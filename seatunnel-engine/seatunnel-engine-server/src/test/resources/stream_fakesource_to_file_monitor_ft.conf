env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 1000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 30
    split.num = 1
    split.read-interval = 300
    parallelism = 1
    schema = {
      fields {
        name = "string"
        age = "int"
      }
    }
  }
}

sink {
  LocalFile {
    path="/tmp/hive/warehouse/monitor_ft_pr12081"
    field_delimiter="\t"
    row_delimiter="\n"
    partition_by=["age"]
    partition_dir_expression="${k0}=${v0}"
    is_partition_field_write_in_file=true
    file_name_expression="${transactionId}_${now}"
    file_format_type="text"
    sink_columns=["name","age"]
    filename_time_format="yyyy.MM.dd"
    is_enable_transaction=true
    save_mode="overwrite"
  }
}