######
###### Streaming job whose savepoint deterministically times out: the InMemory sink sleeps
###### 5s in prepareCommit while checkpoint.timeout is 2s. checkpoint.interval is large so
###### no periodic checkpoint interferes with the manually triggered savepoint.
######

env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 600000
  checkpoint.timeout = 2000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100
    split.num = 5
    split.read-interval = 3000
    parallelism = 1
    schema = {
      fields {
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  InMemory {
    plugin_input = "fake"
    checkpoint_sleep = true
  }
}
