######
###### Two independent pipelines for a savepoint whose failure lands while one pipeline waits to
###### be restored: the first sink fails the savepoint after 4 s, the second finishes its part
###### after 5 s, and pipeline restore waits 3 s before restarting.
######

env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 600000
}

source {
  FakeSource {
    plugin_output = "failing"
    row.num = 100
    split.num = 5
    split.read-interval = 3000
    parallelism = 1
    schema = {
      fields {
        name = "string"
        age = "int"
      }
    }
  }
  FakeSource {
    plugin_output = "slow"
    row.num = 100
    split.num = 5
    split.read-interval = 3000
    parallelism = 1
    schema = {
      fields {
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  InMemory {
    plugin_input = "failing"
    throw_exception = true
  }
  InMemory {
    plugin_input = "slow"
    checkpoint_sleep = true
  }
}
