env {
  parallelism = 1
  job.mode = "BATCH"
  read_limit.bytes_per_second = 1000
}

source {
  FakeSource {
    row.num = 3
    split.num = 1
    schema = {
      fields {
        id = "int"
        maps = "array<map<string,int>>"
      }
    }
    rows = [
      { kind = INSERT, fields = { id = 1, maps = [null, {a = 1}] } },
      { kind = INSERT, fields = { id = 2, maps = [null] } },
      { kind = INSERT, fields = { id = 3, maps = [] } }
    ]
  }
}

sink {
  Console {
    log.print.data = false
  }
}
