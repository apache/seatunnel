seatunnel:
    engine:
        managed-source-runtime:
            enabled: true
            connector-allowlist:
                - FakeSource
                - Kafka
            runtime-protocol-version: 1
            reader-mailbox-max-commands: 256
            reader-mailbox-max-bytes: 2097152
            reader-reserved-control-commands: 16
            reader-reserved-control-bytes: 131072
            worker-mailbox-max-bytes: 134217728
            max-command-payload-bytes: 262144
            poll-max-records: 32
            poll-max-bytes: 524288
            poll-soft-duration-ms: 4
            poll-hard-duration-ms: 500
            poll-cancellation-timeout-ms: 10000
            idle-wait-ms: 5
            admission-budget-ms: 4
            retry-initial-backoff-ms: 5
            retry-max-backoff-ms: 500
            command-retry-deadline-ms: 10000
            coordinator-async-max-concurrency: 2
            coordinator-async-io-threads: 8
            coordinator-async-cpu-threads: 2
            coordinator-async-queue-capacity: 512
            assignment-tracker-max-entries: 10000
            assignment-tracker-max-bytes: 16777216
