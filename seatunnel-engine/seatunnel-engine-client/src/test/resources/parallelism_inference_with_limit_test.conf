######
###### This config file is a demonstration of streaming processing in seatunnel config
######

env {
  parallelism.inference.enabled = true
  parallelism.inference.max-parallelism = 3
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 1000
    tables_configs = [
      {
        schema = {
          table = "test.table1"
          fields {
            id = "int"
            name = "string"
            age = "int"
          }
        }
      },
      {
        schema = {
          table = "test.table2"
          fields {
            id = "int"
            email = "string"
            phone = "string"
          }
        }
      },
      {
        schema = {
          table = "test.table3"
          fields {
            id = "int"
            address = "string"
            city = "string"
          }
        }
      }
    ]
  }
}

sink {
  Console {
    plugin_input = "fake"
  }
}

