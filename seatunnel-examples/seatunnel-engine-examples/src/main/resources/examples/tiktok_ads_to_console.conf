env {
  parallelism = 1
  job.mode = "BATCH"
}
source {
  TikTokAds {
    token = ${TIKTOK_ADS_TOKEN}
    advertiser_id = "123456789"
    data_level = "AUCTION_AD"
    start_date = "2026-09-01"
    end_date = "2026-09-02"
    dimensions = ["ad_id", "stat_time_day"]
    metrics = ["spend", "impressions", "clicks"]
    schema {
      fields {
        ad_id = string
        stat_time_day = string
        spend = "decimal(38, 6)"
        impressions = bigint
        clicks = bigint
      }
    }
  }
}
sink {
  Console {}
}
