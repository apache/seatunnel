######
###### This config file demonstrates batch offline ETL from MySQL to HDFS partitioned Parquet
######

env {
  job.name = "mysql_to_hdfs_batch_dw"
  job.mode = "BATCH"
  parallelism = 4
}

source {
  Jdbc {
    result_table_name = "src_mysql_orders"
    url = "jdbc:mysql://localhost:3306/trade_db?useSSL=false&serverTimezone=UTC&rewriteBatchedStatements=true"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "test_user"
    password = "test_password"

    table_path = "trade_db.orders"
    query = "select id, order_no, user_id, amount, status, create_time from trade_db.orders"

    # Parallel slice optimization for big data volume
    partition_column = "id"
    partition_num = 4
    partition_lower_bound = 1
    partition_upper_bound = 10000000
    fetch_size = 2000
  }
}

transform {
  Sql {
    source_table_name = "src_mysql_orders"
    result_table_name = "dwd_orders"
    query = """
      select
        id as order_id,
        order_no,
        user_id,
        amount,
        upper(status) as order_status,
        create_time,
        date_format(create_time, 'yyyy-MM-dd') as pt_dt
      from src_mysql_orders
      where amount >= 0
    """
  }
}

sink {
  HdfsFile {
    source_table_name = "dwd_orders"
    fs.defaultFS = "hdfs://namenode:8020"
    path = "/user/hive/warehouse/dwd.db/dwd_orders_df"
    file_format_type = "parquet"

    # Hive style dynamic partition directory: /pt_dt=YYYY-MM-DD/
    partition_by = ["pt_dt"]
    filename_num = 4

    # Parquet snappy compression
    compress_codec = "snappy"
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
  }
}
