env {
  parallelism = 1
  job.mode = "BATCH"
}
source {
  GoogleAnalytics4 {
    property_id = "123456789"
    service_account_key_file = "/run/secrets/ga4-service-account.json"
    start_date = "2024-01-01"
    end_date = "2024-01-31"
    dimensions = ["country"]
    metrics = ["activeUsers", "purchaseRevenue"]
    metric_types = ["TYPE_INTEGER", "TYPE_CURRENCY"]
    page_size = 2
    schema {
      fields {
        country = string
        activeUsers = bigint
        purchaseRevenue = double
      }
    }
  }
}
sink {
  Console {}
}
