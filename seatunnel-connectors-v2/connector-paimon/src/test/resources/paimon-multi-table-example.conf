env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Paimon {
    warehouse = "file:///tmp/paimon"
    catalog_name = "paimon_catalog"
    catalog_type = "FILESYSTEM"
    table_list = [
      {
        database = "test_db"
        table = "table1"
        query = "SELECT * FROM table1 WHERE id > 100"
        schema = {
          fields {
            id = BIGINT
            name = STRING
            age = INT
          }
        }
      },
      {
        database = "test_db"
        table = "table2"
        query = "SELECT * FROM table2"
        schema = {
          fields {
            id = BIGINT
            description = STRING
            created_at = TIMESTAMP
          }
        }
      }
    ]
  }
}

transform {
}

sink {
  Console {}
}
