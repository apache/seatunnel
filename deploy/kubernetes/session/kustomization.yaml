apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: seatunnel
resources:
  - namespace.yaml
  - root-configmap.yaml
  - rbac.yaml
  - services.yaml
  - statefulset-master.yaml
configMapGenerator:
  - name: seatunnel-session-cluster-master-config
    files:
      - conf/master/seatunnel.yaml
      - conf/master/hazelcast-master.yaml
      - conf/master/hazelcast-client.yaml
      - log4j2.properties=conf/common/log4j2.properties
      - jvm_master_options=conf/common/jvm_options
    options:
      labels:
        seatunnel.apache.org/session: seatunnel-session-cluster
  - name: seatunnel-session-cluster-worker
    files:
      - conf/worker/seatunnel.yaml
      - conf/worker/hazelcast-worker.yaml
      - log4j2.properties=conf/common/log4j2.properties
      - jvm_worker_options=conf/common/jvm_options
    options:
      labels:
        seatunnel.apache.org/session: seatunnel-session-cluster
  - name: seatunnel-session-cluster-session
    files:
      - session.yaml
generatorOptions:
  disableNameSuffixHash: true
