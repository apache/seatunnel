hazelcast:
  cluster-name: seatunnel-session-cluster
  network:
    rest-api:
      enabled: true
      endpoint-groups:
        CLUSTER_WRITE:
          enabled: true
        DATA:
          enabled: true
    port:
      auto-increment: false
      port: 5801
    join:
      kubernetes:
        enabled: true
        service-dns: seatunnel-session-cluster-headless.seatunnel.svc.cluster.local
        service-dns-timeout: 10
        service-port: 5801
  map:
    engine*:
      map-store:
        enabled: true
        initial-mode: EAGER
        factory-class-name: org.apache.seatunnel.engine.server.persistence.FileMapStoreFactory
        properties:
          type: hdfs
          namespace: /seatunnel/imap
          clusterName: seatunnel-session-cluster
          storage.type: hdfs
          # Runnable default: shared PVC mounted at /opt/seatunnel/data.
          # For S3/OSS/COS/GCS, keep type: hdfs (the IMap factory identifier)
          # and change storage.type plus the matching bucket/credential keys;
          # see docs/en/getting-started/kubernetes/configuration.md#imap-mapstore.
          fs.defaultFS: file:///opt/seatunnel/data
  properties:
    hazelcast.invocation.max.retry.count: 20
    hazelcast.tcp.join.port.try.count: 30
    hazelcast.logging.type: log4j2
    hazelcast.operation.generic.thread.count: 50
    hazelcast.heartbeat.failuredetector.type: phi-accrual
    hazelcast.heartbeat.interval.seconds: 2
    hazelcast.max.no.heartbeat.seconds: 180
    hazelcast.heartbeat.phiaccrual.failuredetector.threshold: 10
    hazelcast.heartbeat.phiaccrual.failuredetector.sample.size: 200
    hazelcast.heartbeat.phiaccrual.failuredetector.min.std.dev.millis: 100
