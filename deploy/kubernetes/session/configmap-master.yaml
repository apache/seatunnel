apiVersion: v1
kind: ConfigMap
metadata:
  name: seatunnel-session-cluster-master-config
  namespace: seatunnel
  labels:
    seatunnel.apache.org/session: seatunnel-session-cluster
data:
  session.yaml: |
    session:
      name: seatunnel-session-cluster
      cluster-name: seatunnel-session-cluster
      root-config-map: seatunnel-session-cluster-meta
      master:
        port: 5801
      worker:
        min-workers: 2
        max-workers: 32
        slots: 8
        cpu-cores: 2
        memory-mb: 4096
        heap-mb: 3072
        image: apache/seatunnel:3.0.1
        image-pull-policy: IfNotPresent
        service-account: default
        config-map: seatunnel-session-cluster-worker
        jvm-options: "-Xms3g -Xmx3g"
      dynamic-worker:
        enabled: true
        startup-timeout-millis: 120000
        retry-interval-millis: 3000
    kubernetes:
      namespace: seatunnel
  seatunnel.yaml: |
    seatunnel:
      engine:
        classloader-cache-mode: true
        history-job-expire-minutes: 1440
        backup-count: 1
        print-execution-info-interval: 60
        slot-service:
          dynamic-slot: false
          slot-num: 8
        http:
          enable-http: true
          port: 8080
          enable-dynamic-port: false
        checkpoint:
          interval: 30000
          timeout: 60000
          storage:
            type: hdfs
            max-retained: 3
            plugin-config:
              namespace: /tmp/seatunnel/checkpoint_snapshot
              storage.type: hdfs
              fs.defaultFS: file:///tmp/
  hazelcast-master.yaml: |
    hazelcast:
      cluster-name: seatunnel-session-cluster
      network:
        rest-api:
          enabled: true
          endpoint-groups:
            CLUSTER_WRITE:
              enabled: true
            DATA:
              enabled: true
        port:
          auto-increment: false
          port: 5801
        join:
          kubernetes:
            enabled: true
            service-dns: seatunnel-session-cluster-headless.seatunnel.svc.cluster.local
            service-dns-timeout: 10
      map:
        engine*:
          map-store:
            enabled: true
            initial-mode: EAGER
            factory-class-name: org.apache.seatunnel.engine.server.persistence.FileMapStoreFactory
            properties:
              type: hdfs
              namespace: /tmp/seatunnel/imap
              clusterName: seatunnel-session-cluster
              storage.type: hdfs
              fs.defaultFS: file:///tmp/
      properties:
        hazelcast.invocation.max.retry.count: 20
        hazelcast.tcp.join.port.try.count: 30
        hazelcast.logging.type: log4j2
        hazelcast.operation.generic.thread.count: 50
        hazelcast.heartbeat.failuredetector.type: phi-accrual
        hazelcast.heartbeat.interval.seconds: 2
        hazelcast.max.no.heartbeat.seconds: 180
        hazelcast.heartbeat.phiaccrual.failuredetector.threshold: 10
        hazelcast.heartbeat.phiaccrual.failuredetector.sample.size: 200
        hazelcast.heartbeat.phiaccrual.failuredetector.min.std.dev.millis: 100
  hazelcast-client.yaml: |
    hazelcast-client:
      cluster-name: seatunnel-session-cluster
      network:
        cluster-members:
          - seatunnel-session-cluster-client.seatunnel.svc.cluster.local:5801
  log4j2.properties: |
    rootLogger.level = INFO
    rootLogger.appenderRef.stdout.ref = Console
    appender.console.type = Console
    appender.console.name = Console
    appender.console.layout.type = PatternLayout
    appender.console.layout.pattern = %d{yyyy-MM-dd HH:mm:ss} %-5p %c{1}:%L - %m%n
  jvm_master_options: |
    -Xms3g
    -Xmx3g
