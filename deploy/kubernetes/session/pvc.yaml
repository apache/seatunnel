# Shared storage for checkpoints and Hazelcast IMAP state.
# ReadWriteMany requires a storage class that supports shared volumes
# (for example NFS, CephFS, or a cloud file-storage class).
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: seatunnel-session-cluster-data
  namespace: seatunnel
  labels:
    seatunnel.apache.org/session: seatunnel-session-cluster
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 10Gi
