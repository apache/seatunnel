github:
  description: SeaTunnel is a multimodal, high-performance, distributed, massive data integration tool.
  homepage: https://seatunnel.apache.org/
  labels:
    - data-integration
    - multimodal
    - llm
    - embeddings
    - change-data-capture
    - cdc
    - high-performance
    - offline
    - real-time
    - batch
    - streaming
    - data-ingestion
    - apache
    - elt
  collaborators:
    - ricky2129
    - DanielLeens
    - LiJie20190102
    - CosmosNi
    - fcb-xiaobo
    - LeonYoah
    - heye1005
    - SEZ9
    - goutamadwant
    - nzw921rx
  dependabot_updates: false
  enabled_merge_buttons:
    squash: true
    merge: false
    rebase: false
  pull_requests:
    allow_update_branch: true
  rulesets:
    - name: Merge Queue
      target: branch
      enforcement: active
      bypass_actors:
        # apache/root — ASF Infra team.
        - actor_id: 118420
          actor_type: Team
          bypass_mode: always
        # Apache SeaTunnel public team can bypass the merge queue when necessary.
        - actor_id: 19408713
          actor_type: Team
          bypass_mode: pull_request
      conditions:
        ref_name:
          include:
            - refs/heads/dev
          exclude: []
      rules:
        # Preserve branch safety in the ruleset so bypass actors cover the full merge gate.
        - type: deletion
        - type: non_fast_forward
        - type: pull_request
          parameters:
            allowed_merge_methods:
              - squash
            dismiss_stale_reviews_on_push: true
            require_code_owner_review: false
            require_extra_approval_for_unattributed_changes: false
            require_last_push_approval: false
            required_approving_review_count: 1
            required_review_thread_resolution: false
        - type: required_status_checks
          parameters:
            strict_required_status_checks_policy: false
            required_status_checks:
              - context: Build
                integration_id: 15368
        - type: merge_queue
          parameters:
            # Allow enough time for runner scheduling before the 30-minute job starts.
            check_response_timeout_minutes: 120
            grouping_strategy: ALLGREEN
            max_entries_to_build: 5
            # Phase one merges each PR immediately instead of waiting to form a batch.
            max_entries_to_merge: 1
            merge_method: SQUASH
            min_entries_to_merge: 1
            min_entries_to_merge_wait_minutes: 0
  # Classic branch protection is intentionally disabled: the ruleset above now owns
  # the dev branch merge requirements and its bypass actors can bypass the full gate.
  protected_branches: ~

notifications:
  commits:      commits@seatunnel.apache.org
  issues:       commits@seatunnel.apache.org
  pullrequests: commits@seatunnel.apache.org
  pullrequests_status:  commits@seatunnel.apache.org
  pullrequests_comment: commits@seatunnel.apache.org
