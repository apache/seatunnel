# SeaTunnel配置文件
# 由X2SeaTunnel配置驱动引擎自动生成
# 生成时间: 2025-07-17T18:52:05.331

env {
  parallelism = 4
  job.mode = "BATCH"
}

# DataX 通用JDBC源模板
# 支持MySQL、PostgreSQL、Oracle、SQL Server等所有JDBC数据库
# 模板类型: JDBC Source (统一模板)
# 版本: 1.0

source {
  Jdbc {
    # ===== 必选参数 (SeaTunnel JdbcSourceConfig要求) =====
    # 数据库连接URL (必填) - 来源: DataX connection.jdbcUrl
    url = "jdbc:sqlserver://localhost:1433;DatabaseName=SalesDB;encrypt=false"
    
    # 数据库驱动类名 (必填) - 根据jdbcUrl自动推断
    driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    
    # 数据库用户名 (必填) - 来源: DataX username
    user = "sa"
    
    # 数据库密码 (必填) - 来源: DataX password
    password = "Password123"
    
    # 查询SQL (必填) - 优先使用querySql，否则根据table+column+where生成
    query = "SELECT OrderID,CustomerID,OrderDate,TotalAmount,Status FROM Orders WHERE TotalAmount > 1000"
    
    # ===== 可选参数 =====
    # 数据分割配置 - 提高并行度
    partition_column = "OrderID"
    partition_num = 4
    
    # 连接配置
    connection_check_timeout_sec = 60
    max_retries = 3
    
    # 批量读取配置
    fetch_size = 1500
    
    # 结果表名
    result_table_name = "jdbc_source_table"
    
    # 数据类型处理配置 - 使用SeaTunnel默认值，避免数据库兼容性问题
    # decimal_type_narrowing = true   # Oracle推荐开启
    # int_type_narrowing = true        # MySQL推荐开启  
    # handle_blob_as_string = false    # 根据实际需求设置
  }
}

# ===== 参数说明 =====

## DataX 到 SeaTunnel 的参数映射关系：

### 必选参数（SeaTunnel JDBC Source 要求）：
# 1. url - 从 DataX 的 connection[0].jdbcUrl[0] 获取
# 2. driver - 根据 jdbcUrl 自动推断数据库类型并设置对应驱动
# 3. user - 从 DataX 的 username 获取
# 4. password - 从 DataX 的 password 获取
# 5. query - 优先使用 querySql，否则根据 column + table + where 自动生成

### 可选参数（性能优化和功能增强）：
# 1. partition_column - 从 DataX 的 splitPk 获取，用于数据分片
# 2. partition_num - 从 DataX 的 job.setting.speed.channel 获取，默认为1
# 3. fetch_size - 从 DataX 的 fetchSize 获取，默认1024
# 4. connection_check_timeout_sec - 连接检查超时时间，默认60秒
# 5. max_retries - 最大重试次数，默认3次

### 数据类型处理：
# 1. decimal_type_narrowing - 启用小数类型窄化，Oracle 推荐开启
# 2. int_type_narrowing - 启用整数类型窄化，MySQL 推荐开启
# 3. handle_blob_as_string - 是否将 BLOB 当作字符串处理

### 数据库特定配置：
# 通过 properties 设置各数据库的特有参数，如 MySQL 的 useSSL、characterEncoding 等

## 使用说明：
# 1. 此模板支持所有 JDBC 兼容的数据库
# 2. driver 会根据 jdbcUrl 自动推断，支持 MySQL、PostgreSQL、Oracle、SQL Server 等
# 3. 建议为大表设置 partition_column (splitPk) 以启用并行读取
# 4. 根据数据库类型调整 properties 中的特定配置
# 5. 生产环境建议设置适当的连接池和超时参数

## 驱动类名映射：
# - MySQL: com.mysql.cj.jdbc.Driver
# - PostgreSQL: org.postgresql.Driver  
# - Oracle: oracle.jdbc.driver.OracleDriver
# - SQL Server: com.microsoft.sqlserver.jdbc.SQLServerDriver

# DataX HDFS Sink连接器模板
# 用于将数据写入HDFS分布式文件系统
# 生成时间: 
# 模板类型: HDFS Sink
# 版本: 1.0

sink {
  HdfsFile {
    # HDFS连接配置
    fs.defaultFS = "hdfs://localhost:9000"
    
    # 文件路径配置
    path = "/user/seatunnel/output/sqlserver_data"
    
    # 文件格式配置
    file_format_type = "text"
    
    # 文件名前缀配置
    filename_prefix = "orders"
    
    # 字段分隔符配置
    field_delimiter = "	"
    
    # 行分隔符配置
    row_delimiter = "\n"
    
    # 编码配置
    encoding = "UTF-8"
    
    # 压缩配置
    compress_codec = "snappy"
    
    # 写入模式配置
    save_mode = "overwrite"
    
    # Hadoop配置
    hadoop_conf = {
      "fs.defaultFS" = "hdfs://localhost:9000"
      "dfs.replication" = "3"
      "dfs.blocksize" = "134217728"
      "dfs.client.failover.proxy.provider" = ""
      "dfs.nameservices" = ""
      "hadoop.security.authentication" = "simple"
    }
    
    # 是否启用压缩
    enable_compress = snappy
    
    # 文件大小控制
    max_file_size = "1GB"
    
    # 写入配置
    write_config = {
      # 批量写入大小
      "batch_size" = 1000
      
      # 文件滚动间隔（秒）
      "file_roll_interval_sec" = 3600
      
      # 是否启用数据校验
      "enable_checksum" = true
      
      # 写入超时（秒）
      "write_timeout_sec" = 300
    }
    
    # 分区配置（可选）
    partition_by = []
    
    # Schema配置（针对结构化文件）
    schema = {
      fields = [
        
      ]
    }
    
    # 错误处理配置
    error_handling = {
      # 最大重试次数
      "max_retries" = 3
      
      # 重试间隔（秒）
      "retry_interval_sec" = 5
      
      # 失败记录文件路径
      "failed_records_path" = ""
    }
    
    # 性能优化配置
    performance = {
      # 缓冲区大小
      "buffer_size" = "64KB"
      
      # 并发写入线程数
      "write_threads" = 1
      
      # 是否启用写入预分配
      "enable_preallocation" = false
    }
  }
}

# 使用说明：
# 1. path可以包含时间变量，如 /data////
# 2. 建议根据数据量调整batch_size和max_file_size
# 3. 生产环境建议启用压缩以节省存储空间
# 4. 对于分区数据，设置适当的partition_by配置
# 5. 注意HDFS的文件权限和目录访问权限设置
# 6. 根据集群性能调整performance参数

