# DataX 环境配置模板
# 基于DataX配置生成SeaTunnel环境配置
# 模板类型: Environment Configuration
# 版本: 1.0

env {
  # 并行度配置 - 来源: DataX speed.channel
  parallelism = {{ datax.job.setting.speed.channel | default(1) }}
  
  # 作业模式 - DataX默认为批处理模式
  job.mode = "BATCH"
}

# 参数说明：
#
# 1. parallelism (并行度)：
#    - 来源：DataX job.setting.speed.channel
#    - 默认值：1
#    - 说明：控制SeaTunnel作业的并行度，影响性能和资源使用
#
# 2. job.mode (作业模式)：
#    - 固定值：BATCH
#    - 说明：DataX本身就是批处理工具，所以SeaTunnel也使用批处理模式
#
# 注意事项：
# - 并行度不宜设置过高，建议根据数据量和集群资源合理配置
# - 批处理模式适合大批量数据迁移场景
