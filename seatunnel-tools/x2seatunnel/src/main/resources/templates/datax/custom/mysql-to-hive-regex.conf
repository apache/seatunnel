# MySQL到Hive转换模板 - 正则表达式提取实用版本
# 支持从HDFS路径智能提取Hive表名
# 语法: Jinja2 风格
# 版本: 1.0

env {
  execution.parallelism = {{ datax.job.setting.speed.channel | default(1) }}
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "{{ datax.job.content[0].reader.parameter.connection[0].jdbcUrl[0] }}"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "{{ datax.job.content[0].reader.parameter.username }}"
    password = "{{ datax.job.content[0].reader.parameter.password }}"
    query = "{{ datax.job.content[0].reader.parameter.querySql[0] | default('SELECT') }} {{ datax.job.content[0].reader.parameter.column | join(',') }} FROM {{ datax.job.content[0].reader.parameter.connection[0].table[0] }}"
    result_table_name = "source_table"
  }
}

sink {
  Hive {
    # 智能表名提取 - 从HDFS路径自动获取
    # 原始路径示例：/user/hive/warehouse/ecology_ods.db/ods_formtable_main/dt=2024-01-01/
    # 提取结果：ecology_ods.ods_formtable_main
    
    # 方案A：标准Hive路径 (推荐)
    table_name = "{{ datax.job.content[0].writer.parameter.path | regex_extract('warehouse/(\\w+)\\.db/(\\w+)', '$1.$2') | default('default.target_table') }}"
    
    # 方案B：更宽松的匹配 (适用于各种warehouse路径)
    # table_name = "{{ datax.job.content[0].writer.parameter.path | regex_extract('warehouse/(\\w+)\\.db/(\\w+)', '$1.$2') | default('default.target_table') }}"
    
    # 方案C：自定义路径格式 (如果不是标准Hive路径)
    # table_name = "{{ datax.job.content[0].writer.parameter.path | regex_extract('/data/(\\w+)/(\\w+)/', '$1.$2') | default('default.target_table') }}"
    
    # Hive Metastore配置
    metastore_uri = "{{ datax.job.content[0].writer.parameter.metastoreUri | default('thrift://localhost:9083') }}"
    
    # 压缩配置
    compress_codec = "{{ datax.job.content[0].writer.parameter.compress | default('none') }}"
    
    # 结果表名
    source_table_name = "source_table"
  }
}

# =================================================================
# 正则表达式说明
# =================================================================

# warehouse/(\w+)\.db/(\w+)
# 
# 解释：
# - warehouse/        : 匹配 "warehouse/" 字符串
# - (\w+)             : 第一个捕获组，匹配数据库名 (单词字符)
# - \.db/             : 匹配 ".db/" 字符串 (点号需要转义)
# - (\w+)             : 第二个捕获组，匹配表名 (单词字符)
# 
# 替换模式：$1.$2
# - $1 : 第一个捕获组的内容 (数据库名)
# - $2 : 第二个捕获组的内容 (表名)
# 
# 测试示例：
# 输入：/user/hive/warehouse/ecology_ods.db/ods_formtable_main/dt=2024-01-01/
# 匹配：warehouse/ecology_ods.db/ods_formtable_main
# 结果：ecology_ods.ods_formtable_main

# 其他常见路径模式：
# /hdfs/hive/warehouse/test_db.db/user_table/        → test_db.user_table
# /data/warehouse/analytics.db/sales_fact/           → analytics.sales_fact
# /user/hive/warehouse/default.db/temp_table/        → default.temp_table
