# 测试正则表达式提取的简单模板
# 用于调试 regex_extract 过滤器

env {
  execution.parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:mysql://localhost:3306/test"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "root"
    password = "password"
    query = "SELECT * FROM test"
    result_table_name = "source_table"
  }
}

sink {
  Hive {
    # 测试路径提取
    # 测试路径：/user/hive/warehouse/ecology_ods.db/ods_formtable_main/${partition}
    # 期望结果：ecology_ods.ods_formtable_main
    
    # 直接测试硬编码路径
    table_name = "{{ '/user/hive/warehouse/ecology_ods.db/ods_formtable_main/${partition}' | regex_extract('warehouse/(\\w+)\\.db/(\\w+)', '$1.$2') | default('FAILED') }}"
    
    # 显示原始路径用于调试
    # table_name = "{{ datax.job.content[0].writer.parameter.path }}"
    
    metastore_uri = "thrift://localhost:9083"
    compress_codec = "none"
    source_table_name = "source_table"
  }
}

# 这个模板用于测试正则表达式提取功能
# 如果结果是 "ecology_ods.ods_formtable_main" 则表示成功
# 如果结果是 "FAILED" 则表示正则表达式匹配失败
