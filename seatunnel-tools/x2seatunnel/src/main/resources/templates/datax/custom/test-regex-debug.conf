# 测试正则表达式提取
# 路径：/user/hive/warehouse/ecology_ods.db/ods_formtable_main/${partition}
# 正则：warehouse/(\w+)\.db/(\w+)
# 期望：ecology_ods.ods_formtable_main

env {
  execution.parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:mysql://localhost:3306/test"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "root"
    password = "password"
    query = "SELECT * FROM test_table"
    result_table_name = "source_table"
  }
}

sink {
  Hive {
    # 测试正则表达式提取
    # 硬编码路径进行测试
    table_name = "{{ '/user/hive/warehouse/ecology_ods.db/ods_formtable_main/${partition}' | regex_extract('warehouse/(\\w+)\\.db/(\\w+)', '$1.$2') | default('default.target_table') }}"
    
    metastore_uri = "thrift://localhost:9083"
    compress_codec = "none"
    source_table_name = "source_table"
  }
}

# 测试说明：
# 输入路径：/user/hive/warehouse/ecology_ods.db/ods_formtable_main/${partition}
# 正则匹配：warehouse/ecology_ods.db/ods_formtable_main
# 捕获组1：ecology_ods
# 捕获组2：ods_formtable_main
# 替换结果：ecology_ods.ods_formtable_main
