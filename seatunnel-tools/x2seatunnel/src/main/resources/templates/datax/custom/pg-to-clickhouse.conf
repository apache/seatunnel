# PostgreSQL到ClickHouse转换模板
# 用于将PostgreSQL数据导出到ClickHouse实时分析平台
# 模板类型: PostgreSQL -> ClickHouse
# 语法: Jinja2 风格
# 版本: 1.0

env {
  # 并行度配置
  parallelism = {{ datax.job.setting.speed.channel | default(1) }}
  
  # 任务模式：批处理模式
  job.mode = "BATCH"
  
  # 检查点配置
  checkpoint.interval = {{ datax.job.setting.speed.channel | default(10000) }}
}

source {
  # PostgreSQL JDBC连接器配置
  Jdbc {
    # 数据库连接配置
    url = "{{ datax.job.content[0].reader.parameter.connection[0].jdbcUrl[0] }}"
    driver = "org.postgresql.Driver"
    user = "{{ datax.job.content[0].reader.parameter.username }}"
    password = "{{ datax.job.content[0].reader.parameter.password }}"
    
    # 查询配置 - 优先使用querySql，否则根据column+table自动生成
    query = "{{ datax.job.content[0].reader.parameter.querySql[0] | default('SELECT') }} {{ datax.job.content[0].reader.parameter.column | join(',') }} FROM {{ datax.job.content[0].reader.parameter.connection[0].table[0] }}"
    
    # 数据分割配置
    partition_column = "{{ datax.job.content[0].reader.parameter.splitPk | default('') }}"
    partition_num = {{ datax.job.setting.speed.channel | default(1) }}
    
    # 连接池配置
    connection_check_timeout_sec = 60
    max_retries = 3
    
    # 结果表名
    result_table_name = "pg_source_table"
  }
}

sink {
  # ClickHouse 连接器配置
  ClickHouse {
    # ClickHouse连接配置
    host = "{{ datax.job.content[0].writer.parameter.host | default('localhost:8123') }}"
    database = "{{ datax.job.content[0].writer.parameter.database | default('default') }}"
    table = "{{ datax.job.content[0].writer.parameter.table | default('target_table') }}"
    
    # 认证配置
    username = "{{ datax.job.content[0].writer.parameter.username | default('default') }}"
    password = "{{ datax.job.content[0].writer.parameter.password | default('') }}"
    
    # 写入配置
    bulk_size = {{ datax.job.content[0].writer.parameter.batchSize | default(20000) }}
    split_mode = false
    sharding_key = "{{ datax.job.content[0].writer.parameter.shardingKey | default('') }}"
    
    # 连接配置
    clickhouse.config = {
      max_connections = 8
      connection_timeout = 20000
      socket_timeout = 60000
    }
    
    # 结果表名
    source_table_name = "pg_source_table"
  }
}

