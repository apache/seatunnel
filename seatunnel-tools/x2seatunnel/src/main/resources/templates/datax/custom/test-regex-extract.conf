# 测试正则表达式提取功能的示例模板
# 用于验证 regex_extract 过滤器的正确性

env {
  execution.parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:mysql://localhost:3306/test"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "root"
    password = "password"
    query = "SELECT * FROM test_table"
    result_table_name = "source_table"
  }
}

sink {
  Hive {
    # 测试不同的路径格式
    # 
    # 测试路径1：/user/hive/warehouse/ecology_ods.db/ods_formtable_main/dt=2024-01-01/
    # 期望结果：ecology_ods.ods_formtable_main
    # 
    # 测试路径2：/data/hive/warehouse/test_db.db/user_table/
    # 期望结果：test_db.user_table
    # 
    # 测试路径3：/user/hive/warehouse/sales.db/orders/year=2024/month=01/
    # 期望结果：sales.orders
    
    # 正则模式：.*/(\\w+)\\.db/(\\w+)/.*
    # 解释：
    # - .*/ : 匹配任意字符直到最后一个斜杠
    # - (\\w+) : 捕获组1，匹配数据库名（单词字符）
    # - \\\.db : 匹配 ".db" 字符串
    # - / : 匹配斜杠
    # - (\\w+) : 捕获组2，匹配表名（单词字符）
    # - /.* : 匹配后续的任意字符
    
    # 实际使用（需要取消注释并设置正确的路径）
    table_name = "{{ '/user/hive/warehouse/ecology_ods.db/ods_formtable_main/dt=2024-01-01/' | regex_extract('.*/(\\w+)\\.db/(\\w+)/', '$1.$2') | default('default.target_table') }}"
    
    metastore_uri = "thrift://localhost:9083"
    compress_codec = "none"
    source_table_name = "source_table"
  }
}

# 使用说明：
# 1. 这个模板用于测试正则表达式提取功能
# 2. 硬编码了测试路径来验证提取逻辑
# 3. 实际使用时，将硬编码路径替换为：{{ datax.job.content[0].writer.parameter.path }}
# 4. 正则表达式支持各种 Hive 路径格式
# 5. 如果提取失败，会使用默认值 'default.target_table'
