# MySQL到HDFS转换模板
# 用于将MySQL数据库数据导出到HDFS分布式文件系统
# 模板类型: MySQL -> HDFS
# 语法: Jinja2 风格
# 版本: 1.0

env {
  # 并行度配置
  parallelism = {{ datax.job.setting.speed.channel | default(1) }}
  
  # 任务模式：批处理模式
  job.mode = "BATCH"
  
  # 检查点配置
  checkpoint.interval = {{ datax.job.setting.speed.channel | default(10000) }}
}

source {
  # MySQL JDBC连接器配置
  Jdbc {
    # 数据库连接配置
    url = "{{ datax.job.content[0].reader.parameter.connection[0].jdbcUrl[0] }}"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "{{ datax.job.content[0].reader.parameter.username }}"
    password = "{{ datax.job.content[0].reader.parameter.password }}"
    
    # 查询配置 - 优先使用querySql，否则根据column+table自动生成
    query = "{{ datax.job.content[0].reader.parameter.querySql[0] | default('SELECT') }} {{ datax.job.content[0].reader.parameter.column | join(',') }} FROM {{ datax.job.content[0].reader.parameter.connection[0].table[0] }}"
    
    # 数据分割配置
    partition_column = "{{ datax.job.content[0].reader.parameter.splitPk | default('') }}"
    partition_num = {{ datax.job.setting.speed.channel | default(1) }}
    
    # 连接池配置
    connection_check_timeout_sec = 60
    max_retries = 3
    
    # 结果表名
    result_table_name = "mysql_source_table"
  }
}

sink {
  # HDFS文件连接器配置
  HdfsFile {
    # HDFS连接配置
    fs.defaultFS = "{{ datax.job.content[0].writer.parameter.defaultFS }}"
    
    # 文件路径配置
    path = "{{ datax.job.content[0].writer.parameter.path }}"
    
    # 文件名配置
    file_name_expression = "{{ datax.job.content[0].writer.parameter.fileName | default('output') }}"
    
    # 文件格式配置
    file_format_type = "{{ datax.job.content[0].writer.parameter.fileType | default('text') }}"
    
    # 字段分隔符
    field_delimiter = "{{ datax.job.content[0].writer.parameter.fieldDelimiter | default('\\t') }}"
    
    # 写入模式
    write_mode = "{{ datax.job.content[0].writer.parameter.writeMode | default('append') }}"
    
    # 压缩配置
    compress_codec = "{{ datax.job.content[0].writer.parameter.compress | default('none') }}"
    
    # 编码配置
    encoding = "{{ datax.job.content[0].writer.parameter.encoding | default('UTF-8') }}"
    
    # 文件大小限制（可选）
    max_file_size = "{{ datax.job.content[0].writer.parameter.maxFileSize | default('134217728') }}"
    
    # 是否包含表头
    have_header = {{ datax.job.content[0].writer.parameter.header | default('false') }}
    
    # 结果表名
    source_table_name = "mysql_source_table"
  }
}

