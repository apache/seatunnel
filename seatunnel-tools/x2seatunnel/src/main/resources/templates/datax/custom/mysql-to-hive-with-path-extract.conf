# MySQL到Hive转换模板 - 路径提取示例
# 支持从DataX配置中提取MySQL数据源信息，并转换为Hive写入配置
# 语法: Jinja2 风格
# 版本: 1.0

env {
  execution.parallelism = {{ datax.job.setting.speed.channel | default(1) }}
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "{{ datax.job.content[0].reader.parameter.connection[0].jdbcUrl[0] }}"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "{{ datax.job.content[0].reader.parameter.username }}"
    password = "{{ datax.job.content[0].reader.parameter.password }}"
    query = "{{ datax.job.content[0].reader.parameter.querySql[0] | default('SELECT') }} {{ datax.job.content[0].reader.parameter.column | join(',') }} FROM {{ datax.job.content[0].reader.parameter.connection[0].table[0] }}"
    result_table_name = "source_table"
  }
}

sink {
  Hive {
    # =================================================================
    # 表名配置 - 多种方案供选择
    # =================================================================
    
    # 【方案1】直接指定 - 最简单可靠
    table_name = "target_database.target_table"
    
    # 【方案2】从DataX配置获取 - 如果DataX配置中有database和table字段
    # table_name = "{{ datax.job.content[0].writer.parameter.database | default('default') }}.{{ datax.job.content[0].writer.parameter.table | default('target_table') }}"
    
    # 【方案3】路径提取示例 - 正则表达式实现
    # 原始路径：{{ datax.job.content[0].writer.parameter.path }}
    # 
    # 示例路径提取规则：
    # 路径格式：/user/hive/warehouse/database_name.db/table_name/partition/
    # 
    # 提取步骤：
    # 1. 获取路径：/user/hive/warehouse/ecology_ods.db/ods_formtable_main/dt=2024-01-01/
    # 2. 正则模式：hive/warehouse/(\w+)\.db/(\w+)
    # 3. 提取组合：$1.$2 (即 ecology_ods.ods_formtable_main)
    # table_name = "{{ datax.job.content[0].writer.parameter.path | regex_extract('hive/warehouse/(\\w+)\\.db/(\\w+)', '$1.$2') | default('default.target_table') }}"
    
    # 【方案4】更简单的正则表达式 - 只匹配关键部分
    # table_name = "{{ datax.job.content[0].writer.parameter.path | regex_extract('warehouse/(\\w+)\\.db/(\\w+)', '$1.$2') | default('default.target_table') }}"
    
    # =================================================================
    # 其他配置
    # =================================================================
    
    # Hive Metastore配置
    metastore_uri = "{{ datax.job.content[0].writer.parameter.metastoreUri | default('thrift://localhost:9083') }}"
    
    # 压缩配置
    compress_codec = "{{ datax.job.content[0].writer.parameter.compress | default('none') }}"
    
    # 结果表名
    source_table_name = "source_table"
  }
}

# =================================================================
# 使用说明 - 正则表达式提取详解
# =================================================================

# 路径提取的常见模式和对应的正则表达式：

# 1. 标准Hive路径：/user/hive/warehouse/database.db/table/
#    正则表达式：hive/warehouse/(\w+)\.db/(\w+)
#    提取结果：$1.$2 → database.table

# 2. 简化匹配（推荐）：只匹配warehouse后面的部分
#    正则表达式：warehouse/(\w+)\.db/(\w+)
#    提取结果：$1.$2 → database.table

# 3. 带分区的路径：/user/hive/warehouse/ecology_ods.db/ods_formtable_main/dt=2024-01-01/
#    正则表达式：warehouse/(\w+)\.db/(\w+)
#    提取结果：ecology_ods.ods_formtable_main

# 4. 自定义路径：/data/warehouse/db/table/
#    正则表达式：warehouse/(\w+)/(\w+)
#    提取结果：$1.$2 → db.table

# 5. 复杂路径：/hdfs/data/hive/warehouse/test_db.db/user_table/year=2024/month=01/
#    正则表达式：warehouse/(\w+)\.db/(\w+)
#    提取结果：test_db.user_table

# 实际使用示例：
# 输入路径：/user/hive/warehouse/ecology_ods.db/ods_formtable_main/dt=2024-01-01/
# 正则表达式：warehouse/(\w+)\.db/(\w+)
# 匹配结果：
#   $1 = ecology_ods (数据库名)
#   $2 = ods_formtable_main (表名)
#   $1.$2 = ecology_ods.ods_formtable_main (完整表名)

# 推荐使用方案：
# 1. 直接指定表名（最简单可靠）
# 2. 如果DataX配置中有database和table字段，从配置获取
# 3. 如果需要从路径提取，使用简化的正则表达式
# 4. 根据实际路径格式调整正则表达式模式
