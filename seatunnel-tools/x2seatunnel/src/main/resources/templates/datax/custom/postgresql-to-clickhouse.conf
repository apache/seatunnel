# PostgreSQL到ClickHouse的自定义转换模板
# 支持从DataX配置中提取PostgreSQL数据源信息，并转换为ClickHouse写入配置

env {
  execution.parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "${datax:job.content[0].reader.parameter.connection[0].jdbcUrl[0]}"
    driver = "org.postgresql.Driver"
    username = "${datax:job.content[0].reader.parameter.username}"
    password = "${datax:job.content[0].reader.parameter.password}"
    query = "SELECT * FROM ${datax:job.content[0].reader.parameter.connection[0].table[0]}"
    result_table_name = "source_table"
  }
}

sink {
  ClickHouse {
    host = "localhost"
    port = 8123
    database = "${hdfs.database}"
    table = "${hdfs.table}"
    username = "default"
    password = ""
    
    # 从HDFS路径提取数据库名和表名
    # 例如: /warehouse/sales_dw/dim_orders/ -> database=sales_dw, table=dim_orders
    database = "${extract:path.database}"
    table = "${extract:path.table}"
  }
}
