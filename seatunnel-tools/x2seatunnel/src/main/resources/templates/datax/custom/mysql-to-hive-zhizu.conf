# MySQL到Hive（智筑）自定义转换模板
# 基于智筑公司DataX配置示例，提取MySQL源并转换为Hive写入配置

env {
  execution.parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "${datax:job.content[0].reader.parameter.connection[0].jdbcUrl[0]}"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "${datax:job.content[0].reader.parameter.username}"
    password = "${datax:job.content[0].reader.parameter.password}"
    query = "${datax:job.content[0].reader.parameter.querySql|SELECT * FROM ${datax:job.content[0].reader.parameter.connection[0].table[0]}}"
    result_table_name = "zhizu_source_table"
  }
}

sink {
  Hive {
    # 智筑Hive库名
    database = "zhizu_ods"
    # 智筑Hive表名
    table_name = "ods_zhizu_data"
    # Hive Metastore URI
    metastore_uri = "${datax:job.content[0].writer.parameter.metastoreUri|thrift://hive-metastore.zhizu:9083}"
    # 文件格式
    file_format = "parquet"
    compression = "snappy"
    # 分区字段
    partition_by = []
    # 写入模式
    save_mode = "overwrite"
    # 输出路径
    sink_path = "${datax:job.content[0].writer.parameter.path}"
  }
}
