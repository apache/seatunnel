# DataX 批处理环境配置模板
# 用于批量数据处理场景
# 生成时间: ${generation_time}
# 模板类型: Batch Environment
# 版本: 1.0

env {
  # 并行度配置 - 从DataX channel数量映射
  parallelism = ${datax:job.setting.speed.channel|1}
  
  # 任务模式：批处理
  job.mode = "BATCH"
  
  # 检查点配置 - 基于channel数量自动调整
  checkpoint.interval = ${datax:job.setting.speed.channel|10000}
  
  # 任务名称 - 自动生成
  job.name = "DataX2SeaTunnel_${datax:job.content[0].reader.name}_to_${datax:job.content[0].writer.name}"
  
  # 其他环境配置
  execution.planner = "blink"
  execution.time-characteristic = "ProcessingTime"
  
  # 重启策略配置
  restart.strategy = "fixed-delay"
  restart.strategy.fixed-delay.attempts = 3
  restart.strategy.fixed-delay.delay = "10s"
}

# 使用说明：
# 1. parallelism建议设置为CPU核心数的1-2倍
# 2. checkpoint.interval根据数据量大小调整，一般5-60秒
# 3. 大数据量场景建议适当增加重启策略的重试次数
