# DataX HDFS Source Connector Template
# For reading data from HDFS distributed file system
# Generation time: ${generation_time}
# Template type: HDFS Source
# Version: 1.0

source {
  HdfsFile {
    # HDFS connection configuration
    fs.defaultFS = "${datax:job.content[0].reader.parameter.defaultFS|hdfs://localhost:9000}"

    # File path configuration - supports wildcards
    path = "${datax:job.content[0].reader.parameter.path}"

    # File format configuration
    file_format_type = "${datax:job.content[0].reader.parameter.fileType|@file_type_mapper}"

    # Field delimiter configuration
    field_delimiter = "${datax:job.content[0].reader.parameter.fieldDelimiter|\t}"

    # Row delimiter configuration
    row_delimiter = "${datax:job.content[0].reader.parameter.rowDelimiter|\n}"

    # File encoding configuration
    encoding = "${datax:job.content[0].reader.parameter.encoding|UTF-8}"

    # Compression format configuration
    compress_codec = "${datax:job.content[0].reader.parameter.compress|@compress_mapper}"

    # Skip header row count
    skip_header_row_number = ${datax:job.content[0].reader.parameter.skipHeader|0}

    # Result table name
    result_table_name = "hdfs_source_table"

    # Hadoop configuration
    hadoop_conf = {
      "fs.defaultFS" = "${datax:job.content[0].reader.parameter.defaultFS|hdfs://localhost:9000}"
      "dfs.client.failover.proxy.provider" = "${datax:job.content[0].reader.parameter.proxyProvider|}"
      "dfs.nameservices" = "${datax:job.content[0].reader.parameter.nameservices|}"
      "hadoop.security.authentication" = "${datax:job.content[0].reader.parameter.authentication|simple}"
    }
    
    # Read configuration
    read_config = {
      # Maximum file size
      "max_file_size" = "${datax:job.content[0].reader.parameter.maxFileSize|2GB}"

      # Batch read size
      "batch_size" = ${datax:job.content[0].reader.parameter.batchSize|1000}

      # Whether to recursively read subdirectories
      "recursive" = ${datax:job.content[0].reader.parameter.recursive|false}

      # File filter pattern
      "file_filter_pattern" = "${datax:job.content[0].reader.parameter.fileFilter|}"
    }

    # Schema configuration (for structured files)
    schema = {
      fields = [
        ${datax:job.content[0].reader.parameter.column[*]|@column_schema_mapper}
      ]
    }

    # Partition configuration (if supported)
    partition_by = [${datax:job.content[0].reader.parameter.partition|}]

    # Error handling configuration
    error_handling = {
      # Skip error records
      "skip_errors" = ${datax:job.content[0].reader.parameter.skipErrors|false}

      # Maximum error record count
      "max_error_count" = ${datax:job.content[0].reader.parameter.maxErrorCount|0}

      # Error file path
      "error_file_path" = "${datax:job.content[0].reader.parameter.errorFilePath|}"
    }
  }
}

# Usage Instructions:
# 1. path supports wildcard patterns, e.g., /data/2023/*/*.txt
# 2. Recommend adjusting batch_size and max_file_size based on file size
# 3. For partitioned tables, set appropriate partition_by configuration
# 4. Production environments should enable error handling and monitoring
# 5. Adjust hadoop_conf parameters according to Hadoop cluster configuration
