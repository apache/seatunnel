source {
  Jdbc {
    # 数据库连接URL
    url = "${datax:job.content[0].reader.parameter.connection[0].jdbcUrl[0]}"
    
    # 数据库驱动类名 - PostgreSQL专用
    driver = "${datax:job.content[0].reader.parameter.connection[0].jdbcUrl[0]|@jdbc_driver_mapper}"
    
    # 数据库用户名
    user = "${datax:job.content[0].reader.parameter.username}"
    
    # 数据库密码
    password = "${datax:job.content[0].reader.parameter.password}"
    
    # 查询SQL - 根据DataX配置智能生成
    query = "${datax:job.content[0].reader.parameter.querySql[0]|SELECT id, product_name, price, category, created_date FROM products WHERE price > 100}"
    
    # 数据分割配置
    partition_column = "${datax:job.content[0].reader.parameter.splitPk|}"
    partition_num = ${datax:job.setting.speed.channel|1}
    
    # 批量读取配置
    fetch_size = ${datax:job.content[0].reader.parameter.fetchSize|1024}
    
    # 连接配置
    connection_check_timeout_sec = 60
    max_retries = 3
    
    # 结果表名
    result_table_name = "jdbc_source_table"
    
    # 数据类型处理配置
    decimal_type_narrowing = true
    int_type_narrowing = true
    handle_blob_as_string = false
  }
}
