# DataX 通用JDBC源模板
# 支持MySQL、PostgreSQL、Oracle、SQL Server等所有JDBC数据库
# 模板类型: JDBC Source (统一模板)
# 版本: 1.0

source {
  Jdbc {
    # ===== 必选参数 (SeaTunnel JdbcSourceConfig要求) =====
    # 数据库连接URL (必填) - 来源: DataX connection.jdbcUrl
    url = "{{ datax.job.content[0].reader.parameter.connection[0].jdbcUrl[0] }}"
    
    # 数据库驱动类名 (必填) - 根据jdbcUrl自动推断
    driver = "{{ datax.job.content[0].reader.parameter.connection[0].jdbcUrl[0] | jdbc_driver_mapper }}"
    
    # 数据库用户名 (必填) - 来源: DataX username
    user = "{{ datax.job.content[0].reader.parameter.username }}"
    
    # 数据库密码 (必填) - 来源: DataX password
    password = "{{ datax.job.content[0].reader.parameter.password }}"
    
    # 查询SQL (必填) - 优先使用querySql，否则根据table+column+where生成
    query = "{{ datax.job.content[0].reader.parameter.querySql[0] | default('SELECT') }} {{ datax.job.content[0].reader.parameter.column | join(',') }} FROM {{ datax.job.content[0].reader.parameter.connection[0].table[0] }} WHERE {{ datax.job.content[0].reader.parameter.where | default('1=1') }}"
    
    # ===== 可选参数 =====
    # 数据分割配置 - 提高并行度
    partition_column = "{{ datax.job.content[0].reader.parameter.splitPk | default('') }}"
    partition_num = {{ datax.job.setting.speed.channel | default(1) }}
    
    # 连接配置
    connection_check_timeout_sec = 60
    max_retries = 3
    
    # 批量读取配置
    fetch_size = {{ datax.job.content[0].reader.parameter.fetchSize | default(1024) }}
    
    # 结果表名
    result_table_name = "jdbc_source_table"
    
    # 数据类型处理配置 - 使用SeaTunnel默认值，避免数据库兼容性问题
    # decimal_type_narrowing = true   # Oracle推荐开启
    # int_type_narrowing = true        # MySQL推荐开启  
    # handle_blob_as_string = false    # 根据实际需求设置
  }
}

# ===== 参数说明 =====

## DataX 到 SeaTunnel 的参数映射关系：

### 必选参数（SeaTunnel JDBC Source 要求）：
# 1. url - 从 DataX 的 connection[0].jdbcUrl[0] 获取
# 2. driver - 根据 jdbcUrl 自动推断数据库类型并设置对应驱动
# 3. user - 从 DataX 的 username 获取
# 4. password - 从 DataX 的 password 获取
# 5. query - 优先使用 querySql，否则根据 column + table + where 自动生成

### 可选参数（性能优化和功能增强）：
# 1. partition_column - 从 DataX 的 splitPk 获取，用于数据分片
# 2. partition_num - 从 DataX 的 job.setting.speed.channel 获取，默认为1
# 3. fetch_size - 从 DataX 的 fetchSize 获取，默认1024
# 4. connection_check_timeout_sec - 连接检查超时时间，默认60秒
# 5. max_retries - 最大重试次数，默认3次

### 数据类型处理：
# 1. decimal_type_narrowing - 启用小数类型窄化，Oracle 推荐开启
# 2. int_type_narrowing - 启用整数类型窄化，MySQL 推荐开启
# 3. handle_blob_as_string - 是否将 BLOB 当作字符串处理

### 数据库特定配置：
# 通过 properties 设置各数据库的特有参数，如 MySQL 的 useSSL、characterEncoding 等

## 使用说明：
# 1. 此模板支持所有 JDBC 兼容的数据库
# 2. driver 会根据 jdbcUrl 自动推断，支持 MySQL、PostgreSQL、Oracle、SQL Server 等
# 3. 建议为大表设置 partition_column (splitPk) 以启用并行读取
# 4. 根据数据库类型调整 properties 中的特定配置
# 5. 生产环境建议设置适当的连接池和超时参数

## 驱动类名映射：
# - MySQL: com.mysql.cj.jdbc.Driver
# - PostgreSQL: org.postgresql.Driver  
# - Oracle: oracle.jdbc.driver.OracleDriver
# - SQL Server: com.microsoft.sqlserver.jdbc.SQLServerDriver
