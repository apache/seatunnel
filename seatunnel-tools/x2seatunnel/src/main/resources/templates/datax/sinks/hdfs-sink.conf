# DataX HDFS Sink连接器模板
# 用于将数据写入HDFS分布式文件系统
# 生成时间: {{ generation_time }}
# 模板类型: HDFS Sink
# 版本: 1.0

sink {
  HdfsFile {
    # HDFS连接配置
    fs.defaultFS = "{{ datax.job.content[0].writer.parameter.defaultFS | default('hdfs://localhost:9000') }}"
    
    # 文件路径配置
    path = "{{ datax.job.content[0].writer.parameter.path }}"
    
    # 文件格式配置
    file_format_type = "{{ datax.job.content[0].writer.parameter.fileType | default('text') }}"
    
    # 文件名前缀配置
    filename_prefix = "{{ datax.job.content[0].writer.parameter.fileName | default('output') }}"
    
    # 字段分隔符配置
    field_delimiter = "{{ datax.job.content[0].writer.parameter.fieldDelimiter | default('\t') }}"
    
    # 行分隔符配置
    row_delimiter = "{{ datax.job.content[0].writer.parameter.rowDelimiter | default('\n') }}"
    
    # 编码配置
    encoding = "{{ datax.job.content[0].writer.parameter.encoding | default('UTF-8') }}"
    
    # 压缩配置
    compress_codec = "{{ datax.job.content[0].writer.parameter.compress | default('none') }}"
    
    # 写入模式配置
    save_mode = "{{ datax.job.content[0].writer.parameter.writeMode | default('overwrite') }}"
    
    # Hadoop配置
    hadoop_conf = {
      "fs.defaultFS" = "{{ datax.job.content[0].writer.parameter.defaultFS | default('hdfs://localhost:9000') }}"
      "dfs.replication" = "{{ datax.job.content[0].writer.parameter.replication | default('3') }}"
      "dfs.blocksize" = "{{ datax.job.content[0].writer.parameter.blockSize | default('134217728') }}"
      "dfs.client.failover.proxy.provider" = "{{ datax.job.content[0].writer.parameter.proxyProvider | default('') }}"
      "dfs.nameservices" = "{{ datax.job.content[0].writer.parameter.nameservices | default('') }}"
      "hadoop.security.authentication" = "{{ datax.job.content[0].writer.parameter.authentication | default('simple') }}"
    }
    
    # 是否启用压缩
    enable_compress = {{ datax.job.content[0].writer.parameter.compress | default('false') }}
    
    # 文件大小控制
    max_file_size = "{{ datax.job.content[0].writer.parameter.maxFileSize | default('1GB') }}"
    
    # 写入配置
    write_config = {
      # 批量写入大小
      "batch_size" = {{ datax.job.content[0].writer.parameter.batchSize | default('1000') }}
      
      # 文件滚动间隔（秒）
      "file_roll_interval_sec" = {{ datax.job.content[0].writer.parameter.rollInterval | default('3600') }}
      
      # 是否启用数据校验
      "enable_checksum" = {{ datax.job.content[0].writer.parameter.enableChecksum | default('true') }}
      
      # 写入超时（秒）
      "write_timeout_sec" = {{ datax.job.content[0].writer.parameter.writeTimeout | default('300') }}
    }
    
    # 分区配置（可选）
    partition_by = [{{ datax.job.content[0].writer.parameter.partition | default('') }}]
    
    # Schema配置（针对结构化文件）
    schema = {
      fields = [
        {{ datax.job.content[0].writer.parameter.column | join(',') | default('') }}
      ]
    }
    
    # 错误处理配置
    error_handling = {
      # 最大重试次数
      "max_retries" = {{ datax.job.content[0].writer.parameter.maxRetries | default('3') }}
      
      # 重试间隔（秒）
      "retry_interval_sec" = {{ datax.job.content[0].writer.parameter.retryInterval | default('5') }}
      
      # 失败记录文件路径
      "failed_records_path" = "{{ datax.job.content[0].writer.parameter.failedRecordsPath | default('') }}"
    }
    
    # 性能优化配置
    performance = {
      # 缓冲区大小
      "buffer_size" = "{{ datax.job.content[0].writer.parameter.bufferSize | default('64KB') }}"
      
      # 并发写入线程数
      "write_threads" = {{ datax.job.content[0].writer.parameter.writeThreads | default('1') }}
      
      # 是否启用写入预分配
      "enable_preallocation" = {{ datax.job.content[0].writer.parameter.enablePreallocation | default('false') }}
    }
  }
}

# 使用说明：
# 1. path可以包含时间变量，如 /data/{{ YYYY }}/{{ MM }}/{{ DD }}/
# 2. 建议根据数据量调整batch_size和max_file_size
# 3. 生产环境建议启用压缩以节省存储空间
# 4. 对于分区数据，设置适当的partition_by配置
# 5. 注意HDFS的文件权限和目录访问权限设置
# 6. 根据集群性能调整performance参数
