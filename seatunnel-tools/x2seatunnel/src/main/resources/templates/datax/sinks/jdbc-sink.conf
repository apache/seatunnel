# DataX 通用JDBC Sink连接器模板
# 基于SeaTunnel官方JDBC Sink文档规范编写
# 支持MySQL、PostgreSQL、Oracle、SQL Server等所有JDBC数据库
# 模板类型: JDBC Sink (统一模板)
# 版本: 2.1

sink {
  Jdbc {
    test_size = {{ datax.job.content[0].writer.parameter.test_sizeSize}}
    # 必需配置：数据库连接
    url = "{{ datax.job.content[0].writer.parameter.connection[0].jdbcUrl }}"
    driver = "{{ datax.job.content[0].writer.parameter.connection[0].jdbcUrl | jdbc_driver_mapper }}"
    user = "{{ datax.job.content[0].writer.parameter.username }}"
    password = "{{ datax.job.content[0].writer.parameter.password }}"

    # 写入配置：database + table 模式（推荐）
    table = "{{ datax.job.content[0].writer.parameter.connection[0].table[0] }}"

    # 批量写入配置
    batch_size = {{ datax.job.content[0].writer.parameter.batchSize | default(1000) }}

    # 事务配置
    auto_commit = true

    # 模式和数据处理配置
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "{{ datax.job.content[0].writer.parameter.writeMode | writemode_to_datasavemode_mapper | default('APPEND_DATA') }}"
  }
}
# 使用说明和最佳实践：
#
# 1. SeaTunnel JDBC Sink 核心特性：
#    - 支持自动生成SQL（database + table模式）
#    - 支持手动SQL（query模式）
#    - 支持批量写入和流式写入
#    - 支持精确一次语义（XA事务）
#    - 支持CDC变更数据捕获
#
# 2. 配置模式选择：
#    - 推荐使用：database + table 自动生成模式
#    - 特殊需求：使用 query 手动SQL模式
#    - 不要同时配置两种模式
#
# 3. DataX参数映射说明：
#    - writeMode映射：
#      * insert → data_save_mode = "APPEND_DATA"
#      * replace → data_save_mode = "DROP_DATA" + enable_upsert = true
#      * update → enable_upsert = true
#    - batchSize → batch_size
#    - preSql/postSql → 不直接支持，需要用custom_sql
#
# 4. 数据库特定优化：
#    - MySQL: 启用rewriteBatchedStatements、yearIsDateType等
#    - PostgreSQL: 配置prepareThreshold等
#    - Oracle: 配置oracle.jdbc.batchsize等
#    - SQL Server: 配置sendStringParametersAsUnicode等
#
# 5. 权限要求：
#    - 基本权限：SELECT、INSERT权限
#    - CDC模式：额外需要CREATE、ALTER、DELETE权限
#    - XA事务：需要XA相关权限
#
# 6. 性能调优建议：
#    - batch_size根据数据量和网络情况调整（1000-5000）
#    - 大批量数据建议关闭auto_commit
#    - 根据数据库类型调整连接池参数
