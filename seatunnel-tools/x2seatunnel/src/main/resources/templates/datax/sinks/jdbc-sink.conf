# DataX 通用JDBC Sink连接器模板
# 支持MySQL、PostgreSQL、Oracle、SQL Server等所有JDBC数据库
# 生成时间: ${generation_time}
# 模板类型: JDBC Sink
# 版本: 1.0

sink {
  Jdbc {
    # 数据库连接配置
    url = "${datax:job.content[0].writer.parameter.connection[0].jdbcUrl}"
    driver = "${datax:job.content[0].writer.parameter.connection[0].jdbcUrl|@jdbc_driver_mapper}"
    user = "${datax:job.content[0].writer.parameter.username}"
    password = "${datax:job.content[0].writer.parameter.password|}"
    
    # 写入配置
    database = "${datax:job.content[0].writer.parameter.connection[0].jdbcUrl|@database_extractor}"
    table = "${datax:job.content[0].writer.parameter.connection[0].table[0]}"
    
    # 写入模式
    save_mode = "${datax:job.content[0].writer.parameter.writeMode|@write_mode_mapper}"
    
    # 批量写入配置
    batch_size = ${datax:job.content[0].writer.parameter.batchSize|1000}
    
    # 连接池配置
    connection_check_timeout_sec = 60
    max_retries = 3
    
    # 性能优化配置
    max_batch_size = ${datax:job.content[0].writer.parameter.maxBatchSize|5000}
    
    # 数据库特定配置（可选）
    properties = {
      # MySQL特定配置
      "useSSL" = "${datax:job.content[0].writer.parameter.useSSL|false}"
      "serverTimezone" = "${datax:job.content[0].writer.parameter.serverTimezone|UTC}"
      "characterEncoding" = "${datax:job.content[0].writer.parameter.characterEncoding|UTF-8}"
      "rewriteBatchedStatements" = "${datax:job.content[0].writer.parameter.rewriteBatchedStatements|true}"
      
      # PostgreSQL特定配置
      "prepareThreshold" = "${datax:job.content[0].writer.parameter.prepareThreshold|5}"
      "preparedStatementCacheQueries" = "${datax:job.content[0].writer.parameter.preparedStatementCacheQueries|256}"
      
      # Oracle特定配置
      "oracle.jdbc.batchsize" = "${datax:job.content[0].writer.parameter.oracleBatchSize|1000}"
    }
    
    # 错误处理配置
    error_handling = {
      # 最大重试次数
      "max_retries" = ${datax:job.content[0].writer.parameter.maxRetries|3}
      
      # 重试间隔（秒）
      "retry_interval_sec" = ${datax:job.content[0].writer.parameter.retryInterval|5}
      
      # 是否跳过错误记录
      "skip_errors" = ${datax:job.content[0].writer.parameter.skipErrors|false}
    }
  }
}

# 使用说明：
# 1. 建议根据目标数据库性能调整batch_size和max_batch_size
# 2. 对于MySQL，启用rewriteBatchedStatements可以显著提高写入性能
# 3. 生产环境建议设置适当的连接池和重试策略
# 4. 根据数据库类型调整specific配置参数
