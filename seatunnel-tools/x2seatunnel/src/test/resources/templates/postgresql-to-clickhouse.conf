# PostgreSQL to ClickHouse Custom Template
# This template is used for converting PostgreSQL DataX configuration to SeaTunnel ClickHouse configuration

env {
  execution.parallelism = 1
  job.mode = "BATCH"
}

source {
  PostgreSQL {
    url = "${postgres.url}"
    username = "${postgres.username}"
    password = "${postgres.password}"
    database = "${postgres.database}"
    table = "${postgres.table}"
    query = "${postgres.query}"
  }
}

sink {
  ClickHouse {
    host = "${clickhouse.host}"
    port = "${clickhouse.port}"
    database = "${clickhouse.database}"
    table = "${clickhouse.table}"
    username = "${clickhouse.username}"
    password = "${clickhouse.password}"
    
    # Extract database and table from HDFS path
    database = "${hdfs.database}"
    table = "${hdfs.table}"
  }
}
