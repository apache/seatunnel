env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 3000
}

source {
  MySQL-CDC {
    plugin_output = "mysql_cdc"
    server-id = 5652-5660
    username = "st_user_source"
    password = "mysqlpw"
    table-names = ["mysql_cdc.orders", "mysql_cdc.customers"]
    url = "jdbc:mysql://__MYSQL_HOST__:__MYSQL_PORT__/mysql_cdc"
    startup.mode = "initial"
    snapshot.split.size = 1
    snapshot.fetch.size = 1
    table-name-config = [
      {
        table = "mysql_cdc.orders"
        primaryKeys = ["id"]
        snapshotSplitColumn = "id"
      },
      {
        table = "mysql_cdc.customers"
        primaryKeys = ["id"]
        snapshotSplitColumn = "id"
      }
    ]
  }
}

sink {
  LocalFile {
    plugin_input = "mysql_cdc"
    path = "__SINK_DIR__"
    row_delimiter = "\n"
    file_name_expression = "${transactionId}_${now}"
    file_format_type = "text"
    filename_time_format = "yyyy.MM.dd"
    is_enable_transaction = true
  }
}
