seatunnel:
  engine:
    history-job-expire-minutes: 60
    backup-count: 1
    queue-type: blockingqueue
    print-execution-info-interval: 10
    print-job-metrics-info-interval: 10
    classloader-cache-mode: false
    slot-service:
      dynamic-slot: true
    checkpoint:
      interval: 3000
      timeout: 60000
      storage:
        type: localfile
        max-retained: 3
        plugin-config:
          namespace: __CHECKPOINT_DIR__
    http:
      enable-http: true
      port: 8080
    telemetry:
      metric:
        enabled: false
      logs:
        scheduled-deletion-enable: false
