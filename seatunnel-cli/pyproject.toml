[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seatunnel-cli"
dynamic = ["version"]
description = "SeaTunnel CLI - Generate Apache SeaTunnel configs with natural language"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
dependencies = [
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "pyhocon>=0.3.60",
]

[project.scripts]
seatunnel = "seatunnel_cli.cli:main"

[project.optional-dependencies]
bedrock = ["boto3>=1.34.0"]
anthropic = ["anthropic>=0.42.0"]
openai = ["openai>=1.0.0"]
all = ["boto3>=1.34.0", "anthropic>=0.42.0", "openai>=1.0.0"]
dev = ["pytest", "black", "ruff", "boto3>=1.34.0", "anthropic>=0.42.0", "openai>=1.0.0"]

[tool.setuptools.package-data]
seatunnel_cli = ["connector_catalog.json"]

[tool.setuptools.dynamic]
version = {attr = "seatunnel_cli.__version__"}
