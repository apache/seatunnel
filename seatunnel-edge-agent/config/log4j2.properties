status = warn
name = EdgeAgentLogConfig

property.logDir = ${sys:edge.agent.log.dir:-${sys:edge.agent.home}/log}
property.logName = ${sys:edge.agent.log.name:-edge-agent.log}

appenders = rolling
appender.rolling.type = RollingFile
appender.rolling.name = RollingFile
appender.rolling.fileName = ${logDir}/${logName}
appender.rolling.filePattern = ${logDir}/edge-agent-%d{yyyy-MM-dd}-%i.log.gz
appender.rolling.layout.type = PatternLayout
appender.rolling.layout.pattern = %d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%t] %c{1.} - %msg%n
appender.rolling.policies.type = Policies
appender.rolling.policies.size.type = SizeBasedTriggeringPolicy
appender.rolling.policies.size.size = 20MB
appender.rolling.strategy.type = DefaultRolloverStrategy
appender.rolling.strategy.max = 5

rootLogger.level = ${sys:edge.agent.log.level:-info}
rootLogger.appenderRefs = rolling
rootLogger.appenderRef.rolling.ref = RollingFile
