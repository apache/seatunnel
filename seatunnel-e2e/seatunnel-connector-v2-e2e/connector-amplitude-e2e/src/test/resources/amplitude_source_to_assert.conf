env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
  # The corrupt-archive case must fail once, not restart the Flink job.
  execution.restart.strategy = "no"
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
}
source {
  Amplitude {
    base_url = "http://host.testcontainers.internal:${amplitude.test.port}"
    allow_insecure_http = true
    api_key = "fixture-api-key"
    secret_key = "fixture-secret"
    start = "20260101T00"
    end = "20260101T01"
    retry_backoff_ms = 1
    max_retry_backoff_ms = 5
    read_timeout_ms = 120000
    schema {
      fields {
        event_type = string
        uuid = string
        amount = bigint
      }
    }
    field_mapping {
      amount = "/event_properties/amount"
    }
  }
}
sink {
  Assert {
    rules {
      row_rules = [
        { rule_type = "MIN_ROW", rule_value = "${amplitude.test.min_rows}" },
        { rule_type = "MAX_ROW", rule_value = "${amplitude.test.max_rows}" }
      ]
      field_rules = [
        { field_name = "event_type", field_type = "string", field_value = [{ rule_type = "NOT_NULL" }] },
        { field_name = "uuid", field_type = "string", field_value = [{ rule_type = "NOT_NULL" }] },
        { field_name = "amount", field_type = "bigint", field_value = [{ rule_type = "NOT_NULL" }] }
      ]
    }
  }
}
