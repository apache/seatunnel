# Both ends of the pipeline enable the nullable ROW layout: the messages on the
# source topic were written with avro_row_nullable = true, and the sink writes
# the same layout again so a null ROW survives the round trip. Pulsar has no
# writer-schema option, so the reader schema is derived from the configured
# schema block and has to follow the writer layout.
env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Pulsar {
    client.service-url = "pulsar://pulsar.e2e.format:6650"
    admin.service-url = "http://pulsar.e2e.format:8080"
    cursor.startup.mode = "EARLIEST"
    cursor.stop.mode = "LATEST"
    # Pulsar sinks route by row tableId, so map this input to the target topic.
    tables_configs = [
      {
        topic = "${source_topic}"
        table_path = "${sink_topic}"
        subscription.name = "e2e-avro-nullable-row"
        format = avro
        avro_row_nullable = true
        schema = {
          fields {
            id = bigint
            c_string = string
            c_row = {
              c_int = int
              c_sub_row = {
                c_string = string
              }
            }
          }
        }
      }
    ]
  }
}

sink {
  Pulsar {
    topic = "${sink_topic}"
    client.service-url = "pulsar://pulsar.e2e.format:6650"
    admin.service-url = "http://pulsar.e2e.format:8080"
    format = avro
    avro_row_nullable = true
  }
}
