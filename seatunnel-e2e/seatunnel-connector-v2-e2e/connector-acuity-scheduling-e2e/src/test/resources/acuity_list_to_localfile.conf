env {
  job.mode = "BATCH"
  parallelism = 1
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  checkpoint.retain-after-job-cancelled = true
}

source {
  AcuityScheduling {
    api_url = "${fixture.url}"
    username = "834101"
    password = "fixture-only+:/=key"
    resources = ["${fixture.resource}"]
    request_timeout_ms = "${fixture.timeout}"
    read_timeout_ms = 30000
    max_attempts = "${fixture.attempts}"
    max_response_bytes = "${fixture.bytes}"
    max_records_per_response = "${fixture.rows}"
  }
}

sink {
  LocalFile {
    path = "/tmp/seatunnel_mnt/acuity-${fixture.out}"
    file_format_type = "json"
    row_delimiter = "\n"
    custom_filename = true
    file_name_expression = "receipt_${transactionId}"
    is_enable_transaction = true
  }
}
