env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Typeform {
    base_url = "http://host.testcontainers.internal:${typeform.test.port}"
    api_key = "placeholder-typeform-token-12345"
    form_id = "abc123"
    page_size = 2
    retry_backoff_multiplier_ms = 10
    retry_backoff_max_ms = 50
  }
}

sink {
  Assert {
    rules {
      row_rules = [
        {
          rule_type = "MAX_ROW"
          rule_value = 3
        },
        {
          rule_type = "MIN_ROW"
          rule_value = 3
        }
      ]
      field_rules = [
        {
          field_name = "response_id"
          field_type = "string"
          field_value = [
            {
              rule_type = "NOT_NULL"
            }
          ]
        },
        {
          field_name = "token"
          field_type = "string"
          field_value = [
            {
              rule_type = "NOT_NULL"
            }
          ]
        },
        {
          field_name = "hidden"
          field_type = "string"
          field_value = [
            {
              rule_type = "NOT_NULL"
            }
          ]
        }
      ]
    }
  }
}
