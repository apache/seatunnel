env {
  parallelism = 1
  job.mode = "STREAMING"
  job.retry.times = 0
  checkpoint.interval = 1000
}
source {
  WebSocketServer {
    bind_host = "0.0.0.0"
    port = "${test_port}"
    path = "/ingest"
    expected_host = "ws-fixture"
    allowed_origins = ["https://sender.example"]
    token = "${test_token}"
    format = "text"
    field_delimiter = "|"
    schema {
      fields {
        id = bigint
        value = string
      }
    }
    max_connections = "${test_connections}"
    max_message_bytes = "${test_message_bytes}"
    max_queue_messages = "${test_queue_count}"
    handshake_timeout_ms = 5000
    idle_timeout_ms = 120000
    message_timeout_ms = "${test_message_timeout}"
  }
}
sink {
  Jdbc {
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://websocket-postgres:5432/test?loggerLevel=OFF"
    username = "test"
    password = "test"
    database = "test"
    table = "public.text_output"
    generate_sink_sql = true
    batch_size = 1
  }
}
