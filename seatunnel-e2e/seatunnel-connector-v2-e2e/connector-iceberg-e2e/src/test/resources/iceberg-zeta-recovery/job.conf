env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 2000
}

source {
  IcebergZetaRecoverySource {
    recovery_root = "@ROOT@"
    start_offset = 0
    end_offset = 15
    split_num = 1
    plugin_output = "recovery_events"
  }
}

sink {
  Iceberg {
    plugin_input = "recovery_events"
    catalog_name = "zeta_recovery"
    iceberg.catalog.config = {
      type = "hadoop"
      warehouse = "file://@ROOT@/warehouse/"
    }
    namespace = "seatunnel_namespace"
    table = "zeta_recovery"
    iceberg.table.auto-create-props = {
      format-version = "@VERSION@"
    }
    iceberg.table.primary-keys = "id"
    iceberg.table.upsert-mode-enabled = true
    case_sensitive = true
  }
}
