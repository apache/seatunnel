env {
    parallelism = 1
    job.mode = "STREAMING"
    checkpoint.interval = 5000
    # Engine-level timer flush every 3 s.
    sink.flush.interval = 3000
}

source {
    MySQL-CDC {
        catalog {
            factory = Mysql
        }
        database-names = ["mysql_cdc"]
        table-names    = ["mysql_cdc.timer_flush_restore_src"]
        format   = DEFAULT
        username = "st_user"
        password = "seatunnel"
        url      = "jdbc:mysql://mysql_cdc_iceberg_timer:3306/mysql_cdc"
    }
}

sink {
    Iceberg {
        catalog_name = "timer_flush_cdc_catalog"
        iceberg.catalog.config = {
            "type"      = "hadoop"
            "warehouse" = "file:///tmp/seatunnel_mnt/iceberg/timer-flush-cdc/"
        }
        namespace = "timer_flush_cdc_ns"
        table     = "iceberg_timer_flush_restore"
        iceberg.table.write-props = {
            write.format.default         = "parquet"
            write.target-file-size-bytes = 10
        }
        iceberg.table.primary-keys        = "id"
        iceberg.table.upsert-mode-enabled = true
        enable_timer_flush = true
    }
}
