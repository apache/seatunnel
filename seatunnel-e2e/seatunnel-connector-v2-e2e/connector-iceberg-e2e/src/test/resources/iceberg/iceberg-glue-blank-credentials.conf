# The packaged Iceberg catalog must reflectively load the SeaTunnel provider before network IO.
env {
  parallelism = 1
  job.mode = "BATCH"
}
source {
  Iceberg {
    catalog_name = "static_credentials_validation"
    iceberg.catalog.config = {
      catalog-impl = "org.apache.iceberg.aws.glue.GlueCatalog"
      warehouse = "s3://unused-test-bucket/warehouse/"
      client.region = "us-east-1"
      glue.endpoint = "http://127.0.0.1:1"
      client.credentials-provider = "org.apache.seatunnel.connectors.seatunnel.iceberg.aws.StaticAwsCredentialsProvider"
      client.credentials-provider.access-key-id = " "
      client.credentials-provider.secret-access-key = " "
    }
    namespace = "test_database"
    table = "test_table"
  }
}
sink {
  Console {}
}
