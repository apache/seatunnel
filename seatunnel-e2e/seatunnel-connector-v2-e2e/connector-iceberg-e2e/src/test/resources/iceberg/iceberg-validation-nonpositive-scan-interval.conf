# Negative case for declarative validation (#11007): `increment.scan-interval` must be
# a positive number of milliseconds, so a value of 0 must be rejected at submission time
# by IcebergSourceFactory.optionRule() before any catalog is touched. No Iceberg
# environment is required.

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Iceberg {
    catalog_name = "seatunnel_test"
    iceberg.catalog.config = {
      "type" = "hadoop"
      "warehouse" = "file:///tmp/seatunnel_mnt/iceberg/hadoop-source/"
    }
    namespace = "seatunnel_namespace"
    table = "iceberg_source_table"
    increment.scan-interval = 0
  }
}

sink {
  Console {
  }
}
