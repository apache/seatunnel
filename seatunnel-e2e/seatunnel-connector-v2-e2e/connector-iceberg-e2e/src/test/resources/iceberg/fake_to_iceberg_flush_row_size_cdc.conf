# Changelog (CDC) job into a partitioned table with flush_row_size = 2, used by IcebergSinkIT.
# Same rows as fake_to_iceberg_flush_row_size_upsert.conf, but UPDATE_BEFORE and DELETE are written
# as deletes of the full row, and the writer rotation closes the files of every open partition.
env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        id = int
        name = string
        region = string
      }
    }
    rows = [
      {kind = INSERT, fields = [1, "A", "east"]},
      {kind = INSERT, fields = [2, "B", "west"]},
      {kind = INSERT, fields = [3, "C", "east"]},
      {kind = UPDATE_BEFORE, fields = [1, "A", "east"]},
      {kind = UPDATE_AFTER, fields = [1, "A2", "east"]},
      {kind = DELETE, fields = [2, "B", "west"]},
      {kind = UPDATE_BEFORE, fields = [3, "C", "east"]},
      {kind = UPDATE_AFTER, fields = [3, "C2", "east"]},
      {kind = INSERT, fields = [4, "D", "west"]}
    ]
  }
}

sink {
  Iceberg {
    plugin_input = "fake"
    catalog_name = "seatunnel_test"
    iceberg.catalog.config = {
      "type" = "hadoop"
      "warehouse" = "file:///tmp/seatunnel_mnt/iceberg/hadoop-sink/"
    }
    namespace = "seatunnel_namespace"
    table = "iceberg_flush_cdc_table"
    iceberg.table.primary-keys = "id"
    iceberg.table.partition-keys = "region"
    flush_row_size = 2
    case_sensitive = true
  }
}
