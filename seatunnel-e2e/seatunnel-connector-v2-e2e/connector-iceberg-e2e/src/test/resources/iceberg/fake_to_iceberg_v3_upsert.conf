# Upsert and CDC writes into a format version 3 table are rejected before any data file is
# written: the delta writer of this connector produces position delete files, which format
# version 3 replaces with deletion vectors.

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    schema = {
      fields {
        id = bigint
        name = string
      }
    }
    rows = [
      {
        kind = INSERT
        fields = [1, "A"]
      },
      {
        kind = UPDATE_AFTER
        fields = [1, "A_1"]
      }
    ]
    plugin_output = "fake"
  }
}

sink {
  Iceberg {
    plugin_input = "fake"
    catalog_name = "seatunnel_test"
    iceberg.catalog.config = {
      "type" = "hadoop"
      "warehouse" = "file:///tmp/seatunnel_mnt/iceberg/hadoop-sink/"
    }
    namespace = "seatunnel_namespace"
    table = "iceberg_v3_upsert"
    iceberg.table.auto-create-props = {
      "format-version" = "3"
    }
    iceberg.table.primary-keys = "id"
    iceberg.table.upsert-mode-enabled = true
    case_sensitive = true
  }
}
