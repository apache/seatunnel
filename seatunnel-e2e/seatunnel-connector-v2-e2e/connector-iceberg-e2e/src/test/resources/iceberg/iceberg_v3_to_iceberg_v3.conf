env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Iceberg {
    catalog_name = "seatunnel_test"
    iceberg.catalog.config = {
      "type" = "hadoop"
      "warehouse" = "file:///tmp/seatunnel_mnt/iceberg/hadoop-sink/"
    }
    namespace = "seatunnel_namespace"
    table = "iceberg_v3_table"
    plugin_output = "iceberg_v3"
  }
}

sink {
  Iceberg {
    plugin_input = "iceberg_v3"
    catalog_name = "seatunnel_test"
    iceberg.catalog.config = {
      "type" = "hadoop"
      "warehouse" = "file:///tmp/seatunnel_mnt/iceberg/hadoop-sink/"
    }
    namespace = "seatunnel_namespace"
    table = "iceberg_v3_copy"
    iceberg.table.auto-create-props = {
      "format-version" = "3"
    }
    iceberg.table.write-props = {
      write.format.default = "parquet"
    }
    case_sensitive = true
  }
}
