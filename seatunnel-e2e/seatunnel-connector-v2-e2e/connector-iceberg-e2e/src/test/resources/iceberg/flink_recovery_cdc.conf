env {
  parallelism = 1
  job.mode = "STREAMING"
  # Only REST-triggered checkpoints may advance the recovery boundary during this test.
  checkpoint.interval = 3600000
  checkpoint.timeout = 90000
  execution.max-concurrent-checkpoints = 1
  execution.checkpoint.mode = "exactly-once"
  execution.checkpoint.data-uri = ${flink_recovery_checkpoints}
  execution.restart.strategy = "fixed-delay"
  execution.restart.attempts = 3
  # A manually restarted TaskManager must boot before the first recovery attempt.
  # After its startup grace period, standalone Flink rejects requests while no worker exists.
  execution.restart.delayBetweenAttempts = 30000
}

source {
  FakeSource {
    row.num = 8
    split.num = 1
    schema {
      fields {
        id = bigint
        name = string
      }
    }
    rows = [
      { kind = INSERT, fields = [1, "A"] },
      { kind = UPDATE_AFTER, fields = [1, "A_1"] },
      { kind = UPDATE_BEFORE, fields = [1, "A_1"] },
      { kind = UPDATE_AFTER, fields = [1, "A_2"] },
      { kind = INSERT, fields = [2, "B"] },
      { kind = DELETE, fields = [2, "B"] },
      { kind = INSERT, fields = [3, "C"] },
      { kind = UPDATE_AFTER, fields = [3, "C_1"] }
    ]
    plugin_output = "flink_recovery_fake"
  }
}

sink {
  IcebergFlinkRecovery {
    plugin_input = "flink_recovery_fake"
    catalog_name = "flink_recovery_test"
    iceberg.catalog.config {
      type = "hadoop"
      warehouse = ${flink_recovery_warehouse}
    }
    namespace = "seatunnel_namespace"
    table = "flink_recovery_cdc"
    iceberg.table.auto-create-props {
      format-version = "${flink_recovery_version}"
    }
    iceberg.table.primary-keys = "id"
    iceberg.table.upsert-mode-enabled = true
    case_sensitive = true
  }
}
