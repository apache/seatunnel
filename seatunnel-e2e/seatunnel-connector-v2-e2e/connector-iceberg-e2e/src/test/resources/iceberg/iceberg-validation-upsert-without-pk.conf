# Negative case for declarative validation (#11007): `iceberg.table.upsert-mode-enabled`
# is true but `iceberg.table.primary-keys` is not configured, so the job must be rejected
# at submission time by IcebergSinkFactory.optionRule() before any catalog is touched.
# No Iceberg environment is required.

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    row.num = 10
    schema = {
      fields {
        id = int
        name = string
      }
    }
    plugin_output = "fake"
  }
}

sink {
  Iceberg {
    catalog_name = "seatunnel_test"
    iceberg.catalog.config = {
      "type" = "hadoop"
      "warehouse" = "file:///tmp/seatunnel_mnt/iceberg/hadoop-sink/"
    }
    namespace = "seatunnel_namespace"
    table = "iceberg_sink_table"
    iceberg.table.upsert-mode-enabled = true
  }
}
