# Upsert job with flush_row_size = 2, used by IcebergSinkIT. The sink writer is rotated every
# two rows, so the UPDATE and DELETE of rows 1, 2 and 3 are written by later task writers than
# the rows they change. All rows end up in one checkpoint, which must be committed as ordered
# snapshots for the equality deletes to apply to the earlier rows.
env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        id = int
        name = string
        region = string
      }
    }
    rows = [
      {kind = INSERT, fields = [1, "A", "east"]},
      {kind = INSERT, fields = [2, "B", "west"]},
      {kind = INSERT, fields = [3, "C", "east"]},
      {kind = UPDATE_BEFORE, fields = [1, "A", "east"]},
      {kind = UPDATE_AFTER, fields = [1, "A2", "east"]},
      {kind = DELETE, fields = [2, "B", "west"]},
      {kind = UPDATE_BEFORE, fields = [3, "C", "east"]},
      {kind = UPDATE_AFTER, fields = [3, "C2", "east"]},
      {kind = INSERT, fields = [4, "D", "west"]}
    ]
  }
}

sink {
  Iceberg {
    plugin_input = "fake"
    catalog_name = "seatunnel_test"
    iceberg.catalog.config = {
      "type" = "hadoop"
      "warehouse" = "file:///tmp/seatunnel_mnt/iceberg/hadoop-sink/"
    }
    namespace = "seatunnel_namespace"
    table = "iceberg_flush_upsert_table"
    iceberg.table.primary-keys = "id"
    iceberg.table.upsert-mode-enabled = true
    flush_row_size = 2
    case_sensitive = true
  }
}
