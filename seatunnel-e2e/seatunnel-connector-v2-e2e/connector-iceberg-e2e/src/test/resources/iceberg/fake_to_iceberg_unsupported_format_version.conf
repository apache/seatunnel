# format-version 4 is still under development in the Iceberg spec, so creating such a table is
# rejected with a clear message instead of being passed through to Iceberg.

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    row.num = 1
    schema = {
      fields {
        id = bigint
        name = string
      }
    }
    plugin_output = "fake"
  }
}

sink {
  Iceberg {
    plugin_input = "fake"
    catalog_name = "seatunnel_test"
    iceberg.catalog.config = {
      "type" = "hadoop"
      "warehouse" = "file:///tmp/seatunnel_mnt/iceberg/hadoop-sink/"
    }
    namespace = "seatunnel_namespace"
    table = "iceberg_v4_table"
    iceberg.table.auto-create-props = {
      "format-version" = "4"
    }
    case_sensitive = true
  }
}
