env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    schema = {
      columns = [
        {
          name = id
          type = bigint
          nullable = false
        },
        {
          name = name
          type = string
        },
        {
          name = c_decimal
          type = "decimal(30, 8)"
        },
        {
          name = c_date
          type = date
        },
        {
          name = ts_micros
          type = timestamp
          columnScale = 6
        },
        {
          name = ts_nanos
          type = timestamp
          columnScale = 9
        },
        {
          name = tstz_nanos
          type = timestamp_tz
          columnScale = 9
        }
      ]
    }
    rows = [
      {
        kind = INSERT
        fields = [1, "A", "1.5", "2024-03-10", "2024-03-10T10:00:00.123456", "2024-03-10T10:00:00.123456789", "2024-03-10T10:00:00.123456789+08:00"]
      },
      {
        kind = INSERT
        fields = [2, "B", "2.5", "2024-03-11", "2024-03-11T10:00:00.000001", "2024-03-11T10:00:00.000000001", "2024-03-11T10:00:00.000000001Z"]
      },
      {
        kind = INSERT
        fields = [3, "C", "3.5", "2024-03-12", "2024-03-12T10:00:00", "2024-03-12T23:59:59.999999999", "2024-03-12T23:59:59.999999999-05:00"]
      }
    ]
    plugin_output = "fake"
  }
}

sink {
  Iceberg {
    plugin_input = "fake"
    catalog_name = "seatunnel_test"
    iceberg.catalog.config = {
      "type" = "hadoop"
      "warehouse" = "file:///tmp/seatunnel_mnt/iceberg/hadoop-sink/"
    }
    namespace = "seatunnel_namespace"
    table = "iceberg_v3_table"
    iceberg.table.auto-create-props = {
      "format-version" = "3"
    }
    iceberg.table.write-props = {
      write.format.default = "parquet"
    }
    iceberg.table.partition-keys = "day(ts_nanos)"
    case_sensitive = true
  }
}
