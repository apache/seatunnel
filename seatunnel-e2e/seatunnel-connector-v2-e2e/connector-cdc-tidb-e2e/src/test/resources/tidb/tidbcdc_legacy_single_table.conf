######
###### Single-table config written with the original option keys
###### (database-name / table-name), used by the config-style restore
###### tests together with the table-names based multi-table config.
######

env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 5000
}

source {
  TiDB-CDC {
    plugin_output = "products_tidb_cdc_legacy_single"
    url = "jdbc:mysql://tidb0:4000/tidb_cdc"
    driver = "com.mysql.cj.jdbc.Driver"
    tikv.grpc.timeout_in_ms = 20000
    pd-addresses = "pd0:2379"
    username = "root"
    password = ""
    database-name = "tidb_cdc"
    table-name = "tidb_cdc_e2e_source_table_2"
  }
}

transform {
}

sink {
  jdbc {
    plugin_input = "products_tidb_cdc_legacy_single"
    url = "jdbc:mysql://tidb0:4000/tidb_cdc_sink"
    driver = "com.mysql.cj.jdbc.Driver"
    username = "root"
    password = ""
    database = tidb_cdc_sink
    table = tidb_cdc_e2e_source_table_2
    primary_keys = ["id"]
    generate_sink_sql = true
  }
}
