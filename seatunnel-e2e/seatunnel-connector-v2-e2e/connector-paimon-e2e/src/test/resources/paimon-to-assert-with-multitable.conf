env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Paimon {
    warehouse = "/tmp/seatunnel_mnt/paimon"
    table_list = [
      {
        database = "multi_test"
        table = "table1"
        schema = {
          fields {
            id = bigint
            name = string
            age = int
          }
        }
      },
      {
        database = "multi_test"
        table = "table2"
        schema = {
          fields {
            order_id = bigint
            product = string
            price = double
          }
        }
      }
    ]
    plugin_output = "paimon_multi_simple"
  }
}

sink {
  Assert {
    plugin_input = "paimon_multi_simple"
    rules {
      table-names = ["multi_test.table1", "multi_test.table2"]
      tables_configs = [
        {
          table_path = "multi_test.table1"
          row_rules = [
            {
              rule_type = MIN_ROW
              rule_value = 100
            },
            {
              rule_type = MAX_ROW
              rule_value = 100
            }
          ],
          field_rules = [
            {
              field_name = id
              field_type = BIGINT
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            },
            {
              field_name = name
              field_type = STRING
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            },
            {
              field_name = age
              field_type = INT
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            }
          ]
        },
        {
          table_path = "multi_test.table2"
          row_rules = [
            {
              rule_type = MIN_ROW
              rule_value = 50
            },
            {
              rule_type = MAX_ROW
              rule_value = 50
            }
          ],
          field_rules = [
            {
              field_name = order_id
              field_type = BIGINT
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            },
            {
              field_name = product
              field_type = STRING
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            },
            {
              field_name = price
              field_type = DOUBLE
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            }
          ]
        }
      ]
    }
  }
}
