          }
          primaryKey {
            name = "pk_id"
            columnNames = [pk_id]
          }
        }
        row.num = 50
      }
    ]
    plugin_output = "fake_multi_sink"
  }
}

sink {
  Assert {
    rules {
      table-names = ["e2e_table_source", "e2e_table_source_2"]
    }
  }
}


