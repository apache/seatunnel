env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    tables_configs = [
      {
        schema = {
          table = "e2e_table_source"
          fields {
            pk_id = bigint
            c_map = "map<string, string>"
            c_array = "array<int>"
            c_string = string
            c_boolean = boolean
            c_tinyint = tinyint
            c_smallint = smallint
            c_int = int
            c_bigint = bigint
            c_float = float
            c_double = double
            c_decimal = "decimal(30, 8)"
            c_bytes = bytes
            c_date = date
            c_timestamp = timestamp
            c_time = time
          }
          primaryKey {
            name = "pk_id"
            columnNames = [pk_id]
          }
        }
        row.num = 100
      },
      {
        schema = {
          table = "e2e_table_source_2"
          fields {
            pk_id = bigint
