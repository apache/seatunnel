env { parallelism = 2, job.mode = "BATCH" }
source {
  FakeSource {
    parallelism = 1
    schema {
      fields { pk_id = bigint, name = string }
      primaryKey { name = "pk_id", columnNames = [pk_id] }
    }
    rows = [
      { kind = INSERT, fields = [1, "before"] },
      { kind = INSERT, fields = [2, "delete"] },
      { kind = INSERT, fields = [3, "keep"] },
      { kind = UPDATE_AFTER, fields = [1, "after"] },
      { kind = DELETE, fields = [2, "delete"] }
    ]
  }
}
sink {
  Paimon {
    parallelism = 2
    warehouse = "/tmp/seatunnel_mnt/paimon"
    database = "default"
    table = "routing_regression"
    multi_table_sink_replica = 1
    paimon.table.write-props { bucket = 1, write-only = true }
  }
}
