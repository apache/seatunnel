env {
  job.mode = "BATCH"
  parallelism = 1
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  job.retry.times = 0
}

source {
  Appcues {
    api_url = "${app.url}"
    username = "${app.user}"
    password = "${app.password}"
    account_id = "${app.account}"
    start_date = "${app.start}"
    end_date = "${app.end}"
    resources = ["flows","tags"]
    max_records = "${app.records}"
    max_response_bytes = "${app.bytes}"
    request_timeout_ms = "${app.deadline}"
    max_attempts = "${app.attempts}"
    read_timeout_ms = 15000
  }
}

sink {
  LocalFile {
    path = "/tmp/seatunnel_mnt/appcues-${app.output}"
    file_format_type = "json"
    custom_filename = true
    file_name_expression = "receipt_${transactionId}"
    row_delimiter = "\n"
    is_enable_transaction = true
  }
}
