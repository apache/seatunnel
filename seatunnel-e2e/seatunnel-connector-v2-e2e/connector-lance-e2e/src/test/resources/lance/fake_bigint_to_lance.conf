env {
  parallelism = 1
  job.mode = "BATCH"

  # You can set spark configuration here
  spark.app.name = "SeaTunnel"
  spark.executor.instances = 2
  spark.executor.cores = 1
  spark.executor.memory = "1g"
  spark.master = local
}

source {
  FakeSource {
    schema = {
      fields {
        id = int
        c_bigint = bigint
      }
    }
    # Each value is outside the int32 range. The third is an epoch in milliseconds.
    rows = [
      {
        kind = INSERT
        fields = [1, 3000000000]
      },
      {
        kind = INSERT
        fields = [2, -3000000000]
      },
      {
        kind = INSERT
        fields = [3, 1739586083123]
      },
      {
        kind = INSERT
        fields = [4, 9223372036854775807]
      }
    ]
    plugin_output = "fake"
  }
}

transform {
}

sink {
  Lance {
    dataset_path = "/tmp/seatunnel_mnt/lanceTest/lance_bigint_table"
    namespace_type = "dir"
    namespace_id = "root"
    table = "lance_bigint_table"
  }
}
