env {
  parallelism = 1
  job.mode = "BATCH"

  # You can set spark configuration here
  spark.app.name = "SeaTunnel"
  spark.executor.instances = 2
  spark.executor.cores = 1
  spark.executor.memory = "1g"
  spark.master = local
}

source {
  FakeSource {
    schema = {
      fields {
        id = int
        c_timestamp = timestamp
      }
    }
    # Each value has digits below the millisecond. The second and third are before 1970.
    rows = [
      {
        kind = INSERT
        fields = [1, "2025-02-15T10:21:23.123456"]
      },
      {
        kind = INSERT
        fields = [2, "1960-06-01T12:00:00.000250"]
      },
      {
        kind = INSERT
        fields = [3, "1969-12-31T23:59:59.999500"]
      }
    ]
    plugin_output = "fake"
  }
}

transform {
}

sink {
  Lance {
    dataset_path = "/tmp/seatunnel_mnt/lanceTest/lance_timestamp_table"
    namespace_type = "dir"
    namespace_id = "root"
    table = "lance_timestamp_table"
  }
}
