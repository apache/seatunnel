env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
}
source {
  Mixpanel {
    base_url = "http://host.testcontainers.internal:${mixpanel.test.port}"
    allow_insecure_http = true
    username = "fixture-user"
    password = "fixture-password"
    project_id = 42
    from_date = "2026-01-01"
    to_date = "2026-01-02"
    retry_backoff_ms = 1
    max_retry_backoff_ms = 5
    schema {
      fields {
        event = string
        time = bigint
        distinct_id = string
        insert_id = string
      }
    }
    field_mapping {
      time = "/properties/time"
      distinct_id = "/properties/distinct_id"
      insert_id = "/properties/$insert_id"
    }
  }
}
sink {
  Assert {
    rules {
      row_rules = [
        { rule_type = "MIN_ROW", rule_value = 3 },
        { rule_type = "MAX_ROW", rule_value = 3 }
      ]
      field_rules = [
        { field_name = "event", field_type = "string", field_value = [{ rule_type = "NOT_NULL" }] },
        { field_name = "time", field_type = "bigint", field_value = [{ rule_type = "NOT_NULL" }] },
        { field_name = "distinct_id", field_type = "string", field_value = [{ rule_type = "NOT_NULL" }] },
        { field_name = "insert_id", field_type = "string", field_value = [{ rule_type = "NOT_NULL" }] }
      ]
    }
  }
}
