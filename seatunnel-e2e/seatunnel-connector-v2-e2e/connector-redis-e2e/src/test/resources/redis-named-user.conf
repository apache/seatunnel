env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Redis {
    host = "redis-e2e"
    port = 6379
    user = "seatunnel_reader"
    auth = "reader-password"
    keys = "acl:source:*"
    data_type = string
    format = json
    schema = {
      fields {
        value = string
      }
    }
  }
}

sink {
  Redis {
    host = "redis-e2e"
    port = 6379
    user = "seatunnel_writer"
    auth = "writer-password"
    key = "acl:result"
    data_type = list
    value_field = "value"
  }
}
