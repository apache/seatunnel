env {
  parallelism = 1
  job.mode = "BATCH"

  # spark config
  spark.app.name = "SeaTunnel"
  spark.executor.instances = 2
  spark.executor.cores = 1
  spark.executor.memory = "1g"
  spark.master = local
}

source {
  Redis {
    host = "redis-e2e"
    port = 6379
    auth = "U2VhVHVubmVs"

    table_list = [
      {
        keys = "user:*"
        data_type = string
        batch_size = 33
        schema = {
          table = "user_table"
          fields {
            id = bigint
            c_string = string
          }
        }
        format = json
      },
      {
        keys = "order:*"
        data_type = string
        batch_size = 33
        schema = {
          table = "order_table"
          fields {
            id = bigint
            c_string = string
          }
        }
        format = json
      },
      {
        keys = "product:*"
        data_type = string
        batch_size = 33
        schema = {
          table = "product_table"
          fields {
            id = bigint
            c_string = string
          }
        }
        format = json
      }
    ]
  }
}

sink {
  Redis {
    host = "redis-e2e"
    port = 6379
    auth = "U2VhVHVubmVs"
    key = "multitable-result-${table_name}"
    data_type = list
  }
}
