env {
  parallelism = 1
  job.mode = "BATCH"

  # spark config
  spark.app.name = "SeaTunnel"
  spark.executor.instances = 2
  spark.executor.cores = 1
  spark.executor.memory = "1g"
  spark.master = local
}

source {
  Redis {
    nodes = ["redis-cluster-0:6379", "redis-cluster-1:6379", "redis-cluster-2:6379"]
    mode = "CLUSTER"
    auth = "SeaTunnel"

    table_list = [
      {
        keys = "cluster:user:*"
        data_type = string
        batch_size = 33
        schema = {
          table = "cluster_user_table"
          fields {
            id = bigint
            c_string = string
          }
        }
        format = json
      },
      {
        keys = "cluster:order:*"
        data_type = string
        batch_size = 33
        schema = {
          table = "cluster_order_table"
          fields {
            id = bigint
            c_string = string
          }
        }
        format = json
      }
    ]
  }
}

sink {
  Redis {
    nodes = ["redis-cluster-0:6379", "redis-cluster-1:6379", "redis-cluster-2:6379"]
    mode = "CLUSTER"
    auth = "SeaTunnel"
    key = "cluster-multitable-${table_name}"
    data_type = list
  }
}
