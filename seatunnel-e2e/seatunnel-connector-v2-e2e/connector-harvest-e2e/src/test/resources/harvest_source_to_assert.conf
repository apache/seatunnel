env {
  parallelism = 1
  job.mode = "BATCH"
}
source {
  Harvest {
    base_url = "http://host.testcontainers.internal:${harvest.test.port}"
    token = "harvest-test-token"
    account_id = "12345"
    page_size = 2
    from = "2026-11-01"
    retry_backoff_ms = 10
    max_retry_delay_ms = 100
    schema {
      fields {
        id = bigint
        hours = "decimal(18,4)"
        notes = string
        spent_date = date
      }
    }
  }
}
sink {
  Assert {
    rules {
      row_rules = [
        { rule_type = "MIN_ROW", rule_value = 3 },
        { rule_type = "MAX_ROW", rule_value = 3 }
      ]
      field_rules = [
        { field_name = "id", field_type = "bigint", field_value = [{ rule_type = "NOT_NULL" }] },
        { field_name = "spent_date", field_type = "date", field_value = [{ rule_type = "NOT_NULL" }] }
      ]
    }
  }
}
