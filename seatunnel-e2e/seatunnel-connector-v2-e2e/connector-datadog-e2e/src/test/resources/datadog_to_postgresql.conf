env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
  checkpoint.interval = 1000
}
source {
  Datadog {
    resource = "${dd_resource}"
    site = "${dd_site}"
    access_key = "${dd_access}"
    secret_key = "${dd_secret}"
    start_time = "${dd_start}"
    end_time = "${dd_end}"
    logs_query = "${dd_query}"
    page_size = 2
    request_timeout_ms = 20000
    page_deadline_ms = "${dd_deadline}"
    max_attempts = 3
    max_response_bytes = 2048
  }
}
sink {
  Jdbc {
    driver = org.postgresql.Driver
    url = "jdbc:postgresql://datadog-postgres:5432/test?loggerLevel=OFF"
    username = "test"
    password = "test"
    database = "test"
    table = "public.datadog_result"
    generate_sink_sql = true
    batch_size = 1
  }
}
