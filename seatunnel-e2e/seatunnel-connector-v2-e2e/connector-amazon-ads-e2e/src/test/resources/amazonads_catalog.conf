env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.retain-after-job-cancelled = true
  read_limit.rows_per_second = "${fixture_rate}"
}

source {
  AmazonAds {
    plugin_output = "ads"
    base_url = "${fixture_api}"
    oauth_base_url = "${fixture_oauth}"
    download_hosts = ["host.testcontainers.internal"]
    region = "${fixture_region}"
    client_id = "${fixture_client}"
    client_secret = "${fixture_secret}"
    refresh_token = "${fixture_refresh_token}"
    profiles = ["111"]
    marketplace_ids = ["GB"]
    state_filter = ["ENABLED"]
    start_date = "${fixture_from}"
    end_date = "${fixture_to}"
    page_size = 2
    max_pages = 10
    max_attempts = 3
    request_interval_ms = 10
    io_timeout_ms = 10000
    request_deadline_ms = "${fixture_request}"
    poll_interval_ms = 125
    report_timeout_ms = "${fixture_report_timeout}"
    duplicate_wait_ms = 125
    report_window_days = "${fixture_window}"
    download_deadline_ms = "${fixture_download_timeout}"
    max_response_bytes = 65536
    max_download_bytes = "${fixture_wire}"
    max_report_bytes = "${fixture_report_bytes}"
  }

}

sink {
  Jdbc {
    plugin_input = "ads"
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://amazonads-db:5432/test?loggerLevel=OFF"
    username = "test"
    password = "test"
    database = "test"
    table = "public.amazonads_rows"
    generate_sink_sql = true
    batch_size = 1
  }

}
