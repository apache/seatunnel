env { parallelism = 1, job.mode = "BATCH" }
source {
  Sentry {
    plugin_output = "events"
    token = "mock-token"
    mock_mode = true
    api_base_url = "http://sentry-fixture:1080"
    organization = "acme"
    project = "demo"
    start_time = "2026-01-01T00:00:00Z"
    end_time = "2026-01-02T00:00:00Z"
    page_size = 2
    retry_delay_ms = 1
  }
}
sink {
  Assert {
    plugin_input = "events"
    rules {
      row_rules = [
        {rule_type = MIN_ROW, rule_value = 3},
        {rule_type = MAX_ROW, rule_value = 3}
      ]
      field_rules = [
        {field_name = event_id, field_type = string, field_value = [{rule_type = NOT_NULL}]},
        {field_name = group_id, field_type = string, field_value = [{rule_type = NOT_NULL, equals_to = "42"}]},
        {field_name = project_id, field_type = string, field_value = [{rule_type = NOT_NULL, equals_to = "7"}]},
        {field_name = date_created, field_type = string, field_value = [{rule_type = NOT_NULL, equals_to = "2026-01-01T12:00:00Z"}]},
        {field_name = title, field_type = string, field_value = [{rule_type = NOT_NULL, equals_to = "Sentry event"}]},
        {field_name = message, field_type = string, field_value = [{rule_type = NULL}]},
        {field_name = platform, field_type = string, field_value = [{rule_type = NOT_NULL, equals_to = "java"}]},
        {field_name = content, field_type = string, field_value = [{rule_type = NOT_NULL}]}
      ]
    }
  }
}
