env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  AmazonDynamoDB {
    url = "http://dynamodb-host:8000"
    region = "us-east-1"
    access_key_id = "dummy-key"
    secret_access_key = "dummy-secret"
    scan_item_limit = 2
    parallel_scan_threads = 2
    tables_configs = [
      {
        table = "source_table"
        parallel_scan_threads = 3
        schema = {
          fields {
            id = string
            c_string = string
            c_int = int
          }
        }
      },
      {
        table = "customer_table"
        schema = {
          table = "crm.customers"
          fields {
            id = string
            name = string
            vip = boolean
          }
        }
      }
    ]
  }
}

sink {
  Assert {
    rules {
      table-names = ["source_table", "crm.customers"]
      tables_configs = [
        {
          table_path = "source_table"
          row_rules = [
            { rule_type = MAX_ROW, rule_value = 1 },
            { rule_type = MIN_ROW, rule_value = 1 }
          ]
          field_rules = [
            {
              field_name = c_string
              field_type = string
              field_value = [{ equals_to = "string" }]
            },
            {
              field_name = c_int
              field_type = int
              field_value = [{ equals_to = 1 }]
            }
          ]
        },
        {
          table_path = "crm.customers"
          row_rules = [
            { rule_type = MAX_ROW, rule_value = 3 },
            { rule_type = MIN_ROW, rule_value = 3 }
          ]
          field_rules = [
            {
              field_name = name
              field_type = string
              field_value = [{ rule_type = NOT_NULL }]
            },
            {
              field_name = vip
              field_type = boolean
              field_value = [{ rule_type = NOT_NULL }]
            }
          ]
        }
      ]
    }
  }
}
