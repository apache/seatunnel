env {
  job.mode = "BATCH"
  parallelism = 1
  read_limit.rows_per_second = 5
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  checkpoint.retain-after-job-cancelled = true
}

source {
  OneHundredMs {
    api_url = "${fixture.url}"
    token = "fixture-only-management-token"
    resources = ["${fixture.resource}"]
    page_size = 10
    max_pages = "${max.pages}"
    max_response_bytes = "${max.bytes}"
    request_timeout_ms = "${request.ms}"
    read_timeout_ms = 30000
    max_attempts = "${attempts}"
  }
}

sink {
  LocalFile {
    path = "/tmp/seatunnel_mnt/100ms-${job.output}"
    file_format_type = "json"
    row_delimiter = "\n"
    custom_filename = true
    file_name_expression = "receipt_${transactionId}"
    is_enable_transaction = true
  }
}
