env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 5000
}

source {
  DB2-CDC {
    plugin_output = "customers"
    username = "db2inst1"
    password = "123456"
    startup.mode = "initial"
    database-names = ["E2E"]
    table-names = ["E2E.DB2INST1.CUSTOMERS"]
    url = "jdbc:db2://db2-cdc-e2e:50000/E2E"
    snapshot.split.size = 2
  }
}

sink {
  Jdbc {
    plugin_input = "customers"
    driver = "com.ibm.db2.jcc.DB2Driver"
    url = "jdbc:db2://db2-cdc-e2e:50000/E2E"
    username = "db2inst1"
    password = "123456"
    generate_sink_sql = true
    database = "E2E"
    schema = "DB2INST1"
    table = "CUSTOMERS_SINK"
    batch_size = 1
    primary_keys = ["ID"]
  }
}
