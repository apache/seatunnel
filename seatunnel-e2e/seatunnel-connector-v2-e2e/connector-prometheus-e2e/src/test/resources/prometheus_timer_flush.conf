# Streaming job that verifies engine-level timer flush (sink.flush.interval) for the Prometheus sink.
# The FakeSource emits one metric row and then stays open (streaming source never signals end), so the
# writer is not closed. batch_size is larger than the number of rows and the checkpoint interval is long,
# so the only thing that can flush the buffered row to Prometheus is the engine timer flush.
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 300000
  sink.flush.interval = 2000
}

source {
  FakeSource {
    schema = {
      fields {
        c_map = "map<string, string>"
        c_double = double
        c_timestamp = timestamp
      }
    }
    plugin_output = "fake"
    rows = [
      {
        kind = INSERT
        fields = [{"__name__" : "timer_flush_metric"}, 2.34, CURRENT_TIMESTAMP]
      }
    ]
  }
}

sink {
  Prometheus {
    plugin_input = "fake"
    url = "http://prometheus-host:9090/api/v1/write"
    key_label = "c_map"
    key_value = "c_double"
    key_timestamp = "c_timestamp"
    batch_size = 100
  }
}
