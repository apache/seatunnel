env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 5000
}

source {
  OceanBase-CDC {
    plugin_output = "customers_oceanbase_cdc"
    server-id = 5752
    username = "st_user_source"
    password = "mysqlpw"
    compatible_mode = "mysql"
    table-names = ["mysql_cdc.oceanbase_cdc_e2e_source_table"]
    url = "jdbc:mysql://mysql_cdc_e2e:3306/mysql_cdc"
  }
}

sink {
  jdbc {
    plugin_input = "customers_oceanbase_cdc"
    url = "jdbc:mysql://mysql_cdc_e2e:3306/mysql_cdc"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "st_user_sink"
    password = "mysqlpw"

    generate_sink_sql = true
    database = mysql_cdc
    table = oceanbase_cdc_e2e_sink_table
    primary_keys = ["id"]
  }
}
