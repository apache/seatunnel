env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 3000
}

source {
  Fluss {
    bootstrap.servers = "fluss_coordinator_e2e:9123"
    database = "fluss_latest_db"
    table = "fluss_latest_src"
    start_mode = "latest"
    plugin_output = "fluss_latest"
  }
}

transform {
}

sink {
  Fluss {
    bootstrap.servers = "fluss_coordinator_e2e:9123"
    database = "fluss_latest_db"
    table = "fluss_latest_sink"
    plugin_input = "fluss_latest"
  }
}
