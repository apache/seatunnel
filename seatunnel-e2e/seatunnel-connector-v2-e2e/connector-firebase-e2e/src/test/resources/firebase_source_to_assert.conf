env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Firebase {
    url = ${URL} # Container runner rewrites this dynamically to host/port
    path = "users"
    timeout_ms = 10000

    schema = {
      fields {
        id = "INT"
        name = "STRING"
        score = "DOUBLE"
        is_active = "BOOLEAN"
        timestamp = "BIGINT"
      }
    }
  }
}

sink {
  Assert {
    rules {
      field_rules = [
        {
          field_name = "id"
          field_type = "INT"
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = "name"
          field_type = "STRING"
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = "score"
          field_type = "DOUBLE"
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = "is_active"
          field_type = "BOOLEAN"
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
    }
  }
}