env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Firebase {
    url = ${URL}
    path = "users"
    timeout_ms = 10000

    query_params = {
        ns = "test-project"
    }

    schema = {
      fields {
        id = "INT"
        name = "STRING"
        score = "DOUBLE"
        is_active = "BOOLEAN"
        timestamp = "BIGINT"
      }
    }
  }
}

sink {
  Assert {
    rules {
      row_rules = [
        {
          rule_type = MAX_ROW
          rule_value = 2
        },
        {
          rule_type = MIN_ROW
          rule_value = 2
        }
      ]

      field_rules = [
        {
          field_name = "id"
          field_type = "INT"
          field_value = [
            { rule_type = NOT_NULL },
            { rule_type = MIN, rule_value = 101 },
            { rule_type = MAX, rule_value = 102 }
          ]
        },
        {
          field_name = "name"
          field_type = "STRING"
          field_value = [
            { rule_type = NOT_NULL }
          ]
        },
        {
          field_name = "score"
          field_type = "DOUBLE"
          field_value = [
            { rule_type = NOT_NULL },
            { rule_type = MIN, rule_value = 98.0 },
            { rule_type = MAX, rule_value = 100.0 }
          ]
        },
        {
          field_name = "is_active"
          field_type = "BOOLEAN"
          field_value = [
            { rule_type = NOT_NULL }
          ]
        },
        {
          field_name = "timestamp"
          field_type = "BIGINT"
          field_value = [
            { rule_type = NOT_NULL },
            { rule_type = MIN, rule_value = 1700000000000 }
          ]
        }
      ]
    }
  }
}