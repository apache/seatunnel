env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Firebase {
    # SeaTunnel inside container calls host.testcontainers.internal to reach Java host
    url = "http://host.testcontainers.internal:9000"
    path = "users"
    timeout_ms = 5000

    schema {
      fields {
        name = "string"
        role = "string"
      }
    }
    plugin_output = "firebase_users"
  }
}

sink {
  Assert {
    plugin_input = "firebase_users"
    rules {
      field_rules = [
        {
          field_name = "name"
          field_type = "string"
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = "role"
          field_type = "string"
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
    }
  }
}