env {
  parallelism = 1
  job.mode = "BATCH"
  job.name = "SeaTunnel_NatsJetStream_Json_E2E"
}

source {
  FakeSource {
    rows = [
      {
        kind = INSERT
        fields = {
          id = 101
          name = "alice"
          score = 9.5
        }
      },
      {
        kind = INSERT
        fields = {
          id = 102
          name = "bob"
          score = 7.25
        }
      },
      {
        kind = INSERT
        fields = {
          id = 103
          name = "carol"
          score = 8.75
        }
      }
    ]
    schema = {
      fields {
        id = int
        name = string
        score = double
      }
    }
    plugin_output = "json_fake"
  }
}

sink {
  NatsJetStream {
    plugin_input = "json_fake"
    url = "nats://nats-jetstream-e2e:4222"
    subject = "orders.json"
    format = "json"
  }
}
