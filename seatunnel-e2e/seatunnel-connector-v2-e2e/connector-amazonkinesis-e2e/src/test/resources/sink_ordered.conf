env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
  checkpoint.interval = 10000
}
source {
  FakeSource {
    schema {
      fields {
        key = "string"
        payload = "string"
      }
    }
    rows = [
      {kind = INSERT, fields = ["甲", "one"]},
      {kind = INSERT, fields = ["B", "two"]},
      {kind = INSERT, fields = ["甲", "three"]}
    ]
  }
}
sink {
  AmazonKinesis {
    region = "us-east-1"
    stream_name = "out"
    access_key = "${test_aws_access}"
    secret_key = "${test_aws_secret}"
    token = "${test_aws_session}"
    format = "${test_format}"
    data_field = "${test_data_field}"
    partition_key_field = "${test_key_field}"
    preserve_order = true
    batch_size = "${test_batch_size}"
    batch_bytes = "${test_batch_bytes}"
    record_bytes = "${test_record_bytes}"
    api_timeout_ms = "${test_api_timeout}"
  }
}
