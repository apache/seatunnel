env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
}
source {
  AmazonKinesis {
    region = "us-east-1"
    stream_name = "in"
    access_key = "${test_aws_access}"
    secret_key = "${test_aws_secret}"
    token = "${test_aws_session}"
    start_timestamp = "${test_timestamp}"
    start_position = "${test_start_position}"
    record_limit = 10
    shard_poll_ms = 220
    discovery_interval_ms = 1000
    batch_timeout_ms = "${test_batch_timeout}"
    api_timeout_ms = "${test_api_timeout}"
  }
}
sink {
  Jdbc {
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://kinesis-postgres:5432/test?loggerLevel=OFF"
    username = "test"
    password = "test"
    database = "test"
    table = "public.kinesis_rows"
    generate_sink_sql = true
    batch_size = 1
  }
}
