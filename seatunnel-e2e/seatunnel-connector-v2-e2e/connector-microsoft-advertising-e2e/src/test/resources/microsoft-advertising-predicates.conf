env {
  job.mode = "BATCH"
  parallelism = 1
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  job.retry.times = 0
}
source {
  MicrosoftAdvertising {
    result_table_name = "advertising_rows"
    developer_token = "${api.developer}"
    client_id = "${api.client}"
    client_secret = "${api.secret}"
    refresh_token = "${api.refresh}"
    tls_trust_certificate = "${api.trust}"
    reports_start_date = "${api.start}"
    reports_end_date = "${api.end}"
    bulk_sync_from = "${api.bulk_from}"
    max_retries = "${api.retries}"
    max_retry_delay_ms = "${api.retry_delay}"
    request_timeout_ms = "${api.request_timeout}"
    download_timeout_ms = "${api.download_timeout}"
    poll_timeout_ms = "${api.poll_timeout}"
    poll_interval_ms = 10
    max_response_bytes = "${api.json_bytes}"
    max_compressed_bytes = "${api.compressed_bytes}"
    max_expanded_bytes = "${api.expanded_bytes}"
    max_csv_row_chars = "${api.csv_row}"
    max_csv_columns = "${api.csv_columns}"
    max_csv_rows = "${api.csv_rows}"
    max_accounts = "${api.accounts}"
    max_account_pages = "${api.account_pages}"
    connect_timeout_ms = 5000
    resources = ["accounts"]
    account_names = [{operator="Contains",name="retail"},{operator="Equals",name="retail west"}]
  }
}
sink {
  LocalFile {
    source_table_name = "advertising_rows"
    path = "/tmp/seatunnel_mnt/microsoft-advertising-${api.output}"
    file_format_type = "json"
    custom_filename = true
    file_name_expression = "receipt_${transactionId}"
    row_delimiter = "\n"
    is_enable_transaction = true
  }
}
