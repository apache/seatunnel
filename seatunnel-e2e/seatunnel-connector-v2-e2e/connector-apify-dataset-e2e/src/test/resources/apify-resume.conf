env {
  job.mode = "BATCH"
  parallelism = 1
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  job.retry.times = 0
}

source {
  ApifyDataset {
    api_url = "${apify.url}"
    token = "${apify.token}"
    dataset_id = "${apify.dataset}"
    resources = ["dataset", "item_collection"]
    page_size = 2
    max_pages = "${apify.pages}"
    max_response_bytes = "${apify.bytes}"
    request_timeout_ms = "${apify.deadline}"
    max_attempts = "${apify.attempts}"
    read_timeout_ms = 15000
  }
}

sink {
  LocalFile {
    path = "/tmp/seatunnel_mnt/apify-${apify.output}"
    file_format_type = "json"
    custom_filename = true
    file_name_expression = "receipt_${transactionId}"
    row_delimiter = "\n"
    is_enable_transaction = true
  }
}
