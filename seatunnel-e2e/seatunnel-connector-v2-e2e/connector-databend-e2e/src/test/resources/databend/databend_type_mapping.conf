# Reads a table whose columns cover the Databend types the catalog resolves through a parameterised
# or a byte string type name: DECIMAL(10, 2) arrives from information_schema.columns as
# "decimal(10, 2)" and BINARY as "binary". No schema is declared here on purpose, so the job runs
# on the schema DatabendCatalog infers for the table.
env {
  execution.parallelism = 1
  job.mode = "BATCH"
}

source {
  Databend {
    url = "jdbc:databend://databend:8000/default"
    username = "root"
    password = ""
    database = "default"
    table = "type_mapping_table"
    query = "SELECT id, price, payload FROM type_mapping_table ORDER BY id"
    fetch_size = 1000
  }
}

sink {
  Console {
  }
}
