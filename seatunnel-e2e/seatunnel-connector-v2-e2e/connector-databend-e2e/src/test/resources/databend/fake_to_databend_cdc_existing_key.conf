env {
  execution.parallelism = 1
  job.mode = "BATCH"
  checkpoint.interval = 1000
}

source {
  FakeSource {
    schema = {
      fields {
        id = "int"
        name = "string"
        position = "string"
        age = "int"
        score = "double"
      }
    }

    # sink_table already holds ids 5 and 6. With enable_delete left at its default, the DELETE is
    # dropped, so the row it should have removed is still there for the INSERT that follows.
    rows = [
      {
        kind = INSERT
        fields = [5, "new", "new", 2, 2.0]
      },
      {
        kind = DELETE
        fields = [6, "old", "old", 1, 1.0]
      },
      {
        kind = INSERT
        fields = [6, "new", "new", 2, 2.0]
      },
      {
        kind = INSERT
        fields = [7, "new", "new", 2, 2.0]
      }
    ]
  }
}

sink {
  Databend {
    url = "jdbc:databend://databend:8000/default?ssl=false"
    username = "root"
    password = ""
    database = "default"
    table = "sink_table"

    batch_size = 1
    conflict_key = "id"
  }
}
