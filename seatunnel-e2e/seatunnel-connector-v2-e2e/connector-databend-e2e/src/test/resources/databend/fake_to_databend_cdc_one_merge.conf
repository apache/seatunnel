env {
  execution.parallelism = 1
  job.mode = "BATCH"
  checkpoint.interval = 1000
}

source {
  FakeSource {
    schema = {
      fields {
        id = "int"
        name = "string"
        position = "string"
        age = "int"
        score = "double"
      }
    }

    # sink_table already holds these ids. batch_size below keeps every event in one merge, where the
    # event that came last for each key has to win.
    rows = [
      { kind = DELETE, fields = [10, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [10, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [11, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [11, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [12, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [12, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [13, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [13, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [14, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [14, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [15, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [15, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [16, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [16, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [17, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [17, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [18, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [18, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [19, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [19, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [20, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [20, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [21, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [21, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [22, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [22, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [23, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [23, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [24, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [24, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [25, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [25, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [26, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [26, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [27, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [27, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [28, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [28, "new", "new", 2, 2.0] },
      { kind = DELETE, fields = [29, "old", "old", 1, 1.0] },
      { kind = INSERT, fields = [29, "new", "new", 2, 2.0] },
    ]
  }
}

sink {
  Databend {
    url = "jdbc:databend://databend:8000/default?ssl=false"
    username = "root"
    password = ""
    database = "default"
    table = "sink_table"

    batch_size = 1000
    conflict_key = "id"
    enable_delete = true
  }
}
