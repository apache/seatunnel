env {
  execution.parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 10000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    row.num = 1000
    split.num = 1000
    auto.increment.enabled = true
    auto.increment.start = 1
    schema = {
      fields {
        id = "int"
        name = "string"
        position = "string"
        age = "int"
        score = "double"
      }
      primaryKey {
        name = "pk"
        columnNames = [id]
      }
    }
  }
}

sink {
  Databend {
    url = "jdbc:databend://databend:8000/default?ssl=false"
    username = "root"
    password = ""
    database = "default"
    table = "sink_table"

    # Enable CDC mode
    batch_size = 1
    conflict_key = "id"
    enable_delete = false
  }
}

