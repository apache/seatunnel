env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 300000
  sink.flush.interval = 500
}

source {
  MariaDB-CDC {
    server-id = 5654
    username = "st_user_source"
    password = "mariadbpw"
    table-names = ["mysql_cdc.timer_flush_src"]
    url = "jdbc:mariadb://mariadb_cdc_e2e:3306/mysql_cdc"
  }
}

sink {
  jdbc {
    url = "jdbc:mariadb://mariadb_cdc_e2e:3306/mysql_cdc"
    driver = "org.mariadb.jdbc.Driver"
    user = "st_user_sink"
    password = "mariadbpw"
    generate_sink_sql = true
    database = mysql_cdc
    table = timer_flush_sink
    primary_keys = ["id"]
    batch_size = 100000
    batch_interval_ms = 0
  }
}
