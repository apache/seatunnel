env {
    parallelism = 1
    job.mode = "STREAMING"
    checkpoint.interval = 5000
    checkpoint.timeout = 60000
  }

source {
  Kafka {
    bootstrap.servers = "kafkaCluster:9092"
    topic = "${sourceTopic:kafka_topic_exactly_once_1}"
    consumer.group = "${consumerGroup:test_exactly_once}"
    # The default format is json, which is optional
    format = text
    # The exactly-once test writes a readiness probe before the job starts, while the
    # consumer group is still new and has no stored offsets. Read from earliest so
    # KafkaSourceSplitEnumerator can assign the initial split on the first run.
    # Restore tests resume from checkpointed splits, so start_mode is not used on
    # the restored path.
    start_mode = earliest
    kafka.config = {
          auto.offset.reset = "earliest"
          enable.auto.commit = "false"
        }
  }

}
transform {}


sink{
  kafka {
        format = text
        topic = "${sinkTopic:kafka_topic_exactly_once_2}"
        bootstrap.servers = "kafkaCluster:9092"
        semantics = EXACTLY_ONCE
        kafka.config = {
           transaction.timeout.ms=60000
           request.timeout.ms=60000
           delivery.timeout.ms=60000
           acks=all
           retries=3
           retry.backoff.ms=200
        }
    }
}
