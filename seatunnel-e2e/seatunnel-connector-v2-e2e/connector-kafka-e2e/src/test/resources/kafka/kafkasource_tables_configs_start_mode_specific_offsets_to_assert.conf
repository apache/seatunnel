env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Kafka {
    bootstrap.servers = "kafkaCluster:9092"
    format = json
    tables_configs = [
      {
        topic = "${topic}"
        start_mode = specific_offsets
        start_mode.offsets = {
          test_topic_start_mode_flink_1_13_specific_offsets-0 = 5
          test_topic_start_mode_flink_1_14_specific_offsets-0 = 5
          test_topic_start_mode_flink_1_15_specific_offsets-0 = 5
          test_topic_start_mode_flink_1_16_specific_offsets-0 = 5
          test_topic_start_mode_flink_1_17_specific_offsets-0 = 5
          test_topic_start_mode_flink_1_18_specific_offsets-0 = 5
          test_topic_start_mode_flink_1_20_specific_offsets-0 = 5
          test_topic_start_mode_spark_2_4_specific_offsets-0 = 5
          test_topic_start_mode_spark_3_3_specific_offsets-0 = 5
          test_topic_start_mode_spark_3_5_specific_offsets-0 = 5
          test_topic_start_mode_seatunnel_specific_offsets-0 = 5
        }
        schema = {
          table = "kafka_start_mode.specific_offsets"
          fields {
            id = bigint
          }
        }
      }
    ]
  }
}

sink {
  Assert {
    rules = {
      tables_configs = [
        {
          table_path = "kafka_start_mode.specific_offsets"
          row_rules = [
            { rule_type = MIN_ROW, rule_value = 5 },
            { rule_type = MAX_ROW, rule_value = 5 }
          ]
          field_rules = [{
            field_name = id
            field_type = bigint
            field_value = [
              { rule_type = MIN, rule_value = 5 },
              { rule_type = MAX, rule_value = 9 }
            ]
          }]
        }
      ]
    }
  }
}
