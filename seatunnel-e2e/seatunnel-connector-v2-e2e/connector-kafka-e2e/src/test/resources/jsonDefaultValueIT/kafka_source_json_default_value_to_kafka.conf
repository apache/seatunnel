env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Kafka {
    bootstrap.servers = "kafka_e2e:9092"
    topic = "test-json-default-value-source"
    plugin_output = "kafka_default_value_table"
    start_mode = earliest
    format = json
    schema = {
      columns = [
        { name = "name", type = "string", nullable = true }
        { name = "age", type = "int", nullable = false, defaultValue = 18 }
        { name = "score", type = "double", nullable = false, defaultValue = 0.0 }
        { name = "status", type = "string", nullable = false, defaultValue = "PENDING" }
      ]
    }
  }
}

sink {
  Kafka {
    bootstrap.servers = "kafka_e2e:9092"
    topic = "test-json-default-value-sink"
    format = json
  }
}
