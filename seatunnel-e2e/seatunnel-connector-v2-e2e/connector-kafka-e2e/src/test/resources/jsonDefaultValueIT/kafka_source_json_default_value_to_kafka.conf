env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Kafka {
    bootstrap.servers = "kafka_e2e:9092"
    topic = "test-json-default-value-source"
    plugin_output = "kafka_default_value_table"
    start_mode = earliest
    format = json
    schema = {
      columns = [
        { name = "name", type = "string", nullable = true }
        { name = "age", type = "int", nullable = false, defaultValue = 18 }
        { name = "score", type = "double", nullable = false, defaultValue = 0.0 }
        { name = "status", type = "string", nullable = false, defaultValue = "PENDING" }
        { name = "flag", type = "boolean", nullable = false, defaultValue = true }
        { name = "count", type = "bigint", nullable = false, defaultValue = 100 }
        { name = "ratio", type = "float", nullable = false, defaultValue = 1.5 }
        { name = "amount", type = "decimal(10, 2)", nullable = false, defaultValue = 10.50 }
        { name = "birthday", type = "date", nullable = false, defaultValue = "2024-01-01" }
        { name = "created_at", type = "timestamp", nullable = false, defaultValue = "2024-01-01 12:30:45" }
      ]
    }
  }
}

sink {
  Kafka {
    bootstrap.servers = "kafka_e2e:9092"
    topic = "test-json-default-value-sink"
    format = json
  }
}
