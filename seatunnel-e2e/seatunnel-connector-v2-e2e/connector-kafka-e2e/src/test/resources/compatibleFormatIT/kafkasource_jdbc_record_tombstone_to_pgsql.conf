env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Kafka {
    bootstrap.servers = "kafka_e2e:9092"
    topic = "${topic}"
    consumer.group = "${consumerGroup}"
    plugin_output = "kafka_table"
    start_mode = earliest
    # Driven from the test with both FAIL and SKIP. A tombstone is a deletion marker rather
    # than a format error, so reading one must not depend on which value is configured.
    format_error_handle_way = "${errorHandleWay}"
    schema = {
      fields {
        id = "int"
        name = "string"
        description = "string"
        weight = "string"
      }
    },
    format = COMPATIBLE_KAFKA_CONNECT_JSON
  }
}


sink {
  Jdbc {

    driver = org.postgresql.Driver
    url = "jdbc:postgresql://postgresql:5432/test?loggerLevel=OFF"
    user = test
    password = test
    generate_sink_sql = true
    database = test
    table = public.sink
    primary_keys = ["id"]
  }
}
