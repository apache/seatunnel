# Both ends of the pipeline enable the nullable ROW layout: the messages on the
# source topic were written with avro_row_nullable = true, and the sink writes
# the same layout again so a null ROW survives the round trip.
env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Kafka {
    bootstrap.servers = "kafkaCluster:9092"
    topic = "${source_topic}"
    consumer.group = "e2e-avro-nullable-row-group"
    start_mode = "earliest"
    format = avro
    avro_row_nullable = true
    schema = {
      fields {
        id = bigint
        c_string = string
        c_row = {
          c_int = int
          c_sub_row = {
            c_string = string
          }
        }
      }
    }
  }
}

sink {
  Kafka {
    bootstrap.servers = "kafkaCluster:9092"
    topic = "${sink_topic}"
    format = avro
    avro_row_nullable = true
  }
}
