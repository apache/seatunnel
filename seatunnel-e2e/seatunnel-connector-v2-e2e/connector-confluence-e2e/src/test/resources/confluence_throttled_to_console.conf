env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
  read_limit.rows_per_second = 1
  checkpoint.interval = 1000
  checkpoint.timeout = 5000
  checkpoint.retain-after-job-cancelled = true
}

source {
  Confluence {
    site_url = "${confluence.url}"
    username = "fixture@example.test"
    token = "fixture-confluence-test-token"
    resource = "${confluence.resource}"
    page_size = ${confluence.size}
    page_timeout_ms = ${confluence.timeout}
    max_attempts = ${confluence.attempts}
    max_response_bytes = ${confluence.bytes}
    max_pages = ${confluence.pages}
    body_format = "${confluence.body.format}"
  }
}

sink {
  Console {
    log.print.data = true
    log.print.delay.ms = ${confluence.sink.delay}
  }
  Assert {
    rules {
      row_rules = [{ rule_type = "MAX_ROW", rule_value = 100 }]
    }
  }
}
