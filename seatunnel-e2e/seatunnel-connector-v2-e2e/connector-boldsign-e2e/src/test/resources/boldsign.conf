env {
    job.mode = "BATCH"
    parallelism = ${boldsign.parallelism}
    checkpoint.interval = 1000
    checkpoint.timeout = 30000
    job.retry.times = 0
}
source {
    BoldSign {
        token = ${boldsign.token}
        resource = ${boldsign.resource}
        region = ${?boldsign.region}
        start_date = ${?boldsign.start}
        end_date = ${?boldsign.end}
        page_size = ${?boldsign.pageSize}
        max_pages = ${?boldsign.maxPages}
        max_unpaged_records = ${?boldsign.maxUnpaged}
        read_timeout_ms = ${?boldsign.readTimeout}
        request_deadline_ms = ${?boldsign.deadline}
        max_response_bytes = ${?boldsign.bytes}
        max_attempts = ${?boldsign.attempts}
    }
}
sink {
    LocalFile {
        path = ${boldsign.output}
        file_format_type = "json"
        row_delimiter = "\n"
        custom_filename = true
        file_name_expression = "receipt_${transactionId}"
        is_enable_transaction = true
    }
}
