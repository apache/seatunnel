env {
  parallelism = 1
  job.mode = "BATCH"
  spark.app.name = "SeaTunnel"
  spark.executor.instances = 1
  spark.executor.cores = 1
  spark.executor.memory = "1g"
  spark.master = local
}

source {
  ADLSFile {
    account_name = ${SEATUNNEL_ADLS_ACCOUNT}
    container = ${SEATUNNEL_ADLS_CONTAINER}
    endpoint_suffix = "dfs.core.windows.net"
    auth_type = "SHARED_KEY"
    account_key = ${SEATUNNEL_ADLS_ACCOUNT_KEY}
    path = ${SEATUNNEL_ADLS_TEST_ROOT}"/input"
    file_filter_pattern = ".*\\.csv"
    file_format_type = "csv"
    field_delimiter = ","
    row_delimiter = "\n"
    skip_header_row_number = 1
    schema = {
      fields {
        id = int
        name = string
      }
    }
  }
}

sink {
  ADLSFile {
    parallelism = 1
    account_name = ${SEATUNNEL_ADLS_ACCOUNT}
    container = ${SEATUNNEL_ADLS_CONTAINER}
    endpoint_suffix = "dfs.core.windows.net"
    auth_type = "SHARED_KEY"
    account_key = ${SEATUNNEL_ADLS_ACCOUNT_KEY}
    path = ${SEATUNNEL_ADLS_TEST_ROOT}"/output/"${RUN_ID}
    tmp_path = ${SEATUNNEL_ADLS_TEST_ROOT}"/tmp/"${RUN_ID}
    file_format_type = "csv"
    field_delimiter = ","
    row_delimiter = "\n"
    data_save_mode = "DROP_DATA"
    enable_header_write = true
  }
}
