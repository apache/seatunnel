env {
  parallelism = 1
  job.mode = "BATCH"
  spark.app.name = "SeaTunnel"
  spark.executor.instances = 1
  spark.executor.cores = 1
  spark.executor.memory = "1g"
  spark.master = local
}

source {
  HdfsFile {
    fs.defaultFS = "wasb://files@devstoreaccount1.blob.azurite.test"
    hdfs_site_path = "/tmp/seatunnel/config/adls-azurite-hadoop.xml"
    path = "/file-round-trip-e2e/input"
    file_filter_pattern = ".*\\.csv"
    file_format_type = "csv"
    field_delimiter = ","
    row_delimiter = "\n"
    skip_header_row_number = 1
    schema = {
      fields {
        id = int
        name = string
      }
    }
  }
}

sink {
  ADLSFile {
    account_name = "testaccount"
    container = "files"
    endpoint_suffix = "dfs.core.windows.net"
    auth_type = "OAUTH_CLIENT_CREDENTIALS"
    tenant_id = "example.onmicrosoft.com"
    client_id = "validation-client"
    client_secret = "validation-secret"
    authority_host = "https://login.example.test"
    hadoop_adls_properties {
      "fs.azure.io.retry.max.retries" = "8"
      " fs.azure.io.retry.max.retries " = "9"
    }
    path = "/output"
    tmp_path = "/tmp/seatunnel/adls-validation"
    file_format_type = "csv"
  }
}
