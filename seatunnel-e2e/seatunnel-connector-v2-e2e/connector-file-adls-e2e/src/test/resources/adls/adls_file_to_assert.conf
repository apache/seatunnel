include file("/tmp/seatunnel/config/adls-e2e-secrets.conf")

env {
  parallelism = 1
  job.mode = "BATCH"
  spark.app.name = "SeaTunnel"
  spark.executor.instances = 1
  spark.executor.cores = 1
  spark.executor.memory = "1g"
  spark.master = local
}

source {
  ADLSFile {
    account_name = ${adls_e2e.account_name}
    container = ${adls_e2e.container}
    endpoint_suffix = ${adls_e2e.endpoint_suffix}
    auth_type = "SHARED_KEY"
    account_key = ${adls_e2e.account_key}
    hadoop_adls_properties = ${adls_e2e.hadoop_properties}
    path = ${adls_e2e.test_root}"/output/"${RUN_ID}
    file_format_type = "csv"
    field_delimiter = ","
    row_delimiter = "\n"
    skip_header_row_number = 1
    schema = {
      fields {
        id = int
        name = string
      }
    }
  }
}

sink {
  Assert {
    rules {
      row_rules = [
        { rule_type = MIN_ROW, rule_value = 4 },
        { rule_type = MAX_ROW, rule_value = 4 }
      ]
      field_rules = [
        {
          field_name = id
          field_type = int
          field_value = [
            { rule_type = NOT_NULL },
            { rule_type = MIN, rule_value = 1 },
            { rule_type = MAX, rule_value = 4 }
          ]
        },
        {
          field_name = name
          field_type = string
          field_value = [{ rule_type = NOT_NULL }]
        }
      ]
    }
  }
}
