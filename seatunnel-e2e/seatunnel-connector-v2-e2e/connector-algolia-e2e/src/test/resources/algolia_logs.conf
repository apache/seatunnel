env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.retain-after-job-cancelled = true
  read_limit.rows_per_second = "${fixture_rate}"
}

source {
  Algolia {
    plugin_output = "export"
    base_url = "${fixture_origin}"
    application_id = "${fixture_application_id}"
    token = "${fixture_token}"
    start_date = "${fixture_start}"
    end_date = "${fixture_end}"
    search_query = "${fixture_query}"
    indices_page_size = "${fixture_size}"
    logs_page_size = "${fixture_log_size}"
    max_pages = "${fixture_max_pages}"
    request_interval_ms = 25
    max_attempts = 3
    socket_timeout_ms = 20000
    page_deadline_ms = "${fixture_deadline}"
    max_response_bytes = "${fixture_bytes}"
    resources = ["logs"]
  }

}

sink {
  Jdbc {
    plugin_input = "export"
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://algolia-db:5432/test?loggerLevel=OFF"
    username = "test"
    password = "test"
    database = "test"
    table = "public.algolia_rows"
    generate_sink_sql = true
    batch_size = 1
  }

}
