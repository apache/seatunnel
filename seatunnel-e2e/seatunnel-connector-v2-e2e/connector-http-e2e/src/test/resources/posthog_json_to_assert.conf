env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  PostHog {
    plugin_output = "posthog_events"
    base_url = "http://mockserver:1080"
    project_id = "123"
    api_key = "phx_test"
    query = "SELECT event, distinct_id FROM events LIMIT 2"
    schema = {
      fields {
        event = string
        distinct_id = string
      }
    }
  }
}

sink {
  Assert {
    plugin_input = "posthog_events"
    rules {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 2
        },
        {
          rule_type = MAX_ROW
          rule_value = 2
        }
      ]
      field_rules = [
        {
          field_name = event
          field_type = string
          field_value = [{ rule_type = NOT_NULL }]
        },
        {
          field_name = distinct_id
          field_type = string
          field_value = [{ rule_type = NOT_NULL }]
        }
      ]
    }
  }
}
