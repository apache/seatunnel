env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  # Mirrors the configuration documented in docs/en/connectors/source/Shopify.md, including
  # content_field: the Admin REST API answers with {"products": [...]} rather than a bare
  # array, so the JsonPath is what turns the response into rows.
  #
  # The mock only answers when X-Shopify-Access-Token is present, so this also covers the one
  # thing the connector adds over a plain HTTP source — if buildWithConfig ever stops
  # injecting the header, the request does not match and this job fails.
  Shopify {
    plugin_output = "http"
    url = "http://mockserver:1080/admin/api/2024-01/products.json"
    access_token = "e2e-shopify-access-token"
    method = "GET"
    format = "json"
    content_field = "$.products.*"
    schema = {
      fields {
        id = string
        title = string
        vendor = string
        product_type = string
        created_at = string
        updated_at = string
      }
    }
  }
}

sink {
  Assert {
    plugin_input = "http"
    rules {
      row_rules = [
        {
          rule_type = MAX_ROW
          rule_value = 5
        },
        {
          rule_type = MIN_ROW
          rule_value = 5
        }
      ],

      field_rules = [
        {
          field_name = id
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = title
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = product_type
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
    }
  }
}
