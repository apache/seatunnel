env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  HubSpot {
    url = "http://localhost:8089/crm/v3/objects/contacts"
    access_token = "dummy-token"
  }
}

sink {
  Assert {
    rules = {
      row_rules = [
        {
          rule_type = MAX_ROW
          rule_value = 4
        },
        {
          rule_type = MIN_ROW
          rule_value = 4
        }
      ]
    }
  }
}