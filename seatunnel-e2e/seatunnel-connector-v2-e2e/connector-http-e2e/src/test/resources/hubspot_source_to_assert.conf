env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  HubSpot {
    #Route traffic from the Docker container back to the host JVM
    url = "http://host.testcontainers.internal:8089/crm/v3/objects/contacts"
    access_token = "dummy-token"
    format = "JSON"
    content_field = "$.results"

    schema = {
      fields {
        id = string
        properties = string
      }
    }
  }
}

sink {
  Assert {
    rules = {
      row_rules = [
        {
          rule_type = MAX_ROW
          rule_value = 4
        },
        {
          rule_type = MIN_ROW
          rule_value = 4
        }
      ]
    }
  }
}
