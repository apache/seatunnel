env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  Matomo {
    url = "http://mockserver:1080/matomo-report"
    site_id = 1
    start_date = "2026-06-01"
    end_date = "2026-06-02"
  }
}

sink {
  Assert {
    rules {
      row_rules = [
        { rule_type = MIN_ROW, rule_value = 1 },
        { rule_type = MAX_ROW, rule_value = 1 }
      ]
      field_rules = [
        { field_name = site_id, field_type = int, field_value = [{ equals_to = 1 }] },
        { field_name = report_date, field_type = string, field_value = [{ equals_to = "2026-06-01" }] },
        { field_name = visits, field_type = bigint, field_value = [{ rule_type = MIN, rule_value = 9 }, { rule_type = MAX, rule_value = 9 }] },
        { field_name = actions, field_type = bigint, field_value = [{ rule_type = MIN, rule_value = 17 }, { rule_type = MAX, rule_value = 17 }] },
        { field_name = unique_visitors, field_type = bigint, field_value = [{ rule_type = NULL }] }
      ]
    }
  }
}
