server {
    listen 80;
    default_type application/json;

    location = /health {
        return 200 '{}';
    }

    location = /sonarqube/api/measures/component {
        if ($args = 'component=example%3Afixture&metricKeys=ncloc%2Cnew_coverage') {
            return 200 '{"component":{"key":"example:fixture","name":"Example","qualifier":"TRK","measures":[{"metric":"ncloc","value":"456"},{"metric":"new_coverage","period":{"index":1,"value":"80.5","bestValue":false}}]}}';
        }
        return 400 '{}';
    }
}
