env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  CbsStatLine {
    base_url = "http://statline-fixture"
    dataset_id = "83765NED"
    plugin_output = "observations"
  }
}

# Keep all source columns and validate the two fixed fixture rows after plugin installation.
# Exact JSON comparisons also protect period/dimension fields and unrounded numeric text.
transform {
  Sql {
    plugin_input = "observations"
    plugin_output = "validated_rows"
    query = """SELECT dataset_id, id, measure, `value`, string_value, value_attribute, observation,
      CASE
        WHEN dataset_id = '83765NED' AND id = 0 AND measure = 'M1' AND `value` IS NULL
          AND string_value = 'Nederland  ' AND value_attribute IS NULL
          AND observation = '{"Id":0,"Measure":"M1","Value":null,"StringValue":"Nederland  ","Region":"NL00"}' THEN 1
        WHEN dataset_id = '83765NED' AND id = 1 AND measure = 'M2'
          AND `value` = '0.123456789012345678901' AND string_value IS NULL AND value_attribute = 'None'
          AND observation = '{"Id":1,"Measure":"M2","Value":0.123456789012345678901,"ValueAttribute":"None","Region":"NL01"}' THEN 1
        ELSE 0 END AS contract_ok
      FROM dual"""
  }
}

sink {
  Assert {
    plugin_input = "validated_rows"
    rules {
      row_rules = [
        { rule_type = MIN_ROW, rule_value = 2 },
        { rule_type = MAX_ROW, rule_value = 2 }
      ]
      field_rules = [
        {
          field_name = contract_ok
          field_type = int
          field_value = [
            { rule_type = NOT_NULL },
            { rule_type = MIN, rule_value = 1 },
            { rule_type = MAX, rule_value = 1 }
          ]
        },
        {
          field_name = dataset_id
          field_type = string
          field_value = [
            { rule_type = NOT_NULL }
          ]
        },
        {
          field_name = observation
          field_type = string
          field_value = [
            { rule_type = NOT_NULL }
          ]
        }
      ]
    }
  }
}
