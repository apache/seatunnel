env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  SonarQube {
    base_url = "http://sonarqube-fixture/sonarqube"
    project_key = "example:fixture"
    metric_keys = ["ncloc", "new_coverage"]
    plugin_output = "sonar_measures"
  }
}

# Keep all source columns and validate the two fixed fixture rows after plugin installation.
# Exact JSON comparisons also protect period/dimension fields and unrounded numeric text.
transform {
  Sql {
    plugin_input = "sonar_measures"
    plugin_output = "validated_rows"
    query = """SELECT project_key, project_name, metric_key, `value`, best_value, measure,
      CASE
        WHEN project_key = 'example:fixture' AND project_name = 'Example'
          AND metric_key = 'ncloc' AND `value` = '456' AND best_value = true
          AND measure = '{"metric":"ncloc","value":"456","bestValue":true}' THEN 1
        WHEN project_key = 'example:fixture' AND project_name = 'Example'
          AND metric_key = 'new_coverage' AND `value` IS NULL AND best_value IS NULL
          AND measure = '{"metric":"new_coverage","period":{"index":1,"value":"80.5","bestValue":false}}' THEN 1
        ELSE 0 END AS contract_ok
      FROM dual"""
  }
}

sink {
  Assert {
    plugin_input = "validated_rows"
    rules {
      row_rules = [
        { rule_type = MIN_ROW, rule_value = 2 },
        { rule_type = MAX_ROW, rule_value = 2 }
      ]
      field_rules = [
        {
          field_name = contract_ok
          field_type = int
          field_value = [
            { rule_type = NOT_NULL },
            { rule_type = MIN, rule_value = 1 },
            { rule_type = MAX, rule_value = 1 }
          ]
        },
        {
          field_name = project_key
          field_type = string
          field_value = [
            { rule_type = NOT_NULL }
          ]
        },
        {
          field_name = measure
          field_type = string
          field_value = [
            { rule_type = NOT_NULL }
          ]
        }
      ]
    }
  }
}
