server {
    listen 80;
    default_type application/json;

    location = /health {
        return 200 '{}';
    }

    location = /odata/v1/CBS/83765NED/Observations {
        if ($args = 'cursor=page%2B2') {
            return 200 '{"value":[{"Id":1,"Measure":"M2","Value":0.123456789012345678901,"ValueAttribute":"None","Region":"NL01"}]}';
        }
        if ($args = '') {
            return 200 '{"value":[{"Id":0,"Measure":"M1","Value":null,"StringValue":"Nederland  ","Region":"NL00"}],"@odata.nextLink":"?cursor=page%2B2"}';
        }
        return 400 '{}';
    }
}
