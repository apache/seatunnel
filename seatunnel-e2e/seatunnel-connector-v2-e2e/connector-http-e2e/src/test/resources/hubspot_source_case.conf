# ---------------------------------------------------------------------------------
# STRICT CONFIGURATION TO FIX EXIT CODE 1
# ---------------------------------------------------------------------------------

env {
  execution.parallelism = 1
}

source {
  HubSpot {
    url = "http://mock-server:1080/crm/v3/objects/contacts"
    access_token = "test_token"
    format = "JSON"
    object_type = "contacts"
    content_field = "$.results"

    schema = {
      fields {
        id = string
        properties = string
      }
    }
    json_field = {
      id = "$.id"
      properties = "$.properties"
    }
  }
}

transform {
}

sink {
  Console {}
}
