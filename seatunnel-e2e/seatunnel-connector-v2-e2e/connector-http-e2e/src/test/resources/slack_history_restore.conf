env {
  parallelism = 1
  job.mode = "STREAMING"
  job.retry.times = 0
  checkpoint.interval = 1000
}
source {
  Slack {
    token = "fixture-token"
    channel_ids = ["C1", "C2"]
    api_root = "http://slack-fixture:1080/"${slack_scenario}"/"
    page_size = 15
    oldest = "1699999999.999999"
    max_retries = 2
    retry_backoff_ms = 1
    max_retry_delay_ms = 1000
    request_timeout_ms = 300000
    max_response_bytes = 1024
    max_pages_per_channel = 10
  }
}
sink {
  Jdbc {
    driver = org.postgresql.Driver
    url = "jdbc:postgresql://slack-postgres:5432/test?loggerLevel=OFF"
    username = "test"
    password = "test"
    database = "test"
    table = "public.slack_history"
    generate_sink_sql = true
    batch_size = 1
  }
}
