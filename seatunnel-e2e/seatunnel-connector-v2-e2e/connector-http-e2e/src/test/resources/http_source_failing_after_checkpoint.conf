# The server answers the first requests and then rejects every request. Checkpoints complete
# while it answers, so when the reader fails, its split was assigned before the last checkpoint.
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  # HttpIT relies on one checkpoint at a time to know a checkpoint started after a row was read
  execution.max-concurrent-checkpoints = 1
  flink.restart-strategy = "fixed-delay"
  flink.restart-strategy.fixed-delay.attempts = 2
  flink.restart-strategy.fixed-delay.delay = 1000
}

source {
  Http {
    plugin_output = "http"
    url = "http://mockserver:1080/example/restart/failing-after-checkpoint"
    method = "GET"
    format = "json"
    poll_interval_millis = 1000
    schema = {
      fields {
        c_string = string
        c_int = int
      }
    }
  }
}

sink {
  Assert {
    plugin_input = "http"
    rules {
      field_rules = [
        {
          field_name = c_int
          field_type = int
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
    }
  }
}
