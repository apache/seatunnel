env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.timeout = 15000
}

source {
  Feishu {
    app_id = "${scenario}"
    client_secret = "${secret}"
    token = "${baseToken}"
    table_id = "${scenario}"
    api_base_url = "http://feishu-source-fixture:8080"
    allow_insecure_http = true
    page_size = 2
    page_timeout_ms = ${pageTimeout}
    max_pages = ${maxPages}
    max_retries = 3
  }
}

sink {
  Http {
    url = "http://feishu-source-fixture:8080/sink/${scenario}"
  }
}
