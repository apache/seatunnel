env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
      schema = {
           table = "simple_example_nullable"
           columns = [
           {
              name = book_id
              type = bigint
              nullable = false
              comment = "primary key id"
           },
           {
              name = book_intro
              type = float_vector
              columnScale = 4
              nullable = false
              comment = "vector"
           },
           {
              name = book_title
              type = string
              nullable = true
              comment = "nullable title"
           }
       ]
        primaryKey {
            name = book_id
            columnNames = [book_id]
        }
      }
      rows = [
        {
          kind = INSERT
          fields = [1, [0.1, 0.2, 0.3, 0.4], null]
        },
        {
          kind = INSERT
          fields = [2, [0.2, 0.3, 0.4, 0.5], "nullable title"]
        }
      ]
  }
}

sink {
   Milvus {
     url = "http://milvus-e2e:19530"
     token = "root:Milvus"
     database = "test_nullable"
     enable_nullable_field = true
   }
}
