######
###### This config file is a demonstration of streaming processing in seatunnel config
######

env {
  parallelism = 1
  job.mode = "BATCH"
  checkpoint.interval = 10000
}

source {
  FakeSource {
    schema = {
      fields {
        c_int = int
        c_string = string
        c_json = string
      }
    }
    rows = [
      {
        kind = INSERT
        fields = [1, "A", "{\"user_id\": 101, \"event_type\": \"login\", \"location\": \"USA\"}"]
      },
      {
        kind = INSERT
        fields = [2, "B", "{\"user_id\": 102, \"event_type\": \"login\", \"location\": \"Canada\"}"]
      },
      {
        kind = INSERT
        fields = [3, "C", "{\"user_id\": 103, \"event_type\": \"logout\", \"location\": \"Mexico\"}"]
      },
      {
        kind = INSERT
        fields = [4, "D", "{\"user_id\": 104, \"event_type\": \"login\", \"location\": \"China\"}"]
      },
      {
        kind = INSERT
        fields = [5, "E", "{\"user_id\": 105, \"event_type\": \"logout\", \"location\": \"Thailand\"}"]
      }
    ]
  }
}

sink {
  Clickhouse {
    host = "clickhouse:8123"
    database = "default"
    table = "multi_sink_table1"
    username = "default"
    password = ""
  }
}