# NOTE:
# This e2e fixture validates ClickhouseFile sink Avro temp-file mode.
# It requires clickhouse-local and file transfer preconditions in test runtime.

env {
  parallelism = 1
  job.mode = "BATCH"
  checkpoint.interval = 10
}

source {
  Clickhouse {
    host = "clickhouse:8123"
    database = "default"
    sql = "select * from source_table"
    username = "default"
    password = ""
    plugin_output = "source_table"
  }
}

sink {
  ClickhouseFile {
    host = "clickhouse:8123"
    database = "default"
    table = "sink_table"
    username = "default"
    password = ""
    clickhouse_local_path = "/usr/bin/clickhouse-local"
    node_free_password = true
    copy_method = "scp"
    file_temp_path = "/tmp/seatunnel/clickhouse-local/file"
  }
}
