######
###### This job copies a table whose column names contain characters that
###### are not valid Java identifier parts ('#', ' ', '-') to make sure the
###### ClickHouse sink named-parameter SQL still binds every field. The
###### column names come from the source table schema, so they never appear
###### as keys in this config file.
######

env {
  parallelism = 1
  job.mode = "BATCH"
  checkpoint.interval = 10
}

source {
  Clickhouse {
    host = "clickhouse:8123"
    table_path = "default.special_column_source_table"
    sql = "select * from special_column_source_table"
    username = "default"
    password = ""
    plugin_output = "special_column_source_table"
  }
}

sink {
  Clickhouse {
    host = "clickhouse:8123"
    database = "default"
    table = "special_column_sink_table"
    username = "default"
    password = ""
  }
}
