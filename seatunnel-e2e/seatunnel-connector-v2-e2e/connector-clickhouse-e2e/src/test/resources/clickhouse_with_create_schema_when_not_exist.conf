######
###### This config file is a demonstration of streaming processing in seatunnel config
######

env {
  parallelism = 1
  job.mode = "BATCH"
  checkpoint.interval = 10000
}

source {
  FakeSource {
    schema = {
      table = "source_table_for_schema"
      columns = [
        {
          name = "c_string"
          type = string
          nullable = false
        },
        {
          name = "c_boolean"
          type = boolean
          nullable = false
        },
        {
          name = "c_tinyint"
          type = tinyint
          nullable = false
        },
        {
          name = "c_smallint"
          type = smallint
          nullable = false
        },
        {
          name = "c_int"
          type = int
          nullable = false
        },
        {
          name = "c_bigint"
          type = bigint
          nullable = false
        },
        {
          name = "c_float"
          type = float
          nullable = false
        },
        {
          name = "c_double"
          type = double
          nullable = false
        },
        {
          name = "c_decimal"
          type = "decimal(30, 8)"
          nullable = false
        },
        {
          name = "c_date"
          type = date
          nullable = false
        },
        {
          name = "c_time"
          type = time
          nullable = false
        },
        {
          name = "c_timestamp"
          type = timestamp
          nullable = false
        },
        {
          name = "c_map"
          type = "map<string, int>"
          nullable = false
        },
        {
          name = "c_array"
          type = "array<int>"
          nullable = false
        }
      ]
      primaryKey {
        name = "c_string"
        columnNames = [c_string]
      }
    }
    row.num = 100
  }
}

sink {
  Clickhouse {
    host = "clickhouse:8123"
    database = "default"
    table = "sink_table_for_schema"
    username = "default"
    password = ""
    "schema_save_mode"="CREATE_SCHEMA_WHEN_NOT_EXIST"
    "data_save_mode"="APPEND_DATA"
    primary_key = "c_string"
    support_upsert = true
    allow_experimental_lightweight_delete = true
  }
}