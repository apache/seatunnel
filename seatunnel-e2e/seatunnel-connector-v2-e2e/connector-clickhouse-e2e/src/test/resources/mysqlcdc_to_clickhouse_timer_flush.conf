env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 300000
  sink.flush.interval = 500
}

source {
  MySQL-CDC {
    parallelism = 1
    server-id = 5690
    username = "st_user_source"
    password = "mysqlpw"
    table-names = ["shop.products"]
    url = "jdbc:mysql://mysql_clickhouse_timer_flush_e2e:3306/shop"
  }
}

sink {
  Clickhouse {
    host = "clickhouse_timer_flush_e2e:8123"
    database = "default"
    table = "clickhouse_timer_flush"
    username = "default"
    password = ""
    bulk_size = 100000
    schema_save_mode = "IGNORE"
    data_save_mode = "APPEND_DATA"
  }
}
