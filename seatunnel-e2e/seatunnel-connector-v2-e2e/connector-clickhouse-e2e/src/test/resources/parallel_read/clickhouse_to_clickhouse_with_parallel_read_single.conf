######
###### This config file is a demonstration of batch processing in seatunnel config
######

env {
  parallelism = 3
  job.mode = "BATCH"
  job.name = "clickhouse_to_clickhouse_with_parallel_read"
}

source {
  Clickhouse {
    host = "clickhouse:8123"
    database = "default"
    sql = "select * from parallel_source_table"
    username = "default"
    password = ""
    plugin_output = "parallel_source_table"
  }
}

sink {
  Clickhouse {
    plugin_input = "parallel_source_table"
    host = "clickhouse:8123"
    database = "default"
    table = "parallel_sink_table"
    username = "default"
    password = ""
  }
}
