env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  LocalFile {
    path = "/seatunnel/read/csv/defaults"
    file_format_type = csv
    csv_use_header_line = true
    null_format = "NULL"
    schema {
      columns = [
        { name = "id", type = "int", nullable = false, defaultValue = 7 }
        { name = "name", type = "string", nullable = false, defaultValue = "unknown" }
        { name = "optional", type = "string", nullable = true }
        { name = "date", type = "date", defaultValue = "2020-01-01" }
        { name = "timestamp", type = "timestamp", defaultValue = "2020-01-01 12:34:56" }
      ]
    }
  }
}

sink {
  Assert {
    rules {
      row_rules = [
        { rule_type = MIN_ROW, rule_value = 2 }
        { rule_type = MAX_ROW, rule_value = 2 }
      ]
      field_rules = [
        { field_name = id, field_type = int, field_value = [{ equals_to = 7 }] }
        { field_name = name, field_type = string, field_value = [{ equals_to = "unknown" }] }
        { field_name = optional, field_type = string, field_value = [{ equals_to = "keep" }] }
        { field_name = date, field_type = date, field_value = [{ rule_type = NOT_NULL, equals_to = "2020-01-01" }] }
        { field_name = timestamp, field_type = timestamp, field_value = [{ rule_type = NOT_NULL, equals_to = "2020-01-01T12:34:56" }] }
      ]
    }
  }
}
