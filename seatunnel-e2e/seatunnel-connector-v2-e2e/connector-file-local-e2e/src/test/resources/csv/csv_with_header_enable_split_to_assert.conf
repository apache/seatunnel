env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  LocalFile {
    path = "/seatunnel/read/csv/header"
    file_format_type = csv
    csv_use_header_line = true
    enable_file_split = true
    file_split_size = 8
    schema = {
      fields {
        id = int
        name = string
        is_female = boolean
      }
    }
  }
}

sink {
  Assert {
    rules {
      row_rules = [
        { rule_type = MAX_ROW, rule_value = 2 }
        { rule_type = MIN_ROW, rule_value = 2 }
      ]
      field_rules = [
        {
          field_name = id
          field_type = int
          field_value = [
            { rule_type = NOT_NULL }
            { rule_type = MIN, rule_value = 20 }
            { rule_type = MAX, rule_value = 30 }
          ]
        }
        {
          field_name = name
          field_type = string
          field_value = [
            { rule_type = NOT_NULL }
            { rule_type = MIN_LENGTH, rule_value = 3 }
            { rule_type = MAX_LENGTH, rule_value = 5 }
          ]
        }
        {
          field_name = is_female
          field_type = boolean
          field_value = [
            { rule_type = NOT_NULL }
          ]
        }
      ]
    }
  }
}
