env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  LocalFile {
    path = "/tmp/seatunnel_mnt/csv/json-type"
    plugin_output = "json_csv"
    file_format_type = "csv"
    field_delimiter = ","
    row_delimiter = "\n"
    skip_header_row_number = 1
    schema = {
      fields {
        id = int
        payload = json
        payloads = "array<json>"
        scalar_payload = json
        json_null = json
        sql_null = json
      }
    }
  }
}

sink {
  Assert {
    plugin_input = "json_csv"
    rules = {
      row_rules = [
        {rule_type = MIN_ROW, rule_value = 1}
        {rule_type = MAX_ROW, rule_value = 1}
      ]
      field_rules = [
        {
          field_name = payload
          field_type = json
          field_value = [{equals_to = {id = 1, message = "a,b"}}]
        }
        {
          field_name = payloads
          field_type = "array<json>"
          field_value = [{equals_to = [{nested = true}, ["quoted", 2]]}]
        }
        {
          field_name = scalar_payload
          field_type = json
          field_value = [{equals_to = 7}]
        }
        {
          field_name = json_null
          field_type = json
          field_value = [{rule_type = NOT_NULL}]
        }
        {
          field_name = sql_null
          field_type = json
          field_value = [{rule_type = NULL}]
        }
      ]
    }
  }
}
