env {
  parallelism = 1
  job.mode = BATCH
}

source {
  LocalFile {
    path = "/tmp/seatunnel_mnt/custom_delimiter"
    file_format_type = "csv"
    field_delimiter = "|"
    schema {
      fields {
        c_string = string
        c_int = int
      }
    }
    plugin_output = "local"
  }
}

sink {
  Assert {
    plugin_input = "local"
    rules {
      row_rules = [
        {rule_type = MIN_ROW, rule_value = 2},
        {rule_type = MAX_ROW, rule_value = 2}
      ]
      field_rules = [
        {
          field_name = c_string
          field_type = string
          field_value = [
            {rule_type = MIN_LENGTH, rule_value = 3},
            {rule_type = MAX_LENGTH, rule_value = 3},
            {equals_to = "a|b"}
          ]
        },
        {
          field_name = c_int
          field_type = int
          field_value = [
            {rule_type = MIN, rule_value = 42},
            {rule_type = MAX, rule_value = 42}
          ]
        }
      ]
    }
  }
}
