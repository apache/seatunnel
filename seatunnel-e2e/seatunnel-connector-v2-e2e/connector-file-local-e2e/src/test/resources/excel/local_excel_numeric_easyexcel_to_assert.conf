# Reads back the file written by fake_to_local_excel_numeric.conf. Before the fix the
# values came back rounded: 10.28571429, 1012345.67 and 9215784885957046.

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  LocalFile {
    path = "/tmp/seatunnel_mnt/excel_numeric/output"
    file_format_type = excel
    excel_engine = EasyExcel
    skip_header_row_number = 1
    schema = {
      fields {
        c_double = double
        c_decimal = "decimal(20, 4)"
        c_wide_decimal = "decimal(20, 4)"
      }
    }
  }
}

sink {
  Assert {
    rules {
      row_rules = [
        {rule_type = MIN_ROW, rule_value = 1},
        {rule_type = MAX_ROW, rule_value = 1}
      ]
      field_rules = [
        {
          field_name = c_double
          field_type = double
          field_value = [{rule_type = NOT_NULL, equals_to = 10.285714285}]
        },
        {
          field_name = c_decimal
          field_type = "decimal(20, 4)"
          field_value = [{rule_type = NOT_NULL, equals_to = "1012345.6699"}]
        },
        {
          field_name = c_wide_decimal
          field_type = "decimal(20, 4)"
          field_value = [{rule_type = NOT_NULL, equals_to = "9215784885957046.9450"}]
        }
      ]
    }
  }
}
