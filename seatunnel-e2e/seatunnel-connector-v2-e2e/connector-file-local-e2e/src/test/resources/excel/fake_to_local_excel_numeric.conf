# Writes numbers that the "General" display format or a double would round.
# local_excel_numeric_poi_to_assert.conf and local_excel_numeric_easyexcel_to_assert.conf
# read them back with the two reader engines.

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        c_double = double
        c_decimal = "decimal(20, 4)"
        c_wide_decimal = "decimal(20, 4)"
      }
    }
    rows = [
      # c_decimal fits a double and is written as a number cell, c_wide_decimal has
      # 17 significant digits and is written as a text cell
      {kind = INSERT, fields = [10.285714285, "1012345.6699", "9215784885957046.9450"]}
    ]
  }
}

sink {
  LocalFile {
    # Under the mount shared by the Flink job manager and task manager. LocalFileIT
    # creates both directories empty and writable before the test.
    path = "/tmp/seatunnel_mnt/excel_numeric/output"
    tmp_path = "/tmp/seatunnel_mnt/excel_numeric/pending"
    file_format_type = "excel"
  }
}
