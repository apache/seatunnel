env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  LocalFile {
    plugin_output = "word_rows"
    path = "/seatunnel/read/word/test.docx"
    file_format_type = "word"
  }
}

transform {
  Sql {
    plugin_input = "word_rows"
    plugin_output = "heading_rows"
    query = "select * from word_rows where text = 'The Essential Guide to Groceries: Shopping, Storing, and Enjoying Food at Home'"
  }

  Sql {
    plugin_input = "word_rows"
    plugin_output = "table_rows"
    query = "select * from word_rows where element_type = 'table' and text like '%Rich in vitamins and fiber%'"
  }
}

sink {
  Assert {
    plugin_input = "heading_rows"
    rules {
      row_rules = [
        { rule_type = MIN_ROW, rule_value = 1 }
        { rule_type = MAX_ROW, rule_value = 1 }
      ]
      field_rules = [
        {
          field_name = element_id
          field_type = string
          field_value = [{ rule_type = NOT_NULL }]
        }
        {
          field_name = element_type
          field_type = string
          field_value = [{ equals_to = "heading" }]
        }
        {
          field_name = heading_level
          field_type = int
          field_value = [{ equals_to = 1 }]
        }
        {
          field_name = text
          field_type = string
          field_value = [
            { equals_to = "The Essential Guide to Groceries: Shopping, Storing, and Enjoying Food at Home" }
          ]
        }
      ]
    }
  }

  Assert {
    plugin_input = "table_rows"
    rules {
      row_rules = [
        { rule_type = MIN_ROW, rule_value = 1 }
        { rule_type = MAX_ROW, rule_value = 1 }
      ]
      field_rules = [
        {
          field_name = element_id
          field_type = string
          field_value = [{ rule_type = NOT_NULL }]
        }
        {
          field_name = element_type
          field_type = string
          field_value = [{ equals_to = "table" }]
        }
        {
          field_name = text
          field_type = string
          field_value = [
            { rule_type = NOT_NULL }
            { rule_type = MIN_LENGTH, rule_value = 100 }
          ]
        }
      ]
    }
  }
}
