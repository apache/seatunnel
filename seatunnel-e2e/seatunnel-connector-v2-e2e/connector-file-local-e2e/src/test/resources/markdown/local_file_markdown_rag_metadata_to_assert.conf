env {
  parallelism = 1
  job.mode = "BATCH"
  spark.app.name = "SeaTunnel"
  spark.executor.instances = 2
  spark.executor.cores = 1
  spark.executor.memory = "1g"
  spark.master = local
}

source {
  LocalFile {
    plugin_output = "markdown_rows"
    path = "/seatunnel/read/markdown/e2e.md"
    file_format_type = "markdown"
    markdown_rag_metadata_enabled = true
  }
}

transform {
  Metadata {
    plugin_input = "markdown_rows"
    plugin_output = "markdown_rows_with_logical_metadata"
    metadata_fields = {
      SourceUri = "ks_source_uri"
      DocumentId = "ks_document_id"
      DocumentHash = "document_hash"
      ChunkHash = "chunk_hash"
    }
  }
  Sql {
    plugin_input = "markdown_rows_with_logical_metadata"
    plugin_output = "heading_rows"
    query = "select * from markdown_rows_with_logical_metadata where element_id = 'Heading_1'"
  }
  Sql {
    plugin_input = "markdown_rows_with_logical_metadata"
    plugin_output = "child_heading_rows"
    query = "select * from markdown_rows_with_logical_metadata where element_id = 'Heading_2'"
  }
  Sql {
    plugin_input = "markdown_rows_with_logical_metadata"
    plugin_output = "paragraph_rows"
    query = "select * from markdown_rows_with_logical_metadata where element_id = 'Paragraph_1'"
  }
  TableRename {
    plugin_input = "heading_rows"
    plugin_output = "heading_assert_rows"
    suffix = "_heading"
  }
  TableRename {
    plugin_input = "child_heading_rows"
    plugin_output = "child_heading_assert_rows"
    suffix = "_child_heading"
  }
  TableRename {
    plugin_input = "paragraph_rows"
    plugin_output = "paragraph_assert_rows"
    suffix = "_paragraph"
  }
}

sink {
  Assert {
    plugin_input = "heading_assert_rows"
    rules {
      row_rules = [
        {
          rule_type = MAX_ROW
          rule_value = 1
        },
        {
          rule_type = MIN_ROW
          rule_value = 1
        }
      ],
      field_rules = [
        {
          field_name = element_id
          field_type = string
          field_value = [
            {
              equals_to = "Heading_1"
            }
          ]
        },
        {
          field_name = element_type
          field_type = string
          field_value = [
            {
              equals_to = "Heading"
            }
          ]
        },
        {
          field_name = heading_level
          field_type = int
          field_value = [
            {
              equals_to = 1
            }
          ]
        },
        {
          field_name = text
          field_type = string
          field_value = [
            {
              equals_to = "E2E Markdown RAG"
            }
          ]
        },
        {
          field_name = parent_id
          field_type = string
          field_value = [
            {
              rule_type = NULL
            }
          ]
        },
        {
          field_name = child_ids
          field_type = array<string>
          field_value = [{ equals_to = ["Heading_2"] }]
        },
        {
          field_name = source_uri
          field_type = string
          field_value = [
            {
              equals_to = "/seatunnel/read/markdown/e2e.md"
            }
          ]
        },
        {
          field_name = document_id
          field_type = string
          field_value = [
            {
              equals_to = "doc_f9e9a2324852c0fdff7ecea9013e95f3a2361f570b0d5226f2f671ae38d1d1c8"
            }
          ]
        },
        {
          field_name = chunk_id
          field_type = string
          field_value = [
            {
              equals_to = "chunk_b48c799b9daccdb6a04d665be5892bc9efc84795f266f7ec27c5b4fd2f0a5af0"
            }
          ]
        },
        {
          field_name = chunk_index
          field_type = int
          field_value = [
            {
              equals_to = 1
            }
          ]
        },
        {
          field_name = content_hash
          field_type = string
          field_value = [
            {
              equals_to = "6fc6a22e9e5515086f32ea5400fcd490c92cbe0f3707febffb8f97b83abe2f46"
            }
          ]
        },
        {
          field_name = ks_source_uri
          field_type = string
          field_value = [
            {
              equals_to = "/seatunnel/read/markdown/e2e.md"
            }
          ]
        },
        {
          field_name = ks_document_id
          field_type = string
          field_value = [
            {
              equals_to = "doc_f9e9a2324852c0fdff7ecea9013e95f3a2361f570b0d5226f2f671ae38d1d1c8"
            }
          ]
        },
        {
          field_name = document_hash
          field_type = string
          field_value = [
            {
              equals_to = "35f4024ea492a3a66048f502cce55f396f8eb1b03bffc22dc9a36e83d29decc9"
            }
          ]
        },
        {
          field_name = chunk_hash
          field_type = string
          field_value = [
            {
              equals_to = "6fc6a22e9e5515086f32ea5400fcd490c92cbe0f3707febffb8f97b83abe2f46"
            }
          ]
        }
      ]
    }
  }
  Assert {
    plugin_input = "child_heading_assert_rows"
    rules {
      row_rules = [
        { rule_type = MAX_ROW, rule_value = 1 }
        { rule_type = MIN_ROW, rule_value = 1 }
      ]
      field_rules = [
        {
          field_name = parent_id
          field_type = string
          field_value = [{ equals_to = "Heading_1" }]
        }
        {
          field_name = child_ids
          field_type = array<string>
          field_value = [{ equals_to = ["Paragraph_1"] }]
        }
      ]
    }
  }
  Assert {
    plugin_input = "paragraph_assert_rows"
    rules {
      row_rules = [
        { rule_type = MAX_ROW, rule_value = 1 }
        { rule_type = MIN_ROW, rule_value = 1 }
      ]
      field_rules = [
        {
          field_name = parent_id
          field_type = string
          field_value = [{ equals_to = "Heading_2" }]
        }
        {
          field_name = child_ids
          field_type = array<string>
          field_value = [{ equals_to = [] }]
        }
      ]
    }
  }
}
