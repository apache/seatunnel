env { parallelism = 1, job.mode = "BATCH" }

source {
  LocalFile {
    plugin_output = "raw_default"
    path = "/seatunnel/read/raw-text/raw.txt"
    file_format_type = "text"
    parse_partition_from_path = false
  }
  LocalFile {
    plugin_output = "raw_explicit"
    path = "/seatunnel/read/raw-text/raw.txt"
    file_format_type = "text"
    parse_partition_from_path = false
    field_delimiter = ","
  }
}

sink {
  Assert {
    plugin_input = "raw_default"
    rules {
      row_rules = [{rule_type = MIN_ROW, rule_value = 2}, {rule_type = MAX_ROW, rule_value = 2}]
      field_rules = [
        {field_name = content, field_type = string, field_value = [{rule_type = NOT_NULL, equals_to = "a,b,c\u0001tail||end"}]}
      ]
    }
  }
  Assert {
    plugin_input = "raw_explicit"
    rules {
      row_rules = [{rule_type = MIN_ROW, rule_value = 2}, {rule_type = MAX_ROW, rule_value = 2}]
      field_rules = [
        {field_name = content, field_type = string, field_value = [{rule_type = NOT_NULL, equals_to = "a,b,c\u0001tail||end"}]}
      ]
    }
  }
}
