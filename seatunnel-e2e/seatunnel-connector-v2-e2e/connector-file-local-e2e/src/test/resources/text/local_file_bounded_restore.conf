env {
  parallelism = 2
  job.mode = "BATCH"
  checkpoint.interval = 1000
  read_limit.rows_per_second = 2
}
source {
  LocalFile {
    path = "/tmp/seatunnel_mnt/bounded-restore/source"
    file_format_type = "text"
    schema {
      fields {
        id = int
      }
    }
  }
}
sink {
  LocalFile {
    path = "/tmp/seatunnel_mnt/bounded-restore/output"
    tmp_path = "/tmp/seatunnel_mnt/bounded-restore/pending"
    file_format_type = "text"
    is_enable_transaction = true
    file_name_expression = "${transactionId}"
    row_delimiter = "\n"
  }
}
