env { parallelism = 1, job.mode = "BATCH" }
source {
  LocalFile {
    path = "/seatunnel/read/temporal/temporal_auto.txt"
    file_format_type = "text"
    field_delimiter = ","
    skip_header_row_number = 17
    schema { fields { c_date = date, c_time = time, c_timestamp = timestamp } }

  }
}
sink {
  Assert {
    rules {
      row_rules = [{rule_type = MIN_ROW, rule_value = 3}, {rule_type = MAX_ROW, rule_value = 3}]
      field_rules = [
        {field_name = c_date, field_type = date, field_value = [{rule_type = NOT_NULL, equals_to = "2024-05-20"}]},
        {field_name = c_time, field_type = time, field_value = [{rule_type = NOT_NULL, equals_to = "12:34:56"}]},
        {field_name = c_timestamp, field_type = timestamp, field_value = [{rule_type = NOT_NULL, equals_to = "2024-05-20T12:34:56.123"}]}
      ]
    }
  }
}
