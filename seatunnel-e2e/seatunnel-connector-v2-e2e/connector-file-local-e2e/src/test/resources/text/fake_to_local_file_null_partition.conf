env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    row.num = 10
    plugin_output = "fake"
    schema = {
      fields {
        id = int
        c_null = "null"
      }
    }
  }
}

sink {
  LocalFile {
    plugin_input = "fake"
    path = "/tmp/seatunnel/text_null_partition"
    field_delimiter = "\t"
    row_delimiter = "\n"
    partition_by = ["c_null"]
    file_name_expression = "${transactionId}_${now}"
    file_format_type = "text"
    filename_time_format = "yyyy.MM.dd"
    is_enable_transaction = true
  }
}
