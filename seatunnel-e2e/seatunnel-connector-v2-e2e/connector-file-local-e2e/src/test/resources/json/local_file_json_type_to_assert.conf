env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  LocalFile {
    path = "/tmp/seatunnel/json-type"
    plugin_output = "json_file"
    file_format_type = "json"
    schema = {
      fields {
        id = int
        object_payload = json
        array_payload = json
        scalar_payload = json
        json_null = json
        sql_null = json
      }
    }
  }
}

sink {
  Assert {
    plugin_input = "json_file"
    rules = {
      row_rules = [
        {rule_type = MIN_ROW, rule_value = 1}
        {rule_type = MAX_ROW, rule_value = 1}
      ]
      field_rules = [
        {
          field_name = object_payload
          field_type = json
          field_value = [{equals_to = {id = 1, nested = [true, 2]}}]
        }
        {
          field_name = array_payload
          field_type = json
          field_value = [{equals_to = [{id = 2}, "text", false]}]
        }
        {
          field_name = scalar_payload
          field_type = json
          field_value = [{equals_to = 7}]
        }
        {
          field_name = json_null
          field_type = json
          field_value = [{rule_type = NOT_NULL}]
        }
        {
          field_name = sql_null
          field_type = json
          field_value = [{rule_type = NULL}]
        }
      ]
    }
  }
}
