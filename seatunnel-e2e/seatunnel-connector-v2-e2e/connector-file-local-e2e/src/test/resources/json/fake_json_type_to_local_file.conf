env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    schema = {
      fields {
        id = int
        object_payload = json
        array_payload = json
        scalar_payload = json
        json_null = json
        sql_null = json
      }
    }
    rows = [
      {
        fields = {
          id = 1
          object_payload = {id = 1, nested = [true, 2]}
          array_payload = [{id = 2}, "text", false]
          scalar_payload = 7
          json_null = null
        }
        kind = INSERT
      }
    ]
  }
}

sink {
  LocalFile {
    path = "/tmp/seatunnel_mnt/json/json-type"
    file_format_type = "json"
    row_delimiter = "\n"
    is_enable_transaction = true
    schema_save_mode = "RECREATE_SCHEMA"
    data_save_mode = "DROP_DATA"
  }
}
