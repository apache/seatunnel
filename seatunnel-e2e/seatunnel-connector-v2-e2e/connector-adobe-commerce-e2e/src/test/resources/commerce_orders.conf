env {
  job.mode = "BATCH"
  parallelism = 1
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.retain-after-job-cancelled = true
  read_limit.rows_per_second = "${fixture_rate}"
}
source {
  AdobeCommerce {
    plugin_output = "commerce_data"
    base_url = "${fixture_url}"
    store_code = "en_us"
    token = "${fixture_token}"
    page_size = "${fixture_limit}"
    max_pages = "${fixture_max_pages}"
    max_attempts = 3
    socket_timeout_ms = 20000
    page_deadline_ms = "${fixture_deadline}"
    max_response_bytes = "${fixture_bytes}"
    resources = ["orders"]
  }
}
sink {
  Jdbc {
    plugin_input = "commerce_data"
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://commerce-db:5432/test?loggerLevel=OFF"
    username = "test"
    password = "test"
    table = "public.commerce_rows"
    generate_sink_sql = true
    batch_size = 1
  }
}
