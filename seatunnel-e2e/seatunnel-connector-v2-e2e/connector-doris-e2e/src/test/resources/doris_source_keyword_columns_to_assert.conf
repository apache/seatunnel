env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Doris {
    fenodes = "doris_e2e:8030"
    username = root
    password = ""
    table_list = [
      {
        database = "e2e_source"
        table = "doris_keyword_column_table"
        doris.read.field = "id,from,desc,to,system"
      }
    ]
  }
}

transform {}

sink {
  Assert {
    rules = {
      row_rules = [
        {
          rule_type = MAX_ROW
          rule_value = 1
        },
        {
          rule_type = MIN_ROW
          rule_value = 1
        }
      ]
      field_rules = [
        {
          field_name = "id"
          field_type = int
          field_value = [
            {
              rule_type = NOT_NULL
              equals_to = 1
            }
          ]
        },
        {
          field_name = "from"
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
              equals_to = "beijing"
            }
          ]
        },
        {
          field_name = "desc"
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
              equals_to = "first"
            }
          ]
        },
        {
          field_name = "to"
          field_type = int
          field_value = [
            {
              rule_type = NOT_NULL
              equals_to = 7
            }
          ]
        },
        {
          field_name = "system"
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
              equals_to = "erp"
            }
          ]
        }
      ]
    }
  }
}
