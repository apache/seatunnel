env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Doris {
    fenodes = "doris_e2e:8030"
    username = root
    password = ""
    database = "test"
    table = "doris_largeint_source"
  }
}

sink {
  Jdbc {
    url = "jdbc:mysql://mysql_cdc_e2e:3306/mysql_cdc"
    driver = "com.mysql.cj.jdbc.Driver"
    username = "mysqluser"
    password = "mysqlpw"
    database = "mysql_cdc"
    table = "doris_largeint_sink"
    generate_sink_sql = true
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
  }
}
