  parallelism = 1
  job.mode = "BATCH"
}

source {
  Doris {
    fenodes = "doris_e2e:8030"
    username = root
    password = ""
    database = "e2e_largeint"
    table = "largeint_table"
  }
}

sink {
  Jdbc {
    url = "jdbc:mysql://mysql_largeint_e2e:3306/seatunnel?useSSL=false"
    driver = "com.mysql.cj.jdbc.Driver"
    username = "root"
    password = "Abc!@#135_seatunnel"
    generate_sink_sql = true
    database = "seatunnel"
    table = "largeint_table"
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
  }
}
