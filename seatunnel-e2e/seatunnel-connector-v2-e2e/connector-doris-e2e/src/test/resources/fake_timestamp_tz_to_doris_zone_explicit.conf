env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    schema = {
      fields {
        F_ID = "bigint"
        F_TS = "timestamp_tz"
      }
    }
    rows = [
      {
        kind = INSERT
        fields = [1, "2025-09-28T02:54:08+08:00"]
      }
    ]
  }
}

sink {
  Doris {
          fenodes = "doris_e2e:8030"
          schema_save_mode = "RECREATE_SCHEMA"
          username = root
          password = ""
          table.identifier = "e2e_sink.doris_tz_explicit"
          sink.datetime-timezone = "Asia/Shanghai"
          sink.enable-2pc = "false"
          sink.label-prefix = "test_tz_explicit"
          doris.config = {
              format = "json"
              read_json_by_line = "true"
          }
          save_mode_create_template = """CREATE TABLE IF NOT EXISTS `${database}`.`${table}` (${rowtype_fields}) ENGINE=OLAP UNIQUE KEY (`F_ID`) DISTRIBUTED BY HASH (`F_ID`) PROPERTIES ("replication_allocation" = "tag.location.default: 1")"""
      }
}
