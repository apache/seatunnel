env {
  parallelism=1
  job.mode=BATCH
}
source {
  WooCommerce {
    url="https://woocommerce-fixture"
    consumer_key="ck_0000000000000000000000000000000000000001"
    consumer_secret="cs_0000000000000000000000000000000000000002"
    start_date="2026-01-01T00:00:00Z"
    end_date="2026-02-01T00:00:00Z"
    page_size=2
    decimal_places=3
    schema {
      fields {
        id=bigint
        total="decimal(12,3)"
        currency=string
        status=string
        billing={ email=string }
        line_items="array<map<string,string>>"
      }
    }
  }
}
sink {
  Assert {
    rules {
      row_rules=[{rule_type=MIN_ROW,rule_value=3},{rule_type=MAX_ROW,rule_value=3}]
      field_rules=[
        {field_name=id,field_type=bigint,field_value=[{rule_type=NOT_NULL}]},
        {field_name=total,field_type="decimal(12,3)",field_value=[{rule_type=NOT_NULL,equals_to="12.345"}]},
        {field_name=currency,field_type=string,field_value=[{rule_type=NOT_NULL,equals_to="TND"}]},
        {field_name=status,field_type=string,field_value=[{rule_type=NOT_NULL,equals_to="completed"}]},
        {field_name=billing,field_type={email=string},field_value=[{rule_type=NOT_NULL,equals_to=["buyer@example.test"]}]},
        {field_name=line_items,field_type="array<map<string,string>>",field_value=[{rule_type=NOT_NULL}]}
      ]
    }
  }
}
