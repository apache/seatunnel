env {
  parallelism = 1
  job.mode = "BATCH"
  execution.restart.strategy = "no"

  dirty.collector = {
    type = "log"
    log_level = "ERROR"
    include_stack_trace = true
    threshold = 10
    fail_on_threshold = true
  }

  dirty.validator = {
    type = "AlwaysDirtyDataValidator"
  }
}

source {
  FakeSource {
    row.num = 100
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
        status = "string"
      }
    }
    plugin_output = "fake"
  }
}

sink {
  Console {
    plugin_input = "fake"
  }
}
