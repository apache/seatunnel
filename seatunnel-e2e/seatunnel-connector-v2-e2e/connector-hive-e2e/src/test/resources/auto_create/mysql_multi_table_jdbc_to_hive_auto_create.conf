env {
  parallelism = 2
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:mysql://mysql_e2e:3306/test?useSSL=false&serverTimezone=UTC"
    driver = "com.mysql.cj.jdbc.Driver"
    username = "st_user"
    password = "seatunnel"
    
    # Multiple table configuration using table_list
    table_list = [
      {
        table_path = "test.test_db_10"
        query = "SELECT * FROM test.test_db_10"
      },
      {
        table_path = "test.test_db_11"
        query = "SELECT * FROM test.test_db_11"
      },
      {
        table_path = "test.user_info"
        query = "SELECT * FROM test.user_info"
      },
      {
        table_path = "test.order_info"
        query = "SELECT * FROM test.order_info"
      }
    ]
  }
}

transform {
  # No transformation needed for this test
}

sink {
  Hive {
    # Hive MetaStore configuration
    metastore_uri = "thrift://metastore:9083"
    
    # Use placeholder for dynamic table naming
    table_name = "auto_create_multi_test.${table_name}"
    
    # Auto create table configuration
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    
    # Table storage format
    table_format = "PARQUET"
    
    # Custom table creation template
    save_mode_create_template = "CREATE TABLE IF NOT EXISTS `${database}`.`${table}` (${rowtype_fields}) ${partition_by_clause} STORED AS ${table_format} LOCATION '${table_location}' TBLPROPERTIES (${table_properties}, 'comment'='Auto created from MySQL ${table_name} via JDBC', 'created_by'='seatunnel_e2e_multi_table_jdbc_test', 'source_database'='test', 'sync_mode'='multi_table_jdbc')"
  }
}
