env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:mysql://mysql_e2e:3306/test?useSSL=false&serverTimezone=UTC"
    driver = "com.mysql.cj.jdbc.Driver"
    username = "st_user"
    password = "seatunnel"
    table_path = "test.test_db_10"
    
    # Query to test various MySQL data types
    query = "SELECT id, name, age, sex, address, telephone, height, weight, size, ID_number, date_time, ts FROM test.test_db_10"
  }
}

transform {
  # No transformation needed - test direct type conversion
}

sink {
  Hive {
    # Hive MetaStore configuration
    metastore_uri = "thrift://metastore:9083"
    
    # Target table for type conversion testing
    table_name = "auto_create_test.type_conversion_test"
    
    # Auto create table configuration
    schema_save_mode = "RECREATE_SCHEMA"  # Recreate to ensure clean test
    
    # Table storage format
    table_format = "PARQUET"
    
    # Custom table creation template with detailed type mapping comments
    save_mode_create_template = "CREATE TABLE IF NOT EXISTS `${database}`.`${table}` (${rowtype_fields}) ${partition_by_clause} STORED AS ${table_format} LOCATION '${table_location}' TBLPROPERTIES (${table_properties}, 'comment'='Type conversion test table from MySQL to Hive', 'created_by'='seatunnel_e2e_type_test', 'mysql_bigint_to_hive'='bigint', 'mysql_varchar_to_hive'='string', 'mysql_int_to_hive'='int', 'mysql_boolean_to_hive'='boolean', 'mysql_char_to_hive'='string', 'mysql_float_to_hive'='float', 'mysql_double_to_hive'='double', 'mysql_decimal_to_hive'='decimal', 'mysql_date_to_hive'='date', 'mysql_timestamp_to_hive'='timestamp')"
  }
}
