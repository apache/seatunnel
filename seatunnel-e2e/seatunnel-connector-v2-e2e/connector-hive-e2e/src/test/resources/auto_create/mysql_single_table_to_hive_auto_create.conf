env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:mysql://mysql_e2e:3306/test?useSSL=false&serverTimezone=UTC"
    driver = "com.mysql.cj.jdbc.Driver"
    username = "st_user"
    password = "seatunnel"
    table_path = "test.test_db_10"
    
    # Query to read all data from the test table
    query = "SELECT id, name, age, sex, address, telephone, height, weight, size, ID_number, date_time, ts FROM test.test_db_10"
  }
}

transform {
  # No transformation needed for this test
}

sink {
  Hive {
    # Hive MetaStore configuration
    metastore_uri = "thrift://metastore:9083"
    
    # Target table configuration
    table_name = "auto_create_test.test_db_10"
    
    # Auto create table configuration
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    
    # Table storage format
    table_format = "PARQUET"
    
    # Optional: Custom table properties
    save_mode_create_template = "CREATE TABLE IF NOT EXISTS `${database}`.`${table}` (${rowtype_fields}) ${partition_by_clause} STORED AS ${table_format} LOCATION '${table_location}' TBLPROPERTIES (${table_properties}, 'comment'='Auto created from MySQL test.test_db_10', 'created_by'='seatunnel_e2e_test')"
  }
}
