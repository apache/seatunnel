env {
  parallelism = 2
  job.mode = "BATCH"
}

source {
  MySQL-CDC {
    url = "jdbc:mysql://mysql_e2e:3306/test"
    username = "st_user"
    password = "seatunnel"
    
    # Multiple tables configuration
    table-names = [
      "test.test_db_10",
      "test.test_db_11", 
      "test.user_info",
      "test.order_info"
    ]
    
    # CDC configuration
    server-id = 5656-5660
    startup.mode = "initial"
  }
}

transform {
  # No transformation needed for this test
}

sink {
  Hive {
    # Hive MetaStore configuration
    metastore_uri = "thrift://metastore:9083"
    
    # Use placeholder for dynamic table naming
    table_name = "auto_create_multi_test.${table_name}"
    
    # Auto create table configuration
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    
    # Table storage format
    table_format = "PARQUET"
    
    # Optional: Partition configuration (can be customized per table)
    # partition_fields = ["dt"]
    
    # Custom table creation template
    save_mode_create_template = "CREATE TABLE IF NOT EXISTS `${database}`.`${table}` (${rowtype_fields}) ${partition_by_clause} STORED AS ${table_format} LOCATION '${table_location}' TBLPROPERTIES (${table_properties}, 'comment'='Auto created from MySQL ${table_name}', 'created_by'='seatunnel_e2e_multi_table_test', 'source_database'='test', 'sync_mode'='multi_table')"
  }
}
