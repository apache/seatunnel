env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    row.num = 100
    parallelism = 1
    int.template = [18]
    string.template = ["zhangsan"]
    schema = {
      fields {
        name = "string"
        age = "int"
        score = "double"
        c_date = "date"
      }
    }
  }
}
# will auto create table if table not exist and ignore when table exist
sink {
  Hive {
    table_name = "default.hive_overwrite_example"
    hive_jdbc_url = "jdbc:hive2:///host.docker.internal:10000/default"
    metastore_uri = "thrift://192.168.65.254:9083"
    # hive_jdbc_url = "jdbc:hive2:///host.docker.internal:10000/default"
    # metastore_uri = "thrift://localhost:9083"
    hive.hadoop.conf-path = "/home/op/hive-3.1.2/docker_conf"
    hdfs_url = "hdfs://192.168.65.254:9000"
    # hive_jdbc_url = "jdbc:hive2:///172.27.176.190:10000/default"
    # metastore_uri = "thrift://172.27.176.190:9083"
  }
}
