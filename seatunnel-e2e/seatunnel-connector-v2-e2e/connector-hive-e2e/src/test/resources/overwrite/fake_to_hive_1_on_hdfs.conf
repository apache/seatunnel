env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    row.num = 100
    parallelism = 1
    int.template = [18]
    string.template = ["zhangsan"]
    schema = {
      fields {
        name = "string"
        age = "int"
        score = "double"
        c_date = "date"
      }
    }
  }
}
# will auto create table if table not exist and ignore when table exist
sink {
  Hive {
    table_name = "default.hive_overwrite_example"
    hive_jdbc_url = "jdbc:hive2://172.24.8.225:10000/default"
    metastore_uri = "thrift://172.24.8.225:9083"
  }
}
