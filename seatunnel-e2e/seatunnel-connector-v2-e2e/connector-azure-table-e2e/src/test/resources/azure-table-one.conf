env {
  job.mode = "BATCH"
  parallelism = 1
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  job.retry.times = 0
}
source {
  AzureTableStorage {
    result_table_name = "native_rows"
    account_name = "${api.account}"
    secret_key = "${api.key}"
    endpoint_suffix = "${api.suffix}"
    tls_trust_certificate = "${api.trust}"
    page_size = "${api.page_size}"
    max_pages_per_collection = "${api.max_pages}"
    max_tables = "${api.max_tables}"
    max_response_bytes = "${api.max_bytes}"
    max_retries = "${api.retries}"
    request_timeout_ms = "${api.timeout}"
    operation_timeout_ms = "${api.deadline}"
    connect_timeout_ms = 5000
    min_request_interval_ms = 0
    tables = ["Logs"]
  }
}
sink {
  LocalFile {
    source_table_name = "native_rows"
    path = "/tmp/seatunnel_mnt/azure-table-${api.output}"
    file_format_type = "json"
    custom_filename = true
    file_name_expression = "receipt_${transactionId}"
    row_delimiter = "\n"
    is_enable_transaction = true
  }
}
