env {
    job.mode = "STREAMING"
    parallelism = ${bunnyinc.parallelism}
    checkpoint.interval = 1000
    checkpoint.timeout = 30000
    job.retry.times = 0
}
source {
    BunnyInc {
        result_table_name = "billing_rows"
        token = "${bunnyinc.token}"
        subdomain = "${bunnyinc.subdomain}"
        resource = "${bunnyinc.resource}"
        page_size = "${bunnyinc.pageSize}"
        max_pages = "${bunnyinc.maxPages}"
        read_timeout_ms = "${bunnyinc.readTimeout}"
        request_deadline_ms = "${bunnyinc.deadline}"
        max_response_bytes = "${bunnyinc.bytes}"
        max_attempts = "${bunnyinc.attempts}"
    }
    FakeSource {
        result_table_name = "anchor_rows"
        row.num = 1000
        split.num = 20
        split.read-interval = 250
        schema.fields.name = "string"
    }
}
sink {
    LocalFile {
        source_table_name = "billing_rows"
        path = "/tmp/seatunnel_mnt/bunnyinc-${bunnyinc.output}"
        file_format_type = "json"
        row_delimiter = "\n"
        custom_filename = true
        file_name_expression = "receipt_${transactionId}"
        is_enable_transaction = true
    }
    Console {
        source_table_name = "anchor_rows"
    }
}
