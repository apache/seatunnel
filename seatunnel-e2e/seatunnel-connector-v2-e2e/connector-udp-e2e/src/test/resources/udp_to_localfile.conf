env {
  job.mode = "${mode}"
  parallelism = ${parallelism}
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  checkpoint.retain-after-job-cancelled = true
}

source {
  UDP {
    bind_host = "127.0.0.1"
    ports = ${listen_ports}
    format = "${wire.format}"
    separator = "${wire.separator}"
    max_datagram_bytes = ${max.datagram}
    max_datagrams_per_poll = 3
    max_records_per_datagram = ${max.records}
    idle_timeout_ms = ${idle.timeout}
    on_malformed = "${malformed}"
  }
}

sink {
  LocalFile {
    path = "/tmp/seatunnel_mnt/udp-${output.path}"
    file_format_type = "json"
    row_delimiter = "\n"
    custom_filename = true
    file_name_expression = "receipt_${transactionId}"
    is_enable_transaction = true
  }
}
