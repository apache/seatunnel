env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    tables_configs = [
      {
        schema = {
          table = "composite_key_source"
          fields {
            first = string
            second = string
          }
        }
        rows = [
          { kind = INSERT fields = ["1_1", "2"] }
          { kind = INSERT fields = ["1", "1_2"] }
        ]
      }
    ]
  }
}

sink {
  Elasticsearch {
    hosts = ["https://elasticsearch:9200"]
    username = "elastic"
    password = "elasticsearch"
    tls_verify_certificate = false
    tls_verify_hostname = false

    index = "st_composite_key_encoding"
    primary_keys = ["first", "second"]
    key_encoding = "LENGTH_PREFIXED"
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
  }
}
