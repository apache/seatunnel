env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      table = "st_index_es9"
      fields {
        id = bigint
        name = string
        score = double
      }
      primaryKey {
        name = id
        columnNames = [id]
      }
    }
    rows = [
      { kind = INSERT, fields = [1, "a", 1.5] },
      { kind = INSERT, fields = [2, "b", 2.5] },
      { kind = INSERT, fields = [3, "c", 3.5] },
      { kind = UPDATE_AFTER, fields = [2, "b2", 2.75] },
      { kind = DELETE, fields = [3, "c", 3.5] }
    ]
  }
}

sink {
  Elasticsearch {
    plugin_input = "fake"
    hosts = ["https://elasticsearch9:9200"]
    username = "elastic"
    password = "elasticsearch"
    tls_verify_certificate = false
    tls_verify_hostname = false
    index = "st_index_es9"
    primary_keys = ["id"]
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "DROP_DATA"
  }
}
