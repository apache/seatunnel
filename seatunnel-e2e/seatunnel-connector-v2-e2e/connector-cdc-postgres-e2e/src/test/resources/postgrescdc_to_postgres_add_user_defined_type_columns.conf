######
###### Adds columns of user-defined types that need quoting or a schema qualifier in the sink DDL
######

env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 5000
}

source {
  Postgres-CDC {
    plugin_output = "udt_postgres_cdc"
    username = "postgres"
    password = "postgres"
    database-names = ["postgres_cdc"]
    schema-names = ["udt_cdc"]
    table-names = ["postgres_cdc.udt_cdc.udt_orders"]
    url = "jdbc:postgresql://postgres_cdc_e2e:5432/postgres_cdc?loggerLevel=OFF"
    decoding.plugin.name = "pgoutput"
    schema-changes.enabled = true
    schema-changes.include = ["add.column"]
    slot.name = ${slot_name}
  }
}

sink {
  jdbc {
    plugin_input = "udt_postgres_cdc"
    # The sink binds enum values with setString, which needs stringtype=unspecified
    url = "jdbc:postgresql://postgres_cdc_e2e:5432/postgres_cdc?loggerLevel=OFF&stringtype=unspecified"
    driver = "org.postgresql.Driver"
    user = "postgres"
    password = "postgres"

    generate_sink_sql = true
    database = postgres_cdc
    table = udt_cdc.sink_udt_orders
    primary_keys = ["id"]
  }
}
