env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 5000
}

source {
  Postgres-CDC {
    plugin_output = "publication_cdc"
    username = "postgres"
    password = "postgres"
    database-names = ["generated_cdc"]
    schema-names = ["public"]
    table-names = ["generated_cdc.public.${source_table}"]
    url = "jdbc:postgresql://postgres_column_list_e2e:5432/generated_cdc?loggerLevel=OFF"
    decoding.plugin.name = "pgoutput"
    require-replica-identity-full = false
    slot.name = "${slot_name}"
    schema-changes.enabled = true
    debezium {
      "publication.name" = "${publication_name}"
      "publication.autocreate.mode" = "disabled"
    }
  }
}

sink {
  jdbc {
    plugin_input = "publication_cdc"
    url = "jdbc:postgresql://postgres_column_list_e2e:5432/generated_cdc?loggerLevel=OFF"
    driver = "org.postgresql.Driver"
    user = "postgres"
    password = "postgres"
    generate_sink_sql = true
    database = generated_cdc
    table = "public.${sink_table}"
    primary_keys = ["id"]
  }
}
