env {
  execution.parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 5000
}

source {
  GaussDB-CDC {
    plugin_output = "customers_gaussdb_cdc"
    username = "postgres"
    password = "postgres"
    database-names = ["gaussdb_cdc"]
    schema-name = ["inventory"]
    table-names = ["gaussdb_cdc.inventory.gaussdb_cdc_table"]
    url = "jdbc:postgresql://gaussdb_cdc_e2e:5432/gaussdb_cdc?loggerLevel=OFF"
    decoding.plugin.name = "pgoutput"
    slot.name = ${slot_name}
  }
}

transform {
}

sink {
  jdbc {
    plugin_input = "customers_gaussdb_cdc"
    url = "jdbc:postgresql://gaussdb_cdc_e2e:5432/gaussdb_cdc?loggerLevel=OFF"
    driver = "org.postgresql.Driver"
    user = "postgres"
    password = "postgres"

    generate_sink_sql = true
    database = "gaussdb_cdc"
    table = "inventory.sink_gaussdb_cdc_table"
    primary_keys = ["id"]
  }
}
