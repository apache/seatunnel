env {
  parallelism = 1
  job.mode = "BATCH"
}
source {
  GoogleAnalytics4 {
    property_id = "123"
    emulator_url = "http://ga4-fixture:1080"
    start_date = "2024-01-01"
    end_date = "2024-01-31"
    dimensions = ["country"]
    metrics = ["activeUsers", "purchaseRevenue"]
    metric_types = ["TYPE_INTEGER", "TYPE_CURRENCY"]
    page_size = 2
    schema {
      fields {
        country = string
        activeUsers = bigint
        purchaseRevenue = double
      }
    }
  }
}
sink {
  Assert {
    rules {
      row_rules = [
        { rule_type = MIN_ROW, rule_value = 3 },
        { rule_type = MAX_ROW, rule_value = 3 }
      ]
      field_rules = [
        { field_name = country, field_type = string, field_value = [{ rule_type = NOT_NULL }] },
        { field_name = activeUsers, field_type = bigint, field_value = [{ rule_type = NOT_NULL }] },
        { field_name = purchaseRevenue, field_type = double, field_value = [{ rule_type = NOT_NULL }] }
      ]
    }
  }
}
