env {
  job.mode = "BATCH"
  parallelism = 1
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  checkpoint.retain-after-job-cancelled = true
}
source {
  FakeSource {
    row.num = 2
    schema {
      fields {
        id = bigint
        label = string
        amount = "decimal(30,8)"
        note = string
        details = { samples = "array<int>", description = string }
      }
    }
    rows = [
      { kind = INSERT, fields = [9007199254740993, "雪 🦊", "12345678901234567890.12345678", null, [[1, 2], "nested"]] },
      { kind = INSERT, fields = [9007199254740994, "quoted \"data\"", "10.125", "", [[], null]] }
    ]
  }
}
sink {
  AzureIoTHub {
    hub_url = "${hub.url}"
    device_id = "Sensor?%:"
    secret_key = "MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY="
    sas_ttl_seconds = 60
    row_timeout_ms = ${row.timeout}
    read_timeout_ms = 30000
    max_attempts = ${max.attempts}
    application_properties { route = "sensor" }
    max_payload_bytes = ${max.payload}
  }
}
