# The MQTT source only supports STREAMING, so this job does not finish on its own;
# MqttSourceIT starts it asynchronously and cancels it once the rows have arrived.
env {
  parallelism = 1
  job.mode = "STREAMING"
  job.name = "SeaTunnel_MQTT_Source_E2E"
  checkpoint.interval = 5000
}

source {
  MQTT {
    plugin_output = "mqtt_source"
    url = "tcp://mqtt-e2e:1883"
    topic = "test/seatunnel/source_in"
    qos = 1
    format = "json"
    schema = {
      fields {
        id = bigint
        name = string
      }
    }
  }
}

transform {
}

# Echoed to a second topic so the test can observe what the source produced, the same shape
# FlussSourceIT uses when it reads its streaming results back out of a sink table.
sink {
  MQTT {
    plugin_input = "mqtt_source"
    url = "tcp://mqtt-e2e:1883"
    topic = "test/seatunnel/source_out"
    qos = 1
    format = "json"
  }
}
