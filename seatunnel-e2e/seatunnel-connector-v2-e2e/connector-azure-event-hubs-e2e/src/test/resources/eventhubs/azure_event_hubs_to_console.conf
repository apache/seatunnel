env {
  parallelism = 2
  job.mode = "STREAMING"
  checkpoint.interval = 1000
}

source {
  AzureEventHubs {
    connection_string = "Endpoint=sb://eventhubs-emulator;SharedAccessKeyName=RootManageSharedAccessKey;SharedAccessKey=SAS_KEY_VALUE;UseDevelopmentEmulator=true;"
    event_hub_name = "events"
    consumer_group = "seatunnel"
    start_mode = earliest
    format = json
    max_batch_size = 10
    poll_timeout_ms = 500
    prefetch_count = 20
    schema = {
      fields {
        event_id = string
        event_type = string
      }
    }
  }
}

sink {
  Console {}
}
