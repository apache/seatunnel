env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
}

source {
  OpenDataDC {
    query_url = "http://host.testcontainers.internal:${open_data_dc.test.port}/query"
    allow_insecure_http = true
    page_size = 2
    max_rows = 3
  }
}

sink {
  Assert {
    rules {
      row_rules = [
        { rule_type = "MIN_ROW", rule_value = 3 },
        { rule_type = "MAX_ROW", rule_value = 3 }
      ]
      field_rules = [
        { field_name = "OBJECTID", field_type = "bigint", field_value = [{ rule_type = "MIN", rule_value = 7 }, { rule_type = "MAX", rule_value = 17 }] },
        { field_name = "CCN", field_type = "string", field_value = [{ rule_type = "MIN_LENGTH", rule_value = 8 }, { rule_type = "MAX_LENGTH", rule_value = 8 }] },
        { field_name = "REPORTDATE", field_type = "timestamp", field_value = [{ rule_type = "NOT_NULL" }] },
        { field_name = "WARD", field_type = "string", field_value = [{ rule_type = "NOT_NULL" }] },
        { field_name = "TOTAL_VEHICLES", field_type = "int", field_value = [{ rule_type = "MIN", rule_value = 2 }, { rule_type = "MAX", rule_value = 2 }] },
        { field_name = "LATITUDE", field_type = "double", field_value = [{ rule_type = "NOT_NULL" }] },
        { field_name = "LONGITUDE", field_type = "double", field_value = [{ rule_type = "NULL" }] }
      ]
    }
  }
}
