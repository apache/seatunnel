env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  checkpoint.retain-after-job-cancelled = true
  read_limit.rows_per_second = 5
}

source {
  OpenDataDC {
    query_url = "http://host.testcontainers.internal:${open_data_dc.test.port}/query"
    allow_insecure_http = true
    page_size = 500
    max_rows = 400
  }
}

sink {
  LocalFile {
    path = "/tmp/seatunnel_mnt/open-data-dc-${job.output}"
    file_format_type = "json"
    row_delimiter = "\n"
    custom_filename = true
    file_name_expression = "receipt_${transactionId}"
    is_enable_transaction = true
  }
}
