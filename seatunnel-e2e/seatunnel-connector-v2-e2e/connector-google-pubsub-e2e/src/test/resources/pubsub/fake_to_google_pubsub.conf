env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    row.num = 1
    schema = {
      fields {
        name = string
        age = int
      }
    }
    rows = [
      {
        kind = INSERT
        fields = ["alice", 30]
      }
    ]
  }
}

sink {
  GooglePubSub {
    project_id = "seatunnel-test"
    topic = "events"
    emulator_host = "pubsub-emulator:8085"
    format = json
  }
}
