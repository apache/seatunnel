env {
  job.mode = "BATCH"
  parallelism = 1
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  job.retry.times = 0
}

source {
  Braintree {
    result_table_name = "native_rows"
    environment = "${environment}"
    merchant_id = "${merchant}"
    access_key = "${access}"
    secret_key = "${secret}"
    tls_trust_certificate = "${trust}"
    start_date = "${start}"
    end_date = "${end}"
    connect_timeout_ms = "${connect}"
    request_timeout_ms = "${request}"
    operation_timeout_ms = "${operation}"
    max_retries = "${retries}"
    max_retry_delay_ms = "${retryDelay}"
    max_response_bytes = "${bytes}"
    max_xml_depth = "${depth}"
    max_xml_nodes = "${nodes}"
    max_pages = "${pages}"
    max_search_windows = "${windows}"
    search_window_days = "${days}"
    search_result_limit = "${limit}"
    max_ids_per_request = "${batch}"
    resources = ["${resource}"]
  }
  FakeSource {
    result_table_name = "anchor_rows"
    row.num = 1000
    split.num = 1000
    split.read-interval = 250
    schema { fields { marker = int } }
  }
}

sink {
  LocalFile {
    source_table_name = "native_rows"
    path = "/tmp/seatunnel_mnt/braintree-${scenario}"
    file_format_type = "json"
    custom_filename = true
    file_name_expression = "receipt_${transactionId}"
    row_delimiter = "\n"
    is_enable_transaction = true
  }
  LocalFile {
    source_table_name = "anchor_rows"
    path = "/tmp/seatunnel_mnt/braintree-anchor-${scenario}"
    file_format_type = "json"
    is_enable_transaction = true
  }
}
