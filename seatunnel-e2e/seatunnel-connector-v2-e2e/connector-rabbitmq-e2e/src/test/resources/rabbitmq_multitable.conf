env {
  parallelism = 2
  job.mode = "STREAMING"
}

source {
  RabbitMQ {
    host = "rabbitmq-e2e"
    port = 5672
    virtual_host = "/"
    username = "guest"
    password = "guest"
    for_e2e_testing = true
    tables_configs = [
      {
        queue_name = "multi_table_1"
        schema = {
          fields {
             id = bigint
             name = string
          }
        }
      },
      {
        queue_name = "multi_table_2"
        schema = {
          fields {
             id = bigint
             age = int
          }
        }
      }
    ]
  }
}

transform {
}

sink {
  RabbitMQ {
    host = "rabbitmq-e2e"
    port = 5672
    virtual_host = "/"
    username = "guest"
    password = "guest"
    queue_name = "sink_multi_table"
  }
}