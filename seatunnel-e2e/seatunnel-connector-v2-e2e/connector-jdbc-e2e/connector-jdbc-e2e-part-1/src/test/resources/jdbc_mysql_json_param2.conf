# Verifies that MySQL TIMESTAMP (LTZ) is read as SeaTunnel TIMESTAMP_TZ (OFFSET_DATE_TIME_TYPE).
# Covers the fix for https://github.com/apache/seatunnel/issues/10685

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    driver = "com.mysql.cj.jdbc.Driver"
    url = "jdbc:mysql://mysql_ts_e2e:3306/ts_test"
    properties=${mysql_props}
    user = ${mysql_user}
    password = ${mysql_password}
    query = "SELECT id FROM ${table_name} where ts_col='${ts}'"
  }
}

sink {
  Assert {
    rules {
      "row_rules": [
        {
          "rule_type": "MIN_ROW",
          "rule_value": "2"
        },
        {
          "rule_type": "MAX_ROW",
          "rule_value": "2"
        }
      ]
    }
  }
}
