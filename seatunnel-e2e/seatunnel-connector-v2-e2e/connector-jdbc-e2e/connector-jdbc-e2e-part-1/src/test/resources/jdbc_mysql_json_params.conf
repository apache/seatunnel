# Verifies that json params such as properties,table_list and filter config options taking effect via cli

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    driver = "com.mysql.cj.jdbc.Driver"
    url = "jdbc:mysql://${mysql_host}:${mysql_port}/${mysql_db}"
    properties = ${mysql_props}
    username = "${mysql_user:root}"
    password = ${mysql_password}
    table_list = ${table_list}
    plugin_output = "mysql_source"
  }
}

transform {
  filter = ${table_filter}
}

sink {
  Assert {
    plugin_input = "table_filter"
    rules = {
      field_rules = [
        {
          field_name = "movie_id"
          field_type = bigint
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = "unix_time"
          field_type = bigint
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
      row_rules = [
        {
          rule_type = MAX_ROW
          rule_value = 3
        }
      ]
    }
  }
}

