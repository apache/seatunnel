# Verifies that json params such as properties,table_list and filter config options taking effect via cli

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    driver = "com.mysql.cj.jdbc.Driver"
    url = "jdbc:mysql://${mysql_host}:${mysql_port}/${mysql_db}"
    properties = """${mysql_props:{"useSSL":"false","allowPublicKeyRetrieval":"true"}}"""
    username = "${mysql_user:root}"
    password = ${mysql_password}
    table_list = """${table_list:[{"table_path":"json_test.ml_*","use_regex":"true"},{"table_path":"json_test.ratings"}]}"""
    plugin_output = "mysql_source"
  }
}

transform {
  # NOTE: Default values are NOT supported at the plugin-level node (e.g., filter = """${k:{...}}""").
  # The plugin_name node will be silently lost during the `parseFile` stage when reading the configuration file.
  #filter ="""${table_filter:{"plugin_input":"mysql_source","plugin_output":"table_filter","include_fields":[movie_id,unix_time]}}"""
  filter {
    "plugin_input":"mysql_source",
    "plugin_output":"table_filter",
    "include_fields":[movie_id,unix_time]
  }
}

sink {
  Assert {
    plugin_input = "table_filter"
    rules = {
      field_rules = [
        {
          field_name = "movie_id"
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = "unix_time"
          field_type = bigint
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
      row_rules = [
        {
          rule_type = MAX_ROW
          rule_value = 3
        }
      ]
    }
  }
}

