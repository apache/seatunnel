######
###### This config file verifies that the source table_path may name a view.
######

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    driver = oracle.jdbc.driver.OracleDriver
    url = "jdbc:oracle:thin:@e2e_oracleDb:1521/TESTUSER"
    username = testUser
    password = testPassword
    table_path = "TESTUSER.E2E_VIEW_SOURCE"
    properties {
       database.oracle.jdbc.timezoneAsRegion = "false"
    }
  }
}

sink {
  Jdbc {
    driver = oracle.jdbc.driver.OracleDriver
    url = "jdbc:oracle:thin:@e2e_oracleDb:1521/TESTUSER"
    username = testUser
    password = testPassword
    database = XE
    table = "TESTUSER.E2E_VIEW_SINK"
    generate_sink_sql = true
    properties {
       database.oracle.jdbc.timezoneAsRegion = "false"
    }
  }
}
