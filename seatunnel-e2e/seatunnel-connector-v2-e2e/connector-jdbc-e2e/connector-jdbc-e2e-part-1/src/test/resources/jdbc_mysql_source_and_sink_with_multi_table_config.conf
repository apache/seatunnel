env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  jdbc {
    url = "jdbc:mysql://mysql-e2e:3306/seatunnel"
    driver = "com.mysql.cj.jdbc.Driver"
    connection_check_timeout_sec = 100
    username = "root"
    password = "Abc!@#135_seatunnel"

    table_list = [
      {
        table_path = "source.mtc_table1"
      },
      {
        table_path = "source.mtc_table2"
      }
    ]
    where_condition = "where c_int >= 0"
    split.size = 8096
    split.even-distribution.factor.upper-bound = 100
    split.even-distribution.factor.lower-bound = 0.05
    split.sample-sharding.threshold = 1000
    split.inverse-sampling.rate = 1000
  }
}

sink {
  jdbc {
    url = "jdbc:mysql://mysql-e2e:3306/seatunnel"
    driver = "com.mysql.cj.jdbc.Driver"
    username = "root"
    password = "Abc!@#135_seatunnel"

    database = "sink"
    table = "${table_name}"
    generate_sink_sql = true
    # The E2E test drops the sink tables before this job starts, so the sink creates them here and
    # the primary keys resolved from multi_table_config.primary_keys end up in the generated DDL.
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    create_index = true

    # Fallback for tables that match no pattern in multi_table_config.primary_keys. It must not be
    # used by mtc_table1/mtc_table2, otherwise their keys would resolve to `id` instead of the
    # mapped columns.
    primary_keys = ["id"]

    multi_table_config {
      primary_keys {
        # The first matching pattern in declaration order wins. The catch-all is declared last on
        # purpose: it also matches mtc_table1/mtc_table2 and it sorts first alphabetically, so it
        # would win if the declaration order were not preserved.
        "^mtc_table2$" = ["c_mediumint"]
        "^mtc_table1$" = ["c_int", "c_integer"]
        "^mtc_.*$"     = ["c_int"]
      }
    }
  }
}
