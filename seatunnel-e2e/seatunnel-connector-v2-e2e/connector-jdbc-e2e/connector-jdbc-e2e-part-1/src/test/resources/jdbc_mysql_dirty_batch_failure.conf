env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
  savemode.execute.location = "CLIENT"
}

source {
  Jdbc {
    url = "jdbc:mysql://mysql-e2e:3306/seatunnel"
    driver = "com.mysql.cj.jdbc.Driver"
    username = "root"
    password = "Abc!@#135_seatunnel"
    query = "SELECT id, payload FROM dirty_batch_source ORDER BY id"
  }
}

sink {
  Jdbc {
    url = "jdbc:mysql://mysql-e2e:3306/seatunnel"
    driver = "com.mysql.cj.jdbc.Driver"
    username = "root"
    password = "Abc!@#135_seatunnel"
    database = "seatunnel"
    table = "dirty_batch_sink"
    generate_sink_sql = true
    schema_save_mode = "ERROR_WHEN_SCHEMA_NOT_EXIST"
    data_save_mode = "DROP_DATA"
    batch_size = 2
    batch_interval_ms = 0
    max_retries = 0
    auto_commit = false
    properties {
      rewriteBatchedStatements = false
      sessionVariables = "sql_mode='STRICT_ALL_TABLES'"
    }
    dirty.collector {
      type = "log"
      log_level = "ERROR"
      include_stack_trace = false
      threshold = 1
      fail_on_threshold = true
    }
  }
}
