######
###### This config file verifies that the source table_path may name a view.
######

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    driver = com.ibm.db2.jcc.DB2Driver
    url = "jdbc:db2://db2-e2e:50000/E2E"
    username = "db2inst1"
    password = "123456"
    table_path = "E2E.E2E.E2E_VIEW_SOURCE"
  }
}

sink {
  Jdbc {
    driver = com.ibm.db2.jcc.DB2Driver
    url = "jdbc:db2://db2-e2e:50000/E2E"
    username = "db2inst1"
    password = "123456"
    database = "E2E"
    table = "E2E.E2E_VIEW_SINK"
    generate_sink_sql = true
  }
}
