env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    plugin_output = "mysql_orders"
    driver = "com.mysql.cj.jdbc.Driver"
    url = "jdbc:mysql://mysql-jdbc-recipe:3306/source_db?useSSL=false&allowPublicKeyRetrieval=true"
    username = "test"
    password = "test"
    query = "SELECT id, customer_name, amount, status FROM orders"
  }
}

transform {
  Sql {
    plugin_input = "mysql_orders"
    plugin_output = "paid_orders"
    query = """
      SELECT
        id,
        UPPER(customer_name) AS customer_name,
        CAST(amount AS DECIMAL(12, 2)) AS amount,
        'MYSQL' AS source_system
      FROM dual
      WHERE status = 'PAID'
    """
  }
}

sink {
  Jdbc {
    plugin_input = "paid_orders"
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://postgresql-jdbc-recipe:5432/target_db"
    username = "test"
    password = "test"
    query = "INSERT INTO public.paid_orders (id, customer_name, amount, source_system) VALUES (?, ?, ?, ?)"
  }
}
