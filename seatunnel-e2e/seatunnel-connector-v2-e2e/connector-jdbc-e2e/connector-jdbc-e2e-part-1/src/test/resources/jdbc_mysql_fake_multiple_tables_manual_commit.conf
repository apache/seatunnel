######
###### Healthy path for the shared manual-commit transaction state (#12624): two tables in one
###### multi-table JDBC sink share one queue, so they share one pooled connection and one open
###### transaction. With auto_commit = false, batch_size flushes stay uncommitted until the next
###### checkpoint. The source is slowed down so several checkpoints happen while both tables have
###### flushed but uncommitted batches.
######

env {
  parallelism = 1
  job.mode = "BATCH"
  checkpoint.interval = 2000
}

source {
  FakeSource {
    tables_configs = [
      {
        row.num = 100
        split.num = 10
        split.read-interval = 1000
        auto.increment.enabled = true
        schema = {
          table = "fake.manual_commit_table1"
          fields {
            id = "bigint"
            name = "string"
          }
          primaryKey {
            name = "pk"
            columnNames = [id]
          }
        }
      },
      {
        row.num = 100
        split.num = 10
        split.read-interval = 1000
        auto.increment.enabled = true
        schema = {
          table = "fake.manual_commit_table2"
          fields {
            id = "bigint"
            name = "string"
          }
          primaryKey {
            name = "pk"
            columnNames = [id]
          }
        }
      }
    ]
  }
}

sink {
  jdbc {
    url = "jdbc:mysql://mysql-e2e:3306/seatunnel"
    driver = "com.mysql.cj.jdbc.Driver"
    username = "root"
    password = "Abc!@#135_seatunnel"

    database = "sink"
    table = "${table_name}"
    generate_sink_sql = true
    primary_keys = ["id"]
    # Manual commit: flushed batches stay in the shared transaction until the checkpoint commits.
    auto_commit = false
    # Smaller than a split, so both tables flush mid-interval before each checkpoint.
    batch_size = 7
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "DROP_DATA"
  }
}
