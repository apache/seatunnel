env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    driver = "oracle.jdbc.OracleDriver"
    url = "jdbc:oracle:thin:@e2e_oracleDb:1521/XE"
    username = TESTUSER
    password = testPassword
    query = "select ID, TSTZ from TESTUSER.E2E_TZ_SRC order by ID"
    properties {
      oracle.jdbc.timezoneAsRegion = "false"
    }
  }
}

sink {
  Jdbc {
    driver = "oracle.jdbc.OracleDriver"
    url = "jdbc:oracle:thin:@e2e_oracleDb:1521/XE"
    username = TESTUSER
    password = testPassword
    generate_sink_sql = true
    database = XE
    table = "TESTUSER.E2E_TZ_SINK"
    primary_keys = ["ID"]
    properties {
      oracle.jdbc.timezoneAsRegion = "false"
    }
  }
}

