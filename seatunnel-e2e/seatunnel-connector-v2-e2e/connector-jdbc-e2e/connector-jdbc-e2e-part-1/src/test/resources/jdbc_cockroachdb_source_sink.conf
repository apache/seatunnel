env {
  parallelism = 2
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:postgresql://cockroachdb:26257/defaultdb?sslmode=disable"
    driver = "org.postgresql.Driver"
    dialect = "CockroachDB"
    username = "root"
    password = ""
    query = "SELECT id,name,amount FROM source_rows"
    partition_column = "name"
    partition_num = 3
    split.string-strategy = "hash"
    fetch_size = 1
  }
}

sink {
  Jdbc {
    url = "jdbc:postgresql://cockroachdb:26257/defaultdb?sslmode=disable"
    driver = "org.postgresql.Driver"
    dialect = "CockroachDB"
    username = "root"
    password = ""
    database = "defaultdb"
    table = "public.sink_rows"
    primary_keys = ["id"]
    generate_sink_sql = true
    batch_size = 2
  }
}
