# Run with UTC and Asia/Shanghai worker JVMs to exercise both mismatch directions.
env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:mysql://mysql_ts_e2e:3306/ts_test?useSSL=false&serverTimezone="${connection_zone}
    driver = "com.mysql.cj.jdbc.Driver"
    user = "root"
    password = "Abc!@#135_seatunnel"
    query = "SELECT id, dt_col, ts_col FROM datetime_source"
  }
}

sink {
  Jdbc {
    url = "jdbc:mysql://mysql_ts_e2e:3306/ts_test?useSSL=false&serverTimezone="${connection_zone}"&useServerPrepStmts="${server_prepared}"&rewriteBatchedStatements=true"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "root"
    password = "Abc!@#135_seatunnel"
    query = "INSERT INTO datetime_sink (id, dt_col, ts_col) VALUES (?, ?, ?)"
    batch_size = 3
  }
}
