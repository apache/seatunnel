env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  jdbc {
    url = "jdbc:presto://e2e_Presto:8080/memory"
    driver = "com.facebook.presto.jdbc.PrestoDriver"
    connection_check_timeout_sec = 100
    user = "presto"
    query = "select * from memory.default.presto_e2e_source_table"
    split.size = 10
  }
}

transform {
}

sink {
  jdbc {
    url = "jdbc:presto://e2e_Presto:8080/memory"
    driver = "com.facebook.presto.jdbc.PrestoDriver"
    user = "presto"
    database = "memory.default"
    table = "presto_e2e_sink_table"
    generate_sink_sql = true
  }
}
