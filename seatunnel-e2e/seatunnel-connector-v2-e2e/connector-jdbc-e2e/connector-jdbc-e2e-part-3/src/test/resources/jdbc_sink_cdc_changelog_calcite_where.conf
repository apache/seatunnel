env {
    parallelism = 1
    job.mode = "BATCH"
}

# The key comes from the primary key of the source schema; the sink sets no primary_keys.
# Row 1 goes from active to inactive and must be removed from the sink, row 3 goes from
# inactive to active and must be written, row 2 stays active.
source {
    FakeSource {
        plugin_output = "fake"
        schema = {
            fields {
                pk_id = bigint
                status = string
            }
            primaryKey {
                name = "pk"
                columnNames = [pk_id]
            }
        }
        rows = [
            {
                kind = INSERT
                fields = [1, "active"]
            },
            {
                kind = INSERT
                fields = [2, "active"]
            },
            {
                kind = INSERT
                fields = [3, "inactive"]
            },
            {
                kind = UPDATE_BEFORE
                fields = [1, "active"]
            },
            {
                kind = UPDATE_AFTER
                fields = [1, "inactive"]
            },
            {
                kind = UPDATE_BEFORE
                fields = [3, "inactive"]
            },
            {
                kind = UPDATE_AFTER
                fields = [3, "active"]
            }
        ]
    }
}

transform {
    Calcite {
        plugin_input = "fake"
        plugin_output = "filtered"
        sql = "SELECT pk_id, status FROM fake WHERE status = 'active'"
        where_rejected_update_as_delete = true
    }
}

sink {
    Jdbc {
        plugin_input = "filtered"
        driver = org.postgresql.Driver
        url = "jdbc:postgresql://postgresql:5432/test?loggerLevel=OFF"
        username = test
        password = test
        generate_sink_sql = true
        database = test
        table = public.sink_status
    }
}
