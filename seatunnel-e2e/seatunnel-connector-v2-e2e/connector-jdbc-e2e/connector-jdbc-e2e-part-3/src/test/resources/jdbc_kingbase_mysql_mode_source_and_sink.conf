env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
    jdbc {
        driver = "com.kingbase8.Driver"
        url = "jdbc:kingbase8://e2e_KINGBASEDb:54321/test"
        user = "SYSTEM"
        password = "123456"
        compatible_mode = "mysql"
        query = "select * from e2e_mysql_mode_source"
    }
}

sink {
    jdbc {
        driver = "com.kingbase8.Driver"
        url = "jdbc:kingbase8://e2e_KINGBASEDb:54321/test"
        user = "SYSTEM"
        password = "123456"
        compatible_mode = "mysql"
        generate_sink_sql = true
        database = "test"
        table = "e2e_mysql_mode_sink"
        primary_keys = ["id"]
    }
}
