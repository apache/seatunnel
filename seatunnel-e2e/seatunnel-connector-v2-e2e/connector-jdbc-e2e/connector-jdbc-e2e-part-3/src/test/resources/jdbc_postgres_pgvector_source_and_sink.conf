env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  jdbc {
    url = "jdbc:postgresql://pgvector:5432/test?loggerLevel=OFF"
    driver = "org.postgresql.Driver"
    username = "test"
    password = "test"
    query = "select id, name, embedding from pgvector_e2e_source_table"
    partition_column = "id"
    partition_num = 1
  }
}

sink {
  Jdbc {
    driver = org.postgresql.Driver
    url = "jdbc:postgresql://pgvector:5432/test?loggerLevel=OFF&stringtype=unspecified"
    username = test
    password = test
    generate_sink_sql = true
    database = test
    table = public.pgvector_e2e_sink_table
    primary_keys = ["id"]
  }
}
