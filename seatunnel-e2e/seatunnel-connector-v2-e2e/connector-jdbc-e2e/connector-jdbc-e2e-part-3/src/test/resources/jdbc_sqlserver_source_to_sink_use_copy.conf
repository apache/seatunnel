######
###### This config file is a demonstration of streaming processing in seatunnel config
######

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  # This is a example source plugin **only for test and demonstrate the feature source plugin**
  Jdbc {
    driver = com.microsoft.sqlserver.jdbc.SQLServerDriver
    url = "jdbc:sqlserver://sqlserver;encrypt=false;"
    username = SA
    password = "A_Str0ng_Required_Password"
    query = "SELECT INT_IDENTITY_TEST, BIGINT_TEST, BINARY_TEST, BIT_TEST, CHAR_TEST, DATE_TEST, DATETIME_TEST, DATETIME2_TEST, DECIMAL_TEST, FLOAT_TEST, INT_TEST, MONEY_TEST, NCHAR_TEST, NUMERIC_TEST, NVARCHAR_TEST, REAL_TEST, SMALLINT_TEST, SMALLMONEY_TEST, TIME_TEST, TINYINT_TEST, VARBINARY_TEST, VARCHAR_TEST, DATETIMEOFFSET_TEST, IMAGE_TEST, NTEXT_TEST, NVARCHAR_MAX_TEST, TEXT_TEST, UNIQUEIDENTIFIER_TEST, VARBINARY_MAX_TEST, VARCHAR_MAX_TEST, XML_TEST, UDT_TEST FROM \"dbo\".\"source\""
  }

  # If you would like to get more information about how to configure seatunnel and see full list of source plugins,
  # please go to https://seatunnel.apache.org/docs/connector-v2/source/Jdbc
}

transform {

  # If you would like to get more information about how to configure seatunnel and see full list of transform plugins,
  # please go to https://seatunnel.apache.org/docs/transform-v2/sql
}

sink {
  Jdbc {
    driver = com.microsoft.sqlserver.jdbc.SQLServerDriver
    url = "jdbc:sqlserver://sqlserver;encrypt=false;"
    username = SA
    password = "A_Str0ng_Required_Password"
    database = "master"
    table = "dbo.test_copy_sink"
    generate_sink_sql = true
    use_sqlserver_bulk_copy = true
  }

  # If you would like to get more information about how to configure seatunnel and see full list of sink plugins,
  # please go to https://seatunnel.apache.org/docs/connector-v2/sink/Jdbc
}
