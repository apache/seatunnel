env {
  parallelism = 2
  job.mode = "BATCH"
  checkpoint.interval = 500
  multi_table.failure_policy = "FAIL_FAST"
  read_limit.rows_per_second = 80
}

source {
  Jdbc {
    url = "jdbc:postgresql://pg-early-close:5432/test"
    driver = "org.postgresql.Driver"
    username = "test"
    password = "test"
    table_list = [
      { table_path = "test.close_table_source.a" },
      { table_path = "test.close_table_source.b" }
    ]
  }
}

sink {
  Jdbc {
    url = "jdbc:postgresql://pg-early-close:5432/test"
    driver = "org.postgresql.Driver"
    username = "test"
    password = "test"
    database = "test"
    schema = "close_table_sink"
    table = "${table_name}"
    generate_sink_sql = true
    enable_upsert = false
    batch_size = 1
    auto_commit = false
  }
}
