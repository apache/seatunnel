# The same changes are written to three tables that start with the same stored rows:
#  - update_condition_sql with the default batching
#  - update_condition_sql with reWriteBatchedInserts=true
#  - no update_condition_sql, which keeps the last change of each key in a batch

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "changes"
    schema = {
      fields {
        id = int
        name = string
        update_time = bigint
      }
    }
    rows = [
      # key 1 is stored with 100: older -> newer, not adjacent to each other
      { kind = INSERT, fields = [1, "v200", 200] },
      # key 2 is stored with 100: newer -> older
      { kind = INSERT, fields = [2, "v300", 300] },
      { kind = INSERT, fields = [1, "v300", 300] },
      { kind = INSERT, fields = [2, "v200", 200] },
      # key 3 is stored with 100: a false predicate, then a NULL incoming value
      { kind = INSERT, fields = [3, "stale", 50] },
      { kind = INSERT, fields = [3, "null-incoming", null] },
      # key 4 is stored with NULL: the predicate is NULL
      { kind = INSERT, fields = [4, "v500", 500] },
      # key 5 is missing: inserted
      { kind = INSERT, fields = [5, "new", 10] },
      # key 6 is missing: newer -> older
      { kind = INSERT, fields = [6, "v300", 300] },
      { kind = INSERT, fields = [6, "v200", 200] },
      # key 8 is missing: older -> newer
      { kind = INSERT, fields = [8, "v200", 200] },
      { kind = INSERT, fields = [8, "v300", 300] },
      # key 7 is stored with 100: DELETE is not guarded by the condition
      { kind = DELETE, fields = [7, "stale-delete", 50] }
    ]
  }
}

sink {
  Jdbc {
    plugin_input = "changes"
    driver = org.postgresql.Driver
    url = "jdbc:postgresql://postgresql:5432/test?loggerLevel=OFF"
    username = test
    password = test
    generate_sink_sql = true
    database = test
    table = public.pg_e2e_update_condition_sink
    primary_keys = ["id"]
    update_condition_sql = ":update_time > target.update_time"
  }

  Jdbc {
    plugin_input = "changes"
    driver = org.postgresql.Driver
    url = "jdbc:postgresql://postgresql:5432/test?loggerLevel=OFF&reWriteBatchedInserts=true"
    username = test
    password = test
    generate_sink_sql = true
    database = test
    table = public.pg_e2e_update_condition_rewrite_sink
    primary_keys = ["id"]
    update_condition_sql = ":update_time > target.update_time"
  }

  Jdbc {
    plugin_input = "changes"
    driver = org.postgresql.Driver
    url = "jdbc:postgresql://postgresql:5432/test?loggerLevel=OFF"
    username = test
    password = test
    generate_sink_sql = true
    database = test
    table = public.pg_e2e_update_condition_absent_sink
    primary_keys = ["id"]
  }
}
