# The condition names a column the sink does not write, so the job must fail before it writes.

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "changes"
    schema = {
      fields {
        id = int
        name = string
        update_time = bigint
      }
    }
    rows = [
      { kind = INSERT, fields = [1, "v300", 300] }
    ]
  }
}

sink {
  Jdbc {
    plugin_input = "changes"
    driver = org.postgresql.Driver
    url = "jdbc:postgresql://postgresql:5432/test?loggerLevel=OFF"
    username = test
    password = test
    generate_sink_sql = true
    database = test
    table = public.pg_e2e_update_condition_sink
    primary_keys = ["id"]
    update_condition_sql = ":updat_time > target.update_time"
  }
}
