######
###### This config file is a demonstration of streaming processing in seatunnel config
######

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
    url = "jdbc:postgresql://postgresql:5432/postgres"
    driver = "org.postgresql.Driver"
    user = "postgres"
    password = "postgres"
    table-pattern = "postgres\\.public\\.test[0-9]"
  }
}

transform {
}

sink {
  Jdbc {
    url = "jdbc:postgresql://postgresql:5432/postgres"
    driver = "org.postgresql.Driver"
    user = "postgres"
    password = "postgres"
    database = "postgres"
    table = "public.sink_${table_name}"
    generate_sink_sql = true
  }
}
