# update_condition_sql on a table with the composite key (a, b), written with the default
# batching and with reWriteBatchedInserts=true.

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "changes"
    schema = {
      fields {
        a = int
        b = int
        v = string
        update_time = bigint
      }
    }
    rows = [
      # (1, 1) is stored with 100: older, then newer, then older again
      { kind = INSERT, fields = [1, 1, "stale", 50] },
      { kind = INSERT, fields = [1, 1, "v300", 300] },
      { kind = INSERT, fields = [1, 1, "v200", 200] },
      # (1, 2) is stored with 100 and shares a with (1, 1): updated
      { kind = INSERT, fields = [1, 2, "fresh", 150] },
      # (2, 1) is missing: inserted
      { kind = INSERT, fields = [2, 1, "new", 10] }
    ]
  }
}

sink {
  Jdbc {
    plugin_input = "changes"
    driver = org.postgresql.Driver
    url = "jdbc:postgresql://postgresql:5432/test?loggerLevel=OFF"
    username = test
    password = test
    generate_sink_sql = true
    database = test
    table = public.pg_e2e_update_condition_ck_sink
    primary_keys = ["a", "b"]
    update_condition_sql = ":update_time > target.update_time"
  }

  Jdbc {
    plugin_input = "changes"
    driver = org.postgresql.Driver
    url = "jdbc:postgresql://postgresql:5432/test?loggerLevel=OFF&reWriteBatchedInserts=true"
    username = test
    password = test
    generate_sink_sql = true
    database = test
    table = public.pg_e2e_update_condition_ck_rewrite_sink
    primary_keys = ["a", "b"]
    update_condition_sql = ":update_time > target.update_time"
  }
}
