env {
    job.mode = ${astra.jobMode}
    parallelism = ${astra.parallelism}
    checkpoint.interval = 1000
    checkpoint.timeout = 30000
    job.retry.times = 0
}
source {
    FakeSource {
        plugin_output = "input"
        row.num = ${astra.rowNum}
        split.num = ${astra.splitNum}
        split.read-interval = ${astra.interval}
        schema {
            fields {
                id = bigint
                body = string
                tenant = string
                feed = string
                vector = "array<double>"
                context = {
                    team = string
                    flag = boolean
                }
                users = "array<map<string, string>>"
                optional = string
            }
        }
        rows = ${astra.rows}
    }
}
sink {
    Astra {
        plugin_input = "input"
        endpoint = ${astra.endpoint}
        token = ${astra.token}
        keyspace = "fixture"
        collection = "documents"
        mode = ${astra.mode}
        namespace = ${astra.namespace}
        stream = ${astra.stream}
        namespace_field = ${astra.namespaceField}
        stream_field = ${astra.streamField}
        primary_keys = ${astra.keys}
        text_fields = ${astra.textFields}
        metadata_fields = ${astra.metadataFields}
        field_name_mappings = ${astra.aliases}
        omit_raw_text = ${astra.omit}
        splitter = ${astra.splitter}
        separators = ${astra.separators}
        keep_separator = ${astra.keep}
        code_language = ${astra.language}
        markdown_level = ${astra.markdown}
        chunk_size = ${astra.chunk}
        chunk_overlap = ${astra.overlap}
        tokenizer_data_file = ${astra.ranks}
        embedding_mode = ${astra.embedding}
        embedding_url = ${astra.embedUrl}
        embedding_secret_key = ${astra.embedToken}
        embedding_model = "fixture-openai-compatible"
        embedding_deployment = "fixture-deployment"
        embedding_field = "vector"
        embedding_dimensions = ${astra.dimensions}
        max_row_bytes = ${astra.maxRow}
        max_buffer_bytes = ${astra.maxBuffer}
        max_body_bytes = ${astra.maxBody}
        max_chunks_per_row = ${astra.maxChunks}
        max_delete_requests = ${astra.maxDelete}
        request_timeout_ms = ${astra.deadline}
        max_attempts = ${astra.attempts}
    }
}
