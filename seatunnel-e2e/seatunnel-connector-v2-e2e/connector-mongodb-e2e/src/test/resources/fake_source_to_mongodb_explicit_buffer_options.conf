# Control for fake_source_to_mongodb_omitted_buffer_options.conf: the same 1234 rows with the
# previous effective behavior set explicitly (one bulk write per row, no retries).

env {
  parallelism = 1
  job.mode = "BATCH"
  #spark config
  spark.app.name = "SeaTunnel"
  spark.executor.instances = 1
  spark.executor.cores = 1
  spark.executor.memory = "1g"
  spark.master = local
}

source {
  FakeSource {
    row.num = 1234
    split.num = 1
    plugin_output = "fake"
    schema = {
      fields {
        id = bigint
        name = string
      }
    }
  }
}

sink {
  MongoDB {
    plugin_input = "fake"
    uri = "mongodb://e2e_mongodb:27017/test_db"
    database = "test_db"
    collection = "test_explicit_buffer_options"
    buffer-flush.max-rows = 1
    buffer-flush.interval = -1
    retry.max = 0
  }
}
