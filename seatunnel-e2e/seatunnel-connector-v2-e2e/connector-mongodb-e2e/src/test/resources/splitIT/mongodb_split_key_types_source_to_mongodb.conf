# Splits of c_key, an int, a string, NaN, missing or null, must read every document once.
env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  MongoDB {
    uri = "mongodb://e2e_mongodb:27017/test_db"
    database = "test_db"
    collection = "test_split_key_types_db"
    plugin_output = "mongodb_table"
    partition.split-key = c_key
    partition.split-size = 1024
    schema = {
      fields {
        c_id = int
        c_pad = string
      }
    }
  }
}

sink {
  MongoDB {
    uri = "mongodb://e2e_mongodb:27017/test_db?retryWrites=true"
    database = "test_db"
    collection = "test_split_key_types_result_db"
    plugin_input = "mongodb_table"
  }
}
