# DECIMAL with precision above 38, at the top level and inside a ROW.
# Spark carries these as text, so the values and types must come out unchanged.

env {
  parallelism = 1
  job.mode = BATCH
}

source {
  FakeSource {
    schema = {
      fields {
        c_id = int
        c_max = "decimal(39, 0)"
        c_min = "decimal(39, 0)"
        c_zero = "decimal(39, 0)"
        c_null = "decimal(39, 0)"
        c_scaled = "decimal(50, 10)"
        c_narrow = "decimal(10, 2)"
        c_row = {
          c_inner_max = "decimal(39, 0)"
          c_inner_min = "decimal(39, 0)"
        }
      }
    }
    rows = [
      {
        kind = INSERT
        fields = [1, "170141183460469231731687303715884105727", "-170141183460469231731687303715884105728", "0", null, "-12345678901234567890123456789012345678.0123456789", "12345678.90", ["170141183460469231731687303715884105727", "-170141183460469231731687303715884105728"]]
      }
    ]
    plugin_output = "fake"
  }
}

transform {
  Sql {
    plugin_input = "fake"
    plugin_output = "fake1"
    query = "select c_id, c_max, c_min, c_zero, c_null, c_scaled, c_narrow, c_row from dual"
  }
}

sink {
  Assert {
    plugin_input = "fake1"
    rules = {
      row_rules = [
        {
          rule_type = MAX_ROW
          rule_value = 1
        },
        {
          rule_type = MIN_ROW
          rule_value = 1
        }
      ]
      field_rules = [
        {
          field_name = c_max
          field_type = "decimal(39, 0)"
          field_value = [
            {
              equals_to = "170141183460469231731687303715884105727"
            }
          ]
        },
        {
          field_name = c_min
          field_type = "decimal(39, 0)"
          field_value = [
            {
              equals_to = "-170141183460469231731687303715884105728"
            }
          ]
        },
        {
          field_name = c_zero
          field_type = "decimal(39, 0)"
          field_value = [
            {
              equals_to = "0"
            }
          ]
        },
        {
          field_name = c_null
          field_type = "decimal(39, 0)"
          field_value = [
            {
              rule_type = NULL
            }
          ]
        },
        {
          field_name = c_scaled
          field_type = "decimal(50, 10)"
          field_value = [
            {
              equals_to = "-12345678901234567890123456789012345678.0123456789"
            }
          ]
        },
        {
          field_name = c_narrow
          field_type = "decimal(10, 2)"
          field_value = [
            {
              equals_to = "12345678.90"
            }
          ]
        },
        {
          field_name = c_row
          field_type = {
            c_inner_max = "decimal(39, 0)"
            c_inner_min = "decimal(39, 0)"
          }
          field_value = [
            {
              equals_to = ["170141183460469231731687303715884105727", "-170141183460469231731687303715884105728"]
            }
          ]
        }
      ]
      catalog_table_rule {
        column_rule = [
          {
            name = "c_id"
            type = "int"
          },
          {
            name = "c_max"
            type = "decimal(39, 0)"
          },
          {
            name = "c_min"
            type = "decimal(39, 0)"
          },
          {
            name = "c_zero"
            type = "decimal(39, 0)"
          },
          {
            name = "c_null"
            type = "decimal(39, 0)"
          },
          {
            name = "c_scaled"
            type = "decimal(50, 10)"
          },
          {
            name = "c_narrow"
            type = "decimal(10, 2)"
          },
          {
            name = "c_row"
            type = "{c_inner_max = \"decimal(39, 0)\", c_inner_min = \"decimal(39, 0)\"}"
          }
        ]
      }
    }
  }
}
