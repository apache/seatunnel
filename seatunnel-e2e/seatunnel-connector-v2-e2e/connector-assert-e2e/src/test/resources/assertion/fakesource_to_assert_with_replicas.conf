# The Assert writer declares no replica mode, so two writers per table must be rejected.
env {
  parallelism = 1
  job.mode = BATCH
}

source {
  FakeSource {
    row.num = 5
    schema = {
      fields {
        id = bigint
        name = string
      }
    }
    plugin_output = "fake"
  }
}

sink {
  Assert {
    plugin_input = "fake"
    multi_table_sink_replica = 2
    rules {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 5
        }
      ]
    }
  }
}
