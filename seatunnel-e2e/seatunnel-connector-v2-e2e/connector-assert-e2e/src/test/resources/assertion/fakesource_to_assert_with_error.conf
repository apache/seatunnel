env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    parallelism = 1
    tables_configs = [
      {
        row.num = 100
        schema = {
          table = "test.abc"
          columns = [
            {
              name = "id"
              type = "bigint"
            },
            {
              name = "name"
              type = "string"
            },
            {
              name = "age"
              type = "int"
            }
          ]
        }
      },
      {
        row.num = 100
        schema = {
          table = "test.xyz"
          columns = [
            {
              name = "id"
              type = "bigint"
            },
            {
              name = "name"
              type = "string"
            },
            {
              name = "age"
              type = "int"
            }
          ]
        }
      },
      {
        row.num = 1000
        schema = {
          table = "test.www"
          columns = [
            {
              name = "id"
              type = "bigint"
            },
            {
              name = "name"
              type = "string"
            },
            {
              name = "age"
              type = "int"
            }
          ]
        }
      }
    ]
  }
}

transform {
  FilterRowKind {
    table_match_regex = "test.a.*"
    table_transform = [{
      table_path = "test.xyz"
      exclude_kinds = ["INSERT"]
    }]
    exclude_kinds = ["INSERT"]
  }
}

sink {
  Assert {
    rules =
      {
        tables_configs = [
          {
            table_path = "test.abc"
            row_rules = [
              {
                rule_type = MIN_ROW
                rule_value = 0
              },
              {
                rule_type = MAX_ROW
                rule_value = 0
              }
            ]
          },
          {
            table_path = "test.xyz"
            row_rules = [
              {
                rule_type = MIN_ROW
                rule_value = 0
              },
              {
                rule_type = MAX_ROW
                rule_value = 0
              }
            ]
          },
          {
            table_path = "test.www"
            row_rules = [
              {
                rule_type = MIN_ROW
                rule_value = 1000
              },
              {
                rule_type = MAX_ROW
                rule_value = 1000
              }
            ]
            field_rules = [
                {
                field_name = name
                field_type = string
                field_value = [
                    {
                        rule_type = NOT_NULL
                    }
                ]
              }
            ]
          }
        ]
      }
  }
}