# DECIMAL with precision above 38 as a MAP value. Spark rejects this at job start.

env {
  parallelism = 1
  job.mode = BATCH
}

source {
  FakeSource {
    schema = {
      fields {
        c_id = int
        c_attrs = "map<string, decimal(39, 0)>"
      }
    }
    rows = [
      {
        kind = INSERT
        fields = [1, { k0 = "170141183460469231731687303715884105727" }]
      }
    ]
    plugin_output = "fake"
  }
}

sink {
  Assert {
    plugin_input = "fake"
    rules = {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 1
        }
      ]
    }
  }
}
