env {
  parallelism = ${test_parallelism}
  job.mode = "STREAMING"
  checkpoint.interval = ${test_checkpoint_interval}
  flink.pipeline.max-parallelism = 128
  flink.pipeline.operator-chaining = false
  flink.execution.checkpointing.unaligned.enabled = ${test_unaligned_checkpoint}
}

source {
  MySQL-CDC {
    server-id = 5752-5760
    username = "st_user_source"
    password = "mysqlpw"
    table-names = ["shop.products"]
    url = "jdbc:mysql://mysql_cdc_e2e:3306/shop"
    schema-changes.enabled = true
    incremental.parallelism = 1
  }
}

sink {
  jdbc {
    parallelism = ${test_sink_parallelism}
    url = "jdbc:mysql://mysql_cdc_e2e:3306/shop"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "st_user_sink"
    password = "mysqlpw"
    generate_sink_sql = true
    database = shop
    table = mysql_cdc_e2e_sink_table_with_schema_change_exactly_once
    primary_keys = ["id"]
    # Exercise schema-protocol recovery together with the JDBC XA writer and global committer.
    is_exactly_once = true
    xa_data_source_class_name = "com.mysql.cj.jdbc.MysqlXADataSource"
  }
}
