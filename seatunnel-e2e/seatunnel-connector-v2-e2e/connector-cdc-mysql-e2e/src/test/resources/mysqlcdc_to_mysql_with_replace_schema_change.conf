env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 5000
}

source {
  MySQL-CDC {
    plugin_output = "source"
    server-id = 5852-5853
    username = "st_user_source"
    password = "mysqlpw"
    table-names = ["shop.replace_schema_source"]
    url = "jdbc:mysql://mysql_cdc_e2e:3306/shop"
    schema-changes.enabled = true
  }
}

transform {
  Replace {
    plugin_input = "source"
    plugin_output = "replaced"
    replace_fields = ["name", "title"]
    pattern = "before"
    replacement = "after"
  }
}

sink {
  jdbc {
    plugin_input = "replaced"
    url = "jdbc:mysql://mysql_cdc_e2e:3306/shop"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "st_user_sink"
    password = "mysqlpw"
    generate_sink_sql = true
    database = shop
    table = replace_schema_sink
    primary_keys = ["id"]
    multi_table_sink_replica = 1
  }
}
