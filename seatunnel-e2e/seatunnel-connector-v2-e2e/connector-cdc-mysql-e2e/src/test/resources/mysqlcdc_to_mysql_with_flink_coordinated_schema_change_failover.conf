env {
  parallelism = ${cse_sink_parallelism}
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  execution.restart.strategy = "fixed-delay"
  execution.restart.attempts = 10
  execution.restart.delayBetweenAttempts = 3000
}

source {
  MySQL-CDC {
    parallelism = ${cse_source_parallelism}
    server-id = ${cse_server_id}
    username = "st_user_source"
    password = "mysqlpw"
    table-names = ["${cse_database}.${cse_source_table}"]
    url = "jdbc:mysql://mysql_cdc_coordinated_schema_e2e:3306/${cse_database}"
    schema-changes.enabled = true
  }
}

sink {
  jdbc {
    parallelism = ${cse_sink_parallelism}
    url = "jdbc:mysql://mysql_cdc_coordinated_schema_e2e:3306/${cse_database}"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "st_user_sink"
    password = "mysqlpw"
    generate_sink_sql = true
    database = "${cse_database}"
    table = "${cse_sink_table}"
    primary_keys = ["id"]
  }
}
