######
###### This config validates the DDL a same-dialect MySQL sink generates for SET / ENUM columns.
###### The sink is MySQL, so schema-change statements are built from the column's source type
###### expression instead of the reconverted type, which is the path a malformed expression such
###### as SET(5) used to break.
######

env {
  # You can set engine configuration here
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 5000
}

source {
  MySQL-CDC {
    server-id = 5710-5715
    username = "st_user_source"
    password = "mysqlpw"
    table-names = ["shop.products_with_set_enum"]
    url = "jdbc:mysql://mysql_cdc_e2e:3306/shop"

    schema-changes.enabled = true
  }
}

sink {
  jdbc {
    url = "jdbc:mysql://mysql_cdc_e2e:3306/shop"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "st_user_sink"
    password = "mysqlpw"
    generate_sink_sql = true
    database = shop
    table = mysql_cdc_e2e_sink_table_with_set_enum
    primary_keys = ["id"]
  }
}
