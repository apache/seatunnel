env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  checkpoint.timeout = 60000
  checkpoint.retain-after-job-cancelled = true
}

source {
  Kafka {
    plugin_output = "lookup_fact"
    bootstrap.servers = "lookup-kafka:9092"
    topic = "lookup-facts"
    start_mode = "earliest"
    schema {
      fields {
        order_id = int
        customer_id = int
      }
    }
  }
  MySQL-CDC {
    plugin_output = "lookup_dimension"
    server-id = 5662
    username = "st_user_source"
    password = "mysqlpw"
    table-names = ["mysql_cdc.lookup_dimension"]
    url = "jdbc:mysql://mysql_cdc_e2e:3306/mysql_cdc"
    exactly_once = false
  }
}

dynamic_lookup {
  customers {
    uid = "lookup-e2e-customers-v1"
    plugin_output = "lookup_output"
    fact {
      input = "lookup_fact"
      key = ["customer_id"]
      changelog-mode = "APPEND_ONLY"
      required-capability = ["FACT_SOURCE_GATE_V1"]
    }
    dimension {
      input = "lookup_dimension"
      table = "mysql_cdc.lookup_dimension"
      key = ["id"]
      primary-key-update = "FAIL"
      required-capability = ["ORDERED_BOOTSTRAP_V1", "ATOMIC_UPDATE_PAIR_V1", "PK_UPDATE_REJECT_V1"]
    }
    join {
      type = "LEFT"
      fields = ["fact.order_id", "dimension.name"]
    }
    schema-change {
      behavior = "FAIL"
    }
    state {
      backend = "IN_MEMORY"
      ttl = "NONE"
      max-concurrent-snapshots = 1
    }
    resource {
      max-logical-state-bytes-per-subtask = "512mb"
      max-resident-state-bytes-per-subtask = "512mb"
      max-concurrent-snapshots = 1
    }
  }
}

sink {
  Jdbc {
    plugin_input = "lookup_output"
    url = "jdbc:mysql://mysql_cdc_e2e:3306/mysql_cdc"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "st_user_sink"
    password = "mysqlpw"
    query = "INSERT INTO lookup_result (order_id, name) VALUES (?, ?)"
    is_exactly_once = false
    batch_size = 1
  }
}
