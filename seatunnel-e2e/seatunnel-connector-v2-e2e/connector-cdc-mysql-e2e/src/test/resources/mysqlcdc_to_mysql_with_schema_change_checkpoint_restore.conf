env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 5000
  job.retry.times = 1
  job.retry.interval.seconds = 30
}

source {
  MySQL-CDC {
    plugin_output = "schema_restore_mysql_cdc"
    server-id = 5652
    username = "st_user_source"
    password = "mysqlpw"
    table-names = ["mysql_cdc.mysql_cdc_e2e_schema_restore_source"]
    url = "jdbc:mysql://mysql_cdc_e2e:3306/mysql_cdc"
    schema-changes.enabled = true
    exactly_once = false
  }
}

sink {
  jdbc {
    plugin_input = "schema_restore_mysql_cdc"
    url = "jdbc:mysql://mysql_cdc_e2e:3306/mysql_cdc"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "st_user_sink"
    password = "mysqlpw"
    generate_sink_sql = true
    database = mysql_cdc
    table = mysql_cdc_e2e_schema_restore_sink
    primary_keys = ["id"]
    is_exactly_once = false
  }
}
