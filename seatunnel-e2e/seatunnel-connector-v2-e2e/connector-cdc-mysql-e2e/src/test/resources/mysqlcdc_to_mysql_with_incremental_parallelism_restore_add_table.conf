env {
  parallelism = 2
  job.mode = "STREAMING"
  checkpoint.interval = 5000
}

source {
  MySQL-CDC {
    plugin_output = "customers_mysql_cdc"
    server-id = 5652-5660
    username = "st_user_source"
    password = "mysqlpw"
    table-names = [
      "mysql_cdc.inc_par_src_1",
      "mysql_cdc.inc_par_src_2",
      "mysql_cdc.inc_par_src_3",
      "mysql_cdc.inc_par_src_4",
      "mysql_cdc.inc_par_src_5"
    ]
    url = "jdbc:mysql://mysql_cdc_e2e:3306/mysql_cdc"
    incremental.parallelism = 2
    exactly_once = true
  }
}

sink {
  jdbc {
    plugin_input = "customers_mysql_cdc"
    url = "jdbc:mysql://mysql_cdc_e2e:3306/mysql_cdc_inc_par_sink"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "st_user_sink"
    password = "mysqlpw"
    database = "mysql_cdc_inc_par_sink"
    table = "${table_name}"
    primary_keys = ["id"]
    generate_sink_sql = true
  }
}
