######
###### This config validates schema evolution for same-name source tables routed to
###### different sink databases while using multi-table sink replicas.
######

env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 5000
  read_limit.bytes_per_second = 7000000
  read_limit.rows_per_second = 400
}

source {
  MySQL-CDC {
    server-id = 5690-5700
    username = "st_user_source"
    password = "mysqlpw"
    database-names = ["multi_schema_shop_a", "multi_schema_shop_b"]
    table-names = ["multi_schema_shop_a.products", "multi_schema_shop_b.products"]
    url = "jdbc:mysql://mysql_cdc_e2e:3306"
    schema-changes.enabled = true
  }
}

sink {
  jdbc {
    url = "jdbc:mysql://mysql_cdc_e2e:3306"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "st_user_sink"
    password = "mysqlpw"
    generate_sink_sql = true
    database = "${database_name}_sink"
    table = "${table_name}"
    primary_keys = ["id"]

    # Validate ddl update for sink writer multi replica
    multi_table_sink_replica = 2
  }
}
