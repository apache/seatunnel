env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 3000
  job.retry.times = 1
  job.retry.interval.seconds = 15
}
source {
  MySQL-CDC {
    server-id = 8288
    username = "st_user_source"
    password = "mysqlpw"
    table-names = ["shop.schema_drain_recovery_source"]
    url = "jdbc:mysql://mysql_cdc_e2e:3306/shop"
    schema-changes.enabled = true
  }
}
sink {
  Jdbc {
    url = "jdbc:mysql://mysql_cdc_e2e:3306/shop?sessionVariables=lock_wait_timeout=8"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "st_user_sink"
    password = "mysqlpw"
    generate_sink_sql = true
    database = shop
    table = schema_drain_recovery_target
    primary_keys = ["id"]
    enable_upsert = false
  }
}
