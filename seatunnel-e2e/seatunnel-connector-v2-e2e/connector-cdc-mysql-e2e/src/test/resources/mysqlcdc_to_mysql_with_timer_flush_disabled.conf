env {
  parallelism = 1
  job.mode = "STREAMING"
  # Large checkpoint interval so checkpoints do not flush JDBC rows during the polling window.
  checkpoint.interval = 3000
  # Engine-level timer is configured, but the sink opts out via enable_timer_flush=false.
  sink.flush.interval = 100
}

source {
  MySQL-CDC {
    server-id = 5653
    username = "st_user_source"
    password = "mysqlpw"
    table-names = ["mysql_cdc.timer_flush_src"]
    url = "jdbc:mysql://mysql_cdc_e2e:3306/mysql_cdc"
  }
}

sink {
  jdbc {
    url = "jdbc:mysql://mysql_cdc_e2e:3306/mysql_cdc"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "st_user_sink"
    password = "mysqlpw"
    generate_sink_sql = true
    database = mysql_cdc
    table = timer_flush_sink
    primary_keys = ["id"]
    batch_size = 100000
    batch_interval_ms = 0
    # Explicitly opt out — engine timer must NOT flush rows mid-stream.
    enable_timer_flush = false
  }
}
