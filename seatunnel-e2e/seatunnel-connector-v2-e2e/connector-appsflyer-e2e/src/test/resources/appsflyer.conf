env {
    job.mode = "BATCH"
    parallelism = 1
    checkpoint.interval = 1000
    checkpoint.timeout = 30000
    job.retry.times = 0
}
source {
    AppsFlyer {
        token = ${fly.token}
        app_id = ${fly.app}
        start_date = ${fly.start}
        end_date = ${fly.end}
        timezone = ${fly.zone}
        api_url = ${fly.api}
        resources = ${fly.resources}
        download_origins = [${fly.download}]
        max_window_records = ${fly.records}
        max_response_bytes = ${fly.bytes}
        max_buffer_bytes = ${fly.buffer}
        max_field_chars = ${fly.field}
        max_requests = ${fly.requests}
        request_timeout_ms = ${fly.deadline}
        max_attempts = ${fly.attempts}
    }
}
sink {
    LocalFile {
        path = "/tmp/seatunnel_mnt/appsflyer-${fly.output}"
        file_format_type = "json"
        row_delimiter = "\n"
        custom_filename = true
        file_name_expression = "receipt_${transactionId}"
        is_enable_transaction = true
    }
}
