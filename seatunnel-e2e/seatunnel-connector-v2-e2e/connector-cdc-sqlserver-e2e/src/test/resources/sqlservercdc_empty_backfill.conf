env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 3000
}

source {
  SqlServer-CDC {
    plugin_output = "changes"
    username = "sa"
    password = "Password!"
    database-names = ["empty_backfill_test"]
    table-names = ["empty_backfill_test.dbo.A"]
    url = "jdbc:sqlserver://sqlserver-host:1433;databaseName=empty_backfill_test"
    startup.mode = "initial"
    exactly_once = true
    enable_concurrent_read = false
  }
}

sink {
  Jdbc {
    plugin_input = "changes"
    driver = "com.microsoft.sqlserver.jdbc.SQLServerDriver"
    url = "jdbc:sqlserver://sqlserver-host:1433;databaseName=empty_backfill_test;encrypt=false"
    user = "sa"
    password = "Password!"
    database = "empty_backfill_test"
    table = "dbo.A_sink"
    primary_keys = ["Id"]
    generate_sink_sql = true
    batch_size = 1
  }
}
