env {
  parallelism = 1
  job.mode = "STREAMING"
  # Long enough for rows to be appended after the last completed checkpoint before the
  # test cancels the job.
  checkpoint.interval = 10000
  checkpoint.retain-after-job-cancelled = true
}

source {
  FakeSource {
    row.num = 60
    split.num = 30
    split.read-interval = 1000
    schema = {
      fields {
        id = bigint
        name = string
      }
    }
  }
}

sink {
  BigQuery {
    project_id = "${bigquery_project_id}"
    dataset_id = "${bigquery_dataset_id}"
    table_id = "${bigquery_table_id}"
    service_account_key_path = "/tmp/seatunnel/bigquery-service-account.json"
    write_mode = "batch"
    # Every row is appended to the buffered stream as soon as it arrives.
    batch_size = 1
  }
}
