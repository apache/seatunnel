env {
    parallelism = 1
    job.mode = "BATCH"
}

source {
    FakeSource {
        schema = {
            fields {
                id = bigint
                name = string
            }
            primaryKey {
                name = "id"
                columnNames = [id]
            }
        }
        rows = [
            {
                kind = INSERT
                fields = [1, "Alice"]
            },
            {
                kind = INSERT
                fields = [2, "Bob"]
            },
            {
                kind = INSERT
                fields = [3, "Carol"]
            }
        ]
    }
}

sink {
    BigQuery {
        project_id = "test-project"
        dataset_id = "test_dataset"
        table_id = "streaming_test_table"
        write_mode = "streaming"
        batch_size = 2
        emulator_host = "bigquery-emulator:9050"
        emulator_grpc_host = "bigquery-emulator:9060"
    }
}
