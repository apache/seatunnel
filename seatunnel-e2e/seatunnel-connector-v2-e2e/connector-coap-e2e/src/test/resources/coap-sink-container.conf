env {
  job.mode = BATCH
  parallelism = 1
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  job.retry.times = 0
}

source {
  FakeSource {
    row.num = 1
    schema.fields {
      label = "string"
      counter = "int"
    }
    rows = [
      { kind = INSERT, fields = ["x", 42] }
    ]
  }
}

sink {
  CoAP {
    url = "coap://127.0.0.1:17081/sensor/data"
    format = "${coap.format}"
    method = "${coap.method}"
    request_type = "${coap.type}"
    request_timeout_ms = "${coap.timeout}"
    max_payload_bytes = "${coap.bytes}"
    protobuf_schema = "syntax = \"proto3\"; package fixture; message Wire { string label = 1; int32 counter = 2; }"
    protobuf_message_name = "fixture.Wire"
  }
}
