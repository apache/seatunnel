env {
  job.mode = "${coap.job_mode}"
  parallelism = 1
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  job.retry.times = 0
}

source {
  CoAP {
    bind_host = "127.0.0.1"
    port = 17080
    resource_path = "/sensor/data"
    format = "${coap.format}"
    stop_after_messages = "${coap.limit}"
    max_payload_bytes = "${coap.bytes}"
    queue_capacity = "${coap.queue}"
    max_peers = "${coap.peers}"
    max_concurrent_requests = 4
    blockwise_timeout_ms = 120000
  }
}

sink {
  LocalFile {
    path = "/tmp/seatunnel_mnt/coap-${coap.name}"
    file_format_type = "json"
    custom_filename = true
    file_name_expression = "receipt_${transactionId}"
    row_delimiter = "\n"
    is_enable_transaction = true
  }
}
