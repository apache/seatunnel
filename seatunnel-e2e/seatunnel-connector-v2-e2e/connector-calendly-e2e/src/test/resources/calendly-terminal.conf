env {
  job.mode = "BATCH"
  parallelism = 1
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  job.retry.times = 0
}
source {
  Calendly {
    result_table_name = "calendly_rows"
    token = "${api.token}"
    resource = "${api.resource}"
    start_date = "${api.start}"
    end_date = "${api.end}"
    lookback_days = "${api.lookback}"
    tls_trust_certificate = "${api.certificate}"
    page_size = "${api.page_size}"
    max_pages = "${api.pages}"
    max_response_bytes = "${api.bytes}"
    connect_timeout_ms = 5000
    read_timeout_ms = "${api.read_timeout}"
    request_deadline_ms = "${api.deadline}"
    max_attempts = "${api.attempts}"
  }
  FakeSource {
    result_table_name = "anchor_rows"
    row.num = 10
    split.num = 10
    split.read-interval = 60000
    schema.fields.name = "string"
  }
}
sink {
  LocalFile {
    source_table_name = "calendly_rows"
    path = "/tmp/seatunnel_mnt/calendly-${api.output}"
    file_format_type = "json"
    custom_filename = true
    file_name_expression = "receipt_${transactionId}"
    row_delimiter = "\n"
    is_enable_transaction = true
  }
  Console {
    source_table_name = "anchor_rows"
  }
}
