env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        id = bigint
        object_payload = json
        array_payload = json
        scalar_payload = json
        json_null = json
      }
    }
    rows = [
      {
        fields = {
          id = 1
          object_payload = {id = 1, nested = [true, 2]}
          array_payload = [{id = 2}, "text", false]
          scalar_payload = 7
          json_null = null
        }
        kind = INSERT
      }
    ]
  }
}

sink {
  StarRocks {
    plugin_input = "fake"
    nodeUrls = ["starrocks_e2e:8030"]
    username = root
    password = ""
    database = "test"
    table = "json_type_sink"
    base-url = "jdbc:mysql://starrocks_e2e:9030/test"
    starrocks.config = {
      format = "JSON"
      strip_outer_array = true
    }
    schema_save_mode = "RECREATE_SCHEMA"
    data_save_mode = "DROP_DATA"
    save_mode_create_template = "CREATE TABLE IF NOT EXISTS `${database}`.`${table}` (\n ${rowtype_fields}\n ) ENGINE=OLAP \n DUPLICATE KEY(`id`) \n DISTRIBUTED BY HASH (`id`) BUCKETS 1 \n PROPERTIES (\n \"replication_num\" = \"1\"\n )"
  }
}
