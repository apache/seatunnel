env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    parallelism = 1
    plugin_output = "fake"
    row.num = 100
    schema {
        table = "FakeTable"
        primaryKey {
          name = "pk_id"
          columnNames = [id]
        }
        columns = [
           {
              name = id
              type = bigint
              nullable = false
           },
           {
              name = c_string
              type = string
              nullable = true
           }
       ]
      }
    }
}

transform {
}

sink {
  StarRocks {
    plugin_input = "fake"
    nodeUrls = ["starrocks_e2e:8030"]
    username = root
    password = ""
    database = "test"
    table = "sink_table_options"
    batch_max_rows = 100
    max_retries = 3
    base-url="jdbc:mysql://starrocks_e2e:9030/test"
    starrocks.config = {
      format = "JSON"
      strip_outer_array = true
    }
    schema_save_mode = "CREATE_SCHEMA_WHEN_NOT_EXIST"
    data_save_mode = "APPEND_DATA"
    table_options = {
      storage_format = "V2"
    }
  }
}
