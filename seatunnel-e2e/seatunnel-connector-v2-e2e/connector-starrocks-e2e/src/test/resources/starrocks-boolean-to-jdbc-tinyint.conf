env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  StarRocks {
    nodeUrls = ["starrocks_e2e:8030"]
    username = root
    password = ""
    database = "test"
    table = "e2e_boolean_as_tinyint_source"
    schema {
      fields {
        id = INT
        flag = TINYINT
      }
    }
  }
}

sink {
  Jdbc {
    driver = "com.mysql.cj.jdbc.Driver"
    url = "jdbc:mysql://starrocks_e2e:9030/test"
    username = root
    password = ""
    query = "INSERT INTO test.e2e_boolean_as_tinyint_sink (id, flag) VALUES (?, ?)"
    batch_size = 3
  }
}
