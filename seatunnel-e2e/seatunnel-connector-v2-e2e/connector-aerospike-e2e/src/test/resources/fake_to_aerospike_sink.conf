env {
  parallelism = 1
  job.mode = BATCH

  #spark config
  spark.app.name = SeaTunnel
  spark.executor.instances = 1
  spark.executor.cores = 1
  spark.executor.memory = 1g
  spark.master = local
}

source {
  FakeSource {
    rows = [
      { kind = INSERT, fields = [20, "customer-20", 44.25, "2022-01-01T00:00:00"] }
      { kind = INSERT, fields = [21, "customer-21", 45.25, "2022-01-01T00:00:00"] }
      { kind = INSERT, fields = [22, "customer-22", 46.25, "2022-01-01T00:00:00"] }
      { kind = INSERT, fields = [23, "customer-23", 47.25, "2022-01-01T00:00:00"] }
      { kind = INSERT, fields = [24, "customer-24", 48.25, "2022-01-01T00:00:00"] }
      { kind = INSERT, fields = [25, "customer-25", 49.25, "2022-01-01T00:00:00"] }
      { kind = INSERT, fields = [26, "customer-26", 50.25, "2022-01-01T00:00:00"] }
      { kind = INSERT, fields = [27, "customer-27", 51.25, "2022-01-01T00:00:00"] }
      { kind = INSERT, fields = [28, "customer-28", 52.25, "2022-01-01T00:00:00"] }
    ]
    schema {
      fields {
        c_id = int
        c_name = string
        c_money = double
        c_birth = timestamp
      }
    }
  }
}

sink {
  Aerospike {
      bin_name = "data",
      schema = {
        field = {
            c_id = INTEGER
            c_name = STRING
            c_money = DOUBLE
            c_birth = LONG
        }
      },
      username="",
      password="",
      set = "seatunnel_sink",
      port = 3000
      data_format = "string",
      host = "aerospike-host",
      namespace = "test",
      key = "c_id"
  }
}
