env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.retain-after-job-cancelled = true
  read_limit.rows_per_second = "${fixture_rate}"
}

source {
  Akeneo {
    plugin_output = "pim"
    base_url = "${fixture_origin}"
    client_id = "${fixture_client}"
    client_secret = "${fixture_secret}"
    username = "${fixture_user}"
    password = "${fixture_password}"
    measurement_api = "${fixture_measurement}"
    page_size = "${fixture_size}"
    max_pages = "${fixture_max_pages}"
    request_interval_ms = 25
    max_attempts = 3
    socket_timeout_ms = 20000
    page_deadline_ms = "${fixture_deadline}"
    max_response_bytes = "${fixture_bytes}"
    resources = ["products"]
  }
}

sink {
  Jdbc {
    plugin_input = "pim"
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://akeneo-db:5432/test?loggerLevel=OFF"
    username = "test"
    password = "test"
    database = "test"
    table = "public.akeneo_rows"
    generate_sink_sql = true
    batch_size = 1
  }
}
