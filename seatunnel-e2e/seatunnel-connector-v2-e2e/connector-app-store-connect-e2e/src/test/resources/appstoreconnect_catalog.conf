env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.retain-after-job-cancelled = true
  read_limit.rows_per_second = "${fixture_rate}"
}

source {
  AppStoreConnect {
    plugin_output = "store"
    api_origin = "${fixture_api}"
    issuer_id = "${fixture_issuer}"
    key_id = "${fixture_kid}"
    secret_key = "${fixture_key}"
    vendor_number = "${fixture_vendor}"
    download_hosts = ["host.testcontainers.internal"]
    sales_reports_start_date = "${fixture_sales}"
    subscription_event_reports_start_date = "${fixture_event_start}"
    subscription_event_skip_dates = ["${fixture_event_skip}"]
    finance_reports_start_date = "${fixture_fiscal}"
    analytics_reports_start_date = "${fixture_analytics}"
    reviews_start_date = "${fixture_reviews}"
    page_size = 2
    max_pages_per_parent = "${fixture_pages}"
    min_request_interval_ms = 0
    request_timeout_ms = "${fixture_timeout}"
    operation_timeout_ms = "${fixture_operation}"
    max_retries = 1
    max_compressed_report_bytes = "${fixture_wire}"
    max_decoded_report_bytes = "${fixture_decoded}"
    max_report_row_chars = "${fixture_row}"
  }
}

sink {
  Jdbc {
    plugin_input = "store"
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://appstore-db:5432/test?loggerLevel=OFF"
    username = "test"
    password = "test"
    database = "test"
    table = "public.appstore_rows"
    generate_sink_sql = true
    batch_size = 1
  }
}
