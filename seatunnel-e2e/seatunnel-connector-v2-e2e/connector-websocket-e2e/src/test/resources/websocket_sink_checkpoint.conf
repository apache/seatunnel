env {
  job.mode = "BATCH"
  parallelism = 1
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  checkpoint.retain-after-job-cancelled = true
  sink.flush.interval = 500
}
source {
  WebSocket {
    url = "${source.url}"
    format = json
    max_records = 2
    read_timeout_ms = 120000
    poll_timeout_ms = 50
    enable_reconnect = false
    schema { fields { id = bigint } }
  }
}
sink {
  WebSocket {
    url = "${sink.url}"
    connect_timeout_ms = ${connect.timeout}
    close_timeout_ms = ${close.timeout}

  }
}
