env {
  job.mode = "BATCH"
  parallelism = 1
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  checkpoint.retain-after-job-cancelled = true
  sink.flush.interval = 500
}
source {
  FakeSource {
    row.num = 2
    schema {
      fields {
        id = bigint
        name = string
        amount = "decimal(30,8)"
        note = string
      }
    }
    rows = [
      { kind = INSERT, fields = [9007199254740993, "雪 🦊", "12345678901234567890.12345678", null] },
      { kind = INSERT, fields = [9007199254740994, "quotes: \"x\"", "10.125", ""] }
    ]
  }
}
sink {
  WebSocket {
    url = "${sink.url}"
    connect_timeout_ms = ${connect.timeout}
    close_timeout_ms = ${close.timeout}
    token = "fixture-ws-bearer-token"
  }
}
