env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.retain-after-job-cancelled = true
  read_limit.rows_per_second = "${fixture_row_rate}"
}
source {
  ActiveCampaign {
    plugin_output = "account_rows"
    base_url = "${fixture_origin}"
    token = "${fixture_token}"
    resources = ["contacts"]
    page_size = "${fixture_page_size}"
    max_pages = "${fixture_max_pages}"
    request_interval_ms = 250
    max_attempts = "${fixture_attempts}"
    socket_timeout_ms = 20000
    page_deadline_ms = "${fixture_deadline}"
    max_response_bytes = "${fixture_byte_limit}"
  }
  FakeSource {
    plugin_output = "slow_rows"
    row.num = 200
    split.num = 20
    schema {
      fields {
        value = int
      }
    }
  }
}
sink {
  Console {
    plugin_input = "slow_rows"
    log.print.data = false
  }
  Jdbc {
    plugin_input = "account_rows"
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://activecampaign-postgres:5432/test?loggerLevel=OFF"
    username = "test"
    password = "test"
    database = "test"
    table = "public.account_rows"
    generate_sink_sql = true
    batch_size = 1
  }
}
