env {
  job.mode = "BATCH"
  parallelism = 1
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  job.retry.times = 0
}

source {
  AlphaVantage {
    api_url = "${vantage.url}"
    token = "${vantage.token}"
    symbol = "${vantage.symbol}"
    resources = ["${vantage.resource}"]
    interval = "${vantage.interval}"
    adjusted = "${vantage.adjusted}"
    outputsize = "${vantage.size}"
    max_response_bytes = "${vantage.bytes}"
    max_records = "${vantage.records}"
    request_interval_ms = "${vantage.pacing}"
    request_timeout_ms = "${vantage.deadline}"
    max_attempts = "${vantage.attempts}"
    max_requests = "${vantage.requests}"
    read_timeout_ms = 15000
  }
}

sink {
  LocalFile {
    path = "/tmp/seatunnel_mnt/vantage-${vantage.output}"
    file_format_type = "json"
    custom_filename = true
    file_name_expression = "receipt_${transactionId}"
    row_delimiter = "\n"
    is_enable_transaction = true
  }
}
