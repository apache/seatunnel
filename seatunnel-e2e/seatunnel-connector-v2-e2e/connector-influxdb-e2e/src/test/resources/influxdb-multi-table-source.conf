env {
  parallelism = 1
  job.mode = "BATCH"
}
source {
  InfluxDB {
    url = "http://influxdb-host:8086"
    database = "test"
    tables_configs = [
      {
        sql = "select c_int, c_double from source"
        lower_bound = 0
        upper_bound = 99
        partition_num = 3
        split_column = "c_int"
        schema {
          table = "numbers"
          fields {
            c_double = DOUBLE
            c_int = INT
          }
        }
      },
      {
        sql = "select c_string, c_boolean from source tz('Asia/Shanghai')"
        schema {
          table = "states"
          fields {
            c_boolean = BOOLEAN
            c_string = STRING
          }
        }
      }
    ]
  }
}
sink {
  Assert {
    rules {
      table-names = ["numbers", "states"]
      tables_configs = [
        {
          table_path = "numbers"
          row_rules = [
            { rule_type = MAX_ROW, rule_value = 100 },
            { rule_type = MIN_ROW, rule_value = 100 }
          ]
          field_rules = [
            {
              field_name = c_double
              field_type = double
              field_value = [{ equals_to = 1.1 }]
            }
          ]
        },
        {
          table_path = "states"
          row_rules = [
            { rule_type = MAX_ROW, rule_value = 100 },
            { rule_type = MIN_ROW, rule_value = 100 }
          ]
          field_rules = [
            {
              field_name = c_boolean
              field_type = boolean
              field_value = [{ rule_type = NOT_NULL }]
            }
          ]
        }
      ]
    }
  }
}
