env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.retain-after-job-cancelled = true
  read_limit.rows_per_second = "${fixture_rate}"
}
source {
  Aircall {
    plugin_output = "account"
    base_url = "${fixture_origin}"
    username = "${fixture_user}"
    password = "${fixture_password}"
    start_time = "${fixture_start}"
    end_time = "${fixture_end}"
    lookback_days = "${fixture_overlap}"
    call_window_days = 365
    page_size = "${fixture_size}"
    sms_page_size = 100
    max_pages = "${fixture_max_pages}"
    request_interval_ms = 500
    max_attempts = 3
    socket_timeout_ms = 20000
    page_deadline_ms = "${fixture_deadline}"
    max_response_bytes = "${fixture_bytes}"
    resources = ["calls"]
  }
}
sink {
  Jdbc {
    plugin_input = "account"
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://aircall-db:5432/test?loggerLevel=OFF"
    username = "test"
    password = "test"
    database = "test"
    table = "public.aircall_rows"
    generate_sink_sql = true
    batch_size = 1
  }
}
