env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
  checkpoint.interval = 1000
  checkpoint.retain-after-job-cancelled = true
  read_limit.rows_per_second = "${fixture_rate}"
}

source {
  AppleAds {
    plugin_output = "ads"
    ad_account_id = "${fixture_account}"
    api_origin = "${fixture_api}"
    oauth_origin = "${fixture_oauth}"
    client_id = "${fixture_client}"
    client_secret = "${fixture_secret}"
    resources = ["${fixture_resource}"]
    start_date = "${fixture_start}"
    end_date = "${fixture_end}"
    report_window_days = "${fixture_window}"
    page_size = "${fixture_page_size}"
    max_pages_per_partition = "${fixture_max_pages}"
    min_request_interval_ms = 0
    request_timeout_ms = "${fixture_timeout}"
    operation_timeout_ms = "${fixture_operation}"
    max_retries = 1
    max_response_bytes = "${fixture_limit}"
  }
}

sink {
  Jdbc {
    plugin_input = "ads"
    driver = "org.postgresql.Driver"
    url = "jdbc:postgresql://apple-ads-db:5432/test?loggerLevel=OFF"
    username = "test"
    password = "test"
    database = "test"
    table = "public.apple_ads_rows"
    generate_sink_sql = true
    batch_size = 1
  }
}
