env {
  job.mode = "BATCH"
  parallelism = 1
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  job.retry.times = 0
}
source {
  Box {
    result_table_name = "box_rows"
    endpoint = "${api.endpoint}"
    download_endpoint = "${api.download}"
    trust_certificate = "${api.trust}"
    page_size = 2
    max_pages_per_parent = "${api.pages}"
    max_requests = "${api.requests}"
    max_items = "${api.items}"
    max_depth = "${api.depth}"
    recursive = "${api.recursive}"
    max_representation_polls = "${api.polls}"
    max_attempts = "${api.attempts}"
    request_timeout_ms = "${api.timeout}"
    max_response_bytes = "${api.bytes}"
    folder_id = "0"
    ask_prompt = "What is the total?"
    extract_prompt = "Extract fields as JSON."
    structured_fields = """[{"key":"risk","description":"Risk rating","displayName":"Risk","type":"string","prompt":"Return risk","options":[{"key":"high"},{"key":"low"}]},{"key":"owner","description":"Owner","display_name":"Owner","type":"string","prompt":"Return owner","options":[{"key":"none"}]},{"key":"amount","description":"Amount","displayName":"Amount","type":"string","prompt":"Return amount"}]"""
    auth_mode = "client_credentials"
    client_id = "${api.client}"
    secret_key = "${api.secret}"
    box_subject_type = "${api.subject_type}"
    box_subject_id = "${api.subject}"
    resources = ["events","sign_templates","collections","collection_items","sign_request","admin_logs","files","file_collaborations","folder_collaborations","file_comments","recent_items","file_tasks","trashed_items","users","folders","text_representation","ai_ask","ai_extract","ai_extract_structured"]

  }
}
sink {
  LocalFile {
    source_table_name = "box_rows"
    path = "/tmp/seatunnel_mnt/box-${api.output}"
    file_format_type = "json"
    custom_filename = true
    file_name_expression = "receipt_${transactionId}"
    row_delimiter = "\n"
    is_enable_transaction = true
  }
}
