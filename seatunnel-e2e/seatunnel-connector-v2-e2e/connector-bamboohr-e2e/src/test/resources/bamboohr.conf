env {
    job.mode = "BATCH"
    parallelism = ${bamboo.parallelism}
    checkpoint.interval = 1000
    checkpoint.timeout = 30000
    job.retry.times = 0
}
source {
    BambooHR {
        company = ${bamboo.company}
        token = ${bamboo.token}
        resource = ${bamboo.resource}
        custom_reports_fields = ${?bamboo.reportFields}
        employee_fields = ${?bamboo.employeeFields}
        start_date = ${?bamboo.start}
        end_date = ${?bamboo.end}
        company_time_zone = ${?bamboo.zone}
        time_off_watermark = ${?bamboo.timeOffWatermark}
        timesheet_watermark = ${?bamboo.timesheetWatermark}
        employee_changed_since = ${?bamboo.employeeChangedSince}
        read_timeout_ms = ${?bamboo.readTimeout}
        request_deadline_ms = ${?bamboo.deadline}
        max_response_bytes = ${?bamboo.bytes}
        max_records_per_response = ${?bamboo.records}
        max_attempts = ${?bamboo.attempts}
    }
}
sink {
    LocalFile {
        path = ${bamboo.output}
        file_format_type = "json"
        row_delimiter = "\n"
        custom_filename = true
        file_name_expression = "receipt_${transactionId}"
        is_enable_transaction = true
    }
}
