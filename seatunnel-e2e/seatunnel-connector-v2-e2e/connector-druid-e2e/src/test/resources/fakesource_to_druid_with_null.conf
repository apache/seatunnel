env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        id = int
        name = string
        amount = bigint
      }
    }
    # The second row has a null string and the third a null number. Each must still be ingested,
    # and every value after the null must stay in its own column.
    rows = [
      {
        kind = INSERT
        fields = [1, "a", 10]
      },
      {
        kind = INSERT
        fields = [2, null, 20]
      },
      {
        kind = INSERT
        fields = [3, "c", null]
      }
    ]
  }
}

transform {
}

sink {
  Druid {
    coordinatorUrl = "${druidCoordinatorUrl}"
    # Set per engine run by DruidIT, so each run reads back only the rows it wrote.
    datasource = "${nullFieldDatasource}"
  }
}
