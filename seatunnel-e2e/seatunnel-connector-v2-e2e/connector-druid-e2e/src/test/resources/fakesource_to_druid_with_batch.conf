env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        id = int
        name = string
        amount = bigint
      }
    }
    # Six rows with a batch size of two: the writer flushes after rows 2 and 4 and once more on
    # close. Every row must be ingested exactly once, whatever the batch boundaries are.
    rows = [
      {
        kind = INSERT
        fields = [1, "a", 10]
      },
      {
        kind = INSERT
        fields = [2, "b", 20]
      },
      {
        kind = INSERT
        fields = [3, "c", 30]
      },
      {
        kind = INSERT
        fields = [4, "d", 40]
      },
      {
        kind = INSERT
        fields = [5, "e", 50]
      },
      {
        kind = INSERT
        fields = [6, "f", 60]
      }
    ]
  }
}

sink {
  Druid {
    coordinatorUrl = "${druidCoordinatorUrl}"
    # Set per engine run by DruidIT, so each run reads back only the rows it wrote.
    datasource = "${batchDatasource}"
    batchSize = 2
  }
}
