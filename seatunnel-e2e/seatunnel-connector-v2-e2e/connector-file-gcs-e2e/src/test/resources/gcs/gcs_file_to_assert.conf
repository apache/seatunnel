env {
  parallelism = 1
  job.mode = "BATCH"

  spark.app.name = "SeaTunnel"
  spark.executor.instances = 1
  spark.executor.cores = 1
  spark.executor.memory = "1g"
  spark.master = local
}

source {
  GcsFile {
    bucket = "gs://seatunnel-gcs-test"
    path = "/input"
    file_format_type = "json"
    hadoop_gcs_properties = {
      "fs.gs.storage.root.url" = "http://fake-gcs:4443/"
      "fs.gs.auth.service.account.enable" = "false"
      "fs.gs.auth.null.enable" = "true"
      "fs.gs.project.id" = "seatunnel-test"
    }
    schema = {
      fields {
        id = int
        name = string
      }
    }
  }
}

sink {
  Assert {
    rules {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 2
        },
        {
          rule_type = MAX_ROW
          rule_value = 2
        }
      ]
      field_rules = [
        {
          field_name = id
          field_type = int
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = name
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
    }
  }
}
