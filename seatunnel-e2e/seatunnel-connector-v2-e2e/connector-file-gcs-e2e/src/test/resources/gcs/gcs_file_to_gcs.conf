env {
  parallelism = 1
  job.mode = "BATCH"
  spark.app.name = "SeaTunnel"
  spark.executor.instances = 1
  spark.executor.cores = 1
  spark.executor.memory = "1g"
  spark.master = local
}

source {
  GcsFile {
    bucket = "gs://seatunnel-gcs-test"
    path = "/input"
    file_format_type = "json"
    hadoop_gcs_properties = {
      "fs.gs.storage.root.url" = "http://fake-gcs:4443/"
      "fs.gs.auth.service.account.enable" = "false"
      "fs.gs.auth.null.enable" = "true"
      "fs.gs.project.id" = "seatunnel-test"
    }
    schema = {
      fields {
        id = int
        name = string
      }
    }
  }
}

sink {
  GcsFile {
    bucket = "gs://seatunnel-gcs-test"
    path = "/sink-output"
    tmp_path = "/sink-staging"
    file_format_type = "json"
    data_save_mode = "DROP_DATA"
    have_partition = true
    partition_by = ["id"]
    is_partition_field_write_in_file = true
    hadoop_gcs_properties = {
      # fake-gcs-server does not implement the native GCS move endpoint.
      "fs.gs.operation.move.enable" = "false"
      "fs.gs.storage.root.url" = "http://fake-gcs:4443/"
      "fs.gs.auth.service.account.enable" = "false"
      "fs.gs.auth.null.enable" = "true"
      "fs.gs.project.id" = "seatunnel-test"
    }
  }
}
