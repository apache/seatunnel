#
# Reads a field the GraphQL server does not have. The server answers HTTP 200 with an errors
# array, and the job must fail instead of reading no rows.

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  GraphQL {
    plugin_output = "http"
    url = "http://graphql:8080/v1/graphql"
    format = "json"
    content_field = "$.data.missing_table"
    query = """
      query Rejected {
        missing_table {
          id
        }
      }
    """
    schema = {
      fields {
        id = "int"
      }
    }
  }
}

sink {
  Assert {
    plugin_input = http
    rules {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 0
        }
      ]
    }
  }
}
