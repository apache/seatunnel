env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    schema = {
      fields {
        id = int
        version = bigint
      }
    }
    rows = [
      { kind = DELETE, fields = [3, 1003] }
    ]
  }
}

sink {
  Hbase {
    zookeeper_quorum = "hbase_e2e:2181"
    table = ${cdc_table}
    rowkey_column = ["id"]
    version_column = "version"
    family_name {
      all_columns = info
    }
  }
}
