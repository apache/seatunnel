env {
  execution.parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
      schema = {
          fields {
              name = string
              score = int
              ts = bigint
          }
      }
      rows = [
          {
              kind = INSERT
              fields = ["A", 100, 1000]
          },
          {
              kind = INSERT
              fields = ["B", 200, 2000]
          },
          {
              kind = INSERT
              fields = ["C", 300, 3000]
          }
      ]
  }
}

sink {
  Hbase {
    zookeeper_quorum = "hbase_e2e:2181"
    table = "seatunnel_test"
    rowkey_column = ["name"]
    version_column = "ts"
    family_name {
      all_columns = info
    }
  }
}
