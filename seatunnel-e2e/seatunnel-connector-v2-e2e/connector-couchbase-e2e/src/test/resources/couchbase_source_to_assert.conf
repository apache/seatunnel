env {
  parallelism = 1
  job.mode = "BATCH"
}
source {
  Couchbase {
    plugin_output = "couchbase_rows"
    connection.string = "couchbase://e2e_couchbase"
    username = "Administrator"
    password = "password"
    bucket = "test_bucket"
    scope = "_default"
    collection = "_default"
    schema {
      fields {
        id = INT
        name = STRING
        enabled = BOOLEAN
        amount = DOUBLE
        nullable = STRING
      }
    }
  }
}
sink {
  Couchbase {
    plugin_input = "couchbase_rows"
    connection.string = "couchbase://e2e_couchbase"
    username = "Administrator"
    password = "password"
    bucket = "test_bucket"
    scope = "_default"
    collection = "test_source_result"
    primary-key = ["id"]
    upsert-enable = true
  }
  Assert {
    plugin_input = "couchbase_rows"
    rules {
      row_rules = [
        { rule_type = MIN_ROW, rule_value = 2 },
        { rule_type = MAX_ROW, rule_value = 2 }
      ]
      field_rules = [
        {
          field_name = "id"
          field_type = "INT"
          field_value = [
            { rule_type = NOT_NULL },
            { rule_type = MIN, rule_value = 1 },
            { rule_type = MAX, rule_value = 2 }
          ]
        },
        {
          field_name = "name"
          field_type = "STRING"
          field_value = [{ rule_type = NOT_NULL }]
        },
        {
          field_name = "enabled"
          field_type = "BOOLEAN"
          field_value = [{ rule_type = NOT_NULL }]
        },
        {
          field_name = "amount"
          field_type = "DOUBLE"
          field_value = [
            { rule_type = NOT_NULL },
            { rule_type = MIN, rule_value = -3.25 },
            { rule_type = MAX, rule_value = 12.5 }
          ]
        },
        {
          field_name = "nullable"
          field_type = "STRING"
          field_value = [{ rule_type = NULL }]
        }
      ]
    }
  }
}
