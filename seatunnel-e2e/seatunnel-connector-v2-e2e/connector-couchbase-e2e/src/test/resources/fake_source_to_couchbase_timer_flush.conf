env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 300000
  sink.flush.interval = 3000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 10
    auto.increment.enabled = true
    auto.increment.start   = 1
    schema = {
      fields {
        id      = "int"
        name    = "string"
        score   = "double"
        active  = "boolean"
      }
      primaryKey {
        name        = "id"
        columnNames = [id]
      }
    }
  }
}

sink {
  Couchbase {
    connection.string = "couchbase://e2e_couchbase"
    username          = "Administrator"
    password          = "password"
    bucket            = "test_bucket"
    scope             = "_default"
    collection        = "test_collection_timer_flush"
    primary-key       = ["id"]
    upsert-enable     = true
    buffer-flush.max-rows = 100000
  }
}