env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100
    # auto.increment.enabled makes the primary-key field sequential (1..100) so
    # upsert-enable=true produces exactly 100 distinct document keys and the
    # COUNT(*) assertion in CouchbaseIT is fully deterministic.
    auto.increment.enabled = true
    auto.increment.start   = 1
    schema = {
      fields {
        id      = "int"
        name    = "string"
        score   = "double"
        active  = "boolean"
      }
      primaryKey {
        name        = "id"
        columnNames = [id]
      }
    }
  }
}

sink {
  Couchbase {
    connection.string = "couchbase://e2e_couchbase"
    username          = "Administrator"
    password          = "password"
    bucket            = "test_bucket"
    scope             = "_default"
    collection        = "test_collection"
    primary-key       = ["id"]
    upsert-enable     = true
    buffer-flush.max-rows    = 50
    buffer-flush.interval    = 5000
  }
}
