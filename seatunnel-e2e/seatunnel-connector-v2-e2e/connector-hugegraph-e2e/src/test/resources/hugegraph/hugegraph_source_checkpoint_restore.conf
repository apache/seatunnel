# Multi-page bounded scan used by HugeGraphSourceCheckpointRestoreIT to verify engine-level
# checkpoint/restore: a small page_size forces several pages (several checkpoints), and the
# Console sink delay keeps the bounded job RUNNING long enough to take a savepoint mid-scan.
env {
  parallelism = 1
  job.mode = "BATCH"
  checkpoint.interval = 1000
}

source {
  HugeGraph {
    host = "hugegraph-host"
    port = 8080
    graph_name = "hugegraph"
    label = "person"
    label_type = "VERTEX"
    # 100 is the minimum page_size the source accepts; with >100 vertices loaded this still
    # forces multiple pages so the opaque page token is checkpointed between pages.
    page_size = 100
    plugin_output = "hugegraph_cp_restore"
    schema = {
      fields {
        name = "string"
        age = "int"
      }
    }
  }
}

sink {
  Console {
    plugin_input = "hugegraph_cp_restore"
    # Throttle so the bounded scan stays RUNNING long enough for a mid-scan savepoint.
    log.print.delay.ms = 100
  }
}
