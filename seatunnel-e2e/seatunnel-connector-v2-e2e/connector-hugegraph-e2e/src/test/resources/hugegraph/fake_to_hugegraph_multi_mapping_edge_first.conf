env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 25
    schema = {
      fields {
        v_name = "string"
        v_age = "int"
        src = "string"
        tgt = "string"
        weight = "double"
      }
    }
  }
}

sink {
  HugeGraph {
    host = "hugegraph-host"
    port = 8080
    graph_name = "hugegraph"
    schema_save_mode = "ERROR_WHEN_SCHEMA_NOT_EXIST"
    batch_size = 2
    mappings = [
      {
        type = "EDGE"
        label = "knows"
        sourceConfig = {
          label = "person"
          idFields = ["src"]
        }
        targetConfig = {
          label = "person"
          idFields = ["tgt"]
        }
        properties = ["weight"]
        fieldMapping = {
          src = "name"
          tgt = "name"
        }
      }
      {
        type = "VERTEX"
        label = "person"
        idStrategy = "PRIMARY_KEY"
        idFields = ["v_name"]
        properties = ["v_name", "v_age"]
        fieldMapping = {
          v_name = "name"
          v_age = "age"
        }
      }
    ]
  }
}
