# Engine-level checkpoint coverage for the bounded source: checkpoint.interval is enabled and a
# small-ish page_size makes the scan span multiple pages, so on Zeta the source's opaque page
# token is snapshotted (snapshotStateToBytes) at checkpoints during the scan. The Assert sink then
# proves the full scan is read exactly once (row count == loaded count, ids/keys non-null).
env {
  parallelism = 1
  job.mode = "BATCH"
  checkpoint.interval = 1000
}

source {
  HugeGraph {
    host = "hugegraph-host"
    port = 8080
    graph_name = "hugegraph"
    label = "person"
    label_type = "VERTEX"
    page_size = 100
    plugin_output = "hugegraph_vertex_checkpoint"
    schema = {
      fields {
        name = "string"
        age = "int"
      }
    }
  }
}

sink {
  Assert {
    plugin_input = "hugegraph_vertex_checkpoint"
    rules = {
      field_rules = [
        {
          field_name = "~id"
          field_type = STRING
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = name
          field_type = STRING
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 250
        },
        {
          rule_type = MAX_ROW
          rule_value = 250
        }
      ]
    }
  }
}
