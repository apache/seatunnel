env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  HugeGraph {
    host = "hugegraph-host"
    port = 8080
    graph_name = "hugegraph"
    label = "knows"
    label_type = "EDGE"
    page_size = 100
    plugin_output = "hugegraph_edge"
    schema = {
      fields {
        weight = "double"
      }
    }
  }
}

sink {
  Assert {
    plugin_input = "hugegraph_edge"
    rules = {
      field_rules = [
        {
          field_name = "~id"
          field_type = STRING
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = "~label"
          field_type = STRING
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = "~source_id"
          field_type = STRING
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = "~source_label"
          field_type = STRING
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = "~target_id"
          field_type = STRING
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = "~target_label"
          field_type = STRING
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = weight
          field_type = DOUBLE
          field_value = [
            {
              rule_type = MIN
              rule_value = 1.5
            },
            {
              rule_type = MAX
              rule_value = 1.5
            }
          ]
        }
      ]
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 1
        },
        {
          rule_type = MAX_ROW
          rule_value = 1
        }
      ]
    }
  }
}
