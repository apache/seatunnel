# Verifies a BYTE column (code) and an OBJECT column (meta) can be read: before the fix both hit the
# type-converter default branch and failed schema validation, blocking the whole label read.

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  HugeGraph {
    host = "hugegraph-host"
    port = 8080
    graph_name = "hugegraph"
    label = "gadget"
    label_type = "VERTEX"
    page_size = 100
    plugin_output = "hugegraph_gadget"
    schema = {
      fields {
        name = "string"
        code = "tinyint"
        meta = "string"
      }
    }
  }
}

sink {
  Assert {
    plugin_input = "hugegraph_gadget"
    rules = {
      field_rules = [
        {
          field_name = "~id"
          field_type = STRING
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = "~label"
          field_type = STRING
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = name
          field_type = STRING
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = code
          field_type = tinyint
          field_value = [
            {
              equals_to = 7
            }
          ]
        },
        {
          field_name = meta
          field_type = STRING
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 1
        },
        {
          rule_type = MAX_ROW
          rule_value = 1
        }
      ]
    }
  }
}
