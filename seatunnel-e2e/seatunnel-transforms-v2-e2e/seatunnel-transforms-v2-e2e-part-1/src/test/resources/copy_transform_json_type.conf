env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        id = int
        payload = json
        payloads = "array<json>"
      }
    }
    rows = [
      {
        fields = [1, {id = 1, message = "a,b"}, [{id = 2}, ["x", "y"]]]
        kind = INSERT
      }
    ]
  }
}

transform {
  Copy {
    plugin_input = "fake"
    plugin_output = "copied"
    fields {
      payload_copy = "payload"
      payloads_copy = "payloads"
    }
  }
}

sink {
  Assert {
    plugin_input = "copied"
    rules = {
      row_rules = [
        {rule_type = MIN_ROW, rule_value = 1}
        {rule_type = MAX_ROW, rule_value = 1}
      ]
      field_rules = [
        {
          field_name = payload_copy
          field_type = json
          field_value = [{equals_to = {id = 1, message = "a,b"}}]
        }
        {
          field_name = payloads_copy
          field_type = "array<json>"
          field_value = [{equals_to = [{id = 2}, ["x", "y"]]}]
        }
      ]
    }
  }
}
