env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        id = "int"
        content = "string"
      }
    }
    rows = [
      {fields = [1, "abcabcabc"], kind = INSERT}
    ]
  }
}

transform {
  TextChunk {
    plugin_input = "fake"
    plugin_output = "fake1"
    text_field = "content"
    output_field = "chunk"
    chunk_index_field = "chunk_index"
    chunk_size = 3
    overlap_size = 0
    separators = []
  }
}

sink {
  Assert {
    plugin_input = "fake1"
    rules = {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 3
        },
        {
          rule_type = MAX_ROW
          rule_value = 3
        }
      ]
      field_rules = [
        {
          field_name = "id"
          field_type = "int"
          field_value = [
            {equals_to = 1}
          ]
        },
        {
          field_name = "content"
          field_type = "string"
          field_value = [
            {equals_to = "abcabcabc"}
          ]
        },
        {
          field_name = "chunk"
          field_type = "string"
          field_value = [
            {equals_to = "abc"}
          ]
        },
        {
          field_name = "chunk_index"
          field_type = "int"
          field_value = [
            {rule_type = MIN, rule_value = 0},
            {rule_type = MAX, rule_value = 2}
          ]
        }
      ]
    }
  }
}
