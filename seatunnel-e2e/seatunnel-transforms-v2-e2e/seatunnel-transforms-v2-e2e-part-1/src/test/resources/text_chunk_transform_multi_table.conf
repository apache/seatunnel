env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    tables_configs = [
      {
        schema = {
          table = "test.doc_a"
          columns = [
            {name = "id", type = "int"},
            {name = "content", type = "string"}
          ]
        }
        rows = [
          {fields = [1, "xxxx"], kind = INSERT}
        ]
      },
      {
        schema = {
          table = "test.doc_b"
          columns = [
            {name = "id", type = "int"},
            {name = "content", type = "string"}
          ]
        }
        rows = [
          {fields = [2, "yy yy yy "], kind = INSERT}
        ]
      }
    ]
  }
}

transform {
  TextChunk {
    plugin_input = "fake"
    plugin_output = "fake1"
    text_field = "content"
    chunk_size = 3
    overlap_size = 0
    table_transform = [
      {
        table_path = "test.doc_a"
        text_field = "content"
        chunk_size = 2
        overlap_size = 0
        separators = []
      }
    ]
  }
}

sink {
  Assert {
    plugin_input = "fake1"
    rules = {
      tables_configs = [
        {
          table_path = "test.doc_a"
          row_rules = [
            {rule_type = MIN_ROW, rule_value = 2},
            {rule_type = MAX_ROW, rule_value = 2}
          ]
          field_rules = [
            {
              field_name = "id"
              field_type = "int"
              field_value = [{equals_to = 1}]
            },
            {
              field_name = "chunk"
              field_type = "string"
              field_value = [{equals_to = "xx"}]
            },
            {
              field_name = "chunk_index"
              field_type = "int"
              field_value = [
                {rule_type = MIN, rule_value = 0},
                {rule_type = MAX, rule_value = 1}
              ]
            }
          ]
        },
        {
          table_path = "test.doc_b"
          row_rules = [
            {rule_type = MIN_ROW, rule_value = 3},
            {rule_type = MAX_ROW, rule_value = 3}
          ]
          field_rules = [
            {
              field_name = "id"
              field_type = "int"
              field_value = [{equals_to = 2}]
            },
            {
              field_name = "chunk"
              field_type = "string"
              field_value = [{equals_to = "yy "}]
            },
            {
              field_name = "chunk_index"
              field_type = "int"
              field_value = [
                {rule_type = MIN, rule_value = 0},
                {rule_type = MAX, rule_value = 2}
              ]
            }
          ]
        }
      ]
    }
  }
}
