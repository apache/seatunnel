######
###### This config file is a demonstration of Pivot transform
######

env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 4
    schema = {
      fields {
        id = "int"
        type = "string"
        value = "int"
      }
    }
    rows = [
      { fields = [1, "A", 100], kind = INSERT }
      { fields = [1, "B", 200], kind = INSERT }
      { fields = [2, "A", 150], kind = INSERT }
      { fields = [2, "C", 300], kind = INSERT }
    ]
  }
}

transform {
  Pivot {
    plugin_input = "fake"
    plugin_output = "pivoted"
    group_by_keys = ["id"]
    pivot_column = "type"
    value_column = "value"
    pivot_values = ["A", "B", "C"]
  }
}

sink {
  Assert {
    plugin_input = "pivoted"
    rules = {
      # Should output 2 rows (one for id=1, one for id=2)
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 2
        },
        {
          rule_type = MAX_ROW
          rule_value = 2
        }
      ]
      # Verify output schema has 4 columns: id, A, B, C
      field_rules = [
        {
          field_name = id
          field_type = int
        },
        {
          field_name = A
          field_type = int
        },
        {
          field_name = B
          field_type = int
        },
        {
          field_name = C
          field_type = int
        }
      ]
    }
  }
}
