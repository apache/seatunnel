######
###### DataValidator with a transform level rule and a per-table rule.
###### test.abc uses the transform level rule, test.xyz its table_transform entry.
######

env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  FakeSource {
    tables_configs = [
      {
        schema = {
          table = "test.abc"
          columns = [
            {name = "id", type = "int"},
            {name = "name", type = "string"},
            {name = "age", type = "int"},
            {name = "email", type = "string"}
          ]
        }
        rows = [
          {fields = [1, "John Doe", 25, "john@example.com"], kind = INSERT}
          {fields = [2, "Jane Smith", 30, "jane@example.com"], kind = INSERT}
        ]
      },
      {
        schema = {
          table = "test.xyz"
          columns = [
            {name = "id", type = "int"},
            {name = "name", type = "string"},
            {name = "age", type = "int"},
            {name = "email", type = "string"}
          ]
        }
        rows = [
          {fields = [1, "Bob Johnson", 35, "bob@example.com"], kind = INSERT}
          {fields = [2, "Alice Brown", 28, "alice@example.com"], kind = INSERT}
        ]
      }
    ]
  }
}

transform {
  DataValidator {
    plugin_output = "validated"
    row_error_handle_way = "FAIL"
    // applies to every table that is not covered by a table_transform entry
    field_rules = [
      {
        field_name = "name"
        rule_type = "NOT_NULL"
      },
      {
        field_name = "age"
        rule_type = "RANGE"
        min_value = "0"
        max_value = "150"
      }
    ]

    table_transform = [{
      table_path = "test.xyz"
      field_rules = [
        {
          field_name = "name"
          rule_type = "NOT_NULL"
        },
        {
          field_name = "email"
          rule_type = "REGEX"
          pattern = "^[\\w-\\.]+@([\\w-]+\\.)+[\\w-]{2,4}$"
        }
      ]
    }]
  }
}

sink {
  Assert {
    plugin_input = "validated"
    rules = {
      tables_configs = [
        {
          table_path = "test.abc"
          row_rules = [
            {rule_type = MIN_ROW, rule_value = 2},
            {rule_type = MAX_ROW, rule_value = 2}
          ]
          field_rules = [{
            field_name = name
            field_type = string
            field_value = [{rule_type = NOT_NULL}]
          }]
        },
        {
          table_path = "test.xyz"
          row_rules = [
            {rule_type = MIN_ROW, rule_value = 2},
            {rule_type = MAX_ROW, rule_value = 2}
          ]
          field_rules = [{
            field_name = email
            field_type = string
            field_value = [{rule_type = NOT_NULL}]
          }]
        }
      ]
    }
  }
}
