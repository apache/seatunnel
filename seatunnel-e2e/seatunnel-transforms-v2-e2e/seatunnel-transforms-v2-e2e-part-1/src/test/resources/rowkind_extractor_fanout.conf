env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "source1"
    row.num = 1
    schema = {
      table = "test.events"
      fields {
        pk_id = bigint
        name = string
      }
      primaryKey {
        name = "pk_id"
        columnNames = [pk_id]
      }
    }
    rows = [
      {
        kind = DELETE
        fields = [1, "A"]
      }
    ]
  }
}

transform {
  RowKindExtractor {
    plugin_input = "source1"
    plugin_output = "extracted_a"
    custom_field_name = "original_kind"
    transform_type = FULL
  }

  TableRename {
    plugin_input = "extracted_a"
    plugin_output = "branch_a"
    prefix = "a_"
  }

  RowKindExtractor {
    plugin_input = "source1"
    plugin_output = "extracted_b"
    custom_field_name = "original_kind"
    transform_type = FULL
  }

  TableRename {
    plugin_input = "extracted_b"
    plugin_output = "branch_b"
    prefix = "b_"
  }
}

sink {
  Assert {
    plugin_input = "branch_a"
    rules = {
      tables_configs = [
        {
          table_path = "test.a_events"
          row_rules = [
            {
              rule_type = MAX_ROW
              rule_value = 1
            },
            {
              rule_type = MIN_ROW
              rule_value = 1
            }
          ]
          field_rules = [
            {
              field_name = original_kind
              field_type = string
              field_value = [
                {
                  rule_type = NOT_NULL
                  equals_to = "DELETE"
                }
              ]
            }
          ]
        }
      ]
    }
  }

  Assert {
    plugin_input = "branch_b"
    rules = {
      tables_configs = [
        {
          table_path = "test.b_events"
          row_rules = [
            {
              rule_type = MAX_ROW
              rule_value = 1
            },
            {
              rule_type = MIN_ROW
              rule_value = 1
            }
          ]
          field_rules = [
            {
              field_name = original_kind
              field_type = string
              field_value = [
                {
                  rule_type = NOT_NULL
                  equals_to = "DELETE"
                }
              ]
            }
          ]
        }
      ]
    }
  }
}
