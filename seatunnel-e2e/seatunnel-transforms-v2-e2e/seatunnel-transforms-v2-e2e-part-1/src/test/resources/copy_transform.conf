######
###### This config file is a demonstration of streaming processing in seatunnel config
######

env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100
    vector.dimension = 4
    vector.float.max = 1
    vector.float.min = 0
    binary.vector.dimension = 8
    schema = {
      fields {
        c_int = int
        c_string = string
        c_null = "null"
        c_map = "map<string, string>"
        c_array = "array<int>"
        c_boolean = boolean
        c_tinyint = tinyint
        c_smallint = smallint
        c_bigint = bigint
        c_float = float
        c_double = double
        c_bytes = bytes
        c_date = date
        c_decimal = "decimal(38, 18)"
        c_timestamp = timestamp
        c_time = time
        c_timestamp_tz = timestamp_tz
        c_map_nest = "map<string, {c_int = int, c_string = string}>"
        c_row = {
          c_null = "null"
          c_string = string
          c_boolean = boolean
          c_tinyint = tinyint
          c_smallint = smallint
          c_int = int
          c_bigint = bigint
          c_float = float
          c_double = double
          c_decimal = "decimal(38, 18)"
          c_date = date
          c_timestamp = timestamp
          c_time = time
          c_bytes = bytes
          c_array = "array<int>"
          c_map = "map<string, string>"
        }
        c_binary_vector = binary_vector
        c_float_vector = float_vector
        c_float16_vector = float16_vector
        c_bfloat16_vector = bfloat16_vector
        c_sparse_float_vector = sparse_float_vector
      }
    }
  }
}

transform {
  Copy {
    plugin_input = "fake"
    plugin_output = "fake1"
    src_field = "c_string"
    dest_field = "c_string_1"
  }
  Copy {
    plugin_input = "fake1"
    plugin_output = "fake2"
    fields {
      c_int_1 = "c_int"
      c_null_1 = "c_null"
      c_map_1 = "c_map"
      c_array_1 = "c_array"
      c_boolean_1 = "c_boolean"
      c_tinyint_1 = "c_tinyint"
      c_smallint_1 = "c_smallint"
      c_bigint_1 = "c_bigint"
      c_float_1 = "c_float"
      c_double_1 = "c_double"
      c_bytes_1 = "c_bytes"
      c_date_1 = "c_date"
      c_decimal_1 = "c_decimal"
      c_timestamp_1 = "c_timestamp"
      c_time_1 = "c_time"
      c_timestamp_tz_1 = "c_timestamp_tz"
      c_map_nest_1 = "c_map_nest"
      c_row_1 = "c_row"
      c_binary_vector_1 = "c_binary_vector"
      c_float_vector_1 = "c_float_vector"
      c_float16_vector_1 = "c_float16_vector"
      c_bfloat16_vector_1 = "c_bfloat16_vector"
      c_sparse_float_vector_1 = "c_sparse_float_vector"
    }
  }
}

