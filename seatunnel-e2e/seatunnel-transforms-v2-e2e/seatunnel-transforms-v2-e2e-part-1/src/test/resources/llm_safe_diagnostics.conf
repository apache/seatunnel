env {
  job.mode = "BATCH"
  parallelism = 1
  job.retry.times = 0
}

source {
  FakeSource {
    row.num = 1
    split.num = 1
    schema {
      fields {
        text = "string"
      }
    }
    rows = [{fields = ["diagnostic input"], kind = INSERT}]
    plugin_output = "fake"
  }
}

transform {
  LLM {
    plugin_input = "fake"
    plugin_output = "llm_output"
    model_provider = "${diagnostic_provider}"
    model = "test-model"
    api_key = "test-key"
    api_path = "${diagnostic_api_path}"
    prompt = "Classify the input"
    custom_config {
      custom_response_parse = "$.choices[*].message.content"
      custom_request_headers {
        Content-Type = "application/json"
        Authorization = "Bearer test-key"
      }
      custom_request_body {
        model = "${model}"
        messages = [
          {role = "system", content = "${prompt}"}
          {role = "user", content = "${input}"}
        ]
      }
    }
  }
}

sink {
  Assert {
    plugin_input = "llm_output"
    rules {
      field_rules = [
        {
          field_name = "llm_output"
          field_type = "string"
          field_value = [{rule_type = "NOT_NULL"}]
        }
      ]
    }
  }
}
