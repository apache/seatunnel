######
###### Split configured only through table_transform entries.
###### test.abc and test.xyz are split, test.www stays unchanged.
######

env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    tables_configs = [
      {
        row.num = 100
        // fixed value so that both split parts ('', '234') are deterministic
        rows = [
          {fields = [1, "name", 1234], kind = INSERT}
        ]
        schema = {
          table = "test.abc"
          columns = [
            {
              name = "id"
              type = "bigint"
            },
            {
              name = "name"
              type = "string"
            },
            {
              name = "age"
              type = "int"
            }
          ]
        }
      },
      {
        row.num = 100
        rows = [
          {fields = [2, "name", 1234], kind = INSERT}
        ]
        schema = {
          table = "test.xyz"
          columns = [
            {
              name = "id"
              type = "bigint"
            },
            {
              name = "name"
              type = "string"
            },
            {
              name = "age"
              type = "int"
            }
          ]
        }
      },
      {
        row.num = 100
        rows = [
          {fields = [3, "name", 1234], kind = INSERT}
        ]
        schema = {
          table = "test.www"
          columns = [
            {
              name = "id"
              type = "bigint"
            },
            {
              name = "name"
              type = "string"
            },
            {
              name = "age"
              type = "int"
            }
          ]
        }
      }
    ]
    plugin_output = "fake"
  }
}

transform {
  Split {
    plugin_input = "fake"
    plugin_output = "fake1"
    // No transform level rule: every table is handled by its own table_transform entry,
    // tables without an entry are passed through unchanged.
    table_transform = [{
      table_path = "test.abc"
      separator = "1"
      split_field = "age"
      output_fields = ["f1", "f2"]
    }, {
      table_path = "test.xyz"
      separator = "1"
      split_field = "age"
      output_fields = ["f1", "f2"]
    }]
  }
}

sink {
  Assert {
    rules =
      {
        tables_configs = [
          {
            table_path = "test.abc"
            field_rules = [{
              field_name = f1
              field_type = string
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            }]
          },
          {
            table_path = "test.xyz"
            field_rules = [{
              field_name = f2
              field_type = string
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            }]
          },
          {
            table_path = "test.www"
            catalog_table_rule {
              table_path = "test.www"
              column_rule = [
                {
                  name = "id"
                  type = "bigint"
                },
                {
                  name = "name"
                  type = "string"
                },
                {
                  name = "age"
                  type = "int"
                }
              ]
            }
          }
        ]
      }
  }
}
