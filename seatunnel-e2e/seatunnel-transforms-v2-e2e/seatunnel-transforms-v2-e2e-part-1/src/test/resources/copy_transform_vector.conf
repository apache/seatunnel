# Vector types are supported by Flink and Zeta; Spark keeps the base Copy scenario.
env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100
    vector.dimension = 4
    vector.float.max = 1
    vector.float.min = 0
    binary.vector.dimension = 8
    schema {
      fields {
        c_binary_vector = binary_vector
        c_float_vector = float_vector
        c_float16_vector = float16_vector
        c_bfloat16_vector = bfloat16_vector
        c_sparse_float_vector = sparse_float_vector
      }
    }
  }
}

transform {
  Copy {
    plugin_input = "fake"
    plugin_output = "copied"
    fields {
      c_binary_vector_1 = "c_binary_vector"
      c_float_vector_1 = "c_float_vector"
      c_float16_vector_1 = "c_float16_vector"
      c_bfloat16_vector_1 = "c_bfloat16_vector"
      c_sparse_float_vector_1 = "c_sparse_float_vector"
    }
  }
}

sink {
  Assert {
    plugin_input = "copied"
    rules {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 100
        }
      ]
      field_rules = [
        {
          field_name = c_binary_vector_1
          field_type = binary_vector
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
          },
          {
            field_name = c_float_vector_1
            field_type = float_vector
            field_value = [
              {
                rule_type = NOT_NULL
              }
            ]
          },
          {
            field_name = c_float16_vector_1
            field_type = float16_vector
            field_value = [
              {
                rule_type = NOT_NULL
              }
            ]
          },
          {
            field_name = c_bfloat16_vector_1
            field_type = bfloat16_vector
            field_value = [
              {
                rule_type = NOT_NULL
              }
            ]
          },
          {
            field_name = c_sparse_float_vector_1
            field_type = sparse_float_vector
            field_value = [
              {
                rule_type = NOT_NULL
              }
            ]
          }
      ]
    }
  }
}
