######
###### Filter configured only through table_transform entries.
###### test.xyz keeps only 'id', the other tables stay unchanged.
######

env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    tables_configs = [
      {
        row.num = 100
        schema = {
          table = "test.abc"
          columns = [
            {
              name = "id"
              type = "bigint"
            },
            {
              name = "name"
              type = "string"
            },
            {
              name = "age"
              type = "int"
            }
          ]
        }
      },
      {
        row.num = 100
        schema = {
          table = "test.xyz"
          columns = [
            {
              name = "id"
              type = "bigint"
            },
            {
              name = "name"
              type = "string"
            },
            {
              name = "age"
              type = "int"
            }
          ]
        }
      },
      {
        row.num = 100
        schema = {
          table = "test.www"
          columns = [
            {
              name = "id"
              type = "bigint"
            },
            {
              name = "name"
              type = "string"
            },
            {
              name = "age"
              type = "int"
            }
          ]
        }
      }
    ]
  }
}

transform {
  Filter {
    // No transform level rule: every table is handled by its own table_transform entry,
    // tables without an entry are passed through unchanged.
    table_transform = [{
      table_path = "test.xyz"
      include_fields = ["id"]
    }]
  }
}

sink {
  Assert {
    rules =
      {
        tables_configs = [
          {
            table_path = "test.abc"
            // unchanged table: 'age' has to survive the transform
            field_rules = [{
              field_name = age
              field_type = int
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            }]
          },
          {
            table_path = "test.xyz"
            // filtered table: only 'id' is kept
            field_rules = [{
              field_name = id
              field_type = bigint
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            }]
          },
          {
            table_path = "test.www"
            field_rules = [{
              field_name = age
              field_type = int
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            }]
          }
        ]
      }
  }
}
