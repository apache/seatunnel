# Exercises the separator-priority + greedy-merge + whole-piece overlap path end-to-end, with a
# non-BMP (surrogate-pair) payload, so the code paths the docs call fragile all cross the engine
# serialization boundary. Input is six "😀 " pieces (each 2 Unicode code points); with
# separators=[" "], chunk_size=4 and overlap_size=2 (code points) every chunk is "😀 😀 " (4 code
# points / 6 UTF-16 code units) and one whole "😀 " piece is carried forward as overlap, yielding
# exactly 5 chunks.

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        id = "int"
        content = "string"
      }
    }
    rows = [
      {fields = [1, "😀 😀 😀 😀 😀 😀 "], kind = INSERT}
    ]
  }
}

transform {
  TextChunk {
    plugin_input = "fake"
    plugin_output = "fake1"
    text_field = "content"
    output_field = "chunk"
    chunk_index_field = "chunk_index"
    chunk_size = 4
    overlap_size = 2
    separators = [" "]
  }
}

sink {
  Assert {
    plugin_input = "fake1"
    rules = {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 5
        },
        {
          rule_type = MAX_ROW
          rule_value = 5
        }
      ]
      field_rules = [
        {
          field_name = "id"
          field_type = "int"
          field_value = [
            {equals_to = 1}
          ]
        },
        {
          field_name = "content"
          field_type = "string"
          field_value = [
            {equals_to = "😀 😀 😀 😀 😀 😀 "}
          ]
        },
        {
          field_name = "chunk"
          field_type = "string"
          field_value = [
            {equals_to = "😀 😀 "}
          ]
        },
        {
          field_name = "chunk_index"
          field_type = "int"
          field_value = [
            {rule_type = MIN, rule_value = 0},
            {rule_type = MAX, rule_value = 4}
          ]
        }
      ]
    }
  }
}
