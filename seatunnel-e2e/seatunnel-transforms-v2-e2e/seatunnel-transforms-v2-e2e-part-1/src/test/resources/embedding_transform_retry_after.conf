env {
  parallelism = 1
  job.mode = "BATCH"
  job.retry.times = 0
}

source {
  FakeSource {
    row.num = 1
    split.num = 1
    schema {
      fields {
        text = string
      }
    }
    rows = [{fields = ["retry-after-e2e"], kind = INSERT}]
    plugin_output = "input"
  }
}

transform {
  Embedding {
    plugin_input = "input"
    plugin_output = "embedded"
    model_provider = ${retry_provider}
    model = "embedding-3"
    api_key = "test-key"
    secret_key = "test-secret"
    api_path = ${retry_api_path}
    oauth_path = "http://mockserver:1080/retry-after/oauth"
    dimension = 2
    model_retry_max_attempts = 2
    model_retry_backoff_ms = 100
    model_retry_max_backoff_ms = ${retry_max_backoff}
    vectorization_fields {
      vector = text
    }
    custom_config {
      custom_response_parse = "$.data[*].embedding"
      custom_request_headers {
        Content-Type = "application/json"
      }
      custom_request_body {
        model = "${model}"
        input = ["${input}"]
      }
    }
  }
}

sink {
  Assert {
    plugin_input = "embedded"
    rules {
      row_rules = [
        {rule_type = MIN_ROW, rule_value = 1},
        {rule_type = MAX_ROW, rule_value = 1}
      ]
      field_rules = [{
        field_name = vector
        field_type = float_vector
        field_value = [{rule_type = NOT_NULL}]
      }]
    }
  }
}
