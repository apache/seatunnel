######
###### This config file tests Pivot transform with multiple group by keys
######

env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 6
    schema = {
      fields {
        store_id = "int"
        date = "string"
        metric = "string"
        value = "int"
      }
    }
    rows = [
      { fields = [1, "2024-01-01", "sales", 1000], kind = INSERT }
      { fields = [1, "2024-01-01", "returns", 50], kind = INSERT }
      { fields = [1, "2024-01-02", "sales", 1200], kind = INSERT }
      { fields = [2, "2024-01-01", "sales", 800], kind = INSERT }
      { fields = [2, "2024-01-01", "profit", 200], kind = INSERT }
      { fields = [2, "2024-01-02", "sales", 900], kind = INSERT }
    ]
  }
}

transform {
  Pivot {
    plugin_input = "fake"
    plugin_output = "pivoted"
    group_by_keys = ["store_id", "date"]
    pivot_column = "metric"
    value_column = "value"
    pivot_values = ["sales", "returns", "profit"]
  }
}

sink {
  Assert {
    plugin_input = "pivoted"
    rules = {
      # Should output 4 rows (unique combinations of store_id and date)
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 4
        },
        {
          rule_type = MAX_ROW
          rule_value = 4
        }
      ]
      # Verify output schema has 5 columns: store_id, date, sales, returns, profit
      field_rules = [
        {
          field_name = store_id
          field_type = int
        },
        {
          field_name = date
          field_type = string
        },
        {
          field_name = sales
          field_type = int
        },
        {
          field_name = returns
          field_type = int
        },
        {
          field_name = profit
          field_type = int
        }
      ]
    }
  }
}
