######
###### DefineSinkType configured only through table_transform entries.
###### test.abc and test.xyz declare their own sink type, test.www stays unchanged.
######

env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    tables_configs = [
      {
        schema = {
          table = "test.abc"
          columns = [
            {name = "id", type = "bigint"},
            {name = "name", type = "string"}
          ]
        }
        rows = [
          {fields = [1, "Jia Fan"], kind = INSERT}
        ]
      },
      {
        schema = {
          table = "test.xyz"
          columns = [
            {name = "id", type = "bigint"},
            {name = "name", type = "string"}
          ]
        }
        rows = [
          {fields = [2, "Hailin Wang"], kind = INSERT}
        ]
      },
      {
        schema = {
          table = "test.www"
          columns = [
            {name = "id", type = "bigint"},
            {name = "name", type = "string"}
          ]
        }
        rows = [
          {fields = [3, "Tomas"], kind = INSERT}
        ]
      }
    ]
  }
}

transform {
  DefineSinkType {
    // No transform level rule: every table is handled by its own table_transform entry.
    table_transform = [{
      table_path = "test.abc"
      columns = [
        {
          column = "name"
          type = "nvarchar2(10)"
        }
      ]
    }, {
      table_path = "test.xyz"
      columns = [
        {
          column = "name"
          type = "varchar(64)"
        }
      ]
    }]
  }
}

sink {
  Assert {
    rules = {
      tables_configs = [
        {
          table_path = "test.abc"
          catalog_table_rule {
            table_path = "test.abc"
            column_rule = [
              {
                name = "id"
                type = "bigint"
              },
              {
                name = "name"
                type = "string"
                sink_type = "nvarchar2(10)"
              }
            ]
          }
        },
        {
          table_path = "test.xyz"
          catalog_table_rule {
            table_path = "test.xyz"
            column_rule = [
              {
                name = "id"
                type = "bigint"
              },
              {
                name = "name"
                type = "string"
                sink_type = "varchar(64)"
              }
            ]
          }
        },
        {
          table_path = "test.www"
          catalog_table_rule {
            table_path = "test.www"
            column_rule = [
              {
                name = "id"
                type = "bigint"
              },
              {
                name = "name"
                type = "string"
              }
            ]
          }
        }
      ]
    }
  }
}
