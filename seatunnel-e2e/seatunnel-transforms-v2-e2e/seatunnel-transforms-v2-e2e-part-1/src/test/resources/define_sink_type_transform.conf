######
###### DefineSinkType configured with a transform level rule only.
###### The declared sink type is verified through the Assert sink.
######

env {
  job.mode = "BATCH"
  // FakeSource emits the configured 'rows' from every parallelism degree, and the Flink test
  // containers default to parallelism 4. Pin it to 1 so exactly one row reaches the Assert sink.
  parallelism = 1
}

source {
  FakeSource {
    schema = {
      table = "test.abc"
      columns = [
        {name = "id", type = "bigint"},
        {name = "name", type = "string"}
      ]
    }
    rows = [
      {fields = [1, "Jia Fan"], kind = INSERT}
    ]
  }
}

transform {
  DefineSinkType {
    columns = [
      {
        column = "name"
        type = "nvarchar2(10)"
      }
    ]
  }
}

sink {
  Assert {
    rules = {
      tables_configs = [
        {
          table_path = "test.abc"
          catalog_table_rule {
            table_path = "test.abc"
            column_rule = [
              {
                name = "id"
                type = "bigint"
              },
              {
                name = "name"
                type = "string"
                sink_type = "nvarchar2(10)"
              }
            ]
          }
          row_rules = [
            {rule_type = MIN_ROW, rule_value = 1},
            {rule_type = MAX_ROW, rule_value = 1}
          ]
        }
      ]
    }
  }
}
