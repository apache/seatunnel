env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        id = "int"
        name = "string"
        payload = "bytes"
      }
    }
    rows = [
      {fields = [1, "Joy Ding", "Sm95IERpbmc="], kind = INSERT}
    ]
  }
}

transform {
  Calcite {
    plugin_input = "fake"
    plugin_output = "fake1"
    sql = """SELECT DECODE(payload, 'UTF-8') AS name1,
      DECODE(ENCODE(name, 'UTF-16BE'), 'UTF-16BE') AS name2,
      ENCODE(name, 'US-ASCII') AS b1,
      ENCODE(name, 'ISO-8859-1') AS b2,
      ENCODE(name, 'UTF-8') AS b3,
      ENCODE(name, 'UTF-16BE') AS b4,
      ENCODE(name, 'UTF-16LE') AS b5,
      ENCODE(name, 'UTF-16') AS b6,
      ENCODE(name, 'utf-16be') AS b7,
      ENCODE(name, CAST(NULL AS VARCHAR)) AS b8,
      DECODE(payload, CAST(NULL AS VARCHAR)) AS b9,
      DECODE(ENCODE(name, 'UTF-16'), 'UTF-16') AS b10
    FROM fake"""
  }
}

sink {
  Assert {
    plugin_input = "fake1"
    rules = {
      field_rules = [
        {
          field_name = "name1"
          field_type = "string"
          field_value = [
            {equals_to = "Joy Ding"}
          ]
        },
        {
          field_name = "name2"
          field_type = "string"
          field_value = [
            {equals_to = "Joy Ding"}
          ]
        },
        {
          field_name = "b1"
          field_type = "bytes"
          field_value = [
            {equals_to = "Sm95IERpbmc="}
          ]
        },
        {
          field_name = "b2"
          field_type = "bytes"
          field_value = [
            {equals_to = "Sm95IERpbmc="}
          ]
        },
        {
          field_name = "b3"
          field_type = "bytes"
          field_value = [
            {equals_to = "Sm95IERpbmc="}
          ]
        },
        {
          field_name = "b4"
          field_type = "bytes"
          field_value = [
            {equals_to = "AEoAbwB5ACAARABpAG4AZw=="}
          ]
        },
        {
          field_name = "b5"
          field_type = "bytes"
          field_value = [
            {equals_to = "SgBvAHkAIABEAGkAbgBnAA=="}
          ]
        },
        {
          field_name = "b6"
          field_type = "bytes"
          field_value = [
            {equals_to = "/v8ASgBvAHkAIABEAGkAbgBn"}
          ]
        },
        {
          field_name = "b7"
          field_type = "bytes"
          field_value = [
            {equals_to = "AEoAbwB5ACAARABpAG4AZw=="}
          ]
        },
        {
          field_name = "b8"
          field_type = "null"
          field_value = [{equals_to = null}]
        },
        {
          field_name = "b9"
          field_type = "null"
          field_value = [{equals_to = null}]
        },
        {
          field_name = "b10"
          field_type = "string"
          field_value = [
            {equals_to = "Joy Ding"}
          ]
        }
      ]
    }
  }
}
