######
###### This config file is a demonstration of streaming processing in seatunnel config
######

env {
  parallelism = 1
  job.mode = "BATCH"
  checkpoint.interval = 10000
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        id = "int"
        name = "string"
        payload = "bytes"
      }
    }
    rows = [
      {fields = [1, "Joy Ding", "Sm95IERpbmc="], kind = INSERT}
    ]
  }
}

transform {
  sql {
    plugin_input = "fake"
    plugin_output = "fake1"
    query = "select decode(payload, 'UTF-8') as name1, decode(encode(name, 'UTF-16BE'), 'UTF-16BE') as name2, encode(name, 'US-ASCII') as b1, encode(name, 'ISO-8859-1') as b2, encode(name, 'UTF-8') as b3, encode(name, 'UTF-16BE') as b4, encode(name, 'UTF-16LE') as b5, encode(name, 'UTF-16') as b6, encode(name, 'utf-16be') as b7, encode(name, NULL) as b8, decode(payload, NULL) as b9, decode(encode(name, 'UTF-16'), 'UTF-16') as b10 from dual"
  }
}

sink {
  Assert {
    plugin_input = "fake1"
    rules = {
      field_rules = [
        {
          field_name = "name1"
          field_type = "string"
          field_value = [
            {equals_to = "Joy Ding"}
          ]
        },
        {
          field_name = "name2"
          field_type = "string"
          field_value = [
            {equals_to = "Joy Ding"}
          ]
        },
        {
          field_name = "b1"
          field_type = "bytes"
          field_value = [
            {equals_to = "Sm95IERpbmc="}
          ]
        },
        {
          field_name = "b2"
          field_type = "bytes"
          field_value = [
            {equals_to = "Sm95IERpbmc="}
          ]
        },
        {
          field_name = "b3"
          field_type = "bytes"
          field_value = [
            {equals_to = "Sm95IERpbmc="}
          ]
        },
        {
          field_name = "b4"
          field_type = "bytes"
          field_value = [
            {equals_to = "AEoAbwB5ACAARABpAG4AZw=="}
          ]
        },
        {
          field_name = "b5"
          field_type = "bytes"
          field_value = [
            {equals_to = "SgBvAHkAIABEAGkAbgBnAA=="}
          ]
        },
        {
          field_name = "b6"
          field_type = "bytes"
          field_value = [
            {equals_to = "/v8ASgBvAHkAIABEAGkAbgBn"}
          ]
        },
        {
          field_name = "b7"
          field_type = "bytes"
          field_value = [
            {equals_to = "AEoAbwB5ACAARABpAG4AZw=="}
          ]
        },
        {
          field_name = "b8"
          field_type = "null"
          field_value = [{equals_to = null}]
        },
        {
          field_name = "b9"
          field_type = "null"
          field_value = [{equals_to = null}]
        },
        {
          field_name = "b10"
          field_type = "string"
          field_value = [
            {equals_to = "Joy Ding"}
          ]
        }
      ]
    }
  }
}
