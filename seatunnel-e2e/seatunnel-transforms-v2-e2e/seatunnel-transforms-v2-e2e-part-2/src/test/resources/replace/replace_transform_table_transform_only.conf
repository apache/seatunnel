######
###### Replace configured only through table_transform entries.
###### test.abc, test.xyz and test.www are replaced by their own entry.
######

env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    tables_configs = [
      {
        row.num = 100
        schema = {
          table = "test.abc"
          columns = [
            {
              name = "id"
              type = "bigint"
            },
            {
              name = "name"
              type = "string"
            },
            {
              name = "age"
              type = "int"
            }
          ]
        }
      },
      {
        row.num = 100
        schema = {
          table = "test.xyz"
          columns = [
            {
              name = "id"
              type = "bigint"
            },
            {
              name = "name"
              type = "string"
            },
            {
              name = "age"
              type = "int"
            }
          ]
        }
      },
      {
        row.num = 100
        schema = {
          table = "test.www"
          columns = [
            {
              name = "id"
              type = "bigint"
            },
            {
              name = "name"
              type = "string"
            },
            {
              name = "age"
              type = "int"
            }
          ]
        }
      }
    ]
  }
}

transform {
  Replace {
    // No transform level rule: every table is handled by its own table_transform entry.
    table_transform = [{
      table_path = "test.abc"
      replace_fields = ["name"]
      pattern = ".+"
      replacement = "b"
      is_regex = true
      replace_first = true
    }, {
      table_path = "test.xyz"
      replace_fields = ["name"]
      pattern = ".+"
      replacement = "b"
      is_regex = true
      replace_first = true
    }, {
      table_path = "test.www"
      replace_fields = ["name"]
      pattern = ".+"
      replacement = "b"
      is_regex = true
      replace_first = true
    }]
  }
}

sink {
  Assert {
    rules =
      {
        tables_configs = [
          {
            table_path = "test.abc"
            field_rules = [{
              field_name = name
              field_type = string
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            }]
          },
          {
            table_path = "test.xyz"
            field_rules = [{
              field_name = name
              field_type = string
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            }]
          },
          {
            table_path = "test.www"
            field_rules = [{
              field_name = name
              field_type = string
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            }]
          }
        ]
      }
  }
}
