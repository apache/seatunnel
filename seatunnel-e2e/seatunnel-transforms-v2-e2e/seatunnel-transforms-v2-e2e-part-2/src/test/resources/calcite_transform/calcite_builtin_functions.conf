env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100
    schema = {
      fields {
        id = "int"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
  Calcite {
    plugin_input = "fake"
    plugin_output = "calcite_out"
    # Big-endian float encodings: Float.MAX_VALUE, -Float.MAX_VALUE and Float.MIN_VALUE.
    sql = """SELECT id, UPPER(name) AS name_upper, ABS(age) AS abs_age, COALESCE(name, 'unknown') AS safe_name,
      VECTOR_NORM(X'7F7FFFFF') > 3.0e38 AND VECTOR_NORM(X'7F7FFFFF') < 4.0e38 AS large_norm,
      INNER_PRODUCT(X'7F7FFFFF', X'7F7FFFFF') > 1.0e77 AND INNER_PRODUCT(X'7F7FFFFF', X'7F7FFFFF') < 2.0e77 AS large_product,
      COSINE_DISTANCE(X'7F7FFFFF', X'FF7FFFFF') > 1.999 AND COSINE_DISTANCE(X'7F7FFFFF', X'FF7FFFFF') < 2.001 AS large_cosine,
      L1_DISTANCE(X'7F7FFFFF', X'FF7FFFFF') > 6.0e38 AND L1_DISTANCE(X'7F7FFFFF', X'FF7FFFFF') < 7.0e38 AS large_l1,
      L2_DISTANCE(X'7F7FFFFF', X'FF7FFFFF') > 6.0e38 AND L2_DISTANCE(X'7F7FFFFF', X'FF7FFFFF') < 7.0e38 AS large_l2,
      VECTOR_NORM(X'00000001') > 1.0e-45 AND VECTOR_NORM(X'00000001') < 2.0e-45 AS tiny_norm,
      INNER_PRODUCT(X'00000001', X'00000001') > 1.0e-90 AND INNER_PRODUCT(X'00000001', X'00000001') < 3.0e-90 AS tiny_product,
      COSINE_DISTANCE(X'00000001', X'00000001') > -0.001 AND COSINE_DISTANCE(X'00000001', X'00000001') < 0.001 AS tiny_cosine,
      VECTOR_NORM(VECTOR_NORMALIZE(X'7F7FFFFF')) = 1.0 AS large_normalized,
      VECTOR_NORM(VECTOR_NORMALIZE(X'00000001')) = 1.0 AS tiny_normalized
    FROM fake"""
  }
}

sink {
  Assert {
    plugin_input = "calcite_out"
    rules = {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 100
        }
      ]
      field_rules = [
        {field_name = "large_norm", field_type = "boolean", field_value = [{equals_to = true}]},
        {field_name = "large_product", field_type = "boolean", field_value = [{equals_to = true}]},
        {field_name = "large_cosine", field_type = "boolean", field_value = [{equals_to = true}]},
        {field_name = "large_l1", field_type = "boolean", field_value = [{equals_to = true}]},
        {field_name = "large_l2", field_type = "boolean", field_value = [{equals_to = true}]},
        {field_name = "tiny_norm", field_type = "boolean", field_value = [{equals_to = true}]},
        {field_name = "tiny_product", field_type = "boolean", field_value = [{equals_to = true}]},
        {field_name = "tiny_cosine", field_type = "boolean", field_value = [{equals_to = true}]},
        {field_name = "large_normalized", field_type = "boolean", field_value = [{equals_to = true}]},
        {field_name = "tiny_normalized", field_type = "boolean", field_value = [{equals_to = true}]},
        {
          field_name = name_upper
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = abs_age
          field_type = int
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
    }
  }
}
