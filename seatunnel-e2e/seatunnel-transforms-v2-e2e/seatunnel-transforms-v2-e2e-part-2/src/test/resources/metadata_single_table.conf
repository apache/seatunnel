######
###### Metadata configured with a transform level rule only.
######

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    row.num = 5
    schema = {
      table = "test.abc"
      columns = [
        {
          name = "id"
          type = "bigint"
        },
        {
          name = "name"
          type = "string"
        }
      ]
    }
    rows = [
      {fields = [1, "Jia Fan"], kind = INSERT}
      {fields = [2, "Hailin Wang"], kind = INSERT}
    ]
  }
}

transform {
  Metadata {
    metadata_fields {
      RowKind = rowKind
    }
  }
}

sink {
  Assert {
    rules =
      {
        tables_configs = [
          {
            table_path = "test.abc"
            row_rules = [
              {
                rule_type = MIN_ROW
                rule_value = 2
              },
              {
                rule_type = MAX_ROW
                rule_value = 2
              }
            ]
            field_rules = [{
              field_name = rowKind
              field_type = string
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            }]
          }
        ]
      }
  }
}
