env {
  parallelism = 1
  job.mode = "BATCH"
  spark.driver.extraJavaOptions = "-Dseatunnel.transform.python.enabled=true -Dseatunnel.transform.python.allowed-executables=/usr/bin/python3,/usr/local/bin/python3,/opt/bitnami/python/bin/python3,/usr/bin/python,/usr/local/bin/python"
  spark.executor.extraJavaOptions = "-Dseatunnel.transform.python.enabled=true -Dseatunnel.transform.python.allowed-executables=/usr/bin/python3,/usr/local/bin/python3,/opt/bitnami/python/bin/python3,/usr/bin/python,/usr/local/bin/python"
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        id = int
        name = string
        age = int
      }
    }
    rows = [
      {
        kind = INSERT
        fields = [1, " Alice ", 20]
      },
      {
        kind = INSERT
        fields = [2, "Bob", 30]
      }
    ]
  }
}

transform {
  Python {
    plugin_input = "fake"
    plugin_output = "py"
    columns = [
      {
        dest_field = normalized_name
        dest_type = string
      },
      {
        dest_field = age_plus_one
        dest_type = int
      }
    ]
    source_code = """
def process(row, context):
    return {
        "normalized_name": row["name"].strip().lower(),
        "age_plus_one": row["age"] + 1,
    }
"""
  }
}

sink {
  Assert {
    plugin_input = "py"
    rules {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 2
        },
        {
          rule_type = MAX_ROW
          rule_value = 2
        }
      ],
      field_rules = [
        {
          field_name = normalized_name
          field_type = string
          field_value = [
            {
              rule_type = MIN_LENGTH
              rule_value = 3
            },
            {
              rule_type = MAX_LENGTH
              rule_value = 5
            }
          ]
        },
        {
          field_name = age_plus_one
          field_type = int
          field_value = [
            {
              rule_type = MIN
              rule_value = 21
            },
            {
              rule_type = MAX
              rule_value = 31
            }
          ]
        }
      ]
    }
  }
}
