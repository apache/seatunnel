######
###### Python configured only through table_transform entries.
######

env {
  parallelism = 1
  job.mode = "BATCH"
  spark.driver.extraJavaOptions = "-Dseatunnel.transform.python.enabled=true -Dseatunnel.transform.python.allowed-executables=/usr/bin/python3,/usr/local/bin/python3,/opt/bitnami/python/bin/python3,/usr/bin/python,/usr/local/bin/python"
  spark.executor.extraJavaOptions = "-Dseatunnel.transform.python.enabled=true -Dseatunnel.transform.python.allowed-executables=/usr/bin/python3,/usr/local/bin/python3,/opt/bitnami/python/bin/python3,/usr/bin/python,/usr/local/bin/python"
}

source {
  FakeSource {
    tables_configs = [
      {
        schema = {
          table = "test.abc"
          columns = [
            {name = "id", type = "int"},
            {name = "name", type = "string"},
            {name = "age", type = "int"}
          ]
        }
        rows = [
          {kind = INSERT, fields = [1, " Alice ", 20]},
          {kind = INSERT, fields = [2, "Bob", 30]}
        ]
      },
      {
        schema = {
          table = "test.xyz"
          columns = [
            {name = "id", type = "int"},
            {name = "name", type = "string"},
            {name = "age", type = "int"}
          ]
        }
        rows = [
          {kind = INSERT, fields = [1, " Alice ", 20]},
          {kind = INSERT, fields = [2, "Bob", 30]}
        ]
      }
    ]
  }
}

transform {
  Python {
    plugin_output = "py"
    // No transform level rule: every table is handled by its own table_transform entry.
    table_transform = [
      {
        table_path = "test.abc"
        columns = [
          {
            dest_field = normalized_name
            dest_type = string
          }
        ]
        source_code = """
def process(row, context):
    return {
        "normalized_name": row["name"].strip().lower(),
    }
"""
      },
      {
        table_path = "test.xyz"
        columns = [
          {
            dest_field = age_plus_one
            dest_type = int
          }
        ]
        source_code = """
def process(row, context):
    return {
        "age_plus_one": row["age"] + 1,
    }
"""
      }
    ]
  }
}

sink {
  Assert {
    plugin_input = "py"
    rules = {
      tables_configs = [
        {
          table_path = "test.abc"
          row_rules = [
            {rule_type = MIN_ROW, rule_value = 2},
            {rule_type = MAX_ROW, rule_value = 2}
          ]
          field_rules = [
            {
              field_name = normalized_name
              field_type = string
              field_value = [{rule_type = NOT_NULL}]
            }
          ]
        },
        {
          table_path = "test.xyz"
          row_rules = [
            {rule_type = MIN_ROW, rule_value = 2},
            {rule_type = MAX_ROW, rule_value = 2}
          ]
          field_rules = [
            {
              field_name = age_plus_one
              field_type = int
              field_value = [
                {rule_type = MIN, rule_value = 21},
                {rule_type = MAX, rule_value = 31}
              ]
            }
          ]
        }
      ]
    }
  }
}
