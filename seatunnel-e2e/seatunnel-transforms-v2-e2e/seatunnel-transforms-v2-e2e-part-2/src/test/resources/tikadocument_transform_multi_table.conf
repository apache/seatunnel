######
###### This config file is a demonstration of TikaDocument transform multi-table processing in seatunnel config
######

env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "documents_table1"
    result_table_name = "documents.table1"
    row.num = 5
    schema = {
      fields {
        id = "int"
        filename = "string"
        document_data = "string"
      }
    }
    rows = [
      {
        kind = INSERT
        fields = [1, "doc1.txt", "First table document content for multi-table testing."]
      },
      {
        kind = INSERT
        fields = [2, "doc2.txt", "Second table document with different text content."]
      }
    ]
  }
  
  FakeSource {
    plugin_output = "documents_table2"
    result_table_name = "documents.table2"
    row.num = 3
    schema = {
      fields {
        id = "int"
        name = "string"
        file_content = "string"
      }
    }
    rows = [
      {
        kind = INSERT
        fields = [1, "file1.txt", "Table2 document content with different schema."]
      },
      {
        kind = INSERT
        fields = [2, "file2.txt", "Another document in table2 for multi-table validation."]
      }
    ]
  }
}

transform {
  TikaDocument {
    plugin_input = ["documents_table1", "documents_table2"]
    plugin_output = "processed_documents"
    multi_tables = true
    table_match_regex = "documents\\..*"
    source_field = "document_data"
    output_fields = {
      content = "extracted_text"
      content_type = "mime_type"
    }
    parse_options = {
      extract_text = true
      extract_metadata = true
      max_string_length = 5000
    }
    content_processing = {
      remove_empty_lines = true
      trim_whitespace = true
      min_content_length = 5
    }
    error_handling = {
      on_parse_error = "skip"
      log_errors = true
    }
  }
  
  TikaDocument {
    plugin_input = "documents_table2"
    plugin_output = "processed_table2"
    source_field = "file_content"
    output_fields = {
      content = "text_content"
      content_type = "document_type"
    }
    parse_options = {
      extract_text = true
      extract_metadata = false
    }
    content_processing = {
      trim_whitespace = true
    }
    error_handling = {
      on_parse_error = "skip"
    }
  }
}

sink {
  Assert {
    plugin_input = "processed_documents"
    rules = {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 1
        }
      ],
      field_rules = [
        {
          field_name = extracted_text
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
    }
  }
  
  Assert {
    plugin_input = "processed_table2"
    rules = {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 2
        }
      ],
      field_rules = [
        {
          field_name = text_content
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
    }
  }
}
