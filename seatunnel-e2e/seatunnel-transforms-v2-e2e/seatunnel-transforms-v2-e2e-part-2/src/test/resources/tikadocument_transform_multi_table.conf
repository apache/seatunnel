######
###### This config file is a demonstration of TikaDocument transform multi-table processing in seatunnel config
######

env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "source_tables"
    
    tables_configs = [
      {
        row.num = 5
        schema = {
          table = "documents.table1"
          columns = [
            {
              name = "id"
              type = "int"
            },
            {
              name = "filename"
              type = "string"
            },
            {
              name = "document_data"
              type = "string"
            }
          ]
        }
        rows = [
          {
            kind = INSERT
            fields = [1, "doc1.txt", "First table document content for multi-table testing."]
          },
          {
            kind = INSERT
            fields = [2, "doc2.txt", "Second table document with different text content."]
          }
        ]
      },
      {
        row.num = 3
        schema = {
          table = "documents.table2"
          columns = [
            {
              name = "id"
              type = "int"
            },
            {
              name = "filename"
              type = "string"
            },
            {
              name = "document_data"
              type = "string"
            }
          ]
        }
        rows = [
          {
            kind = INSERT
            fields = [1, "file1.txt", "Table2 document content with different schema."]
          },
          {
            kind = INSERT
            fields = [2, "file2.txt", "Another document in table2 for multi-table validation."]
          }
        ]
      }
    ]
  }
}

transform {
  TikaDocument {
    plugin_input = "source_tables"
    plugin_output = "processed_documents"
    multi_tables = true
    table_match_regex = "documents\\..*"
    source_field = "document_data"
    output_fields = {
      content = "extracted_text"
      content_type = "mime_type"
    }
    parse_options = {
      extract_text = true
      extract_metadata = true
      max_string_length = 5000
    }
    content_processing = {
      remove_empty_lines = true
      trim_whitespace = true
      min_content_length = 5
    }
           error_handling = {
             on_parse_error = "null"
             log_errors = true
           }
  }
}

sink {
  Assert {
    plugin_input = "processed_documents"
    
    rules = {
      tables_configs = [
        {
          table_path = "documents.table1"
          row_rules = [
            {
              rule_type = MIN_ROW
              rule_value = 2
            }
          ],
          field_rules = [
            {
              field_name = extracted_text
              field_type = string
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            },
            {
              field_name = mime_type
              field_type = string
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            }
          ]
        },
        {
          table_path = "documents.table2"
          row_rules = [
            {
              rule_type = MIN_ROW
              rule_value = 2
            }
          ],
          field_rules = [
            {
              field_name = extracted_text
              field_type = string
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            },
            {
              field_name = mime_type
              field_type = string
              field_value = [
                {
                  rule_type = NOT_NULL
                }
              ]
            }
          ]
        }
      ]
    }
  }
}
