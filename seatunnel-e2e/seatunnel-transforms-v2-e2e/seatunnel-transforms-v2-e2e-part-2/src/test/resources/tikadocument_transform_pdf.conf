######
###### This config file is a demonstration of TikaDocument transform processing PDF files in seatunnel config
######

env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 5
    schema = {
      fields {
        id = "int"
        filename = "string"
        document_data = "bytes"
      }
    }
    rows = [
      {
        kind = INSERT
        # A minimal PDF file in Base64 format containing "Hello World PDF Test"
        # This is a valid PDF 1.4 document
        fields = [1, "test1.pdf", ""]
      },
      {
        kind = INSERT
        # Another minimal PDF with different text: "SeaTunnel Document Processing"
        fields = [2, "test2.pdf", ""]
      },
      {
        kind = INSERT
        # Third PDF document: "Apache Tika Transform Test"
        fields = [3, "test3.pdf", ""]
      }
    ]
  }
}

transform {
  TikaDocument {
    plugin_input = "fake"
    plugin_output = "tikadoc_pdf_result"
    source_field = "document_data"
    output_fields = {
      content = "extracted_text"
      content_type = "mime_type"
      title = "doc_title"
      page_count = "pages"
    }
    parse_options = {
      extract_text = true
      extract_metadata = true
      max_string_length = 10000
    }
    content_processing = {
      remove_empty_lines = true
      trim_whitespace = true
      normalize_whitespace = true
      min_content_length = 5
    }
    error_handling = {
      on_parse_error = "fail"
      on_unsupported_format = "fail"
      log_errors = true
    }
    timeout_ms = 60000
  }
}

sink {
  Assert {
    plugin_input = "tikadoc_pdf_result"
    rules = {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 3
        }
      ],
      field_rules = [
        {
          field_name = id
          field_type = int
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = filename
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = extracted_text
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            },
            {
              rule_type = MIN_LENGTH
              rule_value = 5
            }
          ]
        },
        {
          field_name = mime_type
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
    }
  }
}

