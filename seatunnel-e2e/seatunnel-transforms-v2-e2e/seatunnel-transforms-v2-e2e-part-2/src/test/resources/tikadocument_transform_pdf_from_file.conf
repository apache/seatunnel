######
###### This config file demonstrates TikaDocument transform processing PDF files from LocalFile source
######

env {
  job.mode = "BATCH"
}

source {
  LocalFile {
    path = "/seatunnel/read/pdf/"
    file_format_type = "binary"
    binary_complete_file_mode = true
    plugin_output = "pdf_source"
  }
}

transform {
  TikaDocument {
    plugin_input = "pdf_source"
    plugin_output = "tikadoc_pdf_file_result"
    source_field = "data"
    output_fields = {
      content = "extracted_text"
      content_type = "mime_type"
      title = "doc_title"
      author = "doc_author"
      page_count = "pages"
    }
    parse_options = {
      extract_text = true
      extract_metadata = true
      max_string_length = 50000
    }
    content_processing = {
      remove_empty_lines = true
      trim_whitespace = true
      normalize_whitespace = true
      min_content_length = 10
    }
    error_handling = {
      on_parse_error = "skip"
      on_unsupported_format = "skip"
      log_errors = true
    }
    timeout_ms = 120000
  }
}

sink {
  Assert {
    plugin_input = "tikadoc_pdf_file_result"
    rules = {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 1
        }
      ],
      field_rules = [
        {
          field_name = extracted_text
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            },
            {
              rule_type = MIN_LENGTH
              rule_value = 10
            }
          ]
        },
        {
          field_name = mime_type
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = relativePath
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
    }
  }
}

