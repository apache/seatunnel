######
###### This config file is a demonstration of TikaDocument transform processing in seatunnel config
######

env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 10
    string.fake.mode = "TEMPLATE"
    string.template = ["This is a test document for TikaDocument transform testing."]
    schema = {
      fields {
        id = "int"
        filename = "string"
        document_data = "string"
      }
    }
    rows = [
      {
        kind = INSERT
        fields = [1, "test1.txt", "This is a simple text document for testing TikaDocument transform functionality."]
      },
      {
        kind = INSERT  
        fields = [2, "test2.txt", "Another test document with different content to verify the transform works correctly."]
      },
      {
        kind = INSERT
        fields = [3, "test3.txt", "Third test document containing sample text for document processing validation."]
      }
    ]
  }
}

transform {
  TikaDocument {
    plugin_input = "fake"
    plugin_output = "tikadoc_result"
    source_field = "document_data"
    output_fields = {
      content = "extracted_text"
      content_type = "mime_type"
      title = "doc_title"
    }
    parse_options = {
      extract_text = true
      extract_metadata = true
      max_string_length = 10000
    }
    content_processing = {
      remove_empty_lines = true
      trim_whitespace = true
      normalize_whitespace = true
      min_content_length = 5
    }
    error_handling = {
      on_parse_error = "skip"
      on_unsupported_format = "skip"
      log_errors = true
    }
  }
}

sink {
  Assert {
    plugin_input = "tikadoc_result"
    rules = {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 3
        }
      ],
      field_rules = [
        {
          field_name = id
          field_type = int
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = filename
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = document_data
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = extracted_text
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        },
        {
          field_name = mime_type
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
    }
  }
}
