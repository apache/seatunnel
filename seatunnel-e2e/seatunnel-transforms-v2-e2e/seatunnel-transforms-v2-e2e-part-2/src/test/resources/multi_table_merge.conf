env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "source1"
    tables_configs = [
      {
        row.num = 2
        schema = {
          table = "source.user_1"
          columns = [
            { name = "id", type = "bigint" },
            { name = "name", type = "string" }
          ]
        }
      },
      {
        row.num = 2
        schema = {
          table = "source.user_2"
          columns = [
            { name = "id", type = "bigint" },
            { name = "name", type = "string" }
          ]
        }
      },
      {
        row.num = 2
        schema = {
          table = "source.order_1"
          columns = [
            { name = "id", type = "bigint" },
            { name = "amount", type = "int" }
          ]
        }
      },
      {
        row.num = 2
        schema = {
          table = "source.order_2"
          columns = [
            { name = "id", type = "bigint" },
            { name = "amount", type = "int" }
          ]
        }
      }
    ]
  }
}

transform {
  TableMerge {
    plugin_input = "source1"
    plugin_output = "t1"
    table_match_regex = "source.user_.*"
    database = "sink"
    table = "user_all"
  }
  TableMerge {
    plugin_input = "t1"
    plugin_output = "t2"
    table_match_regex = "source.order_.*"
    database = "sink"
    table = "order_all"
  }
}

sink {
  Assert {
    plugin_input = "t2"
    rules = {
      tables_configs = [
        {
          table_path = "sink.user_all"
          row_rules = [ { rule_type = MAX_ROW, rule_value = 4 } ]
        },
        {
          table_path = "sink.order_all"
          row_rules = [ { rule_type = MAX_ROW, rule_value = 4 } ]
        }
      ]
    }
  }
}
