######
###### LIKE wildcard semantics through a configured job: an interior wildcard, a literal
###### character that is a regex metacharacter, a regex keyword, and NOT LIKE.
###### Every row is pinned, and the assertions are exact, so this job keeps zero rows on an
###### evaluator that only expands wildcards at the boundaries.
######

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        id = "int"
        name = "string"
      }
    }
    rows = [
      {fields = [1, "Joy Ding"], kind = INSERT},
      {fields = [2, "Jing Dong"], kind = INSERT},
      {fields = [3, "125"], kind = INSERT},
      {fields = [4, "1.5"], kind = INSERT},
      {fields = [5, "Tu Ning"], kind = INSERT}
    ]
  }
}

transform {
  Sql {
    plugin_input = "fake"
    plugin_output = "fake1"
    # `like_interior_wildcard`: `%` in the middle of the pattern is a wildcard, so "Joy Ding"
    # matches 'J%ng'.  `like_literal_dot`: the `.` in '1.5' is a literal dot, so "125" does not
    # match.  `rlike_regex`: `.*` is a regular expression quantifier.  `rlike_verbatim`: the `%`
    # in a regex pattern is an ordinary character, so it only matches the literal text `J%ng`.
    query = """
      select id, name,
             case when '125' like '1.5' then 1 else 0 end as like_literal_dot,
             case when name like 'J%ng' then 1 else 0 end as like_interior_wildcard,
             case when name rlike 'J.*D.*g' then 1 else 0 end as rlike_regex,
             case when name rlike 'J%ng' then 1 else 0 end as rlike_verbatim
      from dual
      where name like 'J%ng' and name not like 'Jing%'
    """
  }
}

sink {
  Assert {
    plugin_input = "fake1"
    rules =
      {
        row_rules = [
          {
            rule_type = MIN_ROW
            rule_value = 1
          },
          {
            rule_type = MAX_ROW
            rule_value = 1
          }
        ],
        field_rules = [
          {
            field_name = "id"
            field_type = "int"
            field_value = [
              {equals_to = 1}
            ]
          },
          {
            field_name = "name"
            field_type = "string"
            field_value = [
              {equals_to = "Joy Ding"}
            ]
          },
          {
            field_name = "like_literal_dot"
            field_type = "int"
            field_value = [
              {equals_to = 0}
            ]
          },
          {
            field_name = "like_interior_wildcard"
            field_type = "int"
            field_value = [
              {equals_to = 1}
            ]
          },
          {
            field_name = "rlike_regex"
            field_type = "int"
            field_value = [
              {equals_to = 1}
            ]
          },
          {
            field_name = "rlike_verbatim"
            field_type = "int"
            field_value = [
              {equals_to = 0}
            ]
          }
        ]
      }
  }
}
