######
###### This config file is a demonstration of streaming processing in seatunnel config
######

env {
  parallelism = 1
  job.mode = "BATCH"
  checkpoint.interval = 10000
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        c1 = "timestamp"
        c2 = "string"
        c3 = "string"
      }
    }
    rows = [
      {fields = ["2023-01-01T00:00:00", "2023-01-01 00:00:00", "2023/01/01 00:00:00"], kind = INSERT}
    ]
  }
}

transform {
  Sql {
    plugin_input = "fake"
    plugin_output = "fake1"
    query = "select unix_timestamp(c1) as ts1, unix_timestamp(c2) as ts2, unix_timestamp(c3, 'yyyy/MM/dd HH:mm:ss') as ts3, from_unixtime(unix_timestamp(c2), 'yyyy-MM-dd HH:mm:ss') as rt2 from dual"
  }
}

sink {
  Assert {
    plugin_input = "fake1"
    rules = {
      field_rules = [
        {
          field_name = "ts1"
          field_type = bigint
          field_value = [
            {rule_type = NOT_NULL}
          ]
        }
        {
          field_name = "ts2"
          field_type = bigint
          field_value = [
            {rule_type = NOT_NULL}
          ]
        },
        {
          field_name = "ts3"
          field_type = bigint
          field_value = [
            {rule_type = NOT_NULL}
          ]
        },
        {
          field_name = "rt2"
          field_type = string
          field_value = [
            {rule_type = NOT_NULL, equals_to = "2023-01-01 00:00:00"}
          ]
        }
      ]
    }
  }
}
