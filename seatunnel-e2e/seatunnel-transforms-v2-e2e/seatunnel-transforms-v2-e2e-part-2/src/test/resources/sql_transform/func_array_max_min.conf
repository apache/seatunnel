######
###### This config file is a demonstration of streaming processing in seatunnel config
######


env {
   job.mode = "BATCH"
   parallelism = 1
 }

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        c_string = string
        c_num_array = "array<int>"
        c_string_array = "array<string>"
        c_long_array = "array<bigint>"
        c_first_decimal = "decimal(38,20)"
        c_second_decimal = "decimal(38,20)"
      }
    }
    rows = [
      {
        kind = INSERT
        fields = ["c_string",[1,2,3], ["a","b","c"],
          [9007199254740992,9007199254740993],
          "1.00000000000000000001","1.00000000000000000002"]
      },
      {
        kind = INSERT
        fields = ["c_string",[3,2,1], ["c","b","a"],
          [9007199254740993,9007199254740992],
          "1.00000000000000000002","1.00000000000000000001"]
      }
    ]
  }
}

 transform {
   Sql {
     plugin_input = "fake"
     plugin_output = "arrays"
     query = """select c_string, c_num_array, c_string_array, c_long_array,
                     ARRAY(c_first_decimal, c_second_decimal) as c_decimal_array
                     from fake"""
   }
   Sql {
     plugin_input = "arrays"
     plugin_output = "fake1"
     query = """select c_string,
                     ARRAY_MAX(c_num_array) as c_num_max_array,
                     ARRAY_MIN(c_num_array) as c_num_min_array,
                     ARRAY_MAX(c_string_array) as c_string_max_array,
                     ARRAY_MIN(c_string_array) as c_string_min_array,
                     ARRAY_MAX(c_long_array) as c_long_max_array,
                     ARRAY_MIN(c_long_array) as c_long_min_array,
                     ARRAY_MAX(c_decimal_array) as c_decimal_max_array,
                     ARRAY_MIN(c_decimal_array) as c_decimal_min_array
                     from arrays"""
   }
 }

sink {
  Assert {
    plugin_input = "fake1"
    rules =
      {
        row_rules = [
          {
            rule_type = MIN_ROW
            rule_value = 2
          },
          {
            rule_type = MAX_ROW
            rule_value = 2
          }
        ],
        field_rules = [
          {
            field_name = "c_string"
            field_type = "string"
            field_value = [
              {equals_to = "c_string"}
            ]
          },
         {
           field_name = "c_num_max_array"
           field_type = "int"
           field_value = [
             {equals_to = 3}
           ]
         },
         {
           field_name = "c_num_min_array"
           field_type = "int"
           field_value = [
             {equals_to = 1}
           ]
         },
         {
           field_name = "c_string_max_array"
           field_type = "string"
           field_value = [
             {equals_to = "c"}
           ]
         },
         {
           field_name = "c_string_min_array"
           field_type = "string"
           field_value = [
             {equals_to = "a"}
           ]
         },
         {
           field_name = "c_long_max_array"
           field_type = "bigint"
           field_value = [{equals_to = 9007199254740993}]
         },
         {
           field_name = "c_long_min_array"
           field_type = "bigint"
           field_value = [{equals_to = 9007199254740992}]
         },
         {
           field_name = "c_decimal_max_array"
           field_type = "decimal(38,20)"
           field_value = [{equals_to = "1.00000000000000000002"}]
         },
         {
           field_name = "c_decimal_min_array"
           field_type = "decimal(38,20)"
           field_value = [{equals_to = "1.00000000000000000001"}]
         }
        ]
      }
  }
}
