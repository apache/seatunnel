######
###### This config file is a demonstration of streaming processing in seatunnel config
######

env {
  parallelism = 1
  job.mode = "BATCH"
  checkpoint.interval = 10000
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        id = "int"
        age = "int"
        score = "double"
        name = "string"
      }
    }
    rows = [
      {fields = [1, 15, 85.5, "Alice"], kind = INSERT}
    ]
  }
}

transform {
  Sql {
    plugin_input = "fake"
    plugin_output = "fake1"
    query = """
      SELECT
        id,
        age,
        score,
        name,
        IF(age < 18, 'Minor', 'Adult') as age_category,
        IF(score >= 90, 'A', score) as grade,
        IF(age < 18, IF(age < 12, 'Child', 'Teenager'), 'Adult') as age_group
      FROM fake
    """
  }
}

sink {
  Assert {
    plugin_input = "fake1"
    rules = {
      row_rules = [
        {
          rule_type = "MIN_ROW"
          rule_value = 1
        },
        {
          rule_type = "MAX_ROW"
          rule_value = 1
        }
      ],
      field_rules = [
        {
          field_name = "id"
          field_type = "int"
          field_value = [
            {equals_to = 1}
          ]
        },
        {
          field_name = "age_category"
          field_type = "string"
          field_value = [
            {equals_to = "Minor"}
          ]
        },
        {
          field_name = "grade"
          field_type = "string"
          field_value = [
            {equals_to = "85.5"}
          ]
        },
        {
          field_name = "age_group"
          field_type = "string"
          field_value = [
            {equals_to = "Teenager"}
          ]
        }
      ]
    }
  }
}
