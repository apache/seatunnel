env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  FakeSource {
    plugin_output = "input"
    schema {
      fields {
        arrays = "array<array<int>>"
        maps = "array<map<string,array<int>>>"
      }
    }
    rows = [{ kind = INSERT, fields = [[[1, 2], []], [{key = [1, 2]}, {empty = []}]] }]
  }
}

transform {
  Sql {
    plugin_input = "input"
    plugin_output = "nested"
    query = "SELECT arrays, maps, ARRAY(ARRAY(MAP('key', ARRAY(1, 2))), ARRAY(MAP('empty', ARRAY(3, 4)))) AS nested_maps FROM input"
  }
}

sink {
  Assert {
    plugin_input = "nested"
    rules {
      row_rules = [
        { rule_type = MIN_ROW, rule_value = 1 },
        { rule_type = MAX_ROW, rule_value = 1 }
      ]
      field_rules = [
        { field_name = "arrays", field_type = "array<array<int>>", field_value = [{ equals_to = [[1, 2], []] }] },
        { field_name = "maps", field_type = "array<map<string,array<int>>>", field_value = [{ equals_to = [{key = [1, 2]}, {empty = []}] }] },
        { field_name = "nested_maps", field_type = "array<array<map<string,array<int>>>>", field_value = [{ equals_to = [[{key = [1, 2]}], [{empty = [3, 4]}]] }] }
      ]
    }
  }
}
