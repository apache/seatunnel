env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "source1"

    tables_configs = [
      {
        row.num = 3
        schema = {
          table = "test.events_1"
          columns = [
            {
              name = "id"
              type = "bigint"
            },
            {
              name = "name"
              type = "string"
            }
          ]
        }
      },
      {
        row.num = 3
        schema = {
          table = "test.events_2"
          columns = [
            {
              name = "id"
              type = "bigint"
            },
            {
              name = "name"
              type = "string"
            }
          ]
        }
      }
    ]
  }
}

transform {
  TableMerge {
    plugin_input = "source1"
    plugin_output = "branch_a"

    table_match_regex = "test.events_.*"
    database = "sink"
    table = "events_a"
  }

  TableMerge {
    plugin_input = "source1"
    plugin_output = "branch_b"

    table_match_regex = "test.events_.*"
    database = "sink"
    table = "events_b"
  }
}

sink {
  Assert {
    plugin_input = "branch_a"

    rules =
      {
        tables_configs = [
          {
            table_path = "sink.events_a"
            row_rules = [
              {
                rule_type = MAX_ROW
                rule_value = 6
              },
              {
                rule_type = MIN_ROW
                rule_value = 6
              }
            ],
            field_rules = [
              {
                field_name = id
                field_type = bigint
                field_value = [
                  {
                    rule_type = NOT_NULL
                  }
                ]
              },
              {
                field_name = name
                field_type = string
                field_value = [
                  {
                    rule_type = NOT_NULL
                  }
                ]
              }
            ]
          }
        ]
      }
  }

  Assert {
    plugin_input = "branch_b"

    rules =
      {
        tables_configs = [
          {
            table_path = "sink.events_b"
            row_rules = [
              {
                rule_type = MAX_ROW
                rule_value = 6
              },
              {
                rule_type = MIN_ROW
                rule_value = 6
              }
            ],
            field_rules = [
              {
                field_name = id
                field_type = bigint
                field_value = [
                  {
                    rule_type = NOT_NULL
                  }
                ]
              },
              {
                field_name = name
                field_type = string
                field_value = [
                  {
                    rule_type = NOT_NULL
                  }
                ]
              }
            ]
          }
        ]
      }
  }
}
