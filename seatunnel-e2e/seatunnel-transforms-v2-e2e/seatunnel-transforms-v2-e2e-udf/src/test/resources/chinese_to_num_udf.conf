######
###### This config file is a demonstration of streaming processing in seatunnel config
######

env {
  parallelism = 1
  job.mode = "BATCH"
  checkpoint.interval = 10000
}

source {
  FakeSource {
    plugin_output = "fake"
    schema = {
      fields {
        num = "long"
        cn = "string"
      }
    }
    rows = [
      {fields = [4, "肆"], kind = INSERT}
      {fields = [0, "零"], kind = INSERT}
      {fields = [25, "贰拾伍"], kind = INSERT}
      {fields = [321, "叁佰贰拾壹"], kind = INSERT}
      {fields = [8321, "捌仟叁佰贰拾壹"], kind = INSERT}
      {fields = [50021, "伍萬零贰拾壹"], kind = INSERT}
      {fields = [250021, "贰拾伍萬零贰拾壹"], kind = INSERT}
      {fields = [7250021, "柒佰贰拾伍萬零贰拾壹"], kind = INSERT}
      {fields = [67250021, "陆仟柒佰贰拾伍萬零贰拾壹"], kind = INSERT}
      {fields = [607250021, "陆亿零柒佰贰拾伍萬零贰拾壹"], kind = INSERT}
      {fields = [2607250021, "贰拾陆亿零柒佰贰拾伍萬零贰拾壹"], kind = INSERT}
      {fields = [52607250021, "伍佰贰拾陆亿零柒佰贰拾伍萬零贰拾壹"], kind = INSERT}
      {fields = [452607250021, "肆仟伍佰贰拾陆亿零柒佰贰拾伍萬零贰拾壹"], kind = INSERT}
      {fields = [3452607250021, "叁兆肆仟伍佰贰拾陆亿零柒佰贰拾伍萬零贰拾壹"], kind = INSERT}
      {fields = [23452607250021, "贰拾叁兆肆仟伍佰贰拾陆亿零柒佰贰拾伍萬零贰拾壹"], kind = INSERT}
      {fields = [123452607250021, "壹佰贰拾叁兆肆仟伍佰贰拾陆亿零柒佰贰拾伍萬零贰拾壹"], kind = INSERT}
      {fields = [1123452607250021, "壹仟壹佰贰拾叁兆肆仟伍佰贰拾陆亿零柒佰贰拾伍萬零贰拾壹"], kind = INSERT}
      {fields = [10, "十"], kind = INSERT}
      {fields = [100, "壹佰"], kind = INSERT}
      {fields = [2000, "贰仟"], kind = INSERT}
      {fields = [30000, "叁萬"], kind = INSERT}
      {fields = [100000, "十萬"], kind = INSERT}
      {fields = [5000000, "伍佰萬"], kind = INSERT}
      {fields = [60000000, "陆仟萬"], kind = INSERT}
      {fields = [700000000, "柒亿"], kind = INSERT}
      {fields = [8000000000, "捌拾亿"], kind = INSERT}
      {fields = [90000000000, "玖佰亿"], kind = INSERT}
      {fields = [800000000000, "捌仟亿"], kind = INSERT}
      {fields = [8000000000000, "捌兆"], kind = INSERT}
    ]
  }
}

transform {
  sql {
    plugin_input = "fake"
    plugin_output = "fake1"
    query = "select num, (num - CHINESE_TO_NUM(cn)) as cn  from dual"
  }
}

sink {
  Assert {
    plugin_input = "fake1"
    rules = {
      field_rules = [
        {
          field_name = "cn"
          field_type = "int"
          field_value = [
            {equals_to = 0}
          ]
        }
      ]
    }
  }
}