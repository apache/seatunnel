env {
  job.mode = "BATCH"
  parallelism = 1
  job.retry.times = 0

  transform_error_handler {
    mode = "ROUTE"
    sink {
      plugin_name = "Assert"
      rules {
        row_rules = [{rule_type = MAX_ROW, rule_value = 0}]
      }
    }
  }
}

source {
  FakeSource {
    plugin_output = "input"
    row.num = "${sourceRows}"
    schema {
      fields {
        name = "string"
      }
    }
  }
}

transform {
  Sql {
    plugin_input = "input"
    plugin_output = "output"
    query = "${startupQuery}"
  }
}

sink {
  Assert {
    plugin_input = "output"
    rules {
      row_rules = [{rule_type = MAX_ROW, rule_value = "${sourceRows}"}]
    }
  }
}
