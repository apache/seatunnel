env {
  job.mode = "BATCH"
  parallelism = 1
  job.retry.times = 0
}

source {
  FakeSource {
    plugin_output = "input"
    tables_configs = [
      {
        schema {
          table = "test.first"
          columns = [{name = "name", type = "string"}]
        }
        rows = [
          {fields = ["Alice"], kind = INSERT},
          {fields = ["Alice"], kind = INSERT}
        ]
      },
      {
        schema {
          table = "test.second"
          columns = [{name = "name", type = "string"}]
        }
        rows = [{fields = ["Bob"], kind = INSERT}]
      }
    ]
  }
}

transform {
  Sql {
    plugin_input = "input"
    plugin_output = "output"
    rule_match_mode = ALL_MATCH
    table_transform = [
      {
        table_path = "test.first"
        query = "SELECT CATALOG_CONTEXT(name) AS name FROM dual WHERE CATALOG_CONTEXT(name) = 'test.first:Alice'"
      },
      {
        table_path = "test.first"
        query = "SELECT ${secondRule} AS name FROM dual"
      },
      {
        table_path = "test.second"
        query = "SELECT CATALOG_CONTEXT(UpPeR(name)) AS name FROM dual"
      }
    ]
  }
}

sink {
  Assert {
    plugin_input = "output"
    rules {
      tables_configs = [
        {
          table_path = "test.first"
          row_rules = [
            {rule_type = MIN_ROW, rule_value = 2},
            {rule_type = MAX_ROW, rule_value = 2}
          ]
          field_rules = [
            {field_name = "name", field_type = "string", field_value = [{equals_to = "test.first:test.first:Alice"}]}
          ]
        },
        {
          table_path = "test.second"
          row_rules = [
            {rule_type = MIN_ROW, rule_value = 1},
            {rule_type = MAX_ROW, rule_value = 1}
          ]
          field_rules = [
            {field_name = "name", field_type = "string", field_value = [{equals_to = "test.second:BOB"}]}
          ]
        }
      ]
    }
  }
}
