agent:
  idle-sleep-ms: 50
input:
  id: e2e-input
  paths:
    - "/e2e/agent-events.log"
  read-from-beginning: true
  glob-scan-interval-ms: 200
  close-inactive-ms: 300000
  output-format:
    type: line
queue:
  sqlite-path: "/e2e/queue.db"
output:
  type: transport
  endpoint: "server:10091"
  auth-type: token
  token: "edge-e2e-token"
  packet-mode: PACKET
  compression: deflate
  encryption: none
