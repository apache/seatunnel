# Used by CheckpointCoordinatorFailoverIT#testBatchJobCompletesAfterMasterFailoverDuringCloseHandshake
# to build a wide, deterministic gap between "some starting subtasks already reported ready to
# close" and "all starting subtasks reported ready to close": table_fast is a single-split source
# that finishes almost immediately, while table_slow is spread across many splits with a read
# interval between them so it keeps producing rows for several seconds after table_fast is done.
# The shared-sink union is split into two coordinator-local pipelines. env.parallelism = 2 only
# scales each source's reader tasks; the split-enumerator coordinator (the "starting subtask" the
# ready-to-close handshake tracks) is one per source regardless of reader parallelism, so there
# are two starting subtasks total, one per pipeline. The test aggregates both coordinators'
# readiness.
# checkpoint.interval is set far beyond the test's real runtime so the completing checkpoint is
# the only checkpoint ever attempted.
env {
  job.mode = BATCH
  checkpoint.interval = 600000
  parallelism = 2
}

source {
  FakeSource {
    plugin_output = table_fast
    row.num = 5
    split.num = 1
    schema = {
      fields {
        c_string = string
        c_int    = int
      }
    }
  }

  FakeSource {
    plugin_output = table_slow
    row.num = 300
    split.num = 30
    split.read-interval = 300
    schema = {
      fields {
        c_string = string
        c_int    = int
      }
    }
  }
}

transform {
}

sink {
  LocalFile {
    plugin_input = [table_fast, table_slow]
    path = "/tmp/hive/warehouse/${dynamic_test_case_name}"
    field_delimiter = "\t"
    row_delimiter = "\n"
    file_name_expression = "${transactionId}_${now}"
    file_format_type = "text"
    filename_time_format = "yyyy.MM.dd"
    is_enable_transaction = true
    save_mode = "error"
  }
}
