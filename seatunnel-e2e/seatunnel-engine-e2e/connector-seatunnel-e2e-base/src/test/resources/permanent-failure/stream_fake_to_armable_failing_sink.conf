# Job fixture for PermanentFailureCapacityReleaseIT. FakeSource is unbounded in STREAMING mode and
# the ArmableFailingSink accepts rows until the test arms it, so the pipeline first reaches a steady
# RUNNING state and completes real checkpoints. job.retry.times = 2 fixes the retry budget at two
# pipeline restores (three deployments) before the job must end in FAILED.

env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  job.retry.times = 2
  job.retry.interval.seconds = 1
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100000
    split.num = 2
    split.read-interval = 10
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  ArmableFailingSink {
    plugin_input = "fake"
  }
}
