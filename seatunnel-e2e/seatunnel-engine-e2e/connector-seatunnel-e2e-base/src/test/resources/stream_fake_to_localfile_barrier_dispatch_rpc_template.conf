env {
  job.mode = STREAMING
  # Single source task so the test can unambiguously identify and terminate the one worker
  # hosting it.
  parallelism = 1
  # Short interval so a new checkpoint (and its barrier dispatch) recurs quickly, giving the
  # test's tight poll frequent chances to catch one just after it is triggered.
  checkpoint.interval = 1000
  # Deliberately far below the Hazelcast native membership failure-detection ceiling that
  # CheckpointCoordinatorFailoverIT's barrier-dispatch test explicitly configures for its cluster
  # (BARRIER_DISPATCH_HEARTBEAT_CEILING_SECONDS, well above Hazelcast's own 60s compiled-in
  # default) so a bounded post-kill recovery wait in the test can only be explained by this
  # checkpoint timeout backstop firing, not by Hazelcast noticing the terminated worker on its own.
  checkpoint.timeout = 8000
}

source {
  FakeSource {
    plugin_output = table1
    row.num = 1000000
    split.num = 1
    split.read-interval = 50
    schema = {
      fields {
        c_string = string
        c_int    = int
      }
    }
  }
}

transform {
}

sink {
  LocalFile {
    plugin_input = table1
    path = "/tmp/hive/warehouse/${dynamic_test_case_name}"
    field_delimiter = "\t"
    row_delimiter = "\n"
    file_name_expression = "${transactionId}_${now}"
    file_format_type = "text"
    filename_time_format = "yyyy.MM.dd"
    is_enable_transaction = true
    save_mode = "error"
  }
}
