######
###### Continuous streaming job with a short checkpoint interval and an aggregated-commit
###### sink whose writers never produce commit info, used to drive SinkAggregatedCommitterTask
###### through many real checkpoints that leave checkpointCommitInfoMap empty.
######

env {
  job.mode = "STREAMING"
  checkpoint.interval = 1000
}

source {
  FakeSource {
    parallelism = 2
    row.num = 1000000
    split.num = 4
    split.read-interval = 50
    schema = {
      fields {
        c_int = int
      }
    }
  }
}

sink {
  EmptyCommitInfoAggregatedTest {
  }
}
