# Two independent pipelines in one STREAMING job. Each source/sink pair becomes
# its own pipeline (pipeline id 1 and 2, in source declaration order), which is
# what the multi-pipeline savepoint fan-out and restore tests need. Both sources
# are unbounded (FakeSource is UNBOUNDED in STREAMING mode), so neither pipeline
# can finish on its own while the savepoint is being taken. The Console sink
# discards every row, so only engine checkpoint/savepoint bookkeeping is under
# test here.
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = "fake1"
    row.num = 100000
    split.num = 2
    split.read-interval = 10
    schema = {
      table = "savepoint.pipeline1"
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }

  FakeSource {
    plugin_output = "fake2"
    row.num = 100000
    split.num = 2
    split.read-interval = 10
    schema = {
      table = "savepoint.pipeline2"
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "fake1"
    log.print.data = false
  }

  Console {
    plugin_input = "fake2"
    log.print.data = false
  }
}
