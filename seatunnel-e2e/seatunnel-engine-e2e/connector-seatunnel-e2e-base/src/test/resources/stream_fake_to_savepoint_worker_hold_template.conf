######
###### This config file is a template used by WorkerFailureDuringSavepointIT.
###### The dynamic_* placeholders are replaced before the job is submitted.
######

env {
  parallelism = 1
  job.mode = "STREAMING"
  # A savepoint is the only checkpoint this job needs: with a long interval no periodic
  # checkpoint can race the held savepoint, so the snapshot the sink parks in is unambiguous.
  checkpoint.interval = 600000
  # Long enough that the parked savepoint cannot time out while the test kills the worker,
  # short enough that a broken hold still surfaces as a checkpoint timeout.
  checkpoint.timeout = 120000
  # The pipeline may restore after the worker is lost; the stop intent must still win.
  job.retry.times = 3
}

source {
  FakeSource {
    plugin_output = "fake"
    # An unbounded STREAMING source keeps the job alive for the whole test; the savepoint is
    # the only checkpoint, so no final checkpoint can end the pipeline while the barrier is held.
    row.num = 100000000
    split.num = 1
    split.read-interval = 10
    schema = {
      fields {
        id = bigint
        name = string
      }
    }
  }
}

transform {
}

sink {
  SavepointWorkerHoldTest {
    plugin_output = "fake"
    hold_dir = "${dynamic_hold_dir}"
    hold_key = "${dynamic_hold_key}"
    block_on_snapshot = ${dynamic_block_on_snapshot}
  }
}
