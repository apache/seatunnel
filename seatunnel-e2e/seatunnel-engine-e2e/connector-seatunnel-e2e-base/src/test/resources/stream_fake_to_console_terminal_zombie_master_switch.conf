######
###### Streaming job used by SplitClusterTerminalZombieJobMasterSwitchIT.
###### The unbounded FakeSource keeps the job RUNNING and checkpointing every second; the test
###### shuts down the only worker once a checkpoint has been persisted, and job.retry.times = 0
###### turns the resulting task failure straight into a terminal FAILED job whose checkpoint is
###### retained (checkpoints are only removed for FINISHED / CANCELED jobs).
######

env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 1000
  job.retry.times = 0
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100
    split.num = 1
    schema = {
      fields {
        name = "string"
        age = "int"
      }
    }
    parallelism = 1
  }
}

transform {
}

sink {
  Console {
    plugin_input = "fake"
  }
}
