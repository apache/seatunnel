######
###### This config file is a template used by SavepointInFlightMasterFailoverIT.
###### The dynamic_hold_key placeholder is replaced before the job is submitted.
######
###### checkpoint.interval is deliberately far larger than the test duration: the test must hold
###### the barrier of the stop-with-savepoint checkpoint, and a periodic checkpoint that reached the
###### sink first would make the in-flight checkpoint type ambiguous.
######

env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 3600000
  checkpoint.timeout = 100000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100000000
    split.num = 1
    schema = {
      fields {
        id = int
        name = string
      }
    }
    parallelism = 1
  }
}

transform {
}

sink {
  SavepointBarrierHoldTest {
    plugin_input = "fake"
    hold_key = "${dynamic_hold_key}"
  }
}
