# Job fixture for SavepointClusterRestartRestoreIT. FakeSource is UNBOUNDED in
# STREAMING mode and the Console sink discards every row, so the only thing this
# job exercises is the engine's checkpoint/savepoint scheduling and restore path.
# The checkpoint interval is intentionally short so the test can observe the
# periodic checkpoint sequence before and after the savepoint; the source is
# kept actively running so the savepoint barrier has to be injected into live
# tasks rather than after the pipeline already drained.

env {
  parallelism = 2
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100000
    split.num = 2
    split.read-interval = 10
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "fake"
    log.print.data = false
  }
}
