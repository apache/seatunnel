######
###### This config file is a template used by CancelDuringSavepointIT.
###### The dynamic_* placeholders are replaced before the job is submitted.
######

env {
  parallelism = 1
  job.mode = "STREAMING"
  # The savepoint request is the first checkpoint of the job: with a long interval no periodic
  # checkpoint can race the held savepoint, so the snapshot the sink parks in is unambiguous.
  checkpoint.interval = 600000
  # Long enough that the held savepoint cannot expire while the test cancels the job, short
  # enough that a broken hold still surfaces as a checkpoint timeout instead of an eternal hang.
  checkpoint.timeout = 120000
  # A cancel must not be turned into a restore by the in-flight savepoint.
  job.retry.times = 0
}

source {
  FakeSource {
    plugin_output = "fake"
    # A huge split keeps the STREAMING job alive for the whole test; it never reaches
    # ready-to-close, so no final checkpoint can end the pipeline while the savepoint is held.
    row.num = 100000000
    split.num = 1
    split.read-interval = 10
    schema = {
      fields {
        id = bigint
        name = string
      }
    }
  }
}

transform {
}

sink {
  SavepointCancelHoldTest {
    plugin_output = "fake"
    hold_key = "${dynamic_hold_key}"
    block_on_snapshot = ${dynamic_block_on_snapshot}
  }
}
