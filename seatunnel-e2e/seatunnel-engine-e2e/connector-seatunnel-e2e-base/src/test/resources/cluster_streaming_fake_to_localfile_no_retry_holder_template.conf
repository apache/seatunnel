######
###### STREAMING holder used by
###### SplitClusterPendingJobLifecycleFailoverIT#testHolderFailureOnWorkerLossReleasesFixedSlotsSoQueuedJobRuns
###### to occupy fixed slots until the test injects a worker failure.
######
###### FakeSource is UNBOUNDED in STREAMING mode: it reads its splits once and then stays idle, so
###### the holder can never reach FINISHED by itself and the member loss below is always injected
###### while the job is RUNNING and still owns its fixed slots. job.retry.times = 0 makes that
###### member loss terminal instead of a restore, which is exactly the path that has to release the
###### slots the holder still owns on the surviving worker.
######
###### The input is deliberately tiny: the holder is kept open by its source's boundedness, not by
###### row volume or pacing, so the test does not need a large fixture to reach the failure point.
######

env {
  job.mode = "${dynamic_job_mode}"
  job.retry.times = 0
}

source {
  FakeSource {
    row.num = ${dynamic_test_row_num_per_parallelism}
    split.num = 1
    split.read-interval = 1
    parallelism = ${dynamic_test_parallelism}
    schema = {
      fields {
        c_int = int
      }
    }
  }
}

transform {
}

sink {
  LocalFile {
    path = "/tmp/hive/warehouse/${dynamic_test_case_name}"
    field_delimiter = "\t"
    row_delimiter = "\n"
    file_name_expression = "${transactionId}_${now}"
    file_format_type = "text"
    filename_time_format = "yyyy.MM.dd"
    is_enable_transaction = true
    save_mode = "error"
  }
}
