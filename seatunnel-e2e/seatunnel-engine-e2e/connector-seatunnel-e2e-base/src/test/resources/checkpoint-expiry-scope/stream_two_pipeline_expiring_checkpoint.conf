# Two independent pipelines in one STREAMING job (pipeline id 1 and 2, in source
# declaration order). Both sources are long-lived FakeSources, so neither
# pipeline can finish on its own while the checkpoint expiry below is observed.
#
# Pipeline 1 (plugin_output "expiring") ends in an InMemory sink whose
# prepareCommit() sleeps 5 s for every checkpoint, which is longer than the 3 s
# checkpoint.timeout, so its checkpoints are guaranteed to expire instead of
# completing. Pipeline 2 (plugin_output "healthy") uses the same sink without the
# sleep, so its checkpoints complete in milliseconds. The 2 s interval keeps the
# expired-checkpoint window comfortably inside the retry budget below: every run
# of the expiring pipeline dies on its first checkpoint, is restored after 2 s,
# and dies again, while the healthy pipeline must keep checkpointing untouched.
#
# job.retry.times is raised well above the two restore cycles this test observes
# so that the engine cannot exhaust the per-pipeline restore budget and fail the
# job while the assertions run; job.retry.interval.seconds is lowered so a
# restore is observed quickly.
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  checkpoint.timeout = 3000
  job.retry.times = 20
  job.retry.interval.seconds = 2
}

source {
  FakeSource {
    plugin_output = "expiring"
    row.num = 200000
    split.num = 200
    split.read-interval = 1000
    schema = {
      table = "checkpoint_scope.expiring"
      fields {
        id = "bigint"
        name = "string"
      }
    }
  }

  FakeSource {
    plugin_output = "healthy"
    row.num = 200000
    split.num = 200
    split.read-interval = 1000
    schema = {
      table = "checkpoint_scope.healthy"
      fields {
        id = "bigint"
        name = "string"
      }
    }
  }
}

sink {
  InMemory {
    plugin_input = "expiring"
    checkpoint_sleep = true
  }

  InMemory {
    plugin_input = "healthy"
  }
}
