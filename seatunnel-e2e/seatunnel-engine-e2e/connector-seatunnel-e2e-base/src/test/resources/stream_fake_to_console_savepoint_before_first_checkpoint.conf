# Job fixture for SavepointBeforeFirstCheckpointIT.
#
# The checkpoint interval is deliberately longer than the whole test, so the
# job reaches RUNNING with zero completed periodic checkpoints. The savepoint
# requested by the test is therefore the first checkpoint of the job: there is
# no earlier checkpoint to fall back on for the id counter or for the restore
# path. FakeSource is UNBOUNDED in STREAMING mode and the Console sink discards
# every row, so only the engine's savepoint scheduling and restore contracts
# are exercised.

env {
  parallelism = 2
  job.mode = "STREAMING"
  checkpoint.interval = 3600000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100000
    split.num = 2
    split.read-interval = 10
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "fake"
    log.print.data = false
  }
}
