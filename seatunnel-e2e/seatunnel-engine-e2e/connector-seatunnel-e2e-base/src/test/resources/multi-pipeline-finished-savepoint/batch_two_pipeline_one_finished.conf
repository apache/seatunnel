######
###### Two independent batch pipelines with a deliberately asymmetric runtime:
###### "fast_source" finishes within the first checkpoint interval, while
###### "slow_source" reads one split every two seconds and keeps the job RUNNING
###### for about forty seconds. The fixture is only a test bed: the contract under
###### test is what a stop-with-savepoint does while one pipeline has already
###### FINISHED and a sibling pipeline is still RUNNING.
######

env {
  job.mode = "BATCH"
  parallelism = 1
  checkpoint.interval = 1000
}

source {
  FakeSource {
    plugin_output = "fast_source"
    row.num = 10
    split.num = 1
    schema = {
      fields {
        id = "int"
        name = "string"
      }
    }
  }

  FakeSource {
    plugin_output = "slow_source"
    row.num = 100
    split.num = 20
    split.read-interval = 2000
    schema = {
      fields {
        id = "int"
        name = "string"
      }
    }
  }
}

sink {
  Console {
    plugin_input = "fast_source"
  }

  Console {
    plugin_input = "slow_source"
  }
}
