######
###### One BATCH pipeline whose source has parallelism 3 and whose sink has parallelism 1. It
###### needs exactly four fixed slots, i.e. the whole pool of the test cluster. Used to prove that
###### the slots released at the end of another job are genuinely usable again.
######

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "full_pool_job"
    row.num = 3
    split.num = 1
    parallelism = 3
    schema = {
      fields {
        id = "int"
        name = "string"
      }
    }
  }
}

sink {
  PipelineFinishSlotReleaseTest {
    plugin_input = "full_pool_job"
    tag = "c_full_pool"
    parallelism = 1
  }
}
