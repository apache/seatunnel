# Streaming counterpart of fake_to_inmemory_savemode.conf. It is only used by the save-mode IT's
# restore step: a real savepoint can only be taken from a running job, and restoring it must skip
# the save-mode handlers just like the batch case does.
#
# A streaming FakeSource never signals completion, so the job stays RUNNING after it has drained its
# splits and can be savepointed at any time. The sink must be alive but must never park a record
# forever: a savepoint barrier can only pass the chained sink writer once write() returns, so
# writer_sleep (which blocks the first record until the task is interrupted) makes every savepoint
# request time out. A small per-record delay instead keeps rows flowing across the savepoint request
# while still letting the barrier through between records.
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 2000
}

source {
  FakeSource {
    row.num = 5000
    split.read-interval = 100
    tables_configs = [
        {
            row.num = 5000
            split.read-interval = 100
            schema = {
                  table = "test.table1"
                  columns = [
                    {
                        name = id
                        type = bigint
                    }
                  ]
            }
        },
        {
            row.num = 5000
            split.read-interval = 100
            schema = {
                  table = "test.table2"
                  columns = [
                    {
                        name = id
                        type = bigint
                    }
                  ]
            }
        }
    ]
  }
}

sink{
  InMemory {
    write_delay_ms = 1
  }
}
