# Streaming counterpart of fake_to_inmemory_savemode.conf. It is only used by the save-mode IT's
# restore step: a real savepoint can only be taken from a running job, and restoring it must skip
# the save-mode handlers just like the batch case does.
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 2000
}

source {
  FakeSource {
    row.num = 1000000
    split.read-interval = 100
    tables_configs = [
        {
            row.num = 1000000
            split.read-interval = 100
            schema = {
                  table = "test.table1"
                  columns = [
                    {
                        name = id
                        type = bigint
                    }
                  ]
            }
        },
        {
            row.num = 1000000
            split.read-interval = 100
            schema = {
                  table = "test.table2"
                  columns = [
                    {
                        name = id
                        type = bigint
                    }
                  ]
            }
        }
    ]
  }
}

sink{
  InMemory {
    writer_sleep = true
  }
}
