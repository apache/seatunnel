# Two FakeSource subtasks, each chained to a CommitterRegistrationTest writer, and one aggregated
# committer. Used by JobExecutionIT to end the committer before the writers register with it.
env {
  parallelism = 2
  job.mode = "BATCH"
  checkpoint.interval = 300000
  job.retry.times = 0
  job.retry.interval.seconds = 1
}

source {
  FakeSource {
    parallelism = 2
    row.num = 10
    split.num = 2
    schema = {
      fields {
        c_int = int
      }
    }
  }
}

sink {
  CommitterRegistrationTest {
  }
}
