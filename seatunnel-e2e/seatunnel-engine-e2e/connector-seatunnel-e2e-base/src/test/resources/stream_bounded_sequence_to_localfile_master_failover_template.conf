env {
  job.mode = STREAMING
  checkpoint.interval = 2000
  # A single reader on purpose: the sequence enumerator hands every split to the first reader
  # that registers, so extra readers would only be idle readers and would drag the unbounded
  # idle-reader-close path into a test that targets the ready-to-close persistence.
  parallelism = 1
}

source {
  # Bounded run inside a STREAMING job: the reader drains [start_offset, end_offset) and then
  # signals no-more-element, which drives the engine's real completion path
  # (SourceNoMoreElementOperation -> LastCheckpointNotifyOperation -> readyToClose).
  # exhausted_snapshot_delay_ms holds the final barrier's acknowledgement back once the reader
  # is drained, so the job stays in its shutdown phase long enough for the test to fail the
  # master over inside that window. CheckpointCoordinatorFailoverIT derives the expected row
  # count from end_offset - start_offset.
  CheckpointableSequenceSource {
    start_offset = 0
    end_offset = 3000
    split_num = 4
    records_per_poll = 10
    emit_interval_ms = 50
    exhausted_snapshot_delay_ms = 20000
  }
}

transform {
}

sink {
  LocalFile {
    path = "/tmp/hive/warehouse/${dynamic_test_case_name}"
    field_delimiter = "\t"
    row_delimiter = "\n"
    file_name_expression = "${transactionId}_${now}"
    file_format_type = "text"
    filename_time_format = "yyyy.MM.dd"
    is_enable_transaction = true
    save_mode = "error"
  }
}
