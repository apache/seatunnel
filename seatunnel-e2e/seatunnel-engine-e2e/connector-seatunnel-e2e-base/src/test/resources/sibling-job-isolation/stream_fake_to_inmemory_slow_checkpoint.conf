# Long-lived streaming job whose every checkpoint is deliberately slow: the
# InMemory sink's prepareCommit() sleeps 5 s, so this pipeline's checkpoint stays
# in flight for most of the 1 s interval. Used by SiblingJobIsolationOnCancelIT so
# that cancelling the co-located job lands inside an in-flight checkpoint of this
# job rather than between two checkpoints. The source keeps the job alive with 600
# one-row splits and a one second read interval.
env {
  job.mode = "STREAMING"
  checkpoint.interval = 1000
  checkpoint.timeout = 120000
}

source {
  FakeSource {
    parallelism = 1
    row.num = 600
    split.num = 600
    split.read-interval = 1000
    schema = {
      fields {
        id = int
      }
    }
  }
}

sink {
  InMemory {
    checkpoint_sleep = true
  }
}
