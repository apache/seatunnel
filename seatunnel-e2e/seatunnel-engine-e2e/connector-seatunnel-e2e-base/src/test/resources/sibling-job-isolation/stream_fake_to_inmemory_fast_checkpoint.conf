# Long-lived streaming job used as a slot/checkpoint owner in
# SiblingJobIsolationOnCancelIT. One FakeSource reader (parallelism 1), its split
# enumerator and the sink task group occupy three fixed slots. The job stays alive
# for the whole scenario because every one of its 600 one-row splits is followed by
# a one second read interval, while the sink stays fast enough for checkpoint
# barriers to pass immediately (a slow sink would back up the source and delay the
# barriers, which is a different scenario).
env {
  job.mode = "STREAMING"
  checkpoint.interval = 1000
  checkpoint.timeout = 120000
}

source {
  FakeSource {
    parallelism = 1
    row.num = 600
    split.num = 600
    split.read-interval = 1000
    schema = {
      fields {
        id = int
      }
    }
  }
}

sink {
  InMemory {}
}
