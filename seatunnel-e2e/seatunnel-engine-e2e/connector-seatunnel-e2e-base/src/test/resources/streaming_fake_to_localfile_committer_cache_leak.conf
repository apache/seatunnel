######
###### Continuous streaming job with a short checkpoint interval and an aggregated-commit
###### sink, used to drive SinkAggregatedCommitterTask through many real checkpoint cycles.
######

env {
  job.mode = "STREAMING"
  checkpoint.interval = 1000
}

source {
  FakeSource {
    parallelism = 2
    row.num = 1000000
    split.num = 4
    split.read-interval = 50
    schema = {
      fields {
        c_int = int
      }
    }
  }
}

sink {
  LocalFile {
    path = "/tmp/hive/warehouse/sinkAggregatedCommitterTaskCheckpointCacheLeakIT"
    field_delimiter = "\t"
    row_delimiter = "\n"
    file_name_expression = "${transactionId}_${now}"
    file_format_type = "text"
    filename_time_format = "yyyy.MM.dd"
    is_enable_transaction = true
    save_mode = "error"
  }
}
