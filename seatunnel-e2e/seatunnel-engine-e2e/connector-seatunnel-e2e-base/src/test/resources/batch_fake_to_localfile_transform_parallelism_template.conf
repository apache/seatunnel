######
###### A transform declaring a parallelism different from its source, followed by a sink with an
###### aggregated committer, with checkpoints taken while the job runs. Used by
###### TransformParallelismCheckpointIT.
######

env {
  job.mode = "BATCH"
  job.retry.times = 0
  checkpoint.interval = 1000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = ${dynamic_test_row_num_per_parallelism}
    split.num = 5
    split.read-interval = 1000
    parallelism = ${dynamic_test_parallelism}
    schema = {
      fields {
        c_string = string
        c_int = int
      }
    }
  }
}

transform {
  Copy {
    plugin_input = "fake"
    plugin_output = "copied"
    parallelism = ${dynamic_transform_parallelism}
    fields {
      c_string_copy = c_string
    }
  }
}

sink {
  LocalFile {
    plugin_input = "copied"
    path = "/tmp/hive/warehouse/${dynamic_test_case_name}"
    field_delimiter = "\t"
    row_delimiter = "\n"
    file_name_expression = "${transactionId}_${now}"
    file_format_type = "text"
    filename_time_format = "yyyy.MM.dd"
    is_enable_transaction = true
    save_mode = "error"
  }
}
