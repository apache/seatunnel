env {
  job.mode = STREAMING
  parallelism = 1
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  job.retry.times = 3
}

source {
  FakeSource {
    plugin_output = table1
    # A completed split sleeps between polls; many small splits keep committed output advancing
    # across both faults without generating the entire source in one unpaced large split.
    row.num = 100000
    split.num = 1000
    split.read-interval = 50
    schema.fields {
      c_string = string
      c_int = int
    }
  }
}

sink {
  LocalFile {
    plugin_input = table1
    path = "/tmp/hive/warehouse/${dynamic_test_case_name}"
    field_delimiter = "\t"
    row_delimiter = "\n"
    file_name_expression = "${transactionId}_${now}"
    file_format_type = "text"
    filename_time_format = "yyyy.MM.dd"
    is_enable_transaction = true
    save_mode = "error"
  }
}
