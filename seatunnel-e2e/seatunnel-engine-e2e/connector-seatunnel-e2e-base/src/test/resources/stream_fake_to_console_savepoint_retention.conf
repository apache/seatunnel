# Job fixture for SavepointSurvivesRestoredJobCancelIT.
#
# The job has to keep checkpointing long enough for the test to take a savepoint,
# restore it, observe a periodic checkpoint of the restored run and then cancel
# that restored run. FakeSource is unbounded in STREAMING mode and the Console
# sink discards every row, so the only behaviour under test is the engine's
# checkpoint/savepoint storage lifecycle: which files the automatic cleanup is
# allowed to delete when a job reaches a terminal state.
#
# Parallelism is pinned to 1 so the job has exactly one pipeline with one task
# group; that keeps the savepoint to a single storage entry and makes "was the
# savepoint kept or deleted" an unambiguous question.
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100000
    split.num = 1
    split.read-interval = 10
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "fake"
    log.print.data = false
  }
}
