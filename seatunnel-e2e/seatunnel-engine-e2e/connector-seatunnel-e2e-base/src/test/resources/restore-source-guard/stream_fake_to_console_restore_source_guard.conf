# Fixture for CheckpointRestoreRunningSourceIT. FakeSource is unbounded in STREAMING mode and the
# Console sink discards its rows, so this job is a long-lived, single-pipeline checkpoint source:
# the test only needs a running job with a live checkpoint sequence, not any connector behaviour.
# checkpoint.retain-after-job-cancelled keeps the last periodic checkpoints readable after the job
# is stopped, so the test can prove that the rejected restore attempt left a usable recovery point.
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 1000
  checkpoint.timeout = 60000
  checkpoint.retain-after-job-cancelled = true
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100000
    split.num = 2
    split.read-interval = 10
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "fake"
    log.print.data = false
  }
}
