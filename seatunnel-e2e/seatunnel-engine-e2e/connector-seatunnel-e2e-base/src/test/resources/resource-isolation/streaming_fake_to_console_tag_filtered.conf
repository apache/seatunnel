######
###### Fixture for TagFilterLateWorkerPlacementIT.
######
###### A STREAMING job whose tag filter only matches the "team-b" worker. With parallelism 2 the
###### single pipeline needs three fixed slots (one split enumerator task group plus two chained
###### source/sink task groups), so the test can distinguish "queued because no worker matches the
###### tag filter" from "queued because the matching worker has no capacity". The FakeSource keeps
###### the pipeline RUNNING (UNBOUNDED in STREAMING mode) and the Console sink discards every row,
###### so only engine scheduling and slot placement are exercised here.
######

env {
  job.mode = "STREAMING"
  parallelism = 2
  tag_filter {
    team = "team-b"
  }
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 1000
    split.num = 2
    schema = {
      fields {
        id = "int"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  Console {
    log.print.data = false
  }
}
