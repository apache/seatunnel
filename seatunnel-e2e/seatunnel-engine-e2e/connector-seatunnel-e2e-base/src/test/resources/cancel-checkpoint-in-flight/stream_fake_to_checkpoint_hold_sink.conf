######
###### This template is used by CheckpointInFlightMasterFailoverIT.
###### The dynamic hold key is replaced before the job is submitted.
######
###### FakeSource streams into a test-only sink whose writer parks inside
###### snapshotState(), which freezes a periodic checkpoint after its barrier was
###### distributed but before it was acknowledged by the sink task.

env {
  job.mode = "STREAMING"
  parallelism = 1
  # Frequent checkpoints keep the writing job busy; the timeout is large enough
  # that releasing the gate, not expiry, is what ends the hold.
  checkpoint.interval = 2000
  checkpoint.timeout = 100000
  job.retry.times = 10
  job.retry.interval.seconds = 2
  # Keep the completed checkpoints of a cancelled job, so the test can prove that the
  # aborted in-flight checkpoint was not added to the retained set.
  checkpoint.retain-after-job-cancelled = true
}

source {
  FakeSource {
    parallelism = 1
    row.num = 100000000
    split.read-interval = 20
    schema = {
      fields {
        id = int
        name = string
      }
    }
  }
}

sink {
  CheckpointInFlightHoldTest {
    hold_key = "${dynamic_hold_key}"
  }
}
