env {
  job.mode = "BATCH"
  parallelism = 1
}

source {
  FakeSource {
    row.num = 200
    split.num = 4
    split.read-interval = 200
    plugin_output = "fake"
    schema = {
      fields {
        id = bigint
        name = string
      }
    }
  }
}

sink {
  LocalFile {
    path = "${dynamic_test_case_name}"
    field_delimiter = "\t"
    row_delimiter = "\n"
    file_name_expression = "${transactionId}_${now}"
    file_format_type = "text"
    filename_time_format = "yyyy.MM.dd"
    is_enable_transaction = true
    save_mode = "ignore"
  }
}
