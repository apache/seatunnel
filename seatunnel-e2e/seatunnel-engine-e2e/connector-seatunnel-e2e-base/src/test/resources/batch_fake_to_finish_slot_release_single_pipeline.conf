######
###### Minimal BATCH job with one pipeline (one source task and one sink task, i.e. two fixed
###### slots). Used as the waiting job that must only start after a finished pipeline of another
###### running job released the slots it owned.
######

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "waiting_job"
    row.num = 1
    split.num = 1
    schema = {
      fields {
        id = "int"
        name = "string"
      }
    }
  }
}

sink {
  PipelineFinishSlotReleaseTest {
    plugin_input = "waiting_job"
    tag = "b_waiting"
  }
}
