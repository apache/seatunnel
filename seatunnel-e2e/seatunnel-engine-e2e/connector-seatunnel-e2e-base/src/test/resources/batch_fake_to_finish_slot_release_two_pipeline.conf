######
###### Two independent BATCH pipelines inside one job. The first pipeline writes a single row
###### into a sink parked on a gate, so the test can keep it RUNNING until the moment it wants it
###### to finish. The second pipeline writes many rows with a per-row sleep, so the job stays
###### RUNNING long after the first pipeline finished and released its slots.
######

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fast_pipeline"
    row.num = 1
    split.num = 1
    schema = {
      fields {
        id = "int"
        name = "string"
      }
    }
  }

  FakeSource {
    plugin_output = "slow_pipeline"
    row.num = 3000
    split.num = 1
    schema = {
      fields {
        id = "int"
        name = "string"
      }
    }
  }
}

sink {
  PipelineFinishSlotReleaseTest {
    plugin_input = "fast_pipeline"
    tag = "a_fast"
    hold_gate = "a-fast-pipeline-gate"
  }

  PipelineFinishSlotReleaseTest {
    plugin_input = "slow_pipeline"
    tag = "a_slow"
    sleep_ms = 20
  }
}
