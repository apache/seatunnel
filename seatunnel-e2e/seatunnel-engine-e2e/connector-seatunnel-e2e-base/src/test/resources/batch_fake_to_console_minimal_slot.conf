######
###### Minimal single-parallelism batch job, deliberately small so it needs as
###### few slots as possible.
######

env {
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    parallelism = 1
    row.num = 10
    schema = {
      fields {
        name = "string"
        age = "int"
      }
    }
  }
}

sink {
  console {
    plugin_input = "fake"
  }
}
