# Job fixture for ClientCheckpointRestoreMissingDataIT. FakeSource is UNBOUNDED
# in STREAMING mode and Console discards rows without printing them, so this
# config only exists to make the engine produce periodic checkpoints and to let
# the test cancel the job afterwards. Note that
# checkpoint.retain-after-job-cancelled is intentionally left at its default
# (false): cancelling the job must delete its checkpoint data, which is the
# precondition the test then tries to restore from.

env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 1000000
    split.num = 1
    split.read-interval = 10
    schema = {
      fields {
        id = "bigint"
        name = "string"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "fake"
    log.print.data = false
  }
}
