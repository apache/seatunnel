######
###### One config reused by several REST submissions; each fills the placeholders with
###### different variables. The Assert sink checks that the row count variable reached the job.
######

env {
  job.mode = "BATCH"
  parallelism = 1
  job.name = "rest_variables_${run}"
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = ${rows}
    schema = {
      table = "${database}.${table}"
      fields {
        name = "string"
        age = "int"
      }
    }
  }
}

sink {
  Assert {
    plugin_input = "fake"
    rules {
      row_rules = [
        {rule_type = MAX_ROW, rule_value = ${rows}},
        {rule_type = MIN_ROW, rule_value = ${rows}}
      ]
    }
  }
}
