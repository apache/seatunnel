# Job fixture for CheckpointHistoryClientIT. FakeSource is UNBOUNDED in STREAMING mode and the
# Console sink discards every row, so the only thing this job exercises is the engine's checkpoint
# scheduling and the checkpoint monitor state that the client protocol reads back. The interval is
# intentionally short (1s) so the test can observe more than one completed checkpoint and can ask
# for the newest one with an explicit limit; the source keeps emitting so checkpoints have to be
# injected into live tasks rather than after the pipeline already drained.

env {
  parallelism = 2
  job.mode = "STREAMING"
  checkpoint.interval = 1000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100000
    split.num = 2
    split.read-interval = 10
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "fake"
    log.print.data = false
  }
}
