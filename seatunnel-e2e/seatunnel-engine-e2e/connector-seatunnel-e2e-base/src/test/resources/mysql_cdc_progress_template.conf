env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 3000
}

source {
  MySQL-CDC {
    plugin_output = "cdc_rows"
    server-id = 5652
    username = "root"
    password = "mysqlpw"
    table-names = ["cdc_progress.source_rows"]
    url = "${dynamic_jdbc_url}"
    exactly_once = false
    debezium {
      heartbeat.interval.ms = 0
    }
  }
}

sink {
  jdbc {
    plugin_input = ["cdc_rows"]
    url = "${dynamic_jdbc_url}"
    driver = "com.mysql.cj.jdbc.Driver"
    username = "root"
    password = "mysqlpw"
    generate_sink_sql = true
    database = cdc_progress
    table = sink_rows
    primary_keys = ["id"]
    batch_size = 1
    is_exactly_once = false
  }
}
