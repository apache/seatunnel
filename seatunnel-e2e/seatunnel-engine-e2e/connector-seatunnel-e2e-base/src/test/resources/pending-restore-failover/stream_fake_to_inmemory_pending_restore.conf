# Fixture for PendingRestoreMasterFailoverIT. A single-parallelism streaming job whose FakeSource
# emits one row per second for a thousand splits keeps it RUNNING far longer than the test budget
# while checkpoints still complete quickly.
#
# The InMemory sink has an aggregated committer, so the job occupies exactly three fixed slices on a
# `dynamic-slot = false` worker: the split-enumerator task group, the fused reader/writer task group
# and the sink committer task group. That makes "no capacity left" a fact the test can observe
# instead of infer.
#
# The same file is used for the savepoint source, for the job that occupies the whole pool, and for
# the restored run. Keeping the checkpoint state layout identical between the source run and the
# restored run is required for a savepoint restore to be meaningful.

env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 1000
    split.num = 1000
    split.read-interval = 1000
    schema = {
      fields {
        id = "bigint"
        name = "string"
      }
    }
  }
}

transform {
}

sink {
  InMemory {
    plugin_input = "fake"
  }
}
