# Minimal streaming job used by SplitClusterPendingJobLifecycleFailoverIT to fill a fixed-slot
# worker exactly: one FakeSource split-enumerator task plus one fused reader/writer task, so the
# job needs exactly two slots. There is no committer task because Console is a plain sink, and
# checkpoints are enabled because a savepoint can only be taken for a checkpointing job.
# log.print.data is disabled so a job that keeps streaming does not flood the CI log.
env {
  job.mode = "STREAMING"
  checkpoint.interval = 5000
  parallelism = 1
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100
    split.num = 1
    split.read-interval = 100
    schema = {
      fields {
        id = "bigint"
        name = "string"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "fake"
    log.print.data = false
  }
}
