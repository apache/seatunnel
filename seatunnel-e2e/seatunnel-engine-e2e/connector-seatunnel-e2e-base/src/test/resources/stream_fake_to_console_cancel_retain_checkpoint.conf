# Job fixture for CancelledJobCheckpointRetentionIT: the same unbounded
# FakeSource -> Console pipeline as the other checkpoint fixtures, with the
# per-job checkpoint retention switch turned on. The switch is the only
# difference from stream_fake_to_console_cancel_drop_checkpoint.conf, so any
# difference in the checkpoint storage of the two jobs is attributable to this
# option alone.
#
# checkpoint.interval is short so the test sees a completed checkpoint quickly;
# the source keeps emitting so the job is still live when it is cancelled.

env {
  parallelism = 2
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  checkpoint.timeout = 60000
  checkpoint.retain-after-job-cancelled = true
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100000
    split.num = 2
    split.read-interval = 10
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "fake"
    log.print.data = false
  }
}
