# Fixture for SavepointRestoreCapacityAdmissionIT. A single-parallelism streaming job whose
# FakeSource emits one row per second for a thousand splits, so it stays RUNNING far longer than the
# test budget while still completing checkpoints quickly. The InMemory sink has an aggregated
# committer, so the job occupies three fixed slices on a `dynamic-slot = false` worker: the
# split-enumerator task group, the fused reader/writer task group and the sink task group.
#
# It is used three times in one test: as the savepoint source, as the job that occupies the whole
# fixed pool, and as the savepoint restored job. Keeping one fixture keeps the checkpoint state
# layout identical between the source run and the restored run, which is required for a savepoint
# restore to be meaningful.

env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 1000
    split.num = 1000
    split.read-interval = 1000
    schema = {
      fields {
        id = "bigint"
        name = "string"
      }
    }
  }
}

transform {
}

sink {
  InMemory {
    plugin_input = "fake"
  }
}
