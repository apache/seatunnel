######
###### Two parallel readers, each owning exactly one split, so that every subtask checkpoints a
###### non-empty state of its own. Used by ParallelSubtaskSavepointRestoreIT.
######
env {
  parallelism = 2
  job.mode = "STREAMING"
  checkpoint.interval = 1000
  checkpoint.timeout = 60000
}

source {
  CheckpointableSequenceSource {
    start_offset = 0
    end_offset = 4000
    split_num = 2
    records_per_poll = 1
    emit_interval_ms = 4
    # Hand one split to every reader instead of draining all splits into the first reader, so the
    # restored pipeline really has to map two distinct per-subtask states back onto two subtasks.
    one_split_per_reader = true
    # Park every reader at a deterministic, non-terminal offset of its own split and only resume
    # once the test creates resume_file. This makes "the savepoint interrupts a partially processed
    # input" a controlled precondition instead of a race against the remaining emission window.
    pause_after_offsets_per_split = 1000
    resume_file = "${resume_file}"
  }
}

transform {
}

sink {
  LocalFile {
    path = "${dynamic_sink_path}"
    row_delimiter = "\n"
    file_name_expression = "offset_${transactionId}_${uuid}"
    file_format_type = "text"
    is_enable_transaction = true
  }
}
