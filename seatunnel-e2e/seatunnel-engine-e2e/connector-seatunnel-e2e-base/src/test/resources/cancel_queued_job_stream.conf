# Job fixture for the queued-job lifecycle test in SeaTunnelSlotIT. An unbounded FakeSource
# feeding a Console sink that discards every row keeps the job running (and holding its slots)
# until the test cancels it, while the source metric proves the deployed tasks really read data.
# Parallelism 2 means the pipeline needs three slots (one split enumerator plus one chain task
# group per parallelism index), so a second identical job cannot be deployed on a cluster whose
# slot pool is already consumed.
env {
  parallelism = 2
  job.mode = "STREAMING"
  checkpoint.interval = 5000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 1000000
    split.num = 4
    split.read-interval = 100
    schema = {
      fields {
        id = "bigint"
        name = "string"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "fake"
    log.print.data = false
  }
}
