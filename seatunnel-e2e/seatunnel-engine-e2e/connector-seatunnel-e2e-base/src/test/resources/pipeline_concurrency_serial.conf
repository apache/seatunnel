env {
  job.mode = "BATCH"
  job.name = "pipeline_concurrency_serial_test"
  pipeline_concurrency = 1  # Serial execution - one pipeline at a time
}

source {
  FakeSource {
    plugin_output = "fake1"
    row.num = 10
    schema {
      fields {
        id = "int"
        name = "string"
      }
    }
  }

  FakeSource {
    plugin_output = "fake2"
    row.num = 10
    schema {
      fields {
        id = "int"
        age = "int"
      }
    }
  }

  FakeSource {
    plugin_output = "fake3"
    row.num = 10
    schema {
      fields {
        id = "int"
        city = "string"
      }
    }
  }

  FakeSource {
    plugin_output = "fake4"
    row.num = 10
    schema {
      fields {
        id = "int"
        country = "string"
      }
    }
  }
}

sink {
  Console {
    plugin_input = "fake1"
  }

  Console {
    plugin_input = "fake2"
  }

  Console {
    plugin_input = "fake3"
  }

  Console {
    plugin_input = "fake4"
  }
}
