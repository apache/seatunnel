env {
  job.mode = "STREAMING"
  parallelism = 2
  checkpoint.interval = 300000
  sink.flush.interval = 100
}

source {
  FakeSource {
    tables_configs = [
      {
        row.num = 10000
        schema = {
          table = "db1.table_a"
          columns = [
            { name = id, type = int }
            { name = val, type = string }
          ]
        }
      },
      {
        row.num = 10000
        schema = {
          table = "db1.table_b"
          columns = [
            { name = id, type = int }
            { name = val, type = string }
          ]
        }
      },
      {
        row.num = 10000
        schema = {
          table = "db1.table_c"
          columns = [
            { name = id, type = int }
            { name = val, type = string }
          ]
        }
      }
    ]
  }
}

sink {
  MultiTableFlushTest {}
}
