env {
  job.mode = STREAMING
  # A single pipeline (one source, one sink) keeps the test's white-box poll simple: there is
  # exactly one CheckpointCoordinator to inspect for the in-flight savepoint checkpoint.
  parallelism = 5
  # Not relied upon for the savepoint under test (which is triggered explicitly by the client),
  # but kept short so the restored coordinator's periodic checkpointing after failover is visibly
  # alive if the savepoint intent were (incorrectly) dropped, instead of the test just stalling
  # for lack of any coordinator activity at all.
  checkpoint.interval = 5000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = table1
    # Deliberately unbounded within the test's timeframe: this must still be a genuine STREAMING
    # job (not naturally finished) at the moment the client-triggered savepoint's barrier is
    # in flight, otherwise the scenario under test (savepoint shutdown racing a master failover)
    # never arises.
    row.num = 100000000
    split.num = 5
    # Per-split read delay spreads out when each of the 5 parallel subtasks reaches the savepoint
    # barrier, widening the window in which some subtasks have acknowledged it and others have
    # not yet -- the "genuinely mid-shutdown" state this test's white-box poll looks for.
    split.read-interval = 300
    map.size = 10
    array.size = 10
    bytes.length = 10
    string.length = 10
    schema = {
      fields {
        c_string = string
        c_int    = int
        c_bigint = bigint
        c_double = double
        c_boolean = boolean
      }
    }
  }
}

transform {
}

sink {
  LocalFile {
    plugin_input = table1
    path = "/tmp/hive/warehouse/${dynamic_test_case_name}"
    field_delimiter = "\t"
    row_delimiter = "\n"
    file_name_expression = "${transactionId}_${now}"
    file_format_type = "text"
    filename_time_format = "yyyy.MM.dd"
    is_enable_transaction = true
    save_mode = "error"
  }
}
