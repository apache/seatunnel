######
###### Streaming fixture whose checkpoints take longer than the trigger interval.
###### The InMemory sink sleeps 5s in prepareCommit for every checkpoint, so a
###### checkpoint is in flight for most of the job's lifetime. checkpoint.timeout is
###### deliberately far above the sleep so a slow checkpoint completes instead of expiring.
######
env {
  job.mode = "STREAMING"
  parallelism = 1
  checkpoint.interval = 1000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 1000000
    split.num = 1
    split.read-interval = 50
    schema = {
      fields {
        id = "bigint"
        name = "string"
      }
    }
    parallelism = 1
  }
}

transform {
}

sink {
  InMemory {
    plugin_input = "fake"
    checkpoint_sleep = true
  }
}
