######
###### This template is used by CancelDuringMasterFailoverIT.
###### The dynamic_* placeholders are replaced before the job is submitted.
######
###### FakeSource streams an effectively endless split into a test-only sink whose
###### SinkWriter#close() parks on FinalCheckpointCloseHoldGate. Cancelling the job
###### freezes it in CANCELING while the writer is held, which gives the test a
###### deterministic window to kill the active master in the middle of the cancel.

env {
  job.mode = "STREAMING"
  parallelism = 1
  # The module's seatunnel.yaml already sets a long interval; keep it explicit so a
  # periodic checkpoint can never overlap the cancellation window under test.
  checkpoint.interval = 300000
}

source {
  FakeSource {
    parallelism = 1
    row.num = 100000000
    split.read-interval = 50
    schema = {
      fields {
        id = int
        name = string
      }
    }
  }
}

transform {
}

sink {
  FinalCheckpointCloseHoldTest {
    hold_key = "${dynamic_hold_key}"
    output_path = "${dynamic_output_path}"
  }
}
