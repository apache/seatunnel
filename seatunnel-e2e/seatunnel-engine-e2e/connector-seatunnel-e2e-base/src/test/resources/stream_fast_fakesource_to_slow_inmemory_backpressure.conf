######
###### Used by BackpressureSlowSinkIT: a fast, effectively-unbounded FakeSource paired with a
###### deliberately throttled InMemory sink (write_delay_ms) to force sustained backpressure
###### through Zeta's bounded source->sink intermediate queue. checkpoint.interval and
###### write_delay_ms are chosen with a wide safety margin against the queue's default 2048
###### capacity (TaskGroupWithIntermediateBlockingQueue#QUEUE_SIZE) so that checkpoint barriers
###### keep completing well inside their configured interval even while the queue stays
###### saturated. See BackpressureSlowSinkIT for the constants that must stay in sync with this
###### file (CHECKPOINT_INTERVAL_MS, and the write_delay_ms this relies on being "slow").
######
###### row.num / split.num are deliberately sized so every split fits in a single
###### FakeSourceReader#pollNext call (splitRowNum = ceil(row.num / split.num) = 4000 rows,
###### FakeSourceSplitEnumerator#discoverySplits), staying under the reader's
###### MAX_ROWS_PER_POLL = 4096 cap (FakeSourceReader.java). That matters because the reader emits
###### each split's rows while holding the same checkpoint lock that checkpoint/savepoint barrier
###### injection needs (SourceFlowLifeCycle#triggerBarrier); when a split's row count exceeds
###### MAX_ROWS_PER_POLL, pollNext requeues the remainder and skips its own inter-poll
###### Thread.sleep(1000L) (FakeSourceReader.java, "splitInProgress" branch), so the reader can
###### re-acquire the lock back-to-back across many polls with no deterministic release point for
###### the barrier thread to win. Keeping every split at or under the per-poll cap guarantees the
###### reader takes that Thread.sleep(1000L) - fully outside the checkpoint lock - once per split,
###### giving barrier injection a real, contention-free window every second. At ~500 rows/sec sink
###### throughput this window drains only ~500 of the queue's 2048 capacity before the next split
###### refills it, so the queue never empties and backpressure (and emitBlockedNs > 0) stays
###### genuinely sustained; 2,000,000 rows at that same throughput would take roughly 66 minutes to
###### exhaust if fed continuously, far outlasting this test's sustained-backpressure window.
######

env {
  job.mode = "STREAMING"
  checkpoint.interval = 15000
  parallelism = 1

  # Enables Zeta's realtime observability metrics (queue size/capacity, put-blocked time) so the
  # test can observe, via REST, that the intermediate queue is genuinely bounded and that the
  # source is actually being blocked enqueuing into it.
  engine {
    observability {
      enabled = true
    }
  }
}

source {
  # STREAMING FakeSource never signals completion regardless of row.num, so row.num here only
  # needs to comfortably outlast the test's sustained backpressure window (see the header comment
  # above for the runtime math); split.num is chosen so every split's row count
  # (ceil(row.num / split.num) = 4000) stays at or under the reader's MAX_ROWS_PER_POLL = 4096,
  # which is what makes barrier injection deterministic (see the header comment above).
  # split.read-interval = 0 keeps per-row overhead minimal so the source is never the bottleneck.
  FakeSource {
    row.num = 2000000
    split.num = 500
    split.read-interval = 0
    schema = {
      fields {
        c_int = int
        c_string = string
      }
    }
  }
}

sink {
  InMemory {
    # ~500 rows/sec per subtask: orders of magnitude slower than the unthrottled FakeSource above,
    # enough to keep the bounded intermediate queue saturated for the whole test, while still
    # comfortably draining a full queue well inside one checkpoint.interval.
    write_delay_ms = 2
  }
}
