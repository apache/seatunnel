######
###### Used by BackpressureSlowSinkIT: a fast, effectively-unbounded FakeSource paired with a
###### deliberately throttled InMemory sink (write_delay_ms) to force sustained backpressure
###### through Zeta's bounded source->sink intermediate queue. checkpoint.interval and
###### write_delay_ms are chosen with a wide safety margin against the queue's default 2048
###### capacity and the FakeSource reader's 4096-rows-per-poll batch cap, so that checkpoint
###### barriers keep completing well inside their configured interval even while the queue stays
###### saturated. See BackpressureSlowSinkIT for the constants that must stay in sync with this
###### file (CHECKPOINT_INTERVAL_MS, and the write_delay_ms this relies on being "slow").
######

env {
  job.mode = "STREAMING"
  checkpoint.interval = 15000
  parallelism = 1

  # Enables Zeta's realtime observability metrics (queue size/capacity, put-blocked time) so the
  # test can observe, via REST, that the intermediate queue is genuinely bounded and that the
  # source is actually being blocked enqueuing into it.
  engine {
    observability {
      enabled = true
    }
  }
}

source {
  # STREAMING FakeSource never signals completion regardless of row.num, so a huge row.num here
  # simply guarantees the source will not run dry over the test's sustained backpressure window;
  # split.read-interval = 0 keeps per-row overhead minimal so the source is never the bottleneck.
  FakeSource {
    row.num = 10000000
    split.num = 1
    split.read-interval = 0
    schema = {
      fields {
        c_int = int
        c_string = string
      }
    }
  }
}

sink {
  InMemory {
    # ~500 rows/sec per subtask: orders of magnitude slower than the unthrottled FakeSource above,
    # enough to keep the bounded intermediate queue saturated for the whole test, while still
    # comfortably draining a full queue well inside one checkpoint.interval.
    write_delay_ms = 2
  }
}
