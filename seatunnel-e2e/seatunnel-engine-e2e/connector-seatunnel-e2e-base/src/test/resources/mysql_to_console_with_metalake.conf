env {
  execution.parallelism = 1
  job.mode = "BATCH"
}

source {
  Jdbc {
      url = "jdbc:mysql://mysql-e2e:3306/seatunnel"
      driver = "com.mysql.cj.jdbc.Driver"
      connection_check_timeout_sec = 100
      sourceId = "test_catalog"
      user = "${user}"
      password = "${password}"
      query = "select * from source"
      properties {
          useSSL=false
          rewriteBatchedStatements=true
      }
  }
}

transform {
}

sink {
  Console {
  }
}