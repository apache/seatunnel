######
###### Small bounded batch job used by
###### SplitClusterPendingJobLifecycleFailoverIT#testHolderFailureOnWorkerLossReleasesFixedSlotsSoQueuedJobRuns
###### as the job that is queued behind a holder and must run once the failed holder releases the
###### surviving worker's fixed slot. It is deliberately short (a couple of seconds once dispatched)
###### so the test can assert a real committed row count instead of a transient RUNNING status, and
###### it disables retry so a scheduling mistake cannot be misread as a restore attempt.
######

env {
  job.mode = "BATCH"
  job.retry.times = 0
}

source {
  FakeSource {
    row.num = ${dynamic_test_row_num_per_parallelism}
    split.num = 2
    split.read-interval = 100
    parallelism = ${dynamic_test_parallelism}
    schema = {
      fields {
        c_int = int
      }
    }
  }
}

transform {
}

sink {
  LocalFile {
    path = "/tmp/hive/warehouse/${dynamic_test_case_name}"
    field_delimiter = "\t"
    row_delimiter = "\n"
    file_name_expression = "${transactionId}_${now}"
    file_format_type = "text"
    filename_time_format = "yyyy.MM.dd"
    is_enable_transaction = true
    save_mode = "error"
  }
}
