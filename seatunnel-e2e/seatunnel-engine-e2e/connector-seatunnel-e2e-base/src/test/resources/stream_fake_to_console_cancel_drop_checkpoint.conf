# Job fixture for CancelledJobCheckpointRetentionIT: the plain, opt-out variant
# of stream_fake_to_console_cancel_retain_checkpoint.conf. It is identical
# except that it does not set checkpoint.retain-after-job-cancelled, so the
# engine-level default (drop the checkpoint data of a cancelled job) applies to
# this job even while a sibling job on the same cluster opts in.

env {
  parallelism = 2
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100000
    split.num = 2
    split.read-interval = 10
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "fake"
    log.print.data = false
  }
}
