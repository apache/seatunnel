######
###### Used by ClusterFaultToleranceIT#testStreamJobRestoreCommitIn2NodeWorkerDown: a streaming
###### FakeSource feeding the in-repo InMemory sink. InMemorySink implements SupportMultiTableSink,
###### so the Zeta job parser always wraps it in MultiTableSink, which makes the aggregated
###### committer a MultiTableSinkAggregatedCommitter around InMemoryAggregatedCommitter. A STREAMING
###### FakeSource never finishes, so every reader stays RUNNING and every checkpoint carries commit
###### info from each writer.
######

env {
  parallelism = 2
  job.mode = "STREAMING"
  checkpoint.interval = 3000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100
    split.num = 4
    schema = {
      fields {
        name = "string"
        age = "int"
      }
    }
  }
}

sink {
  InMemory {
    plugin_input = "fake"
  }
}
