# The reproduction job of https://github.com/apache/seatunnel/issues/11473, used by
# SavepointBusySourceBarrierIT. A single FakeSource split of 100,000,000 rows keeps the source
# reader continuously busy for far longer than the test budget, so every stop-with-savepoint
# request issued by the test lands while the split is still being emitted. The Console sink
# discards rows so that the pipeline is bounded only by the source generation rate.
#
# checkpoint.timeout is deliberately shorter than the test's savepoint completion bound: if the
# savepoint barrier is starved again, the checkpoint expires first and the request fails instead of
# silently hanging past the bound.

env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 10000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100000000
    split.num = 1
    split.read-interval = 10
    string.length = 16
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "fake"
    log.print.data = false
  }
}
