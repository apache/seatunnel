######
###### Control fixture: same always-failing pipeline, but with a short retry
###### interval and exactly one retry, so the test can prove that a retry that is
###### not cancelled still waits for job.retry.interval.seconds and consumes the
###### configured retry budget.
######

env {
  job.mode = "BATCH"
  parallelism = 1
  job.retry.times = 1
  job.retry.interval.seconds = 3
}

source {
  FakeSource {
    plugin_output = "fake"
    parallelism = 1
    row.num = 10
    split.num = 1
    schema = {
      fields {
        id = "int"
        name = "string"
      }
    }
  }
}

sink {
  RetryBackoffFail {
    plugin_input = "fake"
  }
}
