######
###### This config file is a template used by CheckpointTimeoutPipelineRestoreIT.
###### The dynamic_* placeholders are replaced before the job is submitted.
######

env {
  parallelism = 1
  job.mode = "STREAMING"
  # A short interval keeps the first completed checkpoints cheap, and a timeout that is only a few
  # intervals long makes the held barrier expire while the sink is still parked in snapshotState.
  checkpoint.interval = 1000
  checkpoint.timeout = 2000
}

source {
  FakeSource {
    plugin_output = "fake"
    # A single huge split keeps the STREAMING job alive for the whole test: the source never
    # reaches ready-to-close, so no final checkpoint can end the pipeline while the barrier is held.
    row.num = 100000000
    split.num = 1
    split.read-interval = 10
    schema = {
      fields {
        id = bigint
        name = string
      }
    }
  }
}

transform {
}

sink {
  CheckpointTimeoutHoldTest {
    plugin_output = "fake"
    hold_key = "${dynamic_hold_key}"
    block_on_snapshot = ${dynamic_block_on_snapshot}
  }
}
