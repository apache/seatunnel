######
###### This config file is a template used by SplitClusterWorkerRestartAfterFinalCheckpointIT.
###### The dynamic_* placeholders are replaced before the job is submitted.
######

env {
  job.mode = "BATCH"
  # checkpoint.interval is left unset on purpose: like the deployment reported in
  # apache/seatunnel#11563 this disables periodic checkpoints for the BATCH job, so the final
  # COMPLETED_POINT_TYPE checkpoint is the only checkpoint the coordinator ever completes.
}

source {
  FakeSource {
    row.num = ${dynamic_test_row_num_per_parallelism}
    split.num = 1
    parallelism = ${dynamic_test_parallelism}
    schema = {
      fields {
        id = int
        name = string
      }
    }
  }
}

transform {
}

sink {
  FinalCheckpointCloseHoldTest {
    hold_key = "${dynamic_hold_key}"
    output_path = "${dynamic_output_path}"
  }
}
