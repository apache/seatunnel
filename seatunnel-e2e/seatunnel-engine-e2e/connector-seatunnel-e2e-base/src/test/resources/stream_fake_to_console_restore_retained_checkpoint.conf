# Job fixture for CancelledJobCheckpointRetentionIT: the pipeline that is
# restored from the retained checkpoint of the cancelled job. It is the same
# FakeSource -> Console pipeline as the other fixture, but its periodic
# checkpoint interval is far longer than the test's wait budget, so no periodic
# checkpoint can allocate a checkpoint id while the test observes the restore.
# The test therefore triggers exactly one savepoint: that savepoint is the first
# checkpoint the restored job allocates, and its id must continue the retained
# checkpoint's sequence (retained checkpoint id + 1). A restore that silently
# starts from scratch would number it 1 and fail the assertion.

env {
  parallelism = 2
  job.mode = "STREAMING"
  checkpoint.interval = 3600000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100000
    split.num = 2
    split.read-interval = 10
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "fake"
    log.print.data = false
  }
}
