# Job used by SavepointSnapshotFailureIT.
#
# checkpoint.interval is deliberately far longer than the test budget, so no periodic checkpoint
# can fire and the only barrier that reaches the sink writer is the final barrier of the
# stop-with-savepoint request issued by the test. That makes the injected snapshot failure
# attributable to the savepoint alone.
#
# job.retry.times = 0 keeps the failure path terminal instead of hiding a leaked job behind an
# automatic restart.
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 3600000
  checkpoint.timeout = 30000
  job.retry.times = 0
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100000
    split.num = 1
    split.read-interval = 10
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  SavepointFailingTest {
    plugin_input = "fake"
  }
}
