# Job fixture for CheckpointMinPauseIT. FakeSource is UNBOUNDED in STREAMING
# mode and the Console sink discards every row, so the job only exercises the
# engine's periodic checkpoint scheduling. The interval is deliberately much
# shorter than the min-pause: without enforcement the coordinator would trigger
# a checkpoint every interval, while with enforcement the next trigger has to
# wait until min-pause milliseconds after the previous checkpoint completed.

env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 300
  checkpoint.timeout = 60000
  min-pause = 3000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100000
    split.num = 1
    split.read-interval = 10
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "fake"
    log.print.data = false
  }
}
