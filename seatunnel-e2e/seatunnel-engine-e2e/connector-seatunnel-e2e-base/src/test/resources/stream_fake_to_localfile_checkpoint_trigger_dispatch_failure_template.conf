env {
  job.mode = STREAMING
  # Single source task, single pipeline: CheckpointCoordinatorFailoverIT#
  # testStreamJobFailsAfterCheckpointTriggerDispatchFailure targets this job's sole pipeline
  # (fixed pipelineId = 1) by directly removing its entry from the live ownedSlotProfilesIMap, so
  # a single, unambiguous pipeline keeps the injected fault precise.
  parallelism = 1
  # Short interval: the test first waits for one full checkpoint cycle to complete (proving
  # checkpointing is healthy) and then, after injecting the fault, waits for the next scheduled
  # trigger to fail. Both need to happen quickly for a fast test.
  checkpoint.interval = 2000
  # Deliberately generous relative to checkpoint.interval. This test's failure is a synchronous
  # exception thrown while dispatching the checkpoint barrier (JobMaster#queryTaskGroupAddress
  # throwing IllegalArgumentException), not a checkpoint timing out -- so CHECKPOINT_EXPIRED
  # should never actually be what fires here. Kept large purely to rule out an unrelated timeout
  # race from confusing the result.
  checkpoint.timeout = 30000
  # Disables pipeline restore so the checkpoint-trigger failure this test injects produces one
  # deterministic terminal FAILED job instead of a restore attempt, matching the conf added by
  # the #10442 fix in #10448 (stream_fake_to_console_checkpoint_barrier_trigger_error.conf).
  job.retry.times = 0
}

source {
  FakeSource {
    plugin_output = table1
    row.num = 1000000
    split.num = 1
    split.read-interval = 50
    schema = {
      fields {
        c_string = string
        c_int    = int
      }
    }
  }
}

transform {
}

sink {
  LocalFile {
    plugin_input = table1
    path = "/tmp/hive/warehouse/${dynamic_test_case_name}"
    field_delimiter = "\t"
    row_delimiter = "\n"
    file_name_expression = "${transactionId}_${now}"
    file_format_type = "text"
    filename_time_format = "yyyy.MM.dd"
    is_enable_transaction = true
    save_mode = "error"
  }
}
