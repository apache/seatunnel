# Job fixture for CheckpointStorageWriteFailureIT. One long-lived STREAMING
# pipeline whose FakeSource keeps emitting, so the checkpoint scheduler keeps
# producing periodic checkpoints while the test's checkpoint-storage plugin
# rejects the first writes. The Console sink discards rows, so the only engine
# behaviour under test is checkpoint completion, persistence and restore.
#
# The 1 s interval keeps the failure/restore/recovery cycle short; the retry
# budget is far above the two restore cycles the test observes, and the short
# retry interval makes the restart visible quickly.
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 1000
  checkpoint.timeout = 30000
  job.retry.times = 20
  job.retry.interval.seconds = 1
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 200000
    split.num = 20
    split.read-interval = 500
    schema = {
      table = "checkpoint_storage_failure.fake"
      fields {
        id = "bigint"
        name = "string"
      }
    }
  }
}

sink {
  Console {
    plugin_input = "fake"
    log.print.data = false
  }
}
