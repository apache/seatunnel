env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 3000
}

source {
  MySQL-CDC {
    plugin_output = "source_table_1"
    server-id = ${dynamic_source_server_id_1}
    username = "st_user_source"
    password = "mysqlpw"
    table-names = ["${dynamic_source_database_1}.${dynamic_source_table_1}"]
    url = "jdbc:mysql://${dynamic_mysql_host}:${dynamic_mysql_port}/${dynamic_source_database_1}"
    exactly_once = false
  }

  MySQL-CDC {
    plugin_output = "source_table_2"
    server-id = ${dynamic_source_server_id_2}
    username = "st_user_source"
    password = "mysqlpw"
    table-names = ["${dynamic_source_database_2}.${dynamic_source_table_2}"]
    url = "jdbc:mysql://${dynamic_mysql_host}:${dynamic_mysql_port}/${dynamic_source_database_2}"
    exactly_once = false
  }
}

sink {
  jdbc {
    plugin_input = "source_table_1"
    url = "jdbc:mysql://${dynamic_mysql_host}:${dynamic_mysql_port}/${dynamic_sink_database_1}"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "st_user_sink"
    password = "mysqlpw"
    generate_sink_sql = true
    database = ${dynamic_sink_database_1}
    table = ${dynamic_sink_table_1}
    primary_keys = ["id"]
    is_exactly_once = false
  }

  jdbc {
    plugin_input = "source_table_2"
    url = "jdbc:mysql://${dynamic_mysql_host}:${dynamic_mysql_port}/${dynamic_sink_database_2}"
    driver = "com.mysql.cj.jdbc.Driver"
    user = "st_user_sink"
    password = "mysqlpw"
    generate_sink_sql = true
    database = ${dynamic_sink_database_2}
    table = ${dynamic_sink_table_2}
    primary_keys = ["id"]
    is_exactly_once = false
  }
}
