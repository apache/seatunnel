######
###### Fixture for the pipeline restore diagnostics E2E. The source emits slowly enough that
###### periodic checkpoints complete before the sink fails, so the restore is a real checkpoint
###### restore. The sink fails only the write named by dynamic_fail_at_write, and it writes
###### dynamic_fail_at_write_marker before failing so the restore cannot fail the same way again.
######
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 1000
  job.retry.times = 5
}

source {
  CheckpointableSequenceSource {
    start_offset = 0
    end_offset = 1000000
    split_num = 1
    emit_interval_ms = 20
    records_per_poll = 2
  }
}

transform {
}

sink {
  InMemory {
    fail_at_write = ${dynamic_fail_at_write}
    fail_at_write_marker = "${dynamic_fail_at_write_marker}"
  }
}
