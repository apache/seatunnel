#
# Transform error handling: LOG mode.
# Some rows fail in transform, but with mode=LOG they are only logged,
# not written to an error table, and the job should still finish
# successfully with normal rows written to the main table.
#

env {
  job.mode = "BATCH"
  parallelism = 1

  error_handler {
    mode = "DISABLE"
  }

  transform_error_handler {
    mode = "LOG"

    include_original_data    = true
    include_stacktrace       = true
    original_data_max_length = 2048

    queue_capacity        = 1024
    queue_overflow_policy = "FAIL"
  }
}

source {
  # Same data pattern as transform_fakesource_to_mysql_with_error_handler.conf:
  # 2 rows castable to int, 2 rows not castable.
  FakeSource {
    plugin_output = "orders_raw"

    row.num = 4
    schema {
      fields {
        id   = "int"
        name = "string"
        age  = "int"
      }
    }

    rows = [
      { kind = "INSERT", fields = [1, "1",   18] },
      { kind = "INSERT", fields = [2, "2",   20] },
      { kind = "INSERT", fields = [3, "bad", 25] },
      { kind = "INSERT", fields = [4, "x4",  30] }
    ]
  }
}

transform {
  sql {
    plugin_input  = "orders_raw"
    plugin_output = "orders_ok"
    query = "select id, cast(name as int) as name_int, age from orders_raw"
  }
}

sink {
  Jdbc {
    plugin_input = "orders_ok"

    driver   = "com.mysql.cj.jdbc.Driver"
    url      = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    database = "test"
    username = "root"
    password = "Abc!@#135_seatunnel"

    table             = "orders_from_transform"
    primary_keys      = ["id"]
    generate_sink_sql = true
    schema_save_mode  = "IGNORE"
    batch_size        = 1
  }
}
