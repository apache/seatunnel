#
# Combined scenario: both Transform and Sink stages have error handlers
# enabled. Transform stage has row-level errors (cast failure) and Sink
# stage has row-level errors (data truncation), and both are routed to
# their own Jdbc error tables while the job still finishes successfully.
#

env {
  job.mode = "BATCH"
  parallelism = 1

  error_handler {
    mode = "DISABLE"
  }

  transform_error_handler {
    mode = "ROUTE"

    sink {
      plugin_name = "Jdbc"

      driver   = "com.mysql.cj.jdbc.Driver"
      url      = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      database = "test"
      username = "root"
      password = "Abc!@#135_seatunnel"

      table       = "orders_transform_error_both"
      error_table = "orders_transform_error_both"

      generate_sink_sql = true
      schema_save_mode  = "IGNORE"
      batch_size        = 1
    }

    include_original_data    = true
    include_stacktrace       = true
    original_data_max_length = 2048

    queue_capacity        = 1024
    queue_overflow_policy = "FAIL"
  }

  sink_error_handler {
    mode = "ROUTE"

    sink {
      plugin_name = "Jdbc"

      driver   = "com.mysql.cj.jdbc.Driver"
      url      = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      database = "test"
      username = "root"
      password = "Abc!@#135_seatunnel"

      table       = "orders_sink_error_both"
      error_table = "orders_sink_error_both"

      generate_sink_sql = true
      schema_save_mode  = "IGNORE"
      batch_size        = 1
    }

    include_original_data    = true
    include_stacktrace       = true
    original_data_max_length = 2048

    queue_capacity        = 1024
    queue_overflow_policy = "FAIL"
  }
}

source {
  FakeSource {
    plugin_output = "orders_raw"

    row.num = 4
    schema {
      fields {
        id        = "int"
        raw_name  = "string"
        name      = "string"
        age       = "int"
      }
    }

    # Row 1: transform ok, sink ok
    # Row 2: transform error (cast raw_name), does not reach sink
    # Row 3: transform ok, sink error (name too long)
    # Row 4: transform ok, sink error (name too long)
    rows = [
      { kind = "INSERT", fields = [1, "1",   "ok1",              18] },
      { kind = "INSERT", fields = [2, "bad", "ok2",              20] },
      { kind = "INSERT", fields = [3, "2",   "too_long_name_1",  25] },
      { kind = "INSERT", fields = [4, "3",   "too_long_name_2",  30] }
    ]
  }
}

transform {
  # First SQL transform: validate raw_name and produce an intermediate table.
  sql {
    plugin_input  = "orders_raw"
    plugin_output = "orders_after_transform"
    query = "select id, cast(raw_name as int) as check_value, name, age from orders_raw"
  }

  # Second SQL transform: project fields used by sink.
  sql {
    plugin_input  = "orders_after_transform"
    plugin_output = "orders_sink_input"
    query = "select id, name, age from orders_after_transform"
  }
}

sink {
  Jdbc {
    plugin_input = "orders_sink_input"

    driver   = "com.mysql.cj.jdbc.Driver"
    url      = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    database = "test"
    username = "root"
    password = "Abc!@#135_seatunnel"

    table             = "orders_from_sink"
    primary_keys      = ["id"]
    generate_sink_sql = true
    schema_save_mode  = "IGNORE"
    batch_size        = 1
  }
}
