#
# Sink error handling e2e (RowErrorCollector) with checkpointing:
# - With checkpointing the JDBC sink keeps flushed batches in one open transaction, each followed by
#   a savepoint, and commits at the checkpoint.
# - batch_size = 2: rows 1-2 and 3-4 are flushed before the batch of rows 5 and 5 (duplicated primary
#   key, SQLState 23XXX) fails. Its rollback must stop at the latest savepoint, then the batch is
#   written again row by row, so only the duplicate is routed.
#

env {
  job.mode = "BATCH"
  parallelism = 1
  checkpoint.interval = 10000

  error_handler {
    mode = "DISABLE"
  }

  sink_error_handler {
    mode = "ROUTE"

    sink {
      plugin_name = "Jdbc"

      driver   = "com.mysql.cj.jdbc.Driver"
      url      = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      database = "test"
      username = "root"
      password = "Abc!@#135_seatunnel"

      table       = "orders_sink_error_basic"
      error_table = "orders_sink_error_basic"

      generate_sink_sql = true
      schema_save_mode  = "IGNORE"
      batch_size        = 1
    }

    include_original_data    = true
    include_stacktrace       = true
    original_data_max_length = 2048

    queue_capacity        = 1024
    queue_overflow_policy = "FAIL"
  }
}

source {
  FakeSource {
    plugin_output = "orders_raw"

    row.num = 6
    schema {
      fields {
        id   = "int"
        name = "string"
        age  = "int"
      }
    }

    # The last row duplicates the primary key of the row before it.
    rows = [
      { kind = "INSERT", fields = [1, "a", 1] },
      { kind = "INSERT", fields = [2, "b", 2] },
      { kind = "INSERT", fields = [3, "c", 3] },
      { kind = "INSERT", fields = [4, "d", 4] },
      { kind = "INSERT", fields = [5, "e", 5] },
      { kind = "INSERT", fields = [5, "dup5", 6] }
    ]
  }
}

sink {
  Jdbc {
    plugin_input = "orders_raw"

    driver      = "com.mysql.cj.jdbc.Driver"
    url         = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    database    = "test"
    username    = "root"
    password    = "Abc!@#135_seatunnel"

    table             = "orders_from_sink"
    generate_sink_sql = true
    schema_save_mode  = "IGNORE"

    # Two rows per batch, so the failing batch follows two flushed batches:
    batch_size   = 2
    auto_commit  = false
  }
}
