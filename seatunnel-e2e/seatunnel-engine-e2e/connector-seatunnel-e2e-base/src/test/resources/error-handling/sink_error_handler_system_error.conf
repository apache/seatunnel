#
# Sink error handling: system-level error should still fail the job
# even when sink_error_handler.mode=ROUTE is configured, because the
# error is not a row-level data/constraint violation.
#
# We simulate this by configuring the main Jdbc sink with an invalid
# JDBC URL (bad hostname), which will cause a CONNECT_DATABASE_FAILED
# error. JdbcSinkWriter.isRowError(...) will return false for this
# exception, so ErrorHandlingSinkWriter will rethrow it and the job
# will fail with non-zero exit code.
#

env {
  job.mode = "BATCH"
  parallelism = 1

  error_handler {
    mode = "DISABLE"
  }

  sink_error_handler {
    mode = "ROUTE"

    # Error sink itself uses a valid JDBC configuration, but it will
    # not be invoked because the main sink error is classified as
    # system-level.
    sink {
      plugin_name = "Jdbc"

      driver   = "com.mysql.cj.jdbc.Driver"
      url      = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      database = "test"
      username = "root"
      password = "Abc!@#135_seatunnel"

      table       = "orders_sink_error_fail"
      error_table = "orders_sink_error_fail"

      generate_sink_sql = true
      schema_save_mode  = "IGNORE"
      batch_size        = 1
    }

    include_original_data    = true
    include_stacktrace       = true
    original_data_max_length = 2048

    queue_capacity        = 1024
    queue_overflow_policy = "FAIL"
  }
}

source {
  FakeSource {
    plugin_output = "orders_raw"

    row.num = 4
    schema {
      fields {
        id   = "int"
        name = "string"
        age  = "int"
      }
    }

    rows = [
      { kind = "INSERT", fields = [1, "ok1", 18] },
      { kind = "INSERT", fields = [2, "ok2", 20] },
      { kind = "INSERT", fields = [3, "ok3", 25] },
      { kind = "INSERT", fields = [4, "ok4", 30] }
    ]
  }
}

sink {
  Jdbc {
    plugin_input = "orders_raw"

    driver   = "com.mysql.cj.jdbc.Driver"
    # Invalid hostname to force a connection error that is treated as
    # system-level (non row-level) by JdbcSinkWriter.isRowError(...).
    url      = "jdbc:mysql://mysql-e2e-invalid:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    database = "test"
    username = "root"
    password = "Abc!@#135_seatunnel"

    table             = "orders_from_sink"
    primary_keys      = ["id"]
    generate_sink_sql = true
    schema_save_mode  = "IGNORE"
    batch_size        = 1
  }
}
