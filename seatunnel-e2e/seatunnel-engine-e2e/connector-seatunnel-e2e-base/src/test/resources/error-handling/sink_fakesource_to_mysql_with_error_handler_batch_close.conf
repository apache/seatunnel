#
# Sink error handling e2e (RowErrorCollector):
# - Make JDBC sink accumulate a batch (batch_size > row.num) so that failures happen in close/flush.
# - For SQLState 22/23 errors, connector reports all rows in the failing batch to sink_error_handler.
#

env {
  job.mode = "BATCH"
  parallelism = 1

  error_handler {
    mode = "DISABLE"
  }

  sink_error_handler {
    mode = "ROUTE"

    sink {
      plugin_name = "Jdbc"

      driver   = "com.mysql.cj.jdbc.Driver"
      url      = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      database = "test"
      username = "root"
      password = "Abc!@#135_seatunnel"

      table       = "orders_sink_error_basic"
      error_table = "orders_sink_error_basic"

      generate_sink_sql = true
      schema_save_mode  = "IGNORE"
      batch_size        = 1
    }

    include_original_data    = true
    include_stacktrace       = true
    original_data_max_length = 2048

    queue_capacity        = 1024
    queue_overflow_policy = "FAIL"
  }
}

source {
  FakeSource {
    plugin_output = "orders_raw"

    row.num = 4
    schema {
      fields {
        id   = "int"
        name = "string"
        age  = "int"
      }
    }

    # 2 rows with short names (OK), 2 rows with names too long for VARCHAR(10),
    # which will cause SQLState 22XXX (data exception) at sink flush/close.
    rows = [
      { kind = "INSERT", fields = [1, "ok1", 18] },
      { kind = "INSERT", fields = [2, "ok2", 20] },
      { kind = "INSERT", fields = [3, "too_long_name_1", 25] },
      { kind = "INSERT", fields = [4, "too_long_name_2", 30] }
    ]
  }
}

sink {
  Jdbc {
    plugin_input = "orders_raw"

    driver      = "com.mysql.cj.jdbc.Driver"
    url         = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    database    = "test"
    username    = "root"
    password    = "Abc!@#135_seatunnel"

    table             = "orders_from_sink"
    primary_keys      = ["id"]
    generate_sink_sql = true
    schema_save_mode  = "IGNORE"

    # Ensure the failure happens in close/flush (not in write):
    batch_size   = 100
    auto_commit  = false
  }
}
