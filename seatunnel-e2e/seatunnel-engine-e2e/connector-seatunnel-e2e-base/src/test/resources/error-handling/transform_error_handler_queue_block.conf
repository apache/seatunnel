#
# Transform error handling: queue_overflow_policy=BLOCK.
# All rows cause transform errors; error queue is very small so writers
# will block while the error sink drains, but the job should still
# finish successfully and all error rows should be persisted.
#

env {
  job.mode = "BATCH"
  parallelism = 1

  error_handler {
    mode = "DISABLE"
  }

  transform_error_handler {
    mode = "ROUTE"

    sink {
      plugin_name = "Jdbc"

      driver   = "com.mysql.cj.jdbc.Driver"
      url      = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      database = "test"
      username = "root"
      password = "Abc!@#135_seatunnel"

      table       = "orders_transform_error_block"
      error_table = "orders_transform_error_block"

      generate_sink_sql = true
      schema_save_mode  = "IGNORE"
      batch_size        = 1
    }

    include_original_data    = true
    include_stacktrace       = true
    original_data_max_length = 2048

    queue_capacity        = 1
    queue_overflow_policy = "BLOCK"
  }
}

source {
  FakeSource {
    plugin_output = "orders_raw"

    row.num = 20
    schema {
      fields {
        id   = "int"
        name = "string"
        age  = "int"
      }
    }

    rows = [
      { kind = "INSERT", fields = [1,  "bad1",  18] },
      { kind = "INSERT", fields = [2,  "bad2",  19] },
      { kind = "INSERT", fields = [3,  "bad3",  20] },
      { kind = "INSERT", fields = [4,  "bad4",  21] },
      { kind = "INSERT", fields = [5,  "bad5",  22] },
      { kind = "INSERT", fields = [6,  "bad6",  23] },
      { kind = "INSERT", fields = [7,  "bad7",  24] },
      { kind = "INSERT", fields = [8,  "bad8",  25] },
      { kind = "INSERT", fields = [9,  "bad9",  26] },
      { kind = "INSERT", fields = [10, "bad10", 27] },
      { kind = "INSERT", fields = [11, "bad11", 28] },
      { kind = "INSERT", fields = [12, "bad12", 29] },
      { kind = "INSERT", fields = [13, "bad13", 30] },
      { kind = "INSERT", fields = [14, "bad14", 31] },
      { kind = "INSERT", fields = [15, "bad15", 32] },
      { kind = "INSERT", fields = [16, "bad16", 33] },
      { kind = "INSERT", fields = [17, "bad17", 34] },
      { kind = "INSERT", fields = [18, "bad18", 35] },
      { kind = "INSERT", fields = [19, "bad19", 36] },
      { kind = "INSERT", fields = [20, "bad20", 37] }
    ]
  }
}

transform {
  sql {
    plugin_input  = "orders_raw"
    plugin_output = "orders_ok"
    query = "select id, cast(name as int) as name_int, age from orders_raw"
  }
}

sink {
  Jdbc {
    plugin_input = "orders_ok"

    driver   = "com.mysql.cj.jdbc.Driver"
    url      = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    database = "test"
    username = "root"
    password = "Abc!@#135_seatunnel"

    table             = "orders_from_transform"
    primary_keys      = ["id"]
    generate_sink_sql = true
    schema_save_mode  = "IGNORE"
    batch_size        = 1
  }
}
