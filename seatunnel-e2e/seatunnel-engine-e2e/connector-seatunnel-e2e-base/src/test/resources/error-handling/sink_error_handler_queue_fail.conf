#
# Sink error handling e2e: queue_overflow_policy=FAIL.
# All rows cause sink row errors; queue_capacity is small so error queue will
# overflow quickly and the job should fail.
#

env {
  job.mode = "BATCH"
  parallelism = 1

  error_handler {
    mode = "DISABLE"
  }

  sink_error_handler {
    mode = "ROUTE"

    sink {
      plugin_name = "Jdbc"

      driver   = "com.mysql.cj.jdbc.Driver"
      url      = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      database = "test"
      username = "root"
      password = "Abc!@#135_seatunnel"

      table       = "orders_sink_error_fail"
      error_table = "orders_sink_error_fail"

      generate_sink_sql = true
      schema_save_mode  = "IGNORE"
      batch_size        = 1
    }

    include_original_data    = true
    include_stacktrace       = true
    original_data_max_length = 2048

    queue_capacity        = 1
    queue_overflow_policy = "FAIL"
  }
}

source {
  FakeSource {
    plugin_output = "orders_raw"

    row.num = 20
    schema {
      fields {
        id   = "int"
        name = "string"
        age  = "int"
      }
    }

    rows = [
      { kind = "INSERT", fields = [1,  "too_long_name_1",  18] },
      { kind = "INSERT", fields = [2,  "too_long_name_2",  19] },
      { kind = "INSERT", fields = [3,  "too_long_name_3",  20] },
      { kind = "INSERT", fields = [4,  "too_long_name_4",  21] },
      { kind = "INSERT", fields = [5,  "too_long_name_5",  22] },
      { kind = "INSERT", fields = [6,  "too_long_name_6",  23] },
      { kind = "INSERT", fields = [7,  "too_long_name_7",  24] },
      { kind = "INSERT", fields = [8,  "too_long_name_8",  25] },
      { kind = "INSERT", fields = [9,  "too_long_name_9",  26] },
      { kind = "INSERT", fields = [10, "too_long_name_10", 27] },
      { kind = "INSERT", fields = [11, "too_long_name_11", 28] },
      { kind = "INSERT", fields = [12, "too_long_name_12", 29] },
      { kind = "INSERT", fields = [13, "too_long_name_13", 30] },
      { kind = "INSERT", fields = [14, "too_long_name_14", 31] },
      { kind = "INSERT", fields = [15, "too_long_name_15", 32] },
      { kind = "INSERT", fields = [16, "too_long_name_16", 33] },
      { kind = "INSERT", fields = [17, "too_long_name_17", 34] },
      { kind = "INSERT", fields = [18, "too_long_name_18", 35] },
      { kind = "INSERT", fields = [19, "too_long_name_19", 36] },
      { kind = "INSERT", fields = [20, "too_long_name_20", 37] }
    ]
  }
}

sink {
  Jdbc {
    plugin_input = "orders_raw"

    driver   = "com.mysql.cj.jdbc.Driver"
    url      = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    database = "test"
    username = "root"
    password = "Abc!@#135_seatunnel"

    table             = "orders_from_sink"
    primary_keys      = ["id"]
    generate_sink_sql = true
    schema_save_mode  = "IGNORE"
    batch_size        = 1
  }
}
