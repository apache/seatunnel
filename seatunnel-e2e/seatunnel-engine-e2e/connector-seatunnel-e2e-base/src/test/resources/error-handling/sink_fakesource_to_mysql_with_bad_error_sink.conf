#
# Sink error handling e2e: error sink initialization failure.
# We deliberately configure an invalid sink plugin name for sink_error_handler.sink
# so that DefaultErrorSinkWriter.ensureInitialized() fails on first sink row error
# and the job exits with a non-zero code.
#

env {
  job.mode = "BATCH"
  parallelism = 1

  error_handler {
    mode = "DISABLE"
  }

  sink_error_handler {
    mode = "ROUTE"

    sink {
      # Non-existent sink plugin name on purpose.
      plugin_name = "JdbcBadPlugin"

      driver   = "com.mysql.cj.jdbc.Driver"
      url      = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      database = "test"
      username = "root"
      password = "Abc!@#135_seatunnel"

      table       = "orders_sink_error_bad_sink"
      error_table = "orders_sink_error_bad_sink"

      generate_sink_sql = true
      schema_save_mode  = "IGNORE"
    }

    include_original_data    = true
    include_stacktrace       = true
    original_data_max_length = 2048

    queue_capacity        = 1024
    queue_overflow_policy = "FAIL"
  }
}

source {
  FakeSource {
    plugin_output = "orders_raw"

    row.num = 4
    schema {
      fields {
        id   = "int"
        name = "string"
        age  = "int"
      }
    }

    rows = [
      { kind = "INSERT", fields = [1, "ok1", 18] },
      { kind = "INSERT", fields = [2, "ok2", 20] },
      { kind = "INSERT", fields = [3, "too_long_name_1", 25] },
      { kind = "INSERT", fields = [4, "too_long_name_2", 30] }
    ]
  }
}

sink {
  Jdbc {
    plugin_input = "orders_raw"

    driver   = "com.mysql.cj.jdbc.Driver"
    url      = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    database = "test"
    username = "root"
    password = "Abc!@#135_seatunnel"

    table             = "orders_from_sink"
    primary_keys      = ["id"]
    generate_sink_sql = true
    schema_save_mode  = "IGNORE"
    batch_size        = 1
  }
}
