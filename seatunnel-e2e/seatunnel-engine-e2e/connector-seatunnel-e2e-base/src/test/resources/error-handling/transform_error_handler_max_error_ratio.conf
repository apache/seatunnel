#
# Transform error handling: max_error_ratio threshold.
# With total=150 rows and 90 transform errors (60% error rate), max_error_ratio=0.25 should
# cause the job to fail after the minimum row threshold is reached.
#

env {
  job.mode = "BATCH"
  parallelism = 1

  error_handler {
    mode = "DISABLE"
  }

  transform_error_handler {
    mode = "ROUTE"

    sink {
      plugin_name = "Jdbc"

      driver   = "com.mysql.cj.jdbc.Driver"
      url      = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
      database = "test"
      username = "root"
      password = "Abc!@#135_seatunnel"

      table       = "orders_transform_error_fail"
      error_table = "orders_transform_error_fail"

      generate_sink_sql = true
      schema_save_mode  = "IGNORE"
      batch_size        = 1
    }

    max_error_ratio             = 0.25
    max_error_ratio_min_records = 10
    include_original_data       = true
    include_stacktrace          = true
    original_data_max_length = 2048

    queue_capacity        = 1024
    queue_overflow_policy = "FAIL"
  }
}

