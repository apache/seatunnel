#
# Sink error handling: LOG mode.
# Some rows fail in sink, but with mode=LOG they are only logged,
# not written to an error table, and the job should still finish
# successfully with normal rows written to the main table.
#

env {
  job.mode = "BATCH"
  parallelism = 1

  error_handler {
    mode = "DISABLE"
  }

  sink_error_handler {
    mode = "LOG"

    include_original_data    = true
    include_stacktrace       = true
    original_data_max_length = 2048

    queue_capacity        = 1024
    queue_overflow_policy = "FAIL"
  }
}

source {
  FakeSource {
    plugin_output = "orders_raw"

    row.num = 4
    schema {
      fields {
        id   = "int"
        name = "string"
        age  = "int"
      }
    }

    # 2 rows with short names (OK), 2 rows with names too long for VARCHAR(10),
    # which will cause data exception at sink.
    rows = [
      { kind = "INSERT", fields = [1, "ok1",             18] },
      { kind = "INSERT", fields = [2, "ok2",             20] },
      { kind = "INSERT", fields = [3, "too_long_name_1", 25] },
      { kind = "INSERT", fields = [4, "too_long_name_2", 30] }
    ]
  }
}

sink {
  Jdbc {
    plugin_input = "orders_raw"

    driver   = "com.mysql.cj.jdbc.Driver"
    url      = "jdbc:mysql://mysql-e2e:3306/test?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true"
    database = "test"
    username = "root"
    password = "Abc!@#135_seatunnel"

    table             = "orders_from_sink"
    primary_keys      = ["id"]
    generate_sink_sql = true
    schema_save_mode  = "IGNORE"
    batch_size        = 1
  }
}
