# Streaming job used to savepoint and restore a FakeSource running on the engine-managed lane.
# The short checkpoint interval keeps the savepoint step fast; the restore exercises managed Reader
# checkpoint state, capability digest validation and coordinator ownership replay.
env {
  parallelism = 2
  job.mode = "STREAMING"
  checkpoint.interval = 5000
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 100
    split.num = 5
    schema = {
      fields {
        name = "string"
        age = "int"
      }
    }
    parallelism = 2
  }
}

transform {
}

sink {
  InMemory {
    plugin_input = "fake"
  }
}
