# Job fixture for MultiPipelinePartialFailureIT#testOneFailingPipelineStopsTheJob.
#
# One job, two independent pipelines, five fixed slots in total (every task group takes
# one slot, including the source split enumerator and the sink aggregated committer):
#
#   pipeline A: FakeSource -> Console        healthy, 2 slots (enumerator + fused task)
#   pipeline B: FakeSource -> InMemory       fails,   3 slots (enumerator + fused task +
#                                             aggregated committer); write_delay_ms waits 3s
#                                             and then every write throws OutOfMemoryError
#
# The delay in pipeline B is what makes the boundary deterministic: pipeline A is already
# deployed and RUNNING when pipeline B fails, so the sibling-cancellation half of the job
# failure contract is actually exercised instead of racing task deployment.
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = "healthy_source"
    row.num = 10000000
    split.num = 1
    split.read-interval = 100
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
  FakeSource {
    plugin_output = "failing_source"
    row.num = 10000000
    split.num = 1
    split.read-interval = 100
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "healthy_source"
    log.print.data = false
  }
  InMemory {
    plugin_input = "failing_source"
    write_delay_ms = 3000
    throw_out_of_memory = true
  }
}
