# Capacity probe for MultiPipelinePartialFailureIT.
#
# Two healthy pipelines in one job that need all five fixed slots of the test cluster: 2
# slots for the Console pipeline and 3 for the InMemory pipeline, whose aggregated
# committer is a third task group. It is submitted after the partially failing job
# reaches FAILED, and that job held four of the five slots (two per pipeline, because
# stream_two_pipeline_one_sink_fails_template.conf uses a test sink without a committer),
# so the probe can only reach RUNNING if every slot the failed job held was returned: a
# single slot leaked by a zombie sibling pipeline leaves it PENDING.
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = "first_source"
    row.num = 10000000
    split.num = 1
    split.read-interval = 100
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
  FakeSource {
    plugin_output = "second_source"
    row.num = 10000000
    split.num = 1
    split.read-interval = 100
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "first_source"
    log.print.data = false
  }
  InMemory {
    plugin_input = "second_source"
  }
}
