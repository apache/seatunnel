# Capacity probe for MultiPipelinePartialFailureIT.
#
# Two healthy pipelines in one job with the same fixed-slot footprint (five slots) as
# stream_two_pipeline_one_sink_fails.conf: 2 slots for the Console pipeline and 3 for
# the InMemory pipeline, whose aggregated committer is a third task group. It is
# submitted after the partially failing job reaches FAILED: it can only reach RUNNING if
# the failed job returned every one of its five slots, so it turns a leaked slot held by
# a zombie sibling pipeline into a visible scheduling failure instead of a silent leak.
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = "first_source"
    row.num = 10000000
    split.num = 1
    split.read-interval = 100
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
  FakeSource {
    plugin_output = "second_source"
    row.num = 10000000
    split.num = 1
    split.read-interval = 100
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "first_source"
    log.print.data = false
  }
  InMemory {
    plugin_input = "second_source"
  }
}
