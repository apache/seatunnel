######
###### This config file is a template used by MultiPipelinePartialFailureIT.
###### The dynamic_* placeholders are replaced before the job is submitted.
######

# Job fixture: one job, two independent pipelines, four of the five fixed slots (every
# task group takes one slot, including the source split enumerator; the test sink has no
# committer, so each pipeline needs two slots):
#
#   pipeline A: FakeSource -> PartialFailureGateTest   healthy, writes every row to output_path
#   pipeline B: FakeSource -> PartialFailureGateTest   parks on hold_key before its first row
#                                             and throws OutOfMemoryError once the test
#                                             releases the gate
#
# The injected failure is gated on an observation, not on a delay: pipeline B's writer
# blocks inside write() until the test has seen both pipelines RUNNING and pipeline A's
# sink file growing, and only then releases the gate. A slow or descheduled test thread
# therefore cannot let the failure fire before the healthy sibling is really live.
env {
  parallelism = 1
  job.mode = "STREAMING"
  checkpoint.interval = 2000
  checkpoint.timeout = 60000
}

source {
  FakeSource {
    plugin_output = "healthy_source"
    row.num = 10000000
    split.num = 1
    split.read-interval = 100
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
  FakeSource {
    plugin_output = "failing_source"
    row.num = 10000000
    split.num = 1
    split.read-interval = 100
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  PartialFailureGateTest {
    plugin_input = "healthy_source"
    fail_after_release = false
    output_path = "${dynamic_output_path}"
  }
  PartialFailureGateTest {
    plugin_input = "failing_source"
    fail_after_release = true
    hold_key = "${dynamic_hold_key}"
  }
}
