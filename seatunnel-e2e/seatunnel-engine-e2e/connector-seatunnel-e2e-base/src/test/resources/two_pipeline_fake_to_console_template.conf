######
###### Two independent pipelines inside one job, used by the slot allocation state IT.
######

env {
  job.mode = "${dynamic_job_mode}"
  checkpoint.interval = 5000
}

source {
  FakeSource {
    plugin_output = "table1"
    row.num = ${dynamic_test_row_num_per_parallelism}
    split.num = 2
    split.read-interval = 1000
    parallelism = ${dynamic_test_parallelism}
    schema = {
      fields {
        c_string = string
      }
    }
  }

  FakeSource {
    plugin_output = "table2"
    row.num = ${dynamic_test_row_num_per_parallelism}
    split.num = 2
    split.read-interval = 1000
    parallelism = ${dynamic_test_parallelism}
    schema = {
      fields {
        c_string = string
      }
    }
  }
}

sink {
  Console {
    plugin_input = "table1"
  }

  Console {
    plugin_input = "table2"
  }
}
