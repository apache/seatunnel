######
###### This config file is a template used by CheckpointCoordinatorFailoverIT.
###### The dynamic_* placeholders are replaced before the job is submitted.
######

# A BATCH job that deliberately omits checkpoint.interval: Zeta then disables checkpointing for
# the job (JobMaster#createJobCheckpointConfig) even though the engine keeps a default interval
# configured. Used by CheckpointCoordinatorFailoverIT, which kills the active master while the job
# is still running and asserts that the restored coordinator does not start periodic checkpoints
# for a job that has checkpointing disabled.
#
# The source is a test-only BOUNDED plugin that never reaches its own end while the gate is armed:
# it emits one row per emit_interval_ms and only signals "no more element" after the test releases
# the hold key. The test arms the gate before submitting the job, waits until the worker has
# reached it and releases it in its finally block, so a correct but slow run cannot finish before
# the fault is injected or during the observation window.

env {
  parallelism = 1
  job.mode = "BATCH"
  # checkpoint.interval is left unset on purpose: this disables periodic checkpoints for the BATCH
  # job, which is the precondition the test guards.
}

source {
  GatedBatchSource {
    hold_key = "${dynamic_hold_key}"
    emit_interval_ms = 100
  }
}

transform {
}

sink {
  Console {
    log.print.data = false
  }
}
