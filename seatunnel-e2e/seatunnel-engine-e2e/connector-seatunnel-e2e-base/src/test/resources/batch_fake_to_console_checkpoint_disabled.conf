# A BATCH job that deliberately omits checkpoint.interval: Zeta then disables checkpointing for
# the job (JobMaster#createJobCheckpointConfig) even though the engine keeps a default interval
# configured. Used by CheckpointDisabledBatchFailoverIT, which kills the active master while the
# single FakeSource still emits splits and asserts that the restored coordinator does not start
# periodic checkpoints for a job that has checkpointing disabled.
#
# FakeSource sleeps split.read-interval milliseconds between splits before emitting the next one
# (one split per poll), so the job stays RUNNING long enough to survive a master failover plus the
# observation window of the test without finishing on its own.

env {
  parallelism = 1
  job.mode = "BATCH"
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 400
    split.num = 60
    split.read-interval = 1000
    schema = {
      fields {
        id = "bigint"
        name = "string"
        age = "int"
      }
    }
  }
}

transform {
}

sink {
  Console {
    plugin_input = "fake"
    log.print.data = false
  }
}
