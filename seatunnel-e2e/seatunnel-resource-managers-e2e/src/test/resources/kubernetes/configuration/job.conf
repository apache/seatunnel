# Both values exist only in the Pod environment and must be resolved on the master.
env {
  parallelism = ${E2E_PARALLELISM}
  job.mode = ${E2E_JOB_MODE}
}

source {
  FakeSource {
    plugin_output = "application_e2e_data"
    row.num = 2
    split.num = 2
    schema {
      fields {
        id = string
      }
    }
    rows = [
      {
        kind = INSERT
        # Unquoted substitution: injected by envFrom from the referenced ConfigMap and resolved on
        # the master. An unresolved value would fail the job instead of passing through literally.
        fields = [${E2E_CM_ENV}]
      }
    ]
  }
}

sink {
  Console {
    plugin_input = "application_e2e_data"
  }

  Assert {
    plugin_input = "application_e2e_data"
    rules {
      row_rules = [
        {
          rule_type = MIN_ROW
          rule_value = 1
        }
      ]

      field_rules = [
        {
          field_name = id
          field_type = string
          field_value = [
            {
              rule_type = NOT_NULL
            }
          ]
        }
      ]
    }
  }
}
