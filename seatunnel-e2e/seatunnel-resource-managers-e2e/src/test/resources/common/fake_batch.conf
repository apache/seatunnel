env { parallelism = {{parallelism}}, job.mode = BATCH }
source {
  FakeSource {
    plugin_output = "application_e2e_data"
    row.num = {{row_count}}
    split.num = {{split_count}}
    schema { fields { id = string } }
    rows = [{kind = INSERT, fields = ["{{marker}}"]}]
  }
}
sink {
  Console { plugin_input = "application_e2e_data" }
  Assert {
    plugin_input = "application_e2e_data"
    rules {
      row_rules = [{rule_type = MIN_ROW, rule_value = 1}]
      field_rules = [{field_name = id, field_type = string, field_value = [{rule_type = NOT_NULL}]}]
    }
  }
}
