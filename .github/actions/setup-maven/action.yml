name: Setup Maven with Apache repository
description: Configure Maven to use Apache Public repository as the single dependency source

runs:
  using: composite
  steps:
    - name: Configure Maven with Apache Public repository
      shell: bash
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << 'EOF'
        <settings>
          <profiles>
            <profile>
              <id>apache-repo</id>
              <!--
                Use Apache Public repository as the single source for all dependencies.

                Why Apache Public alone is sufficient:
                  1. Apache Public is a superset of Maven Central — it mirrors Central content
                     AND includes Apache-specific artifacts (snapshots, staging, third-party
                     dependencies used by Apache projects).
                  2. After voting and clicking "Release" in Nexus, new versions typically appear
                     in Maven Central within hours, but global CDN propagation may take up to
                     24 hours. Apache Public mirrors Central and has similar propagation delay,
                     so using it as the single source is consistent.
                  3. Apache Public is hosted on Apache's CDN, which typically responds faster
                     than Maven Central, resulting in faster dependency resolution in CI.
                  4. When seatunnel-shade project are updated and released, Apache Public
                     receives them more promptly than Maven Central, making it the better
                     choice for CI builds that depend on the latest shade artifacts.
              -->
              <repositories>
                <repository>
                  <id>apache-public</id>
                  <url>https://repository.apache.org/content/groups/public/</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>false</enabled></snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>apache-public-plugins</id>
                  <url>https://repository.apache.org/content/groups/public/</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>false</enabled></snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>apache-repo</activeProfile>
          </activeProfiles>
        </settings>
        EOF
