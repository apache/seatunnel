name: Setup Maven with Apache repository
description: Add Apache Public as an additional repository alongside the super-POM central (release-only).

runs:
  using: composite
  steps:
    - name: Configure Maven with Apache Public repository
      shell: bash
      run: |
        mkdir -p ~/.m2
        cat > ~/.m2/settings.xml << 'EOF'
        <settings>
          <profiles>
            <profile>
              <id>apache-repo</id>
              <!--
                Register Apache Public as an additional repository alongside the super-POM
                `central`. We deliberately do NOT mirror Central to Apache Public: Apache's
                Central proxy is not 100% complete (it has been observed to 404 on artifacts
                such as org.junit:junit-bom), and a hard mirror would turn any such gap into
                a build failure with no fallback. With both repos live, Maven tries Apache
                Public first and falls back to Central for anything Apache Public lacks.

                Release-only: snapshots are disabled (see below). Shade iteration that needs
                seatunnel-shade-*-SNAPSHOT should use a separate opt-in profile, or wait for
                the official release.

                Note on the shade propagation delay: after a seatunnel-shade-* artifact is
                published to Apache, Maven Central's CDN typically needs up to ~24h to
                propagate. Until that window closes, a freshly bumped seatunnel.shade.*
                version in the root pom.xml will not resolve from Central and the only
                chance of pulling it is Apache Public (or waiting for Central to catch up).
                See docs/en/developer/shade-guide.md ("Propagation Delay Between Shade
                Release and SeaTunnel CI") for details.
              -->
              <repositories>
                <repository>
                  <id>apache-public</id>
                  <url>https://repository.apache.org/content/groups/public/</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>false</enabled></snapshots>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>apache-public-plugins</id>
                  <url>https://repository.apache.org/content/groups/public/</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>false</enabled></snapshots>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>apache-repo</activeProfile>
          </activeProfiles>
        </settings>
        EOF
