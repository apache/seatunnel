name: PR risk label

on:
  # Runs from the base branch with a write token and NEVER checks out PR code: the script only reads
  # the PR through the GitHub API. `edited` covers title, body and base-branch changes.
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, edited]

# Labels and comments are issue-level writes. The workflow cannot approve, request changes or merge.
permissions:
  contents: read
  issues: write
  pull-requests: write

# Only the latest head matters: a newer run replaces the label and the comment of an older one.
concurrency:
  group: pr-risk-label-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  label:
    if: github.repository == 'apache/seatunnel'
    name: Compute risk label
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The default checkout of pull_request_target is the base branch, which is what we want: its poms
      # tell the script which artifacts and versions are already in use.
      - uses: actions/checkout@v4
      - name: Compute the risk level, post the comment and set the label
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_RISK_DEFAULT_BASE: ${{ vars.PR_RISK_DEFAULT_BASE }}
        run: python3 -I tools/pr_risk_label.py evaluate --pr ${{ github.event.pull_request.number }} --apply
