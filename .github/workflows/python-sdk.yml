name: SeaTunnel Python SDK

on:
  push:
    branches:
      - dev
    paths:
      - 'tools/seatunnel-python-sdk/**'
      - '.github/workflows/python-sdk.yml'
  pull_request:
    paths:
      - 'tools/seatunnel-python-sdk/**'
      - '.github/workflows/python-sdk.yml'

permissions:
  contents: read

concurrency:
  group: python-sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: tools/seatunnel-python-sdk

jobs:
  test:
    name: Test with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The floor declared by python_requires in setup.py and a current release, so a PR
        # cannot silently rely on a syntax or standard library feature outside that range.
        python-version: [ '3.9', '3.13' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: tools/seatunnel-python-sdk/setup.py

      - name: Install seatunnel-python-sdk and pytest
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e . pytest

      - name: Run tests
        # The suite mocks HTTP calls and `java -version`, so it needs no running engine,
        # no JDK and no network.
        run: python -m pytest tests -v
