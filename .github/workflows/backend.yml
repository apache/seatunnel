      - name: Run benchmark unit tests
        run: |
          ./mvnw -B -Pbenchmark -pl seatunnel-benchmarks test \
            -D"license.skipAddThirdParty"=true --no-snapshot-updates
      - name: Run benchmark validation
        run: |
