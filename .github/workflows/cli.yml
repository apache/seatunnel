name: SeaTunnel CLI

on:
  push:
    branches:
      - dev
    paths:
      - 'seatunnel-cli/**'
      - '.github/workflows/cli.yml'
  pull_request:
    paths:
      - 'seatunnel-cli/**'
      - '.github/workflows/cli.yml'

permissions:
  contents: read

concurrency:
  group: cli-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: seatunnel-cli

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: seatunnel-cli/pyproject.toml

      - name: Install ruff
        run: python -m pip install --upgrade ruff

      - name: Check for Python errors
        # Rule selection lives in [tool.ruff.lint] so this command reports exactly what a
        # contributor sees when running `ruff check` locally.
        run: ruff check .

  test:
    name: Test with Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # The floor declared by requires-python and a current release, so a PR cannot
        # silently rely on a syntax or standard library feature outside that range.
        python-version: [ '3.10', '3.13' ]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: seatunnel-cli/pyproject.toml

      - name: Install seatunnel-cli with its dev dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev]'

      - name: Run tests
        # `python -m pytest` puts the working directory on sys.path, which the tests rely
        # on to import the `benchmark` package. It ships next to `seatunnel_cli` but is not
        # part of the installed distribution, so plain `pytest` would not find it.
        # The suite is offline and needs no model credentials.
        run: python -m pytest tests -v
