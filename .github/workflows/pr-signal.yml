# Does nothing itself. It completes, and that completion starts the privileged
# `workflow_run` workflows (labeler, Build check) from the default branch, which
# replaces `pull_request_target`. See
# https://infra.apache.org/github-actions-policy.html ("A safer replacement for
# pull_request_target"). Consumers read the PR through the API from the
# `workflow_run` payload and never check out or run pull request code.
name: PR signal
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions: {}

jobs:
  signal:
    name: Signal pull request update
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: "Do nothing. Only trigger the corresponding workflow_run event"
        run: echo "pull request updated"
