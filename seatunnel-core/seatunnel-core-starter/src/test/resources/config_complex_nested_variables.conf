env {
  job.mode = "BATCH"
  job.name = "seatunnel complex nested variable test job"
  parallelism = 1
}

source {
  FakeSource {
    plugin_output = "fake"
    row.num = 10
    # 测试复杂嵌套结构：List 中包含 Map 和嵌套 List
    complex_data = [
      {
        field = "value_with_${map_placeholder}"
        type = "map_type"
      },
      ["item1", "${list_placeholder}", "item3"]
    ]
    schema = {
      fields {
        id = int
        name = string
      }
    }
  }
}

sink {
  Console {
    plugin_input = "fake"
  }
}
